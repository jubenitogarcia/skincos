# Shared Codex App actions for Skincos. Keep in sync with scripts/install-shared-codex-shortcuts.ps1.
version = 1
name = "skincos"

[setup]
script = ""

[[actions]]
name = "Workspace"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File .\\scripts\\run-shared-codex-shortcut.ps1 -Action WorkspaceMenu"

[[actions]]
name = "Contexto"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File .\\scripts\\run-shared-codex-shortcut.ps1 -Action ContextMenu"

[[actions]]
name = "CRM – Local (Gestor)"
icon = "run"
command = "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command \"`$env:CRM_LOCAL_REVIEW_REF='codex/admin/crm-local-dual-runtime-fix'; & 'C:/CodexShared/Worktrees/skincos/admin/crm-local-dual-runtime-fix/scripts/run-shared-codex-shortcut.ps1' -Action CrmLocal\""

[[actions]]
name = "CRM – Consultor (Ponto)"
icon = "run"
command = "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command \"`$env:CRM_LOCAL_REVIEW_REF='codex/admin/crm-local-dual-runtime-fix'; & 'C:/CodexShared/Worktrees/skincos/admin/crm-local-dual-runtime-fix/scripts/run-shared-codex-shortcut.ps1' -Action CrmConsultor\""

[[actions]]
name = "EF App"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File .\\scripts\\run-shared-codex-shortcut.ps1 -Action EfAppMenu"

[[actions]]
name = "Orb"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File .\\scripts\\run-shared-codex-shortcut.ps1 -Action OrbMenu"
