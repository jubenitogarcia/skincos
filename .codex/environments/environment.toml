# Shared Codex App actions for Skincos. Keep in sync with scripts/install-shared-codex-shortcuts.ps1.
version = 1
name = "skincos"

[setup]
script = ""

[[actions]]
name = "Workspace"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action WorkspaceMenu"

[[actions]]
name = "Contexto"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action ContextMenu"

[[actions]]
name = "Codex – Autônomo"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-skincos-codex.ps1"

[[actions]]
name = "CRM – Local"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action CrmLocal"

[[actions]]
name = "CRM – Módulos"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action CrmModules"

[[actions]]
name = "CRM – Prévia da Thread"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action CrmThreadPreview"

[[actions]]
name = "CRM – Prévia Usuários Equipe Thread"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action CrmUsersThreadPreview"

[[actions]]
name = "CRM – Prévia Insumos Thread"
icon = "tool"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action CrmThreadPreview -CrmRole Gestor -CrmModule insumos"

[[actions]]
name = "EF App"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action EfAppMenu"

[[actions]]
name = "Orb"
icon = "run"
command = "powershell.exe -ExecutionPolicy Bypass -File ./scripts/run-shared-codex-shortcut.ps1 -Action OrbMenu"

[[actions]]
name = "Cartas da Beleza – Prévia Local"
icon = "tool"
command = "powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/start-beauty-movement-local-preview.ps1"
