name: AI – CRM Tester

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  crm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules (best effort)
        run: |
          set -euxo pipefail
          if [ -n "${{ secrets.GH_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
            git submodule sync --recursive || true
            git submodule update --init --recursive || true
          else
            echo "GH_TOKEN not set; skipping submodule init (best-effort mode)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CRM tester (creates/updates issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ai-crm-tester.js || true
