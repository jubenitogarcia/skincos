name: AI – Improvement Scheduler

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  schedule-improvements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick top AI issues and run
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Forward AI configuration from repo Variables/Secrets (optional)
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MODELS_FAST: ${{ vars.AI_MODELS_FAST }}
          AI_MODELS_STRONG: ${{ vars.AI_MODELS_STRONG }}
          AI_MODELS_DEFAULT: ${{ vars.AI_MODELS_DEFAULT }}
          AI_ASSIGNEE: ${{ vars.AI_ASSIGNEE }}
          AI_MENTION: ${{ vars.AI_MENTION }}
        run: |
          node backend/tools/scripts/ai-scheduler.js
