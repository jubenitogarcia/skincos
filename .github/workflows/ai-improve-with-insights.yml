name: AI Improve With Insights

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue number to process
        required: true
        type: string
      ai-endpoint:
        description: Optional endpoint (defaults to GitHub Models)
        required: false
        type: string
        default: ""
      ai-token:
        description: Optional token (defaults to repo token if allowed)
        required: false
        type: string
        default: ""
      ai-models-fast:
        description: CSV fast models
        required: false
        type: string
        default: "gpt-4o-mini,gpt-4.1-mini"
      ai-models-strong:
        description: CSV strong models
        required: false
        type: string
        default: "gpt-4.1,o4-mini,claude-3.5-sonnet"
      ai-models-default:
        description: CSV default models
        required: false
        type: string
        default: "gpt-4o-mini,gpt-4.1-mini"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gather public repo insights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: |
          node backend/tools/scripts/ai-external-insights.js
      - name: Commit insights
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-knowledge/external || true
          git commit -m "docs: external insights for issue #${{ inputs['issue-number'] }}" || echo "No changes"
          git push || true

  improve:
    needs: insights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch AI Improve Runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ai-improve-runner.yml/dispatches \
            -d @- <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "issue-number": "${{ inputs.issue-number }}",
              "dry-run": "false",
              "ai-endpoint": "${{ inputs.ai-endpoint }}",
              "ai-token": "${{ inputs.ai-token }}",
              "ai-models-fast": "${{ inputs.ai-models-fast }}",
              "ai-models-strong": "${{ inputs.ai-models-strong }}",
              "ai-models-default": "${{ inputs.ai-models-default }}"
            }
          }
          JSON
