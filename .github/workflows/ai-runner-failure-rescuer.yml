name: AI Runner Failure Rescuer

on:
  workflow_run:
    workflows: ["AI Improve Runner"]
    types: ["completed"]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  analyze-and-recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download runner logs
        uses: actions/download-artifact@v4
        with:
          name: logs
        continue-on-error: true

      - name: Fetch workflow run logs (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          RUN_ID=${{ github.event.workflow_run.id }}
          mkdir -p runner-logs
          # Try gh cli; if not available, skip
          if command -v gh >/dev/null 2>&1; then
            gh run view $RUN_ID --log > runner-logs/runner.log || true
          else
            echo "gh CLI not available; skipping gh-run logs" | tee runner-logs/info.txt
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run failure analyzer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node scripts/ai-runner-failure-analyzer.js
