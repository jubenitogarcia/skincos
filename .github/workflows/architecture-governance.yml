name: Architecture governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/scripts/validate-architecture.mjs
      - run: node .github/scripts/validate-github-governance.mjs
      - name: Validate GitHub Organization transfer plan
        run: node .github/scripts/validate-github-repository-transfer.mjs
      - run: node .github/scripts/validate-deploy-topology.mjs
      - run: node .github/scripts/validate-progressive-release.mjs
      - name: Validate module catalog, maturity and dependency graph
        run: node .github/scripts/validate-module-catalog.mjs && node .github/scripts/validate-module-maturity.mjs
      - name: Validate domain import boundaries
        run: node .github/scripts/validate-domain-boundaries.mjs
      - name: Validate reproducible staging manifest
        run: node .github/scripts/validate-staging-manifest.mjs
      - name: Validate staging bootstrap safety guards
        run: node .github/scripts/validate-staging-scripts.mjs
      - name: Validate staging PostgreSQL role template
        run: node .github/scripts/validate-staging-postgres.mjs
      - name: Validate external observability catalog
        run: node scripts/observability/validate-catalog.mjs
      - name: Validate Finance synthetic canary policy
        run: node .github/scripts/validate-finance-canary-policy.mjs
