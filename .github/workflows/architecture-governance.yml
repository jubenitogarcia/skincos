name: Architecture governance

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "ops/codex/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/workflows/codex-autonomy-gate.yml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "ops/codex/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/workflows/codex-autonomy-gate.yml"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/scripts/validate-architecture.mjs
      - run: node .github/scripts/validate-github-governance.mjs
      - run: node .github/scripts/validate-deploy-topology.mjs
      - run: node .github/scripts/validate-cloudflare-single-writer.mjs
      - name: Validate dependency closures
        run: node .github/scripts/validate-dependency-closures.mjs
      - name: Test dependency closure validator
        run: node --test .github/scripts/validate-dependency-closures.test.mjs
      - run: node .github/scripts/validate-progressive-release.mjs
      - name: Test private Ponto Core baseline publisher
        run: node --test .github/scripts/ponto-core-baseline-publisher.test.mjs
      - name: Test Ponto Core staging predecessor attestation
        run: node --test .github/scripts/ponto-core-staging-precondition.test.mjs
      - name: Validate module catalog, maturity and dependency graph
        run: node .github/scripts/validate-module-catalog.mjs && node .github/scripts/validate-module-maturity.mjs
      - name: Validate domain import boundaries
        run: node .github/scripts/validate-domain-boundaries.mjs
      - name: Test Influencer Intelligence contracts, providers and snapshots
        run: node --test social/influencer-intelligence/tests/contracts.test.mjs social/influencer-intelligence/tests/registry.test.mjs social/influencer-intelligence/tests/providers.test.mjs social/influencer-intelligence/tests/provider-router-contract.test.mjs social/influencer-intelligence/tests/architecture.test.mjs social/influencer-intelligence/tests/data-model.test.mjs social/influencer-intelligence/tests/snapshots.test.mjs social/influencer-intelligence/tests/analytics.test.mjs social/influencer-intelligence/tests/scoring.test.mjs social/influencer-intelligence/tests/scheduler.test.mjs social/influencer-intelligence/tests/mcp-readonly.test.mjs social/influencer-intelligence/tests/skill.test.mjs social/influencer-intelligence/tests/calibration.test.mjs social/influencer-intelligence/tests/external-provider-gap-analysis.test.mjs
      - name: Validate reproducible staging manifest
        run: node .github/scripts/validate-staging-manifest.mjs
      - name: Validate staging bootstrap safety guards
        run: node .github/scripts/validate-staging-scripts.mjs
      - name: Validate staging PostgreSQL role template
        run: node .github/scripts/validate-staging-postgres.mjs
      - name: Validate external observability catalog
        run: node scripts/observability/validate-catalog.mjs
      - name: Validate Finance synthetic canary policy
        run: node .github/scripts/validate-finance-canary-policy.mjs
