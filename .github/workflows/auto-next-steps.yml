name: Auto Next Steps

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  suggest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

	      - name: Initialize submodules (best-effort)
	        continue-on-error: true
	        run: |
	          set -euxo pipefail
	          echo "No submodules expected in this monorepo; skipping."

      - name: Generate next-steps suggestion
        id: gen
        continue-on-error: true
        run: |
          set -e
          PREV_SHA=$(git rev-parse HEAD^ || echo "")
          LAST_SHA=$(git rev-parse HEAD)
          DIFF_FILES=$(git --no-pager diff --name-only "$PREV_SHA" "$LAST_SHA" || true)
          SUMMARY=$(git --no-pager log -1 --pretty=%B)
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
	          PLAN=""
	          echo "$DIFF_FILES" | grep -q "^frontend/" && PLAN+=$'• Frontend changed: run CRM UI smoke + check build.\n' || true
	          echo "$DIFF_FILES" | grep -q "^backend/apps/crm-api/" && PLAN+=$'• CRM API changed: run basic API health + smoke endpoints.\n' || true
	          echo "$DIFF_FILES" | grep -q "^backend/apps/whatsapp/" && PLAN+=$'• WhatsApp changed: run e2e multi-instance health + smoke.\n' || true
	          echo "$DIFF_FILES" | grep -q "^backend/apps/agent-zero/" && PLAN+=$'• Agent Zero changed: run local startup + basic health checks.\n' || true
	          echo "$DIFF_FILES" | grep -q "^backend/apps/automations/" && PLAN+=$'• Automations changed: run runner diagnose/test flows.\n' || true
	          echo "$DIFF_FILES" | grep -q "^backend/scripts/" && PLAN+=$'• Orchestration changed: run backend/scripts/doctor.sh.\n' || true
          [ -z "$PLAN" ] && PLAN=$'• No module-specific changes detected; consider adding tests or docs.\n'
          {
            echo "plan<<EOF"
            echo "$PLAN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '18'

	      - name: Run e2e smoke (CI mode)
	        run: |
	          bash backend/scripts/e2e.sh ci-smoke
	        continue-on-error: true

      - name: Open issue with next steps
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const summary = process.env.SUMMARY || '';
            const plan = process.env.PLAN || '';
            const body = `Automated next-steps suggestion\n\nRecent commit summary:\n\n${summary}\n\nProposed next steps:\n\n${plan}\n\nCI: E2E smoke attempted in mock mode.\n\nNote: This workflow uses simple heuristics by default. To enable AI suggestions via GitHub Models (free on some plans), set secrets.AI_MODEL and secrets.GITHUB_TOKEN with model access.`;
            const title = `Auto next-steps • ${new Date().toISOString()}`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
        env:
          SUMMARY: ${{ steps.gen.outputs.summary }}
          PLAN: ${{ steps.gen.outputs.plan }}

  # Optional AI enrichment step removed to keep workflow simple and avoid secret dependency
