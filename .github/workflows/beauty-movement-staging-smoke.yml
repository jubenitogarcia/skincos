name: Beauty Movement authenticated staging smoke
run-name: Beauty Movement staging smoke ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable main SHA to deploy temporarily to staging
        required: true
        type: string
      promotion_unit:
        description: Promotion evidence unit consumed by the next protected gate
        required: false
        default: beauty-movement-production-activation
        type: string

concurrency:
  group: beauty-movement-staging-smoke
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    name: Persisted synthetic journey (staging only)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      STAGING_URL: https://espacofacial-site-staging.skincos.workers.dev
      STAGING_D1_DATABASE: espacofacial-beauty-movement-staging
      STAGING_WORKER_NAME: espacofacial-site-staging
      RELEASE_SHA: ${{ inputs.release_sha }}
      PROMOTION_UNIT: ${{ inputs.promotion_unit }}
      CAMPAIGN_ID: bm-stg-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout the attested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Initialize private runner paths
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/beauty-movement-staging-smoke"
          {
            echo "STATE_FILE=${smoke_root}/state.json"
            echo "FIXTURE_DIR=${smoke_root}/fixture"
            echo "OUTPUT_DIR=${smoke_root}/output"
            echo "COPY_PRE_READBACK=${smoke_root}/copy-pre-readback.json"
            echo "COPY_POST_READBACK=${smoke_root}/copy-post-readback.json"
            echo "COPY_RESTORE_READBACK=${smoke_root}/copy-restore-readback.json"
            echo "COPY_EXPECTED_DESCRIPTION=${smoke_root}/copy-expected-description.json"
            echo "COPY_APPLY_SUMMARY=${smoke_root}/copy-apply-summary.json"
            echo "COPY_OUTPUT_DIR=${smoke_root}/copy-output"
          } >> "${GITHUB_ENV}"

      - name: Acquire Website staging coordination lease
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          resource: 'release:website'
          module: website
          source_sha: ${{ inputs.release_sha }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/website-lease.json

      - name: Acquire staging D1 coordination lease
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          resource: 'global:staging-d1'
          module: core
          source_sha: ${{ inputs.release_sha }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/d1-lease.json

      - name: Validate staging-only source and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "jubenitogarcia/skincos" ]] || { echo 'unexpected repository'; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full commit SHA'; exit 1; }
          [[ "${PROMOTION_UNIT}" =~ ^(beauty-movement-production-activation|beauty-movement-campaign-copy-update)$ ]] || { echo 'promotion_unit is not allowed'; exit 1; }
          git fetch --no-tags --depth=1 origin main
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main && [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo 'release_sha must be an ancestor of main or the exact workflow revision'
            exit 1
          fi
          [[ "${STAGING_URL}" == "https://espacofacial-site-staging.skincos.workers.dev" ]] || { echo 'staging URL guard failed'; exit 1; }
          [[ "${STAGING_D1_DATABASE}" == "espacofacial-beauty-movement-staging" ]] || { echo 'staging D1 guard failed'; exit 1; }
          [[ "${STAGING_WORKER_NAME}" == "espacofacial-site-staging" ]] || { echo 'staging Worker guard failed'; exit 1; }
          [[ "${RELEASE_SHA}" == "$(git rev-parse --verify HEAD)" ]] || { echo 'checked out SHA differs from requested SHA'; exit 1; }
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BEAUTY_MOVEMENT_TOKEN_HMAC_KEY BEAUTY_MOVEMENT_PII_KEY; do
            [[ -n "${!required:-}" ]] || { echo "staging secret is unavailable: ${required}"; exit 1; }
          done
          # The target is fixed by this workflow: there is no environment or
          # database input that could redirect the run to production.
          grep -q 'database_name = "espacofacial-beauty-movement-staging"' website/wrangler.toml || { echo 'staging D1 binding is missing'; exit 1; }
        env:
          BEAUTY_MOVEMENT_TOKEN_HMAC_KEY: ${{ secrets.BEAUTY_MOVEMENT_TOKEN_HMAC_KEY }}
          BEAUTY_MOVEMENT_PII_KEY: ${{ secrets.BEAUTY_MOVEMENT_PII_KEY }}

      - name: Check coordination leases before staging D1 inspection
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/website-lease.json
          resource: 'release:website'
          module: website
          source_sha: ${{ inputs.release_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Check staging D1 lease before inspection
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/d1-lease.json
          resource: 'global:staging-d1'
          module: core
          source_sha: ${{ inputs.release_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Apply pending Beauty Movement migrations in staging
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.112.0 d1 migrations apply "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies and browser
        working-directory: website
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare private synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${FIXTURE_DIR}" "${OUTPUT_DIR}" "$(dirname "${STATE_FILE}")"
          node - "${FIXTURE_DIR}" "${CAMPAIGN_ID}" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const [fixtureDir, campaignId] = process.argv.slice(2);
          const now = Date.now();
          const endsAt = new Date(now + 24 * 60 * 60 * 1000).toISOString();
          const write = (name, value) => fs.writeFileSync(path.join(fixtureDir, name), value, { encoding: 'utf8', mode: 0o600, flag: 'wx' });
          write('invites.csv', [
            'NOME,TELEFONE,PRÊMIO',
            'Beauty Movement Smoke Primary,5511999999999,Preenchimento',
            'Beauty Movement Isolation A,5511999999998,Preenchimento',
            'Beauty Movement Isolation B,5511999999997,Preenchimento',
            'Beauty Movement Isolation Expired,5511999999996,Preenchimento',
            '',
          ].join('\n'));
          write('ends-at.txt', endsAt);
          write('campaign.json', JSON.stringify({
            title: 'Beauty Movement staging smoke',
            description: 'Fixture sintética não destinada a publicação.',
            invitationTitle: 'Convite sintético',
            invitationText: 'Jornada automatizada de staging.',
            partnerName: 'Synthetic QA',
            whatsappMessageCourtesy: 'Synthetic QA courtesy',
            whatsappMessageCommercial: 'Synthetic QA commercial',
            whatsappLabel: 'Falar com a equipe',
            conditionsLabel: 'Condições da campanha',
            conditionsText: 'Fixture sintética criada somente para validação de staging.',
            velocityBenefitLabel: 'Benefício sintético',
            velocityBenefitText: 'Nenhuma comunicação externa é disparada neste smoke.',
            startsAt: new Date(now - 60_000).toISOString(),
          }, null, 2));
          NODE

      - name: Validate applied invite-assignment schema and inactive incumbent
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          migration_output="$RUNNER_TEMP/beauty-movement-staging-smoke/migrations.txt"
          npx --yes wrangler@4.112.0 d1 migrations list "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging >"${migration_output}" 2>&1
          grep -q 'No migrations to apply' "${migration_output}" || { echo 'staging reports unapplied migrations'; exit 1; }
          ! grep -q '0004_card_outcomes.sql' "${migration_output}" || { echo '0004_card_outcomes.sql is still pending'; exit 1; }
          ! grep -q '0005_invite_assignments.sql' "${migration_output}" || { echo '0005_invite_assignments.sql is still pending'; exit 1; }
          schema_json="$RUNNER_TEMP/beauty-movement-staging-smoke/schema.json"
          schema_sql="SELECT (SELECT COUNT(*) FROM pragma_table_info('bm_invites') WHERE name='outcome_key') AS outcome_key, (SELECT COUNT(*) FROM pragma_table_info('bm_invites') WHERE name='outcome_snapshot_json') AS outcome_snapshot_json, (SELECT COUNT(*) FROM pragma_table_info('bm_invites') WHERE name='outcome_protocol_version') AS outcome_protocol_version, (SELECT COUNT(*) FROM pragma_table_info('bm_invites') WHERE name='outcome_resolved_at_ms') AS outcome_resolved_at_ms, (SELECT COUNT(*) FROM pragma_table_info('bm_invites') WHERE name='assigned_outcome_key') AS assigned_outcome_key, (SELECT COUNT(*) FROM pragma_table_info('bm_invites') WHERE name='assignment_protocol_version') AS assignment_protocol_version, (SELECT COUNT(*) FROM pragma_table_info('bm_invites') WHERE name='planned_card_selections_json') AS planned_card_selections_json, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_bm_invites_campaign_outcome') AS outcome_index, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_bm_invites_campaign_assignment') AS assignment_index;"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${schema_sql}" --json >"${schema_json}"
          node - "${schema_json}" <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))?.[0]?.results ?? [];
          const row = rows[0];
          if (!row || Object.values(row).some((value) => Number(value) !== 1)) throw new Error('beauty_movement_invite_assignment_schema_invalid');
          NODE
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "origin: ${STAGING_URL}" -H 'content-type: application/json' \
            --data '{"token":"staging-smoke-disabled-probe"}' \
            "${STAGING_URL}/api/beleza-em-movimento/session")"
          [[ "${status}" == "503" ]] || { echo "staging campaign API is not disabled before smoke (HTTP ${status})"; exit 1; }

      - name: Capture exact staging incumbent
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          deployments="$RUNNER_TEMP/beauty-movement-staging-smoke/incumbent.json"
          npx --yes wrangler@4.112.0 deployments list --config wrangler.toml --env staging --json >"${deployments}"
          node - "${deployments}" "${STATE_FILE}" "${CAMPAIGN_ID}" <<'NODE'
          const fs = require('node:fs');
          const [deploymentsPath, statePath, campaignId] = process.argv.slice(2);
          const deployments = JSON.parse(fs.readFileSync(deploymentsPath, 'utf8'));
          const candidates = deployments
            .flatMap((deployment) => (deployment.versions ?? []).map((version) => ({ deployment, version })))
            .filter(({ version }) => Number(version.percentage) === 100 && /^[0-9a-f-]{36}$/i.test(version.version_id))
            .sort((left, right) => String(right.deployment.created_on ?? '').localeCompare(String(left.deployment.created_on ?? '')));
          const incumbent = candidates[0]?.version?.version_id;
          if (!incumbent) throw new Error('beauty_movement_staging_incumbent_missing');
          fs.writeFileSync(statePath, JSON.stringify({ version: 1, campaignId, incumbentVersion: incumbent, candidateMessage: `beauty-movement-staging-smoke:${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}`, mutationStarted: false }, null, 2), { mode: 0o600, flag: 'wx' });
          NODE

      - name: Recheck coordination leases before fixture activation
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/website-lease.json
          resource: 'release:website'
          module: website
          source_sha: ${{ inputs.release_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Recheck staging D1 lease before fixture activation
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/d1-lease.json
          resource: 'global:staging-d1'
          module: core
          source_sha: ${{ inputs.release_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Import and activate only the run-scoped fixture
        working-directory: website
        shell: bash
        env:
          BEAUTY_MOVEMENT_TOKEN_HMAC_KEY: ${{ secrets.BEAUTY_MOVEMENT_TOKEN_HMAC_KEY }}
          BEAUTY_MOVEMENT_PII_KEY: ${{ secrets.BEAUTY_MOVEMENT_PII_KEY }}
          BEAUTY_MOVEMENT_PRIVATE_RUNTIME_ROOT: ${{ runner.temp }}/beauty-movement-staging-smoke
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          npm run beauty-movement:import -- \
            --apply --remote \
            --input "${FIXTURE_DIR}/invites.csv" \
            --campaign "${CAMPAIGN_ID}" \
            --confirm-campaign "${CAMPAIGN_ID}" \
            --campaign-ends-at "$(cat "${FIXTURE_DIR}/ends-at.txt")" \
            --campaign-config "${FIXTURE_DIR}/campaign.json" \
            --database "${STAGING_D1_DATABASE}" \
            --config wrangler.toml \
            --out-dir "${OUTPUT_DIR}"
          activation_sql="UPDATE bm_campaigns SET status = 'active', updated_at_ms = CAST(strftime('%s','now') AS INTEGER) * 1000 WHERE id = '${CAMPAIGN_ID}' AND status = 'draft';"
          activation_json="$RUNNER_TEMP/beauty-movement-staging-smoke/activation.json"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${activation_sql}" --json >"${activation_json}"
          node - "${activation_json}" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))?.[0];
          if (!payload?.success || Number(payload.meta?.changes ?? 0) !== 1) throw new Error('beauty_movement_fixture_activation_failed');
          NODE
          expired_ref="$(node --input-type=module - "${OUTPUT_DIR}" <<'NODE'
          import { readSyntheticInvites } from './scripts/beauty-movement-context-isolation-smoke.mjs';
          process.stdout.write(readSyntheticInvites(process.argv[2]).expired.inviteRef);
          NODE
          )"
          [[ "${expired_ref}" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,119}$ ]] || { echo 'synthetic expired invite reference invalid'; exit 1; }
          expiry_json="$RUNNER_TEMP/beauty-movement-staging-smoke/expiry.json"
          expiry_sql="UPDATE bm_invites SET expires_at_ms = CAST(strftime('%s','now') AS INTEGER) * 1000 - 60000, updated_at_ms = CAST(strftime('%s','now') AS INTEGER) * 1000 WHERE campaign_id = '${CAMPAIGN_ID}' AND external_ref = '${expired_ref}' AND invite_status = 'active';"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${expiry_sql}" --json >"${expiry_json}"
          node - "${expiry_json}" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))?.[0];
          if (!payload?.success || Number(payload.meta?.changes ?? 0) !== 1) throw new Error('beauty_movement_expired_fixture_update_failed');
          NODE

      - name: Prepare synthetic active-campaign copy update
        if: ${{ inputs.promotion_unit == 'beauty-movement-campaign-copy-update' }}
        working-directory: website
        env:
          BEAUTY_MOVEMENT_PRIVATE_RUNTIME_ROOT: ${{ runner.temp }}/beauty-movement-staging-smoke
          GITHUB_ACTIONS: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${COPY_OUTPUT_DIR}"
          copy_config="${FIXTURE_DIR}/campaign-copy-update.json"
          node - "${FIXTURE_DIR}/campaign.json" "${copy_config}" <<'NODE'
          const fs = require('node:fs');
          const [source, destination] = process.argv.slice(2);
          const campaign = JSON.parse(fs.readFileSync(source, 'utf8'));
          campaign.description = 'Fixture sintética atualizada para validar o fluxo de cópia.';
          fs.writeFileSync(destination, `${JSON.stringify(campaign, null, 2)}\n`, { encoding: 'utf8', mode: 0o600, flag: 'wx' });
          NODE
          query="SELECT id,status,ends_at_ms,description,updated_at_ms,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}') AS invite_count,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}' AND invite_status='active') AS active_invite_count,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}' AND invite_status='revoked') AS revoked_invite_count FROM bm_campaigns WHERE id='${CAMPAIGN_ID}';"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${query}" --json > "${COPY_PRE_READBACK}"
          node - "${COPY_PRE_READBACK}" "${CAMPAIGN_ID}" "$(cat "${FIXTURE_DIR}/ends-at.txt")" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedId, expectedEnds] = process.argv.slice(2);
          const row = JSON.parse(fs.readFileSync(file, 'utf8'))?.[0]?.results?.[0];
          if (!row || row.id !== expectedId || row.status !== 'active' || Number(row.ends_at_ms) !== Date.parse(expectedEnds) || Number(row.ends_at_ms) <= Date.now() || typeof row.description !== 'string' || !Number.isSafeInteger(Number(row.updated_at_ms)) || Number(row.updated_at_ms) <= 0) throw new Error('beauty_movement_staging_copy_preflight_invalid');
          if (Number(row.invite_count) !== Number(row.active_invite_count) + Number(row.revoked_invite_count)) throw new Error('beauty_movement_staging_copy_invites_invalid');
          NODE
          npm run --silent beauty-movement:update-copy -- \
            --dry-run \
            --campaign "${CAMPAIGN_ID}" \
            --confirm-campaign "${CAMPAIGN_ID}" \
            --campaign-ends-at "$(cat "${FIXTURE_DIR}/ends-at.txt")" \
            --campaign-config "${copy_config}" \
            --normalized-description-out "${COPY_EXPECTED_DESCRIPTION}" > "${COPY_OUTPUT_DIR}/dry-run.json"

      - name: Recheck staging D1 lease before synthetic copy update
        if: ${{ inputs.promotion_unit == 'beauty-movement-campaign-copy-update' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/d1-lease.json
          resource: 'global:staging-d1'
          module: core
          source_sha: ${{ inputs.release_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Apply synthetic active-campaign copy update
        if: ${{ inputs.promotion_unit == 'beauty-movement-campaign-copy-update' }}
        working-directory: website
        env:
          BEAUTY_MOVEMENT_PRIVATE_RUNTIME_ROOT: ${{ runner.temp }}/beauty-movement-staging-smoke
          GITHUB_ACTIONS: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent beauty-movement:update-copy -- \
            --apply --remote \
            --campaign "${CAMPAIGN_ID}" \
            --confirm-campaign "${CAMPAIGN_ID}" \
            --campaign-ends-at "$(cat "${FIXTURE_DIR}/ends-at.txt")" \
            --campaign-config "${FIXTURE_DIR}/campaign-copy-update.json" \
            --expected-state "${COPY_PRE_READBACK}" \
            --apply-summary "${COPY_APPLY_SUMMARY}" \
            --database "${STAGING_D1_DATABASE}" \
            --config wrangler.toml \
            --out-dir "${COPY_OUTPUT_DIR}" > "${COPY_OUTPUT_DIR}/apply.json"

      - name: Verify synthetic active-campaign copy update
        if: ${{ inputs.promotion_unit == 'beauty-movement-campaign-copy-update' }}
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT id,status,ends_at_ms,description,updated_at_ms,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}') AS invite_count,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}' AND invite_status='active') AS active_invite_count,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}' AND invite_status='revoked') AS revoked_invite_count FROM bm_campaigns WHERE id='${CAMPAIGN_ID}';"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${query}" --json > "${COPY_POST_READBACK}"
          node - "${COPY_PRE_READBACK}" "${COPY_POST_READBACK}" "${COPY_EXPECTED_DESCRIPTION}" "${CAMPAIGN_ID}" "$(cat "${FIXTURE_DIR}/ends-at.txt")" <<'NODE'
          const fs = require('node:fs');
          const [beforeFile, afterFile, expectedFile, expectedId, expectedEnds] = process.argv.slice(2);
          const before = JSON.parse(fs.readFileSync(beforeFile, 'utf8'))?.[0]?.results?.[0];
          const after = JSON.parse(fs.readFileSync(afterFile, 'utf8'))?.[0]?.results?.[0];
          const expected = JSON.parse(fs.readFileSync(expectedFile, 'utf8'));
          if (!before || !after || after.id !== expectedId || after.status !== 'active' || Number(after.ends_at_ms) !== Date.parse(expectedEnds) || Number(after.ends_at_ms) <= Date.now() || after.description !== expected.description || Number(after.updated_at_ms) <= Number(before.updated_at_ms)) throw new Error('beauty_movement_staging_copy_update_readback_invalid');
          if (Number(before.invite_count) !== Number(after.invite_count) || Number(before.active_invite_count) !== Number(after.active_invite_count) || Number(before.revoked_invite_count) !== Number(after.revoked_invite_count)) throw new Error('beauty_movement_staging_copy_invites_changed');
          console.log(JSON.stringify({ copyUpdated: true, descriptionLength: expected.description.length, inviteCount: Number(after.invite_count), activeInviteCount: Number(after.active_invite_count), revokedInviteCount: Number(after.revoked_invite_count) }));
          NODE

      - name: Recheck Website staging lease before Worker deployment
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/website-lease.json
          resource: 'release:website'
          module: website
          source_sha: ${{ inputs.release_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Deploy temporary staging candidate and run authenticated browser journey
        working-directory: website
        shell: bash
        env:
          SMOKE_URL: ${{ env.STAGING_URL }}
        run: |
          set -euo pipefail
          state="${STATE_FILE}"
          candidate_message="$(node --input-type=commonjs -e "const s=require('fs').readFileSync(process.argv[1],'utf8'); process.stdout.write(JSON.parse(s).candidateMessage)" "${state}")"
          node - "${state}" <<'NODE'
          const fs = require('node:fs');
          const statePath = process.argv[2];
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          state.mutationStarted = true;
          fs.writeFileSync(statePath, `${JSON.stringify(state, null, 2)}\n`, { mode: 0o600 });
          NODE

          NEXT_PUBLIC_BUILD_SHA="${RELEASE_SHA}" NEXT_PUBLIC_BUILD_TIME="${GITHUB_RUN_ID}" node scripts/assert-production-snapshot.mjs
          NEXT_PUBLIC_BUILD_SHA="${RELEASE_SHA}" NEXT_PUBLIC_BUILD_TIME="${GITHUB_RUN_ID}" npx opennextjs-cloudflare build
          # Keep the private overlay beside the checked-out website so Wrangler
          # resolves the relative OpenNext entrypoint from the website root.
          activation_config="${PWD}/.beauty-movement-wrangler-enabled.toml"
          trap 'rm -f "${activation_config}"' EXIT
          node - "${activation_config}" <<'NODE'
          const fs = require('node:fs');
          const output = process.argv[2];
          const input = fs.readFileSync('wrangler.toml', 'utf8');
          const marker = '[env.staging.vars]';
          const start = input.indexOf(marker);
          if (start < 0) throw new Error('beauty_movement_staging_vars_section_missing');
          const nextSection = input.indexOf('\n[', start + marker.length);
          const end = nextSection < 0 ? input.length : nextSection;
          const section = input.slice(start, end);
          if (!/^BEAUTY_MOVEMENT_ENABLED\s*=\s*"false"\s*$/m.test(section)) {
            throw new Error('beauty_movement_staging_default_flag_changed');
          }
          const enabled = section.replace(
            /^(BEAUTY_MOVEMENT_ENABLED\s*=\s*)"false"\s*$/m,
            '$1"true"',
          );
          fs.writeFileSync(output, `${input.slice(0, start)}${enabled}${input.slice(end)}`, { mode: 0o600 });
          NODE
          NEXT_PUBLIC_BUILD_SHA="${RELEASE_SHA}" NEXT_PUBLIC_BUILD_TIME="${GITHUB_RUN_ID}" \
            npx --yes wrangler@4.112.0 deploy --config "${activation_config}" --env staging --keep-vars \
            --var 'BEAUTY_MOVEMENT_ENABLED:true' --message "${candidate_message}"
          deployments="$RUNNER_TEMP/beauty-movement-staging-smoke/candidate.json"
          candidate_version=''
          for attempt in $(seq 1 12); do
            npx --yes wrangler@4.112.0 deployments list --config wrangler.toml --env staging --json >"${deployments}"
            candidate_version="$(node --input-type=commonjs -e '
          const fs = require("node:fs");
          const [deploymentsPath, expectedMessage] = process.argv.slice(1);
          const deployments = JSON.parse(fs.readFileSync(deploymentsPath, "utf8"));
          const found = deployments
            .filter((deployment) => deployment.annotations?.["workers/message"] === expectedMessage)
            .flatMap((deployment) => deployment.versions ?? [])
            .find((version) => Number(version.percentage) === 100 && /^[0-9a-f-]{36}$/i.test(version.version_id));
          process.stdout.write(found?.version_id ?? "");
          ' "${deployments}" "${candidate_message}")"
            if [[ "${candidate_version}" =~ ^[0-9a-f-]{36}$ ]]; then break; fi
            sleep 5
          done
          [[ "${candidate_version}" =~ ^[0-9a-f-]{36}$ ]] || { echo 'temporary staging candidate identity was not attested'; exit 1; }
          incumbent_version="$(node --input-type=commonjs -e "const s=require('fs').readFileSync(process.argv[1],'utf8'); process.stdout.write(JSON.parse(s).incumbentVersion)" "${state}")"
          [[ "${candidate_version}" != "${incumbent_version}" ]] || { echo 'temporary candidate equals incumbent'; exit 1; }
          node - "${state}" "${candidate_version}" <<'NODE'
          const fs = require('node:fs');
          const [statePath, candidateVersion] = process.argv.slice(2);
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          state.candidateVersion = candidateVersion;
          fs.writeFileSync(statePath, `${JSON.stringify(state, null, 2)}\n`, { mode: 0o600 });
          NODE
          candidate_headers="$RUNNER_TEMP/beauty-movement-staging-smoke/candidate-headers.txt"
          candidate_build=''
          code=''
          for attempt in $(seq 1 24); do
            code="$(curl -sS -D "${candidate_headers}" -o /dev/null -w '%{http_code}' "${SMOKE_URL}/beleza-em-movimento" || true)"
            candidate_build="$(awk 'tolower($1) == "x-app-build:" { value=$0; sub(/^[^:]+:[[:space:]]*/, "", value); gsub(/\r/, "", value); print value }' "${candidate_headers}" | tail -n 1)"
            [[ "${code}" == "200" && "${candidate_build}" == "${RELEASE_SHA}" ]] && break
            sleep 5
          done
          [[ "${code}" == "200" && "${candidate_build}" == "${RELEASE_SHA}" ]] || {
            echo "temporary staging candidate is not serving the attested release (HTTP ${code}; exact build: false)"
            exit 1
          }
          invite_url="$(node --input-type=commonjs -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = process.argv[1];
          const file = fs.readdirSync(directory).find((name) => name.endsWith("-delivery.csv"));
          if (!file) throw new Error("beauty_movement_delivery_missing");
          const row = fs.readFileSync(path.join(directory, file), "utf8").trim().split(/\r?\n/)[1];
          const cells = row.match(/("(?:[^"]|"")*"|[^,]*)/g)?.filter((cell) => cell !== "") ?? [];
          const value = cells.at(-1)?.replace(/^"|"$/g, "").replace(/""/g, "\"");
          if (!value) throw new Error("beauty_movement_delivery_invalid");
          process.stdout.write(value);
          ' "${OUTPUT_DIR}")"
          token="${invite_url##*#c=}"
          [[ "${token}" =~ ^[A-Za-z0-9_-]{40,180}$ ]] || { echo 'synthetic invite token shape invalid'; exit 1; }
          campaign_probe_code=''
          for attempt in $(seq 1 24); do
            campaign_probe_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "origin: ${SMOKE_URL}" -H 'content-type: application/json' \
              --data "{\"token\":\"${token}\"}" \
              "${SMOKE_URL}/api/beleza-em-movimento/campaign-copy" || true)"
            [[ "${campaign_probe_code}" == "200" ]] && break
            sleep 5
          done
          [[ "${campaign_probe_code}" == "200" ]] || {
            echo "temporary staging campaign did not settle before the browser journey (HTTP ${campaign_probe_code})"
            exit 1
          }
          invite_ref="$(node --input-type=commonjs -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = process.argv[1];
          const file = fs.readdirSync(directory).find((name) => name.endsWith("-delivery.csv"));
          if (!file) throw new Error("beauty_movement_delivery_missing");
          const row = fs.readFileSync(path.join(directory, file), "utf8").trim().split(/\r?\n/)[1];
          const cells = row.match(/("(?:[^"]|"")*"|[^,]*)/g)?.filter((cell) => cell !== "") ?? [];
          const value = cells[1]?.replace(/^"|"$/g, "").replace(/""/g, "\"");
          if (!/^[A-Za-z0-9][A-Za-z0-9._:-]{2,119}$/.test(value ?? "")) throw new Error("beauty_movement_delivery_ref_invalid");
          process.stdout.write(value);
          ' "${OUTPUT_DIR}")"
          [[ "${invite_ref}" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,119}$ ]] || { echo 'synthetic invite reference shape invalid'; exit 1; }
          node - "${state}" "${invite_ref}" <<'NODE'
          const fs = require('node:fs');
          const [statePath, inviteRef] = process.argv.slice(2);
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          state.inviteRef = inviteRef;
          fs.writeFileSync(statePath, `${JSON.stringify(state, null, 2)}\n`, { mode: 0o600 });
          NODE
          node scripts/beauty-movement-context-isolation-smoke.mjs \
            --base-url "${SMOKE_URL}" \
            --delivery-directory "${OUTPUT_DIR}" \
            --evidence-file "$RUNNER_TEMP/beauty-movement-staging-smoke/context-isolation.json"
          SMOKE_INVITE_TOKEN="${token}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const base = process.env.SMOKE_URL;
          const token = process.env.SMOKE_INVITE_TOKEN;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const consoleErrors = [];
          const whatsappRequests = [];
          const bootstrapResponses = [];
          const mutationResponses = [];
          const failedRequests = [];
          let revealRequests = 0;
          let staticFailures = 0;
          const staticResponses = [];
          page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('pageerror', (error) => consoleErrors.push(error.message));
          page.on('requestfailed', (request) => {
            const url = new URL(request.url());
            if (url.pathname.startsWith('/api/beleza-em-movimento/')) {
              failedRequests.push(`${request.method()} ${url.pathname}`);
            }
          });
          page.on('response', (response) => {
            const url = new URL(response.url());
            if (url.pathname.startsWith('/api/beleza-em-movimento/')) {
              const entry = `${response.request().method()} ${url.pathname} ${response.status()}`;
              bootstrapResponses.push(entry);
              if (response.request().method() === 'POST' && /\/reveal$|\/confirm$/.test(url.pathname)) mutationResponses.push(entry);
            }
            if (url.pathname.startsWith('/_next/static/')) {
              const status = response.status();
              if (status >= 400) staticFailures += 1;
              staticResponses.push(`${response.request().method()} ${url.pathname.split('/').slice(-1)[0]} ${status}`);
            }
          });
          page.on('request', (request) => {
            if (request.url().includes('/api/beleza-em-movimento/reveal') && request.method() === 'POST') revealRequests += 1;
            if (/^https:\/\/(?:wa\.me|api\.whatsapp\.com|web\.whatsapp\.com)\//i.test(request.url())) whatsappRequests.push(request.url());
          });
          await page.goto(`${base}/beleza-em-movimento#c=${encodeURIComponent(token)}`, { waitUntil: 'domcontentloaded' });
          const bootstrapReady = await page.waitForFunction(() => (
            document.querySelector('button[aria-label*="Clique no baralho"]') !== null ||
            window.location.pathname !== '/beleza-em-movimento'
          ), { timeout: 60000 }).then(() => true).catch(() => false);
          if (await page.getByRole('button', { name: /Clique no baralho para começar a sua leitura/i }).count() === 0) {
            const diagnostics = await page.evaluate(() => {
              let inviteStorage = { present: false, length: 0 };
              try {
                const value = window.sessionStorage.getItem('ef:beauty-movement:invite');
                inviteStorage = { present: Boolean(value), length: value?.length ?? 0 };
              } catch {
                inviteStorage = { present: false, length: -1 };
              }
              return {
                readyState: document.readyState,
                pathname: window.location.pathname,
                inviteStorage,
                statusPageCount: document.querySelectorAll('[aria-busy="true"]').length,
                deckButtonCount: document.querySelectorAll('button[aria-label*="Clique no baralho"]').length,
              };
            });
            throw new Error(`beauty_movement_browser_bootstrap_missing:${JSON.stringify({ ...diagnostics, bootstrapReady, responses: bootstrapResponses.slice(-20), failedRequests: failedRequests.slice(-12), staticFailures, staticResponses: staticResponses.slice(-12), consoleErrorCount: consoleErrors.length })}`);
          }
          const reveal = async (actLabel) => {
            const card = page.getByRole('button', { name: new RegExp(`Revelar carta 1 de ${actLabel}`, 'i') });
            await card.waitFor({ state: 'visible', timeout: 30000 });
            await card.click();
            try {
              await page.locator('button[aria-pressed="true"]').waitFor({ state: 'visible', timeout: 30000 });
            } catch {
              const diagnostics = await page.evaluate(() => ({
                pathname: window.location.pathname,
                statusPageCount: document.querySelectorAll('[aria-busy="true"]').length,
                actionErrorCount: document.querySelectorAll('[role="alert"]').length,
                selectedCardCount: document.querySelectorAll('button[aria-pressed="true"]').length,
              }));
              throw new Error(`beauty_movement_browser_reveal_missing:${JSON.stringify({ actLabel, ...diagnostics, mutationResponses: mutationResponses.slice(-12), failedRequests: failedRequests.slice(-12), consoleErrorCount: consoleErrors.length })}`);
            }
            await page.waitForTimeout(5600);
          };
          await page.getByRole('button', { name: /Clique no baralho para começar a sua leitura/i }).click();
          await reveal('Beleza');
          await reveal('Movimento');
          await reveal('Celebração');
          await page.getByRole('heading', { name: /Garanta seu presente e confirme presença/i }).waitFor({ state: 'visible', timeout: 30000 });
          await page.getByRole('checkbox').check();
          await page.getByRole('button', { name: /Garantir presente e confirmar presença/i }).click();
          const special = page.locator('article[aria-label^="Carta especial:"]');
          await special.waitFor({ state: 'visible', timeout: 30000 });
          const firstResultText = await special.innerText();
          if (!/combinação|Elleva|Preenchimento|Restylane|Skinbooster|Diamond|Sculptra/i.test(firstResultText)) throw new Error('beauty_movement_browser_offer_missing');
          const revealCountBeforeReload = revealRequests;
          await page.reload({ waitUntil: 'domcontentloaded' });
          await special.waitFor({ state: 'visible', timeout: 30000 });
          const secondResultText = await special.innerText();
          if (firstResultText !== secondResultText) throw new Error('beauty_movement_browser_result_not_persistent');
          if (revealRequests !== revealCountBeforeReload || revealRequests !== 3) throw new Error('beauty_movement_browser_reveal_count_invalid');
          if (whatsappRequests.length !== 0) throw new Error('beauty_movement_external_whatsapp_request');
          if (consoleErrors.length !== 0) throw new Error('beauty_movement_browser_console_error');
          const result = { browser: true, revealRequests, reloadStable: true, whatsappRequests: 0, consoleErrors: 0, outcomeVisible: true };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/beauty-movement-staging-smoke/browser.json`, `${JSON.stringify(result, null, 2)}\n`, { mode: 0o600 });
          await browser.close();
          NODE

      - name: Recheck staging D1 lease before synthetic copy restore
        id: copyRestoreLease
        if: ${{ always() && inputs.promotion_unit == 'beauty-movement-campaign-copy-update' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/d1-lease.json
          resource: 'global:staging-d1'
          module: core
          source_sha: ${{ inputs.release_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Restore synthetic campaign incumbent after copy-update smoke
        if: ${{ always() && inputs.promotion_unit == 'beauty-movement-campaign-copy-update' && steps.copyRestoreLease.outcome == 'success' }}
        working-directory: website
        env:
          BEAUTY_MOVEMENT_PRIVATE_RUNTIME_ROOT: ${{ runner.temp }}/beauty-movement-staging-smoke
          GITHUB_ACTIONS: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "${COPY_APPLY_SUMMARY}" ]]; then
            exit 0
          fi
          npm run --silent beauty-movement:update-copy -- \
            --apply --remote --restore \
            --campaign "${CAMPAIGN_ID}" \
            --confirm-campaign "${CAMPAIGN_ID}" \
            --campaign-ends-at "$(cat "${FIXTURE_DIR}/ends-at.txt")" \
            --campaign-config "${FIXTURE_DIR}/campaign-copy-update.json" \
            --expected-state "${COPY_PRE_READBACK}" \
            --apply-summary "${COPY_APPLY_SUMMARY}" \
            --database "${STAGING_D1_DATABASE}" \
            --config wrangler.toml \
            --out-dir "${COPY_OUTPUT_DIR}" > "${COPY_OUTPUT_DIR}/restore.json"
          query="SELECT id,status,ends_at_ms,description,updated_at_ms,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}') AS invite_count,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}' AND invite_status='active') AS active_invite_count,(SELECT COUNT(*) FROM bm_invites WHERE campaign_id='${CAMPAIGN_ID}' AND invite_status='revoked') AS revoked_invite_count FROM bm_campaigns WHERE id='${CAMPAIGN_ID}';"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${query}" --json > "${COPY_RESTORE_READBACK}"
          node - "${COPY_PRE_READBACK}" "${COPY_RESTORE_READBACK}" "${CAMPAIGN_ID}" "$(cat "${FIXTURE_DIR}/ends-at.txt")" <<'NODE'
          const fs = require('node:fs');
          const [beforeFile, afterFile, expectedId, expectedEnds] = process.argv.slice(2);
          const before = JSON.parse(fs.readFileSync(beforeFile, 'utf8'))?.[0]?.results?.[0];
          const after = JSON.parse(fs.readFileSync(afterFile, 'utf8'))?.[0]?.results?.[0];
          if (!before || !after || after.id !== expectedId || after.status !== 'active' || Number(after.ends_at_ms) !== Date.parse(expectedEnds) || after.description !== before.description || Number(after.updated_at_ms) <= Number(before.updated_at_ms)) throw new Error('beauty_movement_staging_copy_restore_invalid');
          if (Number(before.invite_count) !== Number(after.invite_count) || Number(before.active_invite_count) !== Number(after.active_invite_count) || Number(before.revoked_invite_count) !== Number(after.revoked_invite_count)) throw new Error('beauty_movement_staging_copy_restore_invites_changed');
          console.log(JSON.stringify({ copyRestored: true, descriptionLength: after.description.length, inviteCount: Number(after.invite_count), activeInviteCount: Number(after.active_invite_count), revokedInviteCount: Number(after.revoked_invite_count) }));
          NODE

      - name: Correlate persisted outcome without reading PII
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          readback="$RUNNER_TEMP/beauty-movement-staging-smoke/readback.json"
          invite_ref="$(node --input-type=commonjs -e 'const fs=require("node:fs"); const state=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const value=state.inviteRef; if (!/^[A-Za-z0-9][A-Za-z0-9._:-]{2,119}$/.test(value ?? "")) throw new Error("beauty_movement_delivery_ref_invalid"); process.stdout.write(value);' "${STATE_FILE}")"
          readback_sql="SELECT c.status AS campaign_status, i.invite_status, i.confirmed_at_ms, i.outcome_key, i.outcome_protocol_version, i.outcome_resolved_at_ms, i.assigned_outcome_key, i.assignment_protocol_version, length(i.outcome_snapshot_json) AS outcome_snapshot_length, length(i.planned_card_selections_json) AS planned_card_selections_length, (SELECT COUNT(*) FROM bm_card_reveals r WHERE r.invite_id = i.id) AS reveal_count FROM bm_campaigns c INNER JOIN bm_invites i ON i.campaign_id = c.id WHERE c.id = '${CAMPAIGN_ID}' AND i.external_ref = '${invite_ref}';"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${readback_sql}" --json >"${readback}"
          isolation_evidence="$RUNNER_TEMP/beauty-movement-staging-smoke/context-isolation.json"
          isolation_readback="$RUNNER_TEMP/beauty-movement-staging-smoke/context-isolation-readback.json"
          isolation_refs="$(node --input-type=commonjs -e '
          const fs = require("node:fs");
          const evidence = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          const refs = [evidence.inviteRefs?.a, evidence.inviteRefs?.b, evidence.inviteRefs?.expired];
          if (!refs.every((value) => /^[A-Za-z0-9][A-Za-z0-9._:-]{2,119}$/.test(value ?? "")) || new Set(refs).size !== 3) throw new Error("beauty_movement_isolation_refs_invalid");
          const quote = String.fromCharCode(39);
          process.stdout.write(refs.map((value) => quote + value + quote).join(","));
          ' "${isolation_evidence}")"
          isolation_sql="SELECT i.external_ref, i.invite_status, i.confirmed_at_ms, i.expires_at_ms, (SELECT COUNT(*) FROM bm_card_reveals r WHERE r.invite_id = i.id) AS reveal_count FROM bm_invites i WHERE i.campaign_id = '${CAMPAIGN_ID}' AND i.external_ref IN (${isolation_refs}) ORDER BY i.external_ref;"
          npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${isolation_sql}" --json >"${isolation_readback}"
          node - "${readback}" "${RUNNER_TEMP}/beauty-movement-staging-smoke/browser.json" "${isolation_evidence}" "${isolation_readback}" <<'NODE'
          const fs = require('node:fs');
          const [readbackPath, browserPath, isolationEvidencePath, isolationReadbackPath] = process.argv.slice(2);
          const row = JSON.parse(fs.readFileSync(readbackPath, 'utf8'))?.[0]?.results?.[0];
          const browser = JSON.parse(fs.readFileSync(browserPath, 'utf8'));
          const isolation = JSON.parse(fs.readFileSync(isolationEvidencePath, 'utf8'));
          const isolationRows = JSON.parse(fs.readFileSync(isolationReadbackPath, 'utf8'))?.[0]?.results ?? [];
          const outcomes = new Set(['elleva_upgrade', 'filler_double', 'sculptra_classic_unlock', 'skinbooster_diamond_unlock']);
          if (!row || row.campaign_status !== 'active' || row.invite_status !== 'active' || row.confirmed_at_ms === null || row.outcome_key !== 'filler_double' || row.assigned_outcome_key !== 'filler_double' || row.assignment_protocol_version !== 'beauty-movement-invite-assignments-v1' || !outcomes.has(row.outcome_key) || row.outcome_protocol_version !== 'beauty-movement-outcomes-v2' || Number(row.outcome_resolved_at_ms) <= 0 || Number(row.outcome_snapshot_length) <= 0 || Number(row.planned_card_selections_length) <= 0 || Number(row.reveal_count) !== 3) throw new Error('beauty_movement_persisted_readback_invalid');
          if (browser.browser !== true || browser.reloadStable !== true || browser.revealRequests !== 3 || browser.whatsappRequests !== 0 || browser.consoleErrors !== 0) throw new Error('beauty_movement_browser_evidence_invalid');
          const byRef = new Map(isolationRows.map((candidate) => [candidate.external_ref, candidate]));
          const rowA = byRef.get(isolation.inviteRefs.a);
          const rowB = byRef.get(isolation.inviteRefs.b);
          const expired = byRef.get(isolation.inviteRefs.expired);
          if (isolationRows.length !== 3 || !rowA || !rowB || !expired || rowA.invite_status !== 'active' || rowB.invite_status !== 'active' || rowA.confirmed_at_ms !== null || rowB.confirmed_at_ms !== null || Number(rowA.reveal_count) !== 2 || Number(rowB.reveal_count) !== 1 || Number(expired.reveal_count) !== 0 || Number(expired.expires_at_ms) >= Date.now()) throw new Error('beauty_movement_context_isolation_readback_invalid');
          if (isolation.browser !== true || isolation.crossContextAuthorizationRejected !== true || isolation.simultaneousReloadStable !== true || isolation.rawTokensPersistedInEvidence !== false) throw new Error('beauty_movement_context_isolation_evidence_invalid');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/beauty-movement-staging-smoke/evidence.json`, `${JSON.stringify({ campaignStatus: row.campaign_status, inviteStatus: row.invite_status, confirmed: true, revealCount: Number(row.reveal_count), outcomeKey: row.outcome_key, assignedOutcomeKey: row.assigned_outcome_key, assignmentProtocolVersion: row.assignment_protocol_version, outcomeProtocolVersion: row.outcome_protocol_version, outcomeSnapshotPresent: true, plannedCardSelectionsPresent: true, outcomeResolved: true, browserReloadStable: true, contextIsolation: true, syntheticInviteCount: 4, whatsappRequests: 0, consoleErrors: 0 }, null, 2)}\n`, { mode: 0o600 });
          console.log(`staging persisted smoke passed: outcome=${row.outcome_key} reveals=${row.reveal_count} browserReloadStable=true`);
          NODE

      - name: Write redacted smoke summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/beauty-movement-staging-smoke/evidence.json"
          if [[ -f "${evidence}" ]]; then
            {
              echo '## Beauty Movement staging smoke';
              echo;
              echo "- release SHA: \`${RELEASE_SHA}\`";
              echo "- campaign: \`${CAMPAIGN_ID}\` (synthetic)";
              cat "${evidence}";
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore staging and disable synthetic fixture
        if: ${{ always() }}
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          disable_sql="UPDATE bm_invites SET invite_status = 'revoked', updated_at_ms = CAST(strftime('%s','now') AS INTEGER) * 1000 WHERE campaign_id = '${CAMPAIGN_ID}'; UPDATE bm_campaigns SET status = 'disabled', updated_at_ms = CAST(strftime('%s','now') AS INTEGER) * 1000 WHERE id = '${CAMPAIGN_ID}' AND status IN ('draft','active');"
          if ! npx --yes wrangler@4.112.0 d1 execute "${STAGING_D1_DATABASE}" --remote --config wrangler.toml --env staging --command "${disable_sql}" --json >"$RUNNER_TEMP/beauty-movement-staging-smoke/cleanup-d1.json"; then
            echo 'synthetic fixture cleanup failed'
            cleanup_failed=1
          fi
          if [[ -f "${STATE_FILE}" ]]; then
            incumbent_version="$(node --input-type=commonjs -e "const s=require('fs').readFileSync(process.argv[1],'utf8'); process.stdout.write(JSON.parse(s).incumbentVersion || '')" "${STATE_FILE}")"
            if [[ "${incumbent_version}" =~ ^[0-9a-f-]{36}$ ]]; then
              current_json="$RUNNER_TEMP/beauty-movement-staging-smoke/current.json"
              npx --yes wrangler@4.112.0 deployments list --config wrangler.toml --env staging --json >"${current_json}" || cleanup_failed=1
              current_version="$(node - "${current_json}" <<'NODE'
          const fs = require('node:fs');
          const deployments = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const candidates = deployments.flatMap((deployment) => (deployment.versions ?? []).map((version) => ({ deployment, version }))).filter(({ version }) => Number(version.percentage) === 100 && /^[0-9a-f-]{36}$/i.test(version.version_id)).sort((a, b) => String(b.deployment.created_on ?? '').localeCompare(String(a.deployment.created_on ?? '')));
          process.stdout.write(candidates[0]?.version?.version_id ?? '');
          NODE
              )"
              if [[ -n "${current_version}" && "${current_version}" != "${incumbent_version}" ]]; then
                restored=false
                for attempt in $(seq 1 3); do
                  if npx --yes wrangler@4.112.0 rollback "${incumbent_version}" --config wrangler.toml --env staging --yes --message "beauty-movement-staging-smoke:restore-incumbent" >/dev/null 2>&1; then
                    restored=true
                    break
                  fi
                  sleep 5
                done
                [[ "${restored}" == true ]] || { echo 'staging incumbent rollback failed'; cleanup_failed=1; }
              fi
            else
              echo 'staging incumbent identity was not available for cleanup'
              cleanup_failed=1
            fi
          fi
          for attempt in $(seq 1 12); do
            inactive_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "origin: ${STAGING_URL}" -H 'content-type: application/json' \
              --data '{"token":"staging-smoke-disabled-probe"}' \
              "${STAGING_URL}/api/beleza-em-movimento/session" || true)"
            [[ "${inactive_code}" == "503" ]] && break
            sleep 5
          done
          [[ "${inactive_code}" == "503" ]] || { echo "staging campaign API is not inactive after cleanup (HTTP ${inactive_code})"; cleanup_failed=1; }
          [[ "${cleanup_failed}" == 0 ]] || exit 1

      - name: Release Website staging coordination lease
        if: ${{ always() }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/website-lease.json

      - name: Release staging D1 coordination lease
        if: ${{ always() }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_file: ${{ runner.temp }}/beauty-movement-staging-smoke/d1-lease.json

      - name: Write Beauty Movement staging promotion evidence
        if: ${{ success() }}
        shell: bash
        env:
          PROMOTION_UNIT: ${{ inputs.promotion_unit }}
          PROMOTION_TARGET: staging
          PROMOTION_SOURCE_SHA: ${{ inputs.release_sha }}
          PROMOTION_EVIDENCE_FILE: ${{ runner.temp }}/beauty-movement-staging-smoke/promotion-evidence.json
        run: |
          set -euo pipefail
          tree="$(git rev-parse "${PROMOTION_SOURCE_SHA}^{tree}")"
          digest="$(PROMOTION_UNIT="${PROMOTION_UNIT}" PROMOTION_SOURCE_SHA="${PROMOTION_SOURCE_SHA}" node .github/scripts/promotion-evidence.mjs digest)"
          PROMOTION_SOURCE_TREE="${tree}" \
          PROMOTION_RELEASE_INPUT_DIGEST="${digest}" \
          PROMOTION_DEPENDENCY_CLOSURE_DIGEST="${digest}" \
          node .github/scripts/promotion-evidence.mjs write "${PROMOTION_EVIDENCE_FILE}" >/dev/null
          test -s "${PROMOTION_EVIDENCE_FILE}"

      - name: Upload Beauty Movement staging promotion evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-${{ inputs.promotion_unit }}
          path: ${{ runner.temp }}/beauty-movement-staging-smoke/promotion-evidence.json
          retention-days: 14
          if-no-files-found: error
