name: Central CodeQL Aggregate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '21 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analyze (superproject + submodules)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules with GH_TOKEN
        run: |
          set -euxo pipefail
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::error::GH_TOKEN secret is required to fetch private submodules"; exit 1;
          fi
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          queries: security-extended,security-and-quality

      - name: Autofix common monorepo paths
        run: |
          set -euxo pipefail
          # Create stub package.json for repos missing root manifest to help CodeQL JS autobuild
          [ -f package.json ] || echo '{"name":"skincos-superproject","private":true}' > package.json
          # Ensure Python projects are discoverable
          find . -name requirements.txt -o -name pyproject.toml || true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis (non-blocking)
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: '/language:multi-aggregate'
