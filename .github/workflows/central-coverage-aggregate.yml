name: Central Coverage Aggregate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules with GH_TOKEN
        run: |
          set -euxo pipefail
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::error::GH_TOKEN secret is required to fetch private submodules"; exit 1;
          fi
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Find and collect coverage artifacts
        run: |
          set -euxo pipefail
          mkdir -p coverage-collect
          # Common patterns
          find . -type f -name 'coverage-final.json' -o -name 'lcov.info' -o -name 'coverage.xml' | tee coverage-collect/list.txt || true

      - name: Upload aggregated coverage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aggregate
          path: coverage-collect

      - name: Post summary
        run: |
          echo "Found coverage files:" >> $GITHUB_STEP_SUMMARY
          cat coverage-collect/list.txt 2>/dev/null || echo "(none)" >> $GITHUB_STEP_SUMMARY
