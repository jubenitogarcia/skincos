name: Central Dependency Updates (Issues Only)

on:
  schedule:
    - cron: '25 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  deps_issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Node packages outdated (per submodule)
        run: |
          set -euxo pipefail
          npm i -g npm-check-updates@17 >/dev/null 2>&1
          while read -r pkgfile; do
            dir=$(dirname "$pkgfile")
            echo "Scanning $dir"
            (cd "$dir" && npx --yes npm-check-updates -ui || true) > /tmp/ncu.txt || true
            if [ -s /tmp/ncu.txt ]; then
              echo "---"; cat /tmp/ncu.txt; echo "---";
            fi
          done < <(git ls-files | grep -E '(^|/)package.json$')

      - name: Python outdated packages (summary)
        run: |
          set -euxo pipefail
          for req in $(git ls-files | grep -E '(^|/)requirements\\.txt$'); do
            echo "Found requirements file: $req"
          done

      - name: Open an issue with summary
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const summary = execSync('git status --porcelain | cat').toString();
            const body = `Automated dependency update scan completed.\n\nReview per-module output in job logs. Consider enabling Dependabot in each submodule if desired.\n\nStatus snapshot:\n\n\n${summary}`;
            const title = `Deps update scan • ${new Date().toISOString().slice(0,10)}`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
