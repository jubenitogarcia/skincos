name: Central E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  e2e:
    name: Central E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install frontend deps
        run: |
          set -euxo pipefail
          cd frontend
          npm ci

      - name: Install Playwright (Chromium)
        run: |
          set -euxo pipefail
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start frontend (dev server)
        run: |
          set -euxo pipefail
          cd frontend
          npm run dev -- --host 127.0.0.1 --port 5173 &
          echo $! > /tmp/vite.pid
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:5173/" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Vite did not become ready"
          exit 1

      - name: Run Playwright smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: |
          set -euxo pipefail
          cd frontend
          npm run test:e2e

      - name: Stop frontend
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /tmp/vite.pid ]]; then
            pid="$(cat /tmp/vite.pid 2>/dev/null || true)"
            if [[ "${pid}" =~ ^[0-9]+$ ]]; then
              kill "${pid}" 2>/dev/null || true
            fi
          fi
