name: Central E2E Smoke

on:
  push:
    branches: [main]
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "api/**"
      - "shared/**"
      - "platform/**"
      - "workforce/**"
      - "ops/**"
      - "**/package*.json"
      - "**/package-lock.json"
      - ".github/**"
      - "scripts/github-actions/**"
  pull_request:
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "api/**"
      - "shared/**"
      - "platform/**"
      - "workforce/**"
      - "ops/**"
      - "**/package*.json"
      - "**/package-lock.json"
      - ".github/**"
      - "scripts/github-actions/**"
  workflow_dispatch: {}

jobs:
  scope:
    name: Scope Central E2E closure
    runs-on: ubuntu-latest
    outputs:
      run_central_e2e: ${{ steps.scope.outputs.run_central_e2e }}
      central_tests: ${{ steps.scope.outputs.central_tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/github-actions/affected-crm-validation-scope.mjs

  e2e:
    name: Central E2E Smoke
    needs: scope
    if: ${{ needs.scope.outputs.run_central_e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: 'npm'
          cache-dependency-path: |
            crm/console/package-lock.json

      - name: Install frontend deps
        run: |
          set -euxo pipefail
          cd crm/console
          npm ci

      - name: Install Playwright (Chromium)
        run: |
          set -euxo pipefail
          cd crm/console
          npx playwright install --with-deps chromium

      - name: Start frontend (dev server)
        env:
          VITE_FINANCE_MODULE_URL: http://127.0.0.1:5173/finance-module.js
        run: |
          set -euxo pipefail
          cd crm/console
          npm run dev -- --host 127.0.0.1 --port 5173 &
          echo $! > /tmp/vite.pid
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:5173/" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Vite did not become ready"
          exit 1

      - name: Run Playwright smoke
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_TEST_PATHS: ${{ needs.scope.outputs.central_tests }}
        run: |
          set -euxo pipefail
          cd crm/console
          if [[ "$E2E_TEST_PATHS" == "__FULL__" ]]; then
            RUN_ESCALA_E2E_IN_CI=1 RUN_ATENDIMENTO_E2E_IN_CI=1 npm run test:e2e
          else
            read -r -a tests <<< "$E2E_TEST_PATHS"
            npx playwright test "${tests[@]}"
          fi

      - name: Stop frontend
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /tmp/vite.pid ]]; then
            pid="$(cat /tmp/vite.pid 2>/dev/null || true)"
            if [[ "${pid}" =~ ^[0-9]+$ ]]; then
              kill "${pid}" 2>/dev/null || true
            fi
          fi
