name: Central Healthchecks

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules with GH_TOKEN
        run: |
          set -euxo pipefail
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::error::GH_TOKEN secret is required to fetch private submodules"; exit 1;
          fi
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Run module health checks (best-effort)
        run: |
          set -euxo pipefail
          if [ -f scripts/healthcheck ]; then bash scripts/healthcheck || true; else echo "No top-level scripts/healthcheck"; fi
          # Submodule-specific health checks if present
          for d in a0 broadhub comprehensive-crm-so whatsapp-gateway; do
            if [ -f "$d/scripts/healthcheck" ]; then echo "Running $d healthcheck"; bash "$d/scripts/healthcheck" || true; fi
          done
