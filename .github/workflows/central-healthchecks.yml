name: Central Healthchecks

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run workspace health checks (best-effort)
        run: |
          set -euxo pipefail
          if [ -f backend/scripts/doctor.sh ]; then bash backend/scripts/doctor.sh || true; else echo "No backend/scripts/doctor.sh"; fi
          if [ -f backend/scripts/e2e.sh ]; then bash backend/scripts/e2e.sh health || true; else echo "No backend/scripts/e2e.sh"; fi
