name: Central Lint & Typecheck

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules (best effort)
        run: |
          set -euxo pipefail
          if [ -n "${{ secrets.GH_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
            git submodule sync --recursive || true
            git submodule update --init --recursive || true
          else
            echo "GH_TOKEN not set; skipping submodule init (best-effort mode)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint CRM
        run: |
          set -euxo pipefail
          if [ -d "./comprehensive-crm-so" ] && [ -f "./comprehensive-crm-so/package.json" ]; then
            cd ./comprehensive-crm-so
            npm ci || true
            npx eslint . --ext .ts,.tsx --max-warnings 1000 || true
            npx tsc --noEmit || true
          else
            echo "CRM module not available; skipping"
          fi

      - name: Lint WhatsApp Gateway
        if: ${{ always() }}
        run: |
          set -euxo pipefail
          if [ -d "./whatsapp-gateway" ] && [ -f "./whatsapp-gateway/package.json" ]; then
            cd ./whatsapp-gateway
            pnpm -v || npm i -g pnpm@8
            pnpm install --frozen-lockfile || true
            pnpm lint || true
            pnpm typecheck || true
          else
            echo "Gateway module not available; skipping"
          fi

      - name: Lint Agent Zero (JS only)
        if: ${{ always() }}
        run: |
          set -euxo pipefail
          if [ -d "./a0" ] && [ -f "./a0/package.json" ]; then
            cd ./a0
            npm ci || true
            npm run lint || true
          else
            echo "Agent Zero module not available; skipping"
          fi
