name: Central Repo Health

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Validate submodule pointers
        run: |
          git submodule status
          # fail if any submodule has unpushed changes (placeholder check)
          EXIT=0
          git submodule foreach 'git fetch --quiet; LOCAL=$(git rev-parse HEAD); REMOTE=$(git rev-parse @{u} 2>/dev/null || echo $LOCAL); if [ "$LOCAL" != "$REMOTE" ]; then echo "⚠️ Submodule $name is not at remote HEAD"; fi' || true

      - name: Basic structure checks
        run: |
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f .gitmodules || (echo "Missing .gitmodules" && exit 1)

      - name: Open issue on failures (placeholder)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = 'Repo Health: Issues Detected';
            const body = 'Automated health check detected issues. Please review logs.';
            await github.rest.issues.create({owner, repo, title, body});
