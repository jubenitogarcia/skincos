name: Central Submodule Sync (auto PR)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules with GH_TOKEN
        run: |
          set -euxo pipefail
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::error::GH_TOKEN secret is required to fetch private submodules"; exit 1;
          fi
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          # Explicitly override each submodule URL to use tokenized HTTPS
          if [ -f .gitmodules ]; then
            while read -r name; do
              sm=${name#submodule.}; sm=${sm%.url}
              url=$(git config -f .gitmodules --get "submodule.$sm.url" || echo "")
              if echo "$url" | grep -q '^https://github.com/'; then
                tokenUrl=${url/https:\/\/github.com\//https:\/\/x-access-token:${{ secrets.GH_TOKEN }}@github.com\/}
                git config submodule.$sm.url "$tokenUrl"
                echo "Overrode $sm -> $tokenUrl"
              fi
            done < <(git config -f .gitmodules --name-only --get-regexp 'submodule\..*\.url')
          fi
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Update submodules to latest remote
        run: |
          set -euxo pipefail
          git submodule update --remote --recursive
          git status --porcelain

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(submodules): sync submodule pointers"
          title: "chore(submodules): sync submodule pointers"
          body: "Automated submodule sync (recursive)."
          branch: chore/auto-submodule-sync
          delete-branch: true
