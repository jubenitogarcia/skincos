name: CI Smoke (Assert)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "ops/codex/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/governance/**"
      - ".github/workflows/codex-autonomy-gate.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "ops/codex/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/governance/**"
      - ".github/workflows/codex-autonomy-gate.yml"
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  smoke:
    name: CI Smoke (Assert)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules (if configured)
        if: ${{ hashFiles('.gitmodules') != '' }}
        run: |
          set -euxo pipefail
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::warning::GH_TOKEN not set; skipping submodule init."
            exit 0
          fi
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Guard zero-demo invariants
        run: |
          set -euo pipefail
          bash backend/scripts/ci-no-demo-guard.sh

      - name: Block retired operational paths
        run: |
          set -euo pipefail
          if rg -n -i \
            -g '!scripts/audit-skincos-footprint.ps1' \
            'CodexProfileRename|SkincosMiniPc|n8n-top-level-legacy-20260703T181656|atendimento-legacy|Orb Stack WSL Supervisor' \
            .codex backend modules platform ops scripts; then
            echo 'Retired operational path reference found.' >&2
            exit 1
          fi

      - name: Validate supervised Codex continuity
        run: |
          set -euo pipefail
          python3 -m json.tool .codex/hooks.json >/dev/null
          python3 -m json.tool .codex/supervisor.json >/dev/null
          python3 -m unittest discover -s .codex/hooks/tests -p 'test_*.py' -v
          bash skills/skincos-project-orchestrator/scripts/test-behavior.sh
          bash .codex/hooks/tests/test-host-wrappers.sh

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Validate observability catalog
        run: node scripts/observability/validate-catalog.mjs

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Website lint
        working-directory: website
        run: npm run lint

      - name: Website tests
        working-directory: website
        run: npm run test

      - name: Website build
        working-directory: website
        run: npm run build

      - name: Install CRM API dependencies
        working-directory: crm/api
        run: npm ci

      - name: Install WhatsApp engine dependencies
        working-directory: messaging/channels/whatsapp/engine
        run: npm ci --ignore-scripts

      - name: Install backend workspace deps (pnpm)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm -C backend install --frozen-lockfile

      - name: Ensure jq
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 && exit 0
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Run assertive smoke in mock mode
        run: |
          set -euo pipefail
          bash backend/scripts/e2e.sh ci-smoke
          bash orb/engine/scripts/test-backup-n8n-storage-copy.sh

  supervised-continuity-windows:
    name: Supervised continuity (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Windows gate and rollback tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s .codex/hooks/tests -p 'test_*.py' -v
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.codex\hooks\tests\test-host-wrappers.ps1
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.codex\hooks\tests\test-rollback.ps1
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.codex\hooks\tests\test-skill-installer.ps1
