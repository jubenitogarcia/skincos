name: CI Smoke (Assert)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/governance/**"
      - ".github/workflows/codex-autonomy-gate.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/governance/**"
      - ".github/workflows/codex-autonomy-gate.yml"
  workflow_dispatch: {}

jobs:
  changes:
    name: Classify CI smoke surface
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.scope.outputs.website }}
      crm_api: ${{ steps.scope.outputs.crm_api }}
      whatsapp: ${{ steps.scope.outputs.whatsapp }}
      codex: ${{ steps.scope.outputs.codex }}
      observability: ${{ steps.scope.outputs.observability }}
      clientes_runtime_contract: ${{ steps.scope.outputs.clientes_runtime_contract }}
      orb_runtime: ${{ steps.scope.outputs.orb_runtime }}
      storage_governance: ${{ steps.scope.outputs.storage_governance }}
      ccg: ${{ steps.scope.outputs.ccg }}
      all: ${{ steps.scope.outputs.all }}
      node: ${{ steps.scope.outputs.node }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha='0000000000000000000000000000000000000000'
          base="${PR_BASE_SHA:-}"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then base=""; fi
          if [[ -z "$base" && "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != "$zero_sha" ]]; then
            base="$BEFORE_SHA"
          fi
          if [[ -z "$base" ]]; then base="$(git rev-parse HEAD^)"; fi
          git cat-file -e "$base^{commit}"
          changed() {
            if git diff --quiet "$base...$GITHUB_SHA" -- "$@"; then printf false; else printf true; fi
          }
          website="$(changed website booking package.json package-lock.json)"
          crm_api="$(changed crm/api)"
          whatsapp="$(changed messaging/channels/whatsapp/engine)"
          codex="$(changed .codex skills ops/codex scripts/codex-*.mjs scripts/codex-*.sh scripts/*codex*.ps1)"
          observability="$(changed scripts/observability)"
          clientes_runtime_contract="$(changed scripts crm/api ops/runtime/units)"
          orb_runtime="$(changed orb ops/runtime platform service scripts/runtime/start-n8n-runtime.sh scripts/runtime/prepare-lifecycle-layout.sh scripts/runtime/test-orb-runtime-startup-contract.sh)"
          storage_governance="$(changed ops/codex/storage-retention-policy.json scripts/skincos-storage-governance.ps1 scripts/dedupe-source-tars.ps1 scripts/tests/test-skincos-storage-governance.ps1)"
          ccg="$(changed orb/engine)"
          all="$(changed .github/workflows/ci-smoke.yml)"
          node=false
          if [[ "$website" == true || "$crm_api" == true || "$whatsapp" == true || "$observability" == true || "$clientes_runtime_contract" == true || "$ccg" == true || "$all" == true ]]; then node=true; fi
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "crm_api=$crm_api" >> "$GITHUB_OUTPUT"
          echo "whatsapp=$whatsapp" >> "$GITHUB_OUTPUT"
          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "observability=$observability" >> "$GITHUB_OUTPUT"
          echo "clientes_runtime_contract=$clientes_runtime_contract" >> "$GITHUB_OUTPUT"
          echo "orb_runtime=$orb_runtime" >> "$GITHUB_OUTPUT"
          echo "storage_governance=$storage_governance" >> "$GITHUB_OUTPUT"
          echo "ccg=$ccg" >> "$GITHUB_OUTPUT"
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"

  smoke:
    name: CI Smoke (Assert)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize submodules (if configured)
        if: ${{ hashFiles('.gitmodules') != '' }}
        run: |
          set -euxo pipefail
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::warning::GH_TOKEN not set; skipping submodule init."
            exit 0
          fi
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Guard zero-demo invariants
        run: |
          set -euo pipefail
          bash backend/scripts/ci-no-demo-guard.sh

      - name: Block retired operational paths
        run: |
          set -euo pipefail
          if rg -n -i \
            -g '!scripts/audit-skincos-footprint.ps1' \
            'CodexProfileRename|SkincosMiniPc|n8n-top-level-legacy-20260703T181656|atendimento-legacy|Orb Stack WSL Supervisor' \
            .codex backend modules platform ops scripts; then
            echo 'Retired operational path reference found.' >&2
            exit 1
          fi

      - name: Setup Node for supervised Codex continuity
        if: ${{ needs.changes.outputs.codex == 'true' || needs.changes.outputs.all == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"

      - name: Validate supervised Codex continuity
        if: ${{ needs.changes.outputs.codex == 'true' || needs.changes.outputs.all == 'true' }}
        run: |
          set -euo pipefail
          python3 -m json.tool .codex/hooks.json >/dev/null
          python3 -m json.tool .codex/supervisor.json >/dev/null
          python3 -m unittest discover -s .codex/hooks/tests -p 'test_*.py' -v
          bash skills/skincos-project-orchestrator/scripts/test-behavior.sh
          bash .codex/hooks/tests/test-host-wrappers.sh
          node --test scripts/tests/codex-thread-worktree-router.test.mjs

      - name: Setup Node
        if: ${{ needs.changes.outputs.node == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Validate observability catalog
        if: ${{ needs.changes.outputs.observability == 'true' || needs.changes.outputs.all == 'true' }}
        run: node scripts/observability/validate-catalog.mjs

      - name: Verify Clientes staging runtime contract
        if: ${{ needs.changes.outputs.clientes_runtime_contract == 'true' || needs.changes.outputs.all == 'true' }}
        run: node --test scripts/tests/clientes-production-readonly-runtime.test.mjs

      - name: Install website dependencies
        if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.all == 'true' }}
        working-directory: website
        run: npm ci

      - name: Website lint
        if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.all == 'true' }}
        working-directory: website
        run: npm run lint

      - name: Website tests
        if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.all == 'true' }}
        working-directory: website
        run: npm run test

      - name: Website build
        if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.all == 'true' }}
        working-directory: website
        run: npm run build

      - name: Install CRM API dependencies
        if: ${{ needs.changes.outputs.crm_api == 'true' || needs.changes.outputs.all == 'true' }}
        working-directory: crm/api
        run: npm ci

      - name: Install WhatsApp engine dependencies
        if: ${{ needs.changes.outputs.whatsapp == 'true' || needs.changes.outputs.all == 'true' }}
        working-directory: messaging/channels/whatsapp/engine
        run: npm ci --ignore-scripts

      - name: Run CRM API regression smoke
        if: ${{ needs.changes.outputs.crm_api == 'true' || needs.changes.outputs.all == 'true' }}
        run: |
          set -euo pipefail
          npm --prefix crm/api test

      - name: Run WhatsApp engine regression smoke
        if: ${{ needs.changes.outputs.whatsapp == 'true' || needs.changes.outputs.all == 'true' }}
        run: |
          set -euo pipefail
          npm --prefix messaging/channels/whatsapp/engine test

      - name: Run Campaign Creative runtime tests
        if: ${{ needs.changes.outputs.ccg == 'true' || needs.changes.outputs.all == 'true' }}
        run: |
          set -euo pipefail
          npm --prefix orb/engine run workflow:campaign-creative:runtime:test

      - name: Verify native Orb backup and startup paths
        if: ${{ needs.changes.outputs.orb_runtime == 'true' || needs.changes.outputs.all == 'true' }}
        run: |
          set -euo pipefail
          bash orb/engine/scripts/test-backup-n8n-storage-copy.sh
          bash scripts/runtime/test-orb-runtime-startup-contract.sh

  supervised-continuity-windows:
    name: Supervised continuity (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.codex == 'true' || needs.changes.outputs.storage_governance == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Windows gate and rollback tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s .codex/hooks/tests -p 'test_*.py' -v
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.codex\hooks\tests\test-host-wrappers.ps1
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.codex\hooks\tests\test-rollback.ps1
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.codex\hooks\tests\test-skill-installer.ps1
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\codex-thread-worktree-router.test.ps1
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\codex-thread-routing-hook.test.ps1
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\codex-thread-routing-bridge.test.ps1

      - name: Verify storage governance contracts
        if: ${{ needs.changes.outputs.storage_governance == 'true' || needs.changes.outputs.all == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\test-skincos-storage-governance.ps1
