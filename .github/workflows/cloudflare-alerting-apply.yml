name: cloudflare-alerting-apply

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without mutating Cloudflare (prints payloads)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "23 3 * * 1" # weekly drift remediation (gated by ENABLE_CLOUDFLARE_ALERTING_APPLY)

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard Cloudflare alerting secrets
        id: guard
        env:
          ENABLE_CLOUDFLARE_ALERTING_APPLY: ${{ vars.ENABLE_CLOUDFLARE_ALERTING_APPLY }}
          CLOUDFLARE_ALERT_ENABLE_EMAILS: ${{ vars.CLOUDFLARE_ALERT_ENABLE_EMAILS || 'false' }}
          CLOUDFLARE_ALERTS_API_TOKEN: ${{ secrets.CLOUDFLARE_ALERTS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ALERT_EMAILS: ${{ vars.CLOUDFLARE_ALERT_EMAILS }}
          CLOUDFLARE_ALERT_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${ENABLE_CLOUDFLARE_ALERTING_APPLY:-false}" != "true" ]]; then
            echo "Scheduled Cloudflare alerting apply disabled; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${CLOUDFLARE_ALERT_ENABLE_EMAILS:-false}" != "true" ]]; then
            unset CLOUDFLARE_ALERT_EMAILS
          fi

          if [[ -z "${CLOUDFLARE_ALERTS_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare alerting secrets not configured; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "${CLOUDFLARE_ALERT_EMAILS:-}" && -z "${CLOUDFLARE_ALERT_WEBHOOK_URL:-}" ]]; then
            echo "Cloudflare alerting destinations not configured (email/webhook); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Ensure jq
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 && exit 0
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Acquire Cloudflare alerting lease
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event.inputs.dry_run || 'false') != 'true' }}
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          resource: cloudflare:alerting:production
          module: cloudflare-alerting
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-cloudflare-alerting.json

      - name: Check Cloudflare alerting lease before policy mutation
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event.inputs.dry_run || 'false') != 'true' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-cloudflare-alerting.json
          resource: cloudflare:alerting:production
          module: cloudflare-alerting
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}

      - name: Apply Cloudflare alerting policies
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_ALERT_ENABLE_EMAILS: ${{ vars.CLOUDFLARE_ALERT_ENABLE_EMAILS || 'false' }}
          CLOUDFLARE_ALERTS_API_TOKEN: ${{ secrets.CLOUDFLARE_ALERTS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ALERT_EMAILS: ${{ vars.CLOUDFLARE_ALERT_EMAILS }}
          CLOUDFLARE_ALERT_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_ALERT_WEBHOOK_URL }}
          CLOUDFLARE_ALERT_WEBHOOK_NAME: skincos-alerts
          CLOUDFLARE_PAGES_PROJECT_IDS: ${{ vars.CLOUDFLARE_PAGES_PROJECT_IDS }}
          CLOUDFLARE_PAGES_ENVIRONMENTS: ${{ vars.CLOUDFLARE_PAGES_ENVIRONMENTS }}
          CLOUDFLARE_PAGES_EVENTS: ${{ vars.CLOUDFLARE_PAGES_EVENTS }}
          CLOUDFLARE_ALERTING_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ALERT_ENABLE_EMAILS:-false}" != "true" ]]; then
            unset CLOUDFLARE_ALERT_EMAILS
          fi
          cd /tmp
          bash "$GITHUB_WORKSPACE/backend/scripts/cloudflare-alerting-apply.sh"
          cat cloudflare-alerting-apply.summary.json

      - name: Upload summary artifact
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-alerting-apply
          path: /tmp/cloudflare-alerting-apply.summary.json

      - name: Release Cloudflare alerting lease
        if: ${{ always() && steps.guard.outputs.skip != 'true' && (github.event.inputs.dry_run || 'false') != 'true' }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-cloudflare-alerting.json
