name: cloudflare-alerting-export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure jq
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 && exit 0
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Export alerting data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ALERTS_API_TOKEN != '' && secrets.CLOUDFLARE_ALERTS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_NAME: skincos.com.br
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          bash "$GITHUB_WORKSPACE/backend/scripts/cloudflare-alerting-export.sh"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-alerting-export
          path: |
            /tmp/token_verify.json
            /tmp/eligible_destinations.json
            /tmp/policies.json
            /tmp/zones.json
            /tmp/zone_id.txt
            /tmp/alert_types.json
            /tmp/alert_types_endpoint.txt

