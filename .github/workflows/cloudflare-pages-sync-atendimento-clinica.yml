name: Sync Atendimento Clinica Secret (Cloudflare Pages)

on:
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: "Force CRM Pages redeploy after syncing the secret"
        required: false
        default: "true"

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Guard Cloudflare credentials + Atendimento Clinica secret
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY: ${{ secrets.ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY }}
          FORCE_REDEPLOY: ${{ github.event.inputs.force_redeploy || 'true' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare secrets missing; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY:-}" ]]; then
            echo "Missing GitHub secret ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=${PAGES_PROJECT:-skincos}" >> "$GITHUB_OUTPUT"
          echo "force_redeploy=${FORCE_REDEPLOY:-true}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Sync Atendimento Clinica secret to Cloudflare Pages
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY: ${{ secrets.ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY }}
        run: |
          set -euo pipefail
          for env_name in production preview; do
            printf "%s" "$ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY" | npx --yes wrangler@4 pages secret put ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY --project-name "$PROJECT" --env "$env_name" >/dev/null
            echo "Set Pages secret ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY for env=$env_name."
          done

      - name: Verify Atendimento Clinica secret presence
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
        run: |
          set -euo pipefail
          curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}" \
            > pages_project.json
          python - <<'PY'
          import json
          with open("pages_project.json", "r", encoding="utf-8") as f:
            payload = json.load(f)
          if not payload.get("success"):
            raise SystemExit(f"Cloudflare API returned success=false: {payload.get('errors') or payload}")
          cfg = ((payload.get("result") or {}).get("deployment_configs") or {})
          prod = ((cfg.get("production") or {}).get("env_vars") or {})
          prev = ((cfg.get("preview") or {}).get("env_vars") or {})
          missing = []
          if "ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY" not in prod:
            missing.append("production")
          if "ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY" not in prev:
            missing.append("preview")
          if missing:
            raise SystemExit(f"ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY ausente em: {', '.join(missing)}")
          print("ATENDIMENTO_CLINICA_ACTOR_HMAC_KEY presente em production/preview.")
          PY

      - name: Force redeploy CRM Pages
        if: ${{ steps.guard.outputs.skip != 'true' && steps.guard.outputs.force_redeploy == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-crm-pages-reconcile.yml",
              ref: "main",
              inputs: { force: "true" },
            })
            core.info("Dispatched deploy-crm-pages-reconcile.yml with force=true")
