name: Sync Meta Ads Report Secret (Cloudflare Pages)

on:
  schedule:
    # Keep the CRM Pages runtime aligned with the GitHub source of truth.
    - cron: "37 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard Cloudflare credentials + Meta Ads report secret
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CRM_PAGES_PROJECT }}
          META_ADS_REPORT_WORKER_API_TOKEN: ${{ secrets.META_ADS_REPORT_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare secrets missing; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${META_ADS_REPORT_WORKER_API_TOKEN:-}" ]]; then
            echo "Missing GitHub secret META_ADS_REPORT_WORKER_API_TOKEN; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=${PAGES_PROJECT:-skincos}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Acquire Meta Ads report release lease
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          resource: global:crm-cloudflare-writer
          module: meta-ads-report
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-meta-ads-report-sync.json

      - name: Check Meta Ads report release lease before Pages-secret mutation
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-meta-ads-report-sync.json
          resource: global:crm-cloudflare-writer
          module: meta-ads-report
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Sync Meta Ads report token to Cloudflare Pages
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          META_ADS_REPORT_WORKER_API_TOKEN: ${{ secrets.META_ADS_REPORT_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          for env_name in production preview; do
            printf "%s" "$META_ADS_REPORT_WORKER_API_TOKEN" | npx --yes wrangler@4 pages secret put META_ADS_REPORT_WORKER_API_TOKEN --project-name "$PROJECT" --env "$env_name" >/dev/null
            echo "Set Pages secret META_ADS_REPORT_WORKER_API_TOKEN for env=$env_name."
          done

      - name: Release Meta Ads report release lease
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-meta-ads-report-sync.json
