name: Attest CRM Pages env (Timekeeping)
run-name: Attest CRM Pages ${{ inputs.target }} ${{ inputs.release_sha }} orchestrator=${{ inputs.orchestrator_run_id }} nonce=${{ inputs.orchestrator_nonce }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit isolated target; values come only from this GitHub environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      release_sha:
        description: Immutable main SHA that owns this provisioning change
        required: true
        type: string
      staging_run_id:
        description: Required for production; successful Ponto staging evidence for this SHA
        required: false
        type: string
      root_custody_run_id:
        description: Exact successful pre-mutation root-custody child run
        required: true
        type: string
      orchestrator_run_id:
        description: Ponto coordinator correlation ID
        required: false
        type: string
      orchestrator_stage:
        description: Exact stage of the issuing Ponto coordinator
        required: false
        type: string
      orchestrator_issuer_run_id:
        description: Exact direct issuer run
        required: false
        type: string
      orchestrator_nonce:
        description: Non-secret per-dispatch correlation nonce
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

jobs:
  coordination:
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
    uses: ./.github/workflows/ponto-orchestrator-gate.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
    with:
      required: true
      global_lease_required: true
      global_resource: global:crm-cloudflare-writer
      global_module: ponto
      global_coordinator_url: ${{ inputs.target == 'production' && vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL || vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
      lease_key: pages-secrets
      stage: ${{ inputs.orchestrator_stage }}
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}
  provision:
    needs: coordination
    if: ${{ github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/skincos/release/ponto/') && inputs.orchestrator_run_id != '' && github.sha == inputs.release_sha)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    steps:
      - name: Initialize Pages mutation journal before checkout, setup, and preconditions
        env:
          TARGET: ${{ inputs.target }}
          STAGING_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT_STAGING }}
          PRODUCTION_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging) PROJECT="$STAGING_PROJECT_RAW" ;;
            production) PROJECT="$PRODUCTION_PROJECT_RAW" ;;
            *) echo 'Unsupported Ponto Pages custody target'; exit 1 ;;
          esac
          export PROJECT
          node - "$RUNNER_TEMP/pages-release-probe-evidence.json" <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          fs.writeFileSync(file, `${JSON.stringify({
            schemaVersion: 1,
            surface: "pagesEnvironmentSecrets",
            target: process.env.TARGET,
            project: process.env.PROJECT,
            releaseSha: process.env.RELEASE_SHA,
            orchestratorRunId: process.env.ORCHESTRATOR_RUN_ID,
            mutationStarted: false,
            mutationCompleted: false,
            remoteAttestationCompleted: false,
            retentionPolicy: "environment-scoped-deterministic-prerequisite",
            valuesIncluded: false,
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          [[ -n "$PROJECT" ]] || { echo 'Ponto Pages project is missing'; exit 1; }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22.12.0
      - name: Verify immutable source and production predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          ROOT_CUSTODY_RUN_ID: ${{ inputs.root_custody_run_id }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full SHA'; exit 1; }
          [[ "$ROOT_CUSTODY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'root_custody_run_id must be numeric'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'checkout differs from release_sha'; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'release_sha is not reachable from main'; exit 1; }
          if [[ "$TARGET" == production ]]; then
            [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'production provisioning requires staging_run_id'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ponto-progressive-release.yml" > "$RUNNER_TEMP/staging-workflow.json"
            node - "$RUNNER_TEMP/staging-run.json" "$RUNNER_TEMP/staging-workflow.json" <<'NODE'
          const fs = require("fs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const workflow = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (
            workflow.state !== "active"
            || workflow.path !== ".github/workflows/ponto-progressive-release.yml"
            || workflow.name !== "Ponto progressive release"
          ) {
            throw new Error("canonical Ponto coordinator is not active at the expected path");
          }
          const expectedPath = workflow.path;
          if (
            run.workflow_id !== workflow.id
            || ![expectedPath, `${expectedPath}@refs/heads/main`].includes(run.path)
            || run.status !== "completed"
            || run.conclusion !== "success"
            || run.event !== "workflow_dispatch"
            || run.head_branch !== "main"
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
          ) {
            throw new Error("staging predecessor provenance is not the canonical completed main coordinator");
          }
          NODE
            mkdir -p "$RUNNER_TEMP/staging-evidence"
            gh run download "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "ponto-release-evidence-staging-$RELEASE_SHA" --dir "$RUNNER_TEMP/staging-evidence"
            PONTO_EXPECTED_STAGE=staging PONTO_EXPECTED_SHA="$RELEASE_SHA" PONTO_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
              node .github/scripts/ponto-release-evidence.mjs verify "$RUNNER_TEMP/staging-evidence/ponto-release-evidence.json"
            rm -f "$RUNNER_TEMP/staging-run.json" "$RUNNER_TEMP/staging-workflow.json"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROOT_CUSTODY_RUN_ID" > "$RUNNER_TEMP/root-custody-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-workers-sync-ponto-secrets.yml" > "$RUNNER_TEMP/root-custody-workflow.json"
          node --input-type=module - "$RUNNER_TEMP/root-custody-run.json" "$RUNNER_TEMP/root-custody-workflow.json" <<'NODE'
          import fs from "node:fs";
          import { pontoSourceClosureMatches } from "./.github/scripts/ponto-source-closure.mjs";
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const workflow = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const releaseRef = `refs/tags/skincos/release/ponto/${process.env.RELEASE_SHA}`;
          const releaseTag = releaseRef.slice("refs/tags/".length);
          const expectedTitle = new RegExp(
            `^Attest Ponto Workers ${process.env.TARGET} ${process.env.RELEASE_SHA} orchestrator=${process.env.ORCHESTRATOR_RUN_ID} nonce=([0-9a-f]{32})$`,
          ).exec(String(run.display_title || ""));
          if (
            workflow.state !== "active"
            || workflow.path !== ".github/workflows/cloudflare-workers-sync-ponto-secrets.yml"
            || workflow.name !== "Attest Ponto Worker secret custody"
            || run.id !== Number(process.env.ROOT_CUSTODY_RUN_ID)
            || run.workflow_id !== workflow.id
            || ![workflow.path, `${workflow.path}@${releaseRef}`].includes(run.path)
            || run.run_attempt !== 1
            || run.status !== "completed"
            || run.conclusion !== "success"
            || run.event !== "workflow_dispatch"
            || run.head_branch !== releaseTag
            || String(run.head_sha || "").toLowerCase() !== process.env.RELEASE_SHA
            || !pontoSourceClosureMatches(process.env.RELEASE_SHA, String(run.head_sha || "").toLowerCase())
            || !expectedTitle
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
            || String(run.repository?.id || "") !== process.env.GITHUB_REPOSITORY_ID
            || String(run.head_repository?.id || "") !== process.env.GITHUB_REPOSITORY_ID
          ) throw new Error("root custody run provenance differs from the governed pre-mutation child");
          NODE
          mkdir -p "$RUNNER_TEMP/current-root-custody"
          gh run download "$ROOT_CUSTODY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ponto-root-custody-$TARGET-$RELEASE_SHA" \
            --dir "$RUNNER_TEMP/current-root-custody"
          mapfile -t custody_files < <(find "$RUNNER_TEMP/current-root-custody" -type f -name root-custody.json -print)
          [[ "${#custody_files[@]}" == 1 ]] || { echo 'Root custody child artifact must contain exactly one root-custody.json'; exit 1; }
          node .github/scripts/ponto-root-custody.mjs verify "$TARGET" "$RELEASE_SHA" "${custody_files[0]}"
          rm -f "$RUNNER_TEMP/root-custody-run.json" "$RUNNER_TEMP/root-custody-workflow.json"
      - name: Revalidate the exact active coordinator before Pages custody secrets or mutation
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Authorize global Cloudflare Pages custody mutation
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
          resource: global:crm-cloudflare-writer
          module: ponto
          source_sha: ${{ inputs.release_sha }}
      - name: Attest environment-owned derivation root
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required for custody attestation'; exit 1; }
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET/secrets?per_page=100" > "$RUNNER_TEMP/environment-secrets.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" > "$RUNNER_TEMP/repository-secrets.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET/variables?per_page=100" > "$RUNNER_TEMP/environment-variables.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/variables?per_page=100" > "$RUNNER_TEMP/repository-variables.json"
          node - \
            "$RUNNER_TEMP/environment-secrets.json" \
            "$RUNNER_TEMP/repository-secrets.json" \
            "$RUNNER_TEMP/environment-variables.json" \
            "$RUNNER_TEMP/repository-variables.json" <<'NODE'
          const fs = require("fs");
          const names = (file, key) => {
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            const entries = Array.isArray(payload)
              ? payload.flatMap(page => Array.isArray(page?.[key]) ? page[key] : [])
              : (Array.isArray(payload?.[key]) ? payload[key] : []);
            return new Set(entries.map(item => item.name));
          };
          const environmentSecrets = names(process.argv[2], "secrets");
          const repositorySecrets = names(process.argv[3], "secrets");
          const environmentVariables = names(process.argv[4], "variables");
          const repositoryVariables = names(process.argv[5], "variables");
          if (!environmentSecrets.has("PONTO_IDEMPOTENCY_KEY")) {
            throw new Error("PONTO_IDEMPOTENCY_KEY must exist in the selected GitHub environment; repository fallback is refused");
          }
          if (
            repositorySecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
            || !environmentSecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
          ) {
            throw new Error("shared root attestation key must exist only in the selected GitHub environment");
          }
          if (!environmentVariables.has("PONTO_IDEMPOTENCY_KEY_CUSTODY_REF")) {
            throw new Error("PONTO_IDEMPOTENCY_KEY_CUSTODY_REF must exist in the selected GitHub environment");
          }
          if (
            !repositoryVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
            || environmentVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
          ) {
            throw new Error("shared root attestation key ID must exist only at repository scope");
          }
          NODE
          rm -f \
            "$RUNNER_TEMP/environment-secrets.json" \
            "$RUNNER_TEMP/repository-secrets.json" \
            "$RUNNER_TEMP/environment-variables.json" \
            "$RUNNER_TEMP/repository-variables.json"
      - name: Derive and provision environment-scoped Ponto Pages keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_ROOT_ATTESTATION_KEY_SHARED: ${{ secrets.PONTO_ROOT_ATTESTATION_KEY_SHARED }}
          PONTO_IDEMPOTENCY_KEY_CUSTODY_REF: ${{ vars.PONTO_IDEMPOTENCY_KEY_CUSTODY_REF }}
          PONTO_ROOT_ATTESTATION_KEY_ID: ${{ vars.PONTO_ROOT_ATTESTATION_KEY_ID }}
          TARGET: ${{ inputs.target }}
          STAGING_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT_STAGING }}
          PRODUCTION_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging) PROJECT="$STAGING_PROJECT_RAW"; OPPOSITE_PROJECT="$PRODUCTION_PROJECT_RAW" ;;
            production) PROJECT="$PRODUCTION_PROJECT_RAW"; OPPOSITE_PROJECT="$STAGING_PROJECT_RAW" ;;
            *) echo 'Unsupported Ponto Pages custody target'; exit 1 ;;
          esac
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PONTO_IDEMPOTENCY_KEY PONTO_ROOT_ATTESTATION_KEY_SHARED PONTO_IDEMPOTENCY_KEY_CUSTODY_REF PONTO_ROOT_ATTESTATION_KEY_ID PROJECT; do
            [[ -n "${!name:-}" ]] || { echo "Missing required $TARGET environment value: $name"; exit 1; }
          done
          [[ -z "${OPPOSITE_PROJECT:-}" || "$PROJECT" != "$OPPOSITE_PROJECT" ]] || { echo 'Ponto Pages projects are not isolated'; exit 1; }
          export PROJECT
          before_project_file="$RUNNER_TEMP/pages-project-before.json"
          after_project_file="$RUNNER_TEMP/pages-project-after.json"
          secret_file="$RUNNER_TEMP/pages-release-probe-secret.json"
          evidence_file="$RUNNER_TEMP/pages-release-probe-evidence.json"
          export PONTO_ROOT_CUSTODY_FILE="$RUNNER_TEMP/current-root-custody/root-custody.json"
          export PONTO_STAGING_EVIDENCE_FILE="$RUNNER_TEMP/staging-evidence/ponto-release-evidence.json"
          export PONTO_DERIVED_SECRET_FILE="$secret_file"
          trap 'rm -f "$before_project_file" "$after_project_file" "$secret_file"' EXIT
          node <<'NODE'
          const value = String(process.env.PONTO_IDEMPOTENCY_KEY || "");
          if (
            Buffer.byteLength(value, "utf8") < 32
            || value !== value.trim()
            || /[\r\n\0]/.test(value)
          ) throw new Error("PONTO_IDEMPOTENCY_KEY must contain at least 32 UTF-8 bytes and no surrounding/control whitespace");
          NODE
          node --input-type=module - <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import {
            attestationKeyCommitment,
            rootFingerprint,
            validateRootCustody,
          } from "./.github/scripts/ponto-root-custody.mjs";
          const attested = validateRootCustody(
            JSON.parse(fs.readFileSync(process.env.PONTO_ROOT_CUSTODY_FILE, "utf8")),
            { target: process.env.TARGET, releaseSha: process.env.RELEASE_SHA },
          );
          const current = rootFingerprint(
            process.env.PONTO_IDEMPOTENCY_KEY,
            process.env.PONTO_ROOT_ATTESTATION_KEY_SHARED,
          );
          const currentKeyCommitment = attestationKeyCommitment(
            process.env.PONTO_ROOT_ATTESTATION_KEY_SHARED,
          );
          if (
            current !== attested.idempotencyDigest
            || attested.idempotencyCustodyRef !== process.env.PONTO_IDEMPOTENCY_KEY_CUSTODY_REF
            || attested.attestationKeyId !== process.env.PONTO_ROOT_ATTESTATION_KEY_ID
            || attested.attestationKeyCommitment !== currentKeyCommitment
          ) {
            throw new Error("Pages derivation root differs from the pre-mutation root custody commitment");
          }
          if (process.env.TARGET === "production") {
            const evidence = JSON.parse(fs.readFileSync(process.env.PONTO_STAGING_EVIDENCE_FILE, "utf8"));
            const staging = validateRootCustody(evidence?.surfaces?.timekeeping?.rootCustody, {
              target: "staging",
              releaseSha: process.env.RELEASE_SHA,
              requireStagingSeparation: false,
            });
            if (new Set([staging.profileDigest, staging.idempotencyDigest]).has(current)) {
              throw new Error("production Pages derivation root must be non-reused across staging");
            }
          }
          const derive = (domain) => crypto.createHmac("sha256", process.env.PONTO_IDEMPOTENCY_KEY)
            .update(domain)
            .digest("base64url");
          fs.writeFileSync(
            process.env.PONTO_DERIVED_SECRET_FILE,
            `${JSON.stringify({
              PONTO_ACTOR_HMAC_KEY: derive("skincos/ponto/actor/v1"),
              PONTO_NETWORK_CONTEXT_KEY: derive("skincos/ponto/network-context/v1"),
              PONTO_RELEASE_PROBE_HMAC_KEY: derive("skincos/ponto/release-probe/v1"),
            })}\n`,
            { mode: 0o600 },
          );
          NODE
          unset PONTO_ROOT_CUSTODY_FILE PONTO_STAGING_EVIDENCE_FILE PONTO_DERIVED_SECRET_FILE
          unset PONTO_ROOT_ATTESTATION_KEY_SHARED PONTO_IDEMPOTENCY_KEY
          if [[ "$TARGET" == production ]]; then
            [[ "$PROJECT" != "skincos-staging" ]] || exit 1
          else
            [[ "$PROJECT" == "skincos-staging" ]] || exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > "$before_project_file"
          node - "$before_project_file" "$evidence_file" <<'NODE'
          const fs = require("fs");
          const projectPayload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const project = projectPayload?.result;
          const envVars = project?.deployment_configs?.production?.env_vars;
          if (
            projectPayload?.success !== true
            || !envVars
            || typeof envVars !== "object"
            || Array.isArray(envVars)
          ) throw new Error("Cloudflare Pages project response did not contain structured production env_vars");
          const names = new Set(Object.keys(envVars));
          const expected = process.env.TARGET === "production"
            ? { name: "skincos", branch: "main", subdomain: "skincos.pages.dev", apiType: "secret_text" }
            : {
                name: "skincos-staging",
                branch: "staging",
                subdomain: "skincos-staging.pages.dev",
                apiType: "plain_text",
                apiValue: "https://api-staging.skincos.com.br",
              };
          const apiTarget = project?.deployment_configs?.production?.env_vars?.PONTO_API_TARGET;
          if (
            projectPayload?.success !== true
            || project?.name !== expected.name
            || project?.production_branch !== expected.branch
            || project?.subdomain !== expected.subdomain
            || apiTarget?.type !== expected.apiType
            || (expected.apiValue && apiTarget?.value !== expected.apiValue)
          ) throw new Error("PONTO_API_TARGET or isolated Pages project metadata differs from policy");
          if (process.env.TARGET === "production" && !names.has("PONTO_API_TARGET")) {
            throw new Error("production PONTO_API_TARGET secret is absent");
          }
          fs.writeFileSync(process.argv[3], `${JSON.stringify({
            schemaVersion: 1,
            surface: "pagesEnvironmentSecrets",
            target: process.env.TARGET,
            project: process.env.PROJECT,
            releaseSha: process.env.RELEASE_SHA,
            orchestratorRunId: process.env.ORCHESTRATOR_RUN_ID,
            mutationStarted: false,
            mutationCompleted: false,
            remoteAttestationCompleted: false,
            retentionPolicy: "environment-scoped-deterministic-prerequisite",
            beforeSecretPresence: Object.fromEntries([
              "PONTO_API_TARGET",
              "PONTO_ACTOR_HMAC_KEY",
              "PONTO_NETWORK_CONTEXT_KEY",
              "PONTO_RELEASE_PROBE_HMAC_KEY",
            ].map((name) => [name, names.has(name)])),
            valuesIncluded: false,
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          node - "$evidence_file" <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const journal = JSON.parse(fs.readFileSync(file, "utf8"));
          journal.mutationStarted = true;
          journal.mutationRequestStartedAt = new Date().toISOString();
          fs.writeFileSync(file, `${JSON.stringify(journal, null, 2)}\n`, { mode: 0o600 });
          NODE
          npx --yes wrangler@4.112.0 pages secret bulk "$secret_file" \
            --project-name "$PROJECT" \
            --env production
          node - "$evidence_file" <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const journal = JSON.parse(fs.readFileSync(file, "utf8"));
          journal.mutationCompleted = true;
          journal.mutationCompletedAt = new Date().toISOString();
          fs.writeFileSync(file, `${JSON.stringify(journal, null, 2)}\n`, { mode: 0o600 });
          NODE
          rm -f "$secret_file"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > "$after_project_file"
          node - "$after_project_file" "$evidence_file" <<'NODE'
          const fs = require("fs");
          const projectPayload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const journal = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const envVars = projectPayload?.result?.deployment_configs?.production?.env_vars;
          if (
            projectPayload?.success !== true
            || !envVars
            || typeof envVars !== "object"
            || Array.isArray(envVars)
          ) throw new Error("Cloudflare Pages project response did not contain structured production env_vars");
          const names = new Set(Object.keys(envVars));
          const required = [
            "PONTO_ACTOR_HMAC_KEY",
            "PONTO_NETWORK_CONTEXT_KEY",
            "PONTO_RELEASE_PROBE_HMAC_KEY",
          ];
          if (process.env.TARGET === "production") required.push("PONTO_API_TARGET");
          for (const name of required) {
            if (!names.has(name)) throw new Error(`remote Pages value missing after provisioning: ${name}`);
          }
          fs.writeFileSync(process.argv[3], `${JSON.stringify({
            ...journal,
            remoteAttestationCompleted: true,
            remoteAttestedAt: new Date().toISOString(),
            derivations: {
              PONTO_ACTOR_HMAC_KEY: "hmac-sha256:PONTO_IDEMPOTENCY_KEY:skincos/ponto/actor/v1",
              PONTO_NETWORK_CONTEXT_KEY: "hmac-sha256:PONTO_IDEMPOTENCY_KEY:skincos/ponto/network-context/v1",
              PONTO_RELEASE_PROBE_HMAC_KEY: "hmac-sha256:PONTO_IDEMPOTENCY_KEY:skincos/ponto/release-probe/v1",
            },
            requiredSecretNames: required,
            apiTargetBinding: process.env.TARGET === "production"
              ? { type: "secret_text", valueIncluded: false }
              : { type: "plain_text", expectedOrigin: "api-staging.skincos.com.br", valueIncluded: false },
            mutationSafety: {
              maintenanceRequired: true,
              deterministicRerun: true,
              priorSecretValuesReadable: false,
              retainedOnCodeRollback: true,
            },
            valuesIncluded: false,
            deploymentChanged: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          echo "Derived Ponto Pages bindings provisioned for $TARGET/$PROJECT; no deployment was changed."
      - name: Upload sanitised Pages secret attestation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-pages-secret-attestation-${{ inputs.target }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/pages-release-probe-evidence.json
          retention-days: 90
          if-no-files-found: error
  global-coordination-release:
    needs: [coordination, provision]
    if: ${{ always() && needs.coordination.outputs.global_lease_required == 'true' }}
    uses: ./.github/workflows/global-coordination-release.yml
    secrets:
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
    with:
      required: true
      proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
      coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
