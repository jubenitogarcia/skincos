name: Sync Integrations Encryption Secret (Pages + Social Publisher)

on:
  schedule:
    # Ensure critical secret remains present in Cloudflare runtimes.
    - cron: "22 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Guard Cloudflare credentials + Integrations secret
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare secrets missing; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${INTEGRATIONS_ENCRYPTION_SECRET:-}" ]]; then
            echo "Missing GitHub secret INTEGRATIONS_ENCRYPTION_SECRET; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=${PAGES_PROJECT:-skincos}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Sync secret to Cloudflare Pages (wrangler pages secret put)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          for env_name in production preview; do
            printf "%s" "$INTEGRATIONS_ENCRYPTION_SECRET" | npx --yes wrangler@4 pages secret put INTEGRATIONS_ENCRYPTION_SECRET --project-name "$PROJECT" --env "$env_name" >/dev/null
            echo "Set Pages secret INTEGRATIONS_ENCRYPTION_SECRET for env=$env_name."
          done

      - name: Sync secret to Social Publisher Worker
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          printf "%s" "$INTEGRATIONS_ENCRYPTION_SECRET" | npx --yes wrangler@4 secret put INTEGRATIONS_ENCRYPTION_SECRET --config social/publisher/wrangler.toml >/dev/null
          echo "Set secret INTEGRATIONS_ENCRYPTION_SECRET for social-publisher worker."

      - name: Force redeploy CRM Pages (apply secret/env)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-crm-pages-reconcile.yml",
              ref: "main",
              inputs: { force: "true" },
            })
            core.info("Dispatched deploy-crm-pages-reconcile.yml with force=true")
