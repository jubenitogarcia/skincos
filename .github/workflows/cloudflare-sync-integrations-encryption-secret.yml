name: Sync Integrations Encryption Secret (Pages + Social Publisher)

on:
  schedule:
    # Ensure critical secret remains present in Cloudflare runtimes.
    - cron: "22 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Guard Cloudflare credentials + Integrations secret
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare secrets missing; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${INTEGRATIONS_ENCRYPTION_SECRET:-}" ]]; then
            echo "Missing GitHub secret INTEGRATIONS_ENCRYPTION_SECRET; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=${PAGES_PROJECT:-skincos}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync secret to Cloudflare Pages (wrangler pages secret put)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          printf "%s" "$INTEGRATIONS_ENCRYPTION_SECRET" | npx --yes wrangler@3 pages secret put INTEGRATIONS_ENCRYPTION_SECRET --project-name "$PROJECT" >/dev/null
          echo "Set Pages secret INTEGRATIONS_ENCRYPTION_SECRET for project=$PROJECT."

      - name: Sync secret to Social Publisher Worker
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          printf "%s" "$INTEGRATIONS_ENCRYPTION_SECRET" | npx --yes wrangler@3 secret put INTEGRATIONS_ENCRYPTION_SECRET --config backend/apps/social-publisher/wrangler.toml >/dev/null
          echo "Set secret INTEGRATIONS_ENCRYPTION_SECRET for social-publisher worker."

      - name: Fetch current Cloudflare Pages project config
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
        run: |
          set -euo pipefail
          curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}" \
            > pages_project.json

      - name: Patch Pages env vars (INTEGRATIONS_ENCRYPTION_SECRET)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os

          with open("pages_project.json","r",encoding="utf-8") as f:
            data=json.load(f)
          if not data.get("success"):
            raise SystemExit("Cloudflare API returned success=false")
          res=data.get("result") or {}
          cfg=res.get("deployment_configs") or {}
          secret=os.environ.get("INTEGRATIONS_ENCRYPTION_SECRET","").strip()
          if not secret:
            raise SystemExit("Missing INTEGRATIONS_ENCRYPTION_SECRET")

          for env_name in ("production","preview"):
            env_cfg=cfg.get(env_name) or {}
            env_vars=env_cfg.get("env_vars") or {}
            env_vars["INTEGRATIONS_ENCRYPTION_SECRET"]={"value": secret, "type":"secret_text"}
            env_cfg["env_vars"]=env_vars
            cfg[env_name]=env_cfg

          patch={"deployment_configs": cfg}
          with open("pages_patch.json","w",encoding="utf-8") as f:
            json.dump(patch,f)
          print("Prepared patch for Pages env var key: INTEGRATIONS_ENCRYPTION_SECRET")
          PY

          curl -sS -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @pages_patch.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}" \
            > pages_patch_result.json

          python - <<'PY'
          import json
          with open("pages_patch_result.json","r",encoding="utf-8") as f:
            data=json.load(f)
          if not data.get("success"):
            raise SystemExit("Patch failed: %s" % (data.get("errors") or data))
          cfg=(data.get("result") or {}).get("deployment_configs") or {}
          for env_name in ("production","preview"):
            keys=sorted(((cfg.get(env_name) or {}).get("env_vars") or {}).keys())
            print(f"{env_name}: INTEGRATIONS_ENCRYPTION_SECRET present =", "INTEGRATIONS_ENCRYPTION_SECRET" in keys)
          PY

      - name: Force redeploy CRM Pages (apply secret/env)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-crm-pages-reconcile.yml",
              ref: "main",
              inputs: { force: "true" },
            })
            core.info("Dispatched deploy-crm-pages-reconcile.yml with force=true")
