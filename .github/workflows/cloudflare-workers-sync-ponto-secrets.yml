name: Attest Ponto Worker secret custody
run-name: Attest Ponto Workers ${{ inputs.target }} ${{ inputs.release_sha }} orchestrator=${{ inputs.orchestrator_run_id }} nonce=${{ inputs.orchestrator_nonce }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit isolated target; values come only from this GitHub environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      release_sha:
        description: Immutable main SHA that owns this provisioning change
        required: true
        type: string
      staging_run_id:
        description: Required for production; successful Ponto staging evidence for this SHA
        required: false
        type: string
      orchestrator_run_id:
        description: Ponto coordinator correlation ID
        required: false
        type: string
      orchestrator_stage:
        description: Exact stage of the issuing Ponto coordinator
        required: false
        type: string
      orchestrator_issuer_run_id:
        description: Exact direct issuer run
        required: false
        type: string
      orchestrator_nonce:
        description: Non-secret per-dispatch correlation nonce
        required: false
        type: string

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  coordination:
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
    uses: ./.github/workflows/ponto-orchestrator-gate.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
    with:
      required: true
      global_lease_required: true
      global_resource: global:ponto-workers-writer
      global_module: ponto
      global_coordinator_url: ${{ inputs.target == 'production' && vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL || vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
      lease_key: workers-secrets
      stage: ${{ inputs.orchestrator_stage }}
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}
  provision:
    needs: coordination
    if: ${{ github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/skincos/release/ponto/') && inputs.orchestrator_run_id != '' && github.sha == inputs.release_sha)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22.12.0
      - name: Verify immutable source and production predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'checkout differs from release_sha'; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'release_sha is not reachable from main'; exit 1; }
          if [[ "$TARGET" == production ]]; then
            [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'production provisioning requires staging_run_id'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ponto-progressive-release.yml" > "$RUNNER_TEMP/staging-workflow.json"
            node --input-type=module - "$RUNNER_TEMP/staging-run.json" "$RUNNER_TEMP/staging-workflow.json" <<'NODE'
          import fs from "node:fs";
          import { pontoSourceClosureMatches } from "./.github/scripts/ponto-source-closure.mjs";
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const workflow = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (
            workflow.state !== "active"
            || workflow.path !== ".github/workflows/ponto-progressive-release.yml"
            || workflow.name !== "Ponto progressive release"
          ) {
            throw new Error("canonical Ponto coordinator is not active at the expected path");
          }
          const expectedPath = workflow.path;
          if (
            run.workflow_id !== workflow.id
            || ![expectedPath, `${expectedPath}@refs/heads/main`].includes(run.path)
            || run.status !== "completed"
            || run.conclusion !== "success"
            || run.event !== "workflow_dispatch"
            || run.head_branch !== "main"
            || !pontoSourceClosureMatches(process.env.RELEASE_SHA, String(run.head_sha || "").toLowerCase())
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
          ) {
            throw new Error("staging predecessor provenance is not the canonical completed main coordinator");
          }
          NODE
            mkdir -p "$RUNNER_TEMP/staging-evidence"
            gh run download "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "ponto-release-evidence-staging-$RELEASE_SHA" --dir "$RUNNER_TEMP/staging-evidence"
            PONTO_EXPECTED_STAGE=staging PONTO_EXPECTED_SHA="$RELEASE_SHA" PONTO_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
              node .github/scripts/ponto-release-evidence.mjs verify "$RUNNER_TEMP/staging-evidence/ponto-release-evidence.json"
            rm -f "$RUNNER_TEMP/staging-run.json" "$RUNNER_TEMP/staging-workflow.json"
          fi
      - name: Revalidate the exact active coordinator before Worker custody secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Authorize global Cloudflare Worker custody mutation
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
          resource: global:ponto-workers-writer
          module: ponto
          source_sha: ${{ inputs.release_sha }}
      - name: Verify selected environment root custody scopes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required for custody attestation'; exit 1; }
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET/secrets?per_page=100" > "$RUNNER_TEMP/environment-secrets.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" > "$RUNNER_TEMP/repository-secrets.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET/variables?per_page=100" > "$RUNNER_TEMP/environment-variables.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/variables?per_page=100" > "$RUNNER_TEMP/repository-variables.json"
          node - \
            "$RUNNER_TEMP/environment-secrets.json" \
            "$RUNNER_TEMP/repository-secrets.json" \
            "$RUNNER_TEMP/environment-variables.json" \
            "$RUNNER_TEMP/repository-variables.json" <<'NODE'
          const fs = require("fs");
          const names = (file, key) => {
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            const entries = Array.isArray(payload)
              ? payload.flatMap(page => Array.isArray(page?.[key]) ? page[key] : [])
              : (Array.isArray(payload?.[key]) ? payload[key] : []);
            return new Set(entries.map(item => item.name));
          };
          const environmentSecrets = names(process.argv[2], "secrets");
          const repositorySecrets = names(process.argv[3], "secrets");
          const environmentVariables = names(process.argv[4], "variables");
          const repositoryVariables = names(process.argv[5], "variables");
          for (const name of ["PONTO_PROFILE_DATA_KEY", "PONTO_IDEMPOTENCY_KEY"]) {
            if (!environmentSecrets.has(name)) throw new Error(`${name} must exist in the selected GitHub environment; repository fallback is refused`);
          }
          if (
            repositorySecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
            || !environmentSecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
          ) {
            throw new Error("shared root attestation key must exist only in the selected GitHub environment");
          }
          for (const name of ["PONTO_PROFILE_DATA_KEY_CUSTODY_REF", "PONTO_IDEMPOTENCY_KEY_CUSTODY_REF"]) {
            if (!environmentVariables.has(name)) throw new Error(`${name} must exist in the selected GitHub environment`);
          }
          if (
            !repositoryVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
            || environmentVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
          ) {
            throw new Error("shared root attestation key ID must exist only at repository scope");
          }
          NODE
          rm -f \
            "$RUNNER_TEMP/environment-secrets.json" \
            "$RUNNER_TEMP/repository-secrets.json" \
            "$RUNNER_TEMP/environment-variables.json" \
            "$RUNNER_TEMP/repository-variables.json"
      - name: Attest environment-owned Timekeeping roots
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_PROFILE_DATA_KEY: ${{ secrets.PONTO_PROFILE_DATA_KEY }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_ROOT_ATTESTATION_KEY_SHARED: ${{ secrets.PONTO_ROOT_ATTESTATION_KEY_SHARED }}
          PONTO_PROFILE_DATA_KEY_CUSTODY_REF: ${{ vars.PONTO_PROFILE_DATA_KEY_CUSTODY_REF }}
          PONTO_IDEMPOTENCY_KEY_CUSTODY_REF: ${{ vars.PONTO_IDEMPOTENCY_KEY_CUSTODY_REF }}
          PONTO_ROOT_ATTESTATION_KEY_ID: ${{ vars.PONTO_ROOT_ATTESTATION_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ponto-root-custody"
          staging_args=()
          if [[ "$TARGET" == production ]]; then
            node - "$RUNNER_TEMP/staging-evidence/ponto-release-evidence.json" "$RUNNER_TEMP/ponto-root-custody/staging.json" <<'NODE'
          const fs = require("fs");
          const evidence = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const custody = evidence?.surfaces?.timekeeping?.rootCustody;
          if (!custody) throw new Error("staging release evidence does not contain root custody");
          fs.writeFileSync(process.argv[3], `${JSON.stringify(custody, null, 2)}\n`, { mode: 0o600 });
          NODE
            staging_args=("$RUNNER_TEMP/ponto-root-custody/staging.json")
          fi
          node .github/scripts/ponto-root-custody.mjs write \
            "$TARGET" \
            "$RELEASE_SHA" \
            "$RUNNER_TEMP/ponto-root-custody/root-custody.json" \
            "${staging_args[@]}"
          rm -f "$RUNNER_TEMP/ponto-root-custody/staging.json"
      - name: Attest exact selected D1 and module-control identities before remote custody reads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_RESOURCE_TARGET: ${{ inputs.target }}
          STAGING_D1_ID_RAW: ${{ vars.PONTO_TIMEKEEPING_D1_STAGING_ID }}
          PRODUCTION_D1_ID_RAW: ${{ vars.PONTO_TIMEKEEPING_D1_PRODUCTION_ID }}
          STAGING_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PRODUCTION_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
          PONTO_RESOURCE_IDENTITY_REPORT: ${{ runner.temp }}/ponto-resource-identity.json
        run: |
          set -euo pipefail
          case "$PONTO_RESOURCE_TARGET" in
            staging)
              export PONTO_TIMEKEEPING_D1_ID="$STAGING_D1_ID_RAW"
              export PONTO_OPPOSITE_TIMEKEEPING_D1_ID="$PRODUCTION_D1_ID_RAW"
              export PONTO_MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"
              export PONTO_OPPOSITE_MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"
              ;;
            production)
              export PONTO_TIMEKEEPING_D1_ID="$PRODUCTION_D1_ID_RAW"
              export PONTO_OPPOSITE_TIMEKEEPING_D1_ID="$STAGING_D1_ID_RAW"
              export PONTO_MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"
              export PONTO_OPPOSITE_MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"
              ;;
            *) echo 'Unsupported Ponto resource target'; exit 1 ;;
          esac
          node .github/scripts/ponto-cloudflare-resource-identity.mjs
      - name: Attest remote secret names without creating or deploying a Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
          STAGING_D1_ID_RAW: ${{ vars.PONTO_TIMEKEEPING_D1_STAGING_ID }}
          PRODUCTION_D1_ID_RAW: ${{ vars.PONTO_TIMEKEEPING_D1_PRODUCTION_ID }}
          STAGING_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PRODUCTION_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging)
              D1_ID="$STAGING_D1_ID_RAW"; OPPOSITE_D1_ID="$PRODUCTION_D1_ID_RAW"
              MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"; OPPOSITE_MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"
              ;;
            production)
              D1_ID="$PRODUCTION_D1_ID_RAW"; OPPOSITE_D1_ID="$STAGING_D1_ID_RAW"
              MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"; OPPOSITE_MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"
              ;;
            *) echo 'Unsupported Ponto Worker custody target'; exit 1 ;;
          esac
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_ID MODULE_CONTROL_KV_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing required $TARGET environment value: $name"; exit 1; }
          done
          [[ -z "${OPPOSITE_D1_ID:-}" || "$D1_ID" != "$OPPOSITE_D1_ID" ]] || { echo 'Timekeeping D1 databases are not isolated'; exit 1; }
          [[ -z "${OPPOSITE_MODULE_CONTROL_KV_ID:-}" || "$MODULE_CONTROL_KV_ID" != "$OPPOSITE_MODULE_CONTROL_KV_ID" ]] || { echo 'Module-control namespaces are not isolated'; exit 1; }
          [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Invalid Timekeeping D1 id'; exit 1; }
          [[ "$MODULE_CONTROL_KV_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Invalid module-control KV id'; exit 1; }
          if [[ "$TARGET" == production ]]; then
            env_args=()
            sed -i \
              "s/__CONFIGURE_TIMEKEEPING_D1_ID__/$D1_ID/;s/__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__/$MODULE_CONTROL_KV_ID/;s/__CONFIGURE_TIMEKEEPING_STAGING_D1_ID__/00000000-0000-4000-8000-000000000001/" \
              workforce/timekeeping/wrangler.toml
          else
            env_args=(--env staging)
            sed -i \
              "s/__CONFIGURE_TIMEKEEPING_D1_ID__/00000000-0000-4000-8000-000000000001/;s/__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__/00000000000000000000000000000001/;s/__CONFIGURE_TIMEKEEPING_STAGING_D1_ID__/$D1_ID/" \
              workforce/timekeeping/wrangler.toml
          fi
          timekeeping_secret_list="$RUNNER_TEMP/timekeeping-secret-list.json"
          identity_secret_list="$RUNNER_TEMP/identity-secret-list.json"
          npx --yes wrangler@4.112.0 secret list --config workforce/timekeeping/wrangler.toml "${env_args[@]}" > "$timekeeping_secret_list"
          npx --yes wrangler@4.112.0 secret list --config inventory/wrangler.toml "${env_args[@]}" > "$identity_secret_list"
          node - "$timekeeping_secret_list" "$identity_secret_list" <<'NODE'
          const fs = require("fs");
          const timekeeping = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const identity = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const names = new Set(timekeeping.map(item => item.name));
          for (const name of ["PONTO_ACTOR_HMAC_KEY", "PONTO_IDEMPOTENCY_KEY", "PONTO_TEMPLATES_KEY", "PONTO_NETWORK_CONTEXT_KEY", "ESCALA_ACTOR_HMAC_KEY", "IDENTITY_WORKFORCE_HMAC_KEY"]) {
            if (!names.has(name)) throw new Error(`remote Timekeeping secret is absent: ${name}`);
          }
          const identityNames = new Set(identity.map(item => item.name));
          for (const name of ["IDENTITY_PII_KEY", "IDENTITY_WORKFORCE_HMAC_KEY"]) {
            if (!identityNames.has(name)) throw new Error(`remote Identity secret is absent: ${name}`);
          }
          NODE
          rm -f "$timekeeping_secret_list" "$identity_secret_list"
          echo "Secret custody and opaque root separation attested; values were not printed and no Worker version was created or deployed."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-root-custody-${{ inputs.target }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-root-custody/root-custody.json
          retention-days: 90
          if-no-files-found: error
  global-coordination-release:
    needs: [coordination, provision]
    if: ${{ always() && needs.coordination.outputs.global_lease_required == 'true' }}
    uses: ./.github/workflows/global-coordination-release.yml
    secrets:
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
    with:
      required: true
      proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
      coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
      key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
