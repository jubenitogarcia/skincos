name: Sync Ponto secrets (Cloudflare Workers)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Guard Cloudflare credentials + Ponto secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_ADMIN_TOKEN: ${{ secrets.PONTO_ADMIN_TOKEN }}
          PONTO_PROXY_TOKEN: ${{ secrets.PONTO_PROXY_TOKEN }}
          PONTO_ACTOR_HMAC_KEY: ${{ secrets.PONTO_ACTOR_HMAC_KEY }}
          PONTO_AUDIT_HMAC_KEY: ${{ secrets.PONTO_AUDIT_HMAC_KEY }}
          PONTO_TEMPLATES_KEY: ${{ secrets.PONTO_TEMPLATES_KEY }}
          PONTO_TEMPLATES_CACHE_TTL_MS: ${{ vars.PONTO_TEMPLATES_CACHE_TTL_MS }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare secrets missing; cannot sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${PONTO_ADMIN_TOKEN:-}" || -z "${PONTO_PROXY_TOKEN:-}" || -z "${PONTO_ACTOR_HMAC_KEY:-}" ]]; then
            echo "Missing required GitHub secrets: PONTO_ADMIN_TOKEN, PONTO_PROXY_TOKEN, PONTO_ACTOR_HMAC_KEY."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${PONTO_TEMPLATES_CACHE_TTL_MS:-}" && ! "${PONTO_TEMPLATES_CACHE_TTL_MS}" =~ ^[0-9]+$ ]]; then
            echo "Invalid repo var PONTO_TEMPLATES_CACHE_TTL_MS (must be integer ms)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Sync secrets to Workers (skincos-api + skincos-insumos)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_ADMIN_TOKEN: ${{ secrets.PONTO_ADMIN_TOKEN }}
          PONTO_PROXY_TOKEN: ${{ secrets.PONTO_PROXY_TOKEN }}
          PONTO_ACTOR_HMAC_KEY: ${{ secrets.PONTO_ACTOR_HMAC_KEY }}
          PONTO_AUDIT_HMAC_KEY: ${{ secrets.PONTO_AUDIT_HMAC_KEY }}
          PONTO_TEMPLATES_KEY: ${{ secrets.PONTO_TEMPLATES_KEY }}
          # Non-secret: stored as repo var for easy tuning without code changes.
          PONTO_TEMPLATES_CACHE_TTL_MS: ${{ vars.PONTO_TEMPLATES_CACHE_TTL_MS }}
        run: |
          set -euo pipefail

          put_secret() {
            local cfg="$1"
            local name="$2"
            local value="$3"
            if [[ -z "${value:-}" ]]; then
              echo "Skipping empty secret $name for $cfg"
              return 0
            fi
            printf "%s" "$value" | npx --yes wrangler@3 secret put "$name" --config "$cfg" >/dev/null
            echo "Set secret $name for $cfg"
          }

          # Production (no --env): keep consistent across both Workers, since implementation is shared.
          put_secret backend/apps/api/wrangler.toml PONTO_ADMIN_TOKEN "$PONTO_ADMIN_TOKEN"
          put_secret backend/apps/api/wrangler.toml PONTO_PROXY_TOKEN "$PONTO_PROXY_TOKEN"
          put_secret backend/apps/api/wrangler.toml PONTO_ACTOR_HMAC_KEY "$PONTO_ACTOR_HMAC_KEY"
          put_secret backend/apps/api/wrangler.toml PONTO_AUDIT_HMAC_KEY "${PONTO_AUDIT_HMAC_KEY:-}"
          put_secret backend/apps/api/wrangler.toml PONTO_TEMPLATES_KEY "${PONTO_TEMPLATES_KEY:-}"
          put_secret backend/apps/api/wrangler.toml PONTO_TEMPLATES_CACHE_TTL_MS "${PONTO_TEMPLATES_CACHE_TTL_MS:-}"

          put_secret backend/apps/insumos/wrangler.toml PONTO_ADMIN_TOKEN "$PONTO_ADMIN_TOKEN"
          put_secret backend/apps/insumos/wrangler.toml PONTO_PROXY_TOKEN "$PONTO_PROXY_TOKEN"
          put_secret backend/apps/insumos/wrangler.toml PONTO_ACTOR_HMAC_KEY "$PONTO_ACTOR_HMAC_KEY"
          put_secret backend/apps/insumos/wrangler.toml PONTO_AUDIT_HMAC_KEY "${PONTO_AUDIT_HMAC_KEY:-}"
          put_secret backend/apps/insumos/wrangler.toml PONTO_TEMPLATES_KEY "${PONTO_TEMPLATES_KEY:-}"
          put_secret backend/apps/insumos/wrangler.toml PONTO_TEMPLATES_CACHE_TTL_MS "${PONTO_TEMPLATES_CACHE_TTL_MS:-}"
