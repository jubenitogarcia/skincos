name: codex-automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      startsWith(github.head_ref, 'codex/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'jubenitogarcia'
    runs-on: ubuntu-latest
    steps:
      - name: Token mode
        env:
          HAS_GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN != '' }}
        run: |
          if [[ "${HAS_GH_TOKEN_SECRET}" == "true" ]]; then
            echo "Using GH_TOKEN secret for auto-merge mutation."
          else
            echo "GH_TOKEN secret is missing; falling back to GITHUB_TOKEN (downstream workflow triggers may be suppressed)."
          fi

      - name: Enable auto-merge (squash)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          script: |
            const prId = context.payload.pull_request.node_id;
            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                  pullRequest { number }
                }
              }
            `;
            try {
              await github.graphql(mutation, { pullRequestId: prId });
              core.info(`Enabled auto-merge for PR #${context.payload.pull_request.number}`);
            } catch (err) {
              core.warning(`Could not enable auto-merge: ${err?.message || err}`);
            }
