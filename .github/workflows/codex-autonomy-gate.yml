name: Codex autonomy gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codex-autonomy-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change effect
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.risk.outputs.risk }}
      surfaces: ${{ steps.risk.outputs.surfaces }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - id: bounded-diff
        name: Prepare bounded immutable diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-$BEFORE_SHA}"
          head="${PR_HEAD_SHA:-$HEAD_SHA}"
          node scripts/codex-bounded-diff.mjs --base "$base" --head "$head" --output "$GITHUB_OUTPUT" --files-output "$RUNNER_TEMP/codex-bounded-files.txt"
      - id: risk
        env:
          BOUNDED_FILES_FILE: ${{ steps.bounded-diff.outputs.files_file }}
        run: |
          set -euo pipefail
          mapfile -t files < "$BOUNDED_FILES_FILE"
          args=()
          for file in "${files[@]}"; do args+=(--file "$file"); done
          node scripts/codex-risk-classifier.mjs "${args[@]}" --output risk-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-risk-report-${{ github.run_id }}
          path: risk-report.json
          retention-days: 30

  focused-validation:
    name: Focused validation
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Prepare bounded immutable diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-$BEFORE_SHA}"
          head="${PR_HEAD_SHA:-$HEAD_SHA}"
          node scripts/codex-bounded-diff.mjs --base "$base" --head "$head"
      - name: Proportional diff check
        run: git diff --check
      - name: Baseline contract tests
        if: ${{ contains(needs.classify.outputs.surfaces, 'codex-baseline') }}
        run: |
          set -euo pipefail
          node --test scripts/tests/codex-autonomy-baseline.test.mjs
      - name: GitHub governance contract
        if: ${{ contains(needs.classify.outputs.surfaces, 'github-governance') }}
        run: |
          set -euo pipefail
          node .github/scripts/validate-github-governance.mjs
          node --test .github/scripts/ponto-single-operator-governance.test.mjs
      - name: Supervisor contract
        if: ${{ contains(needs.classify.outputs.surfaces, 'codex-baseline') }}
        run: python3 -m unittest discover -s .codex/hooks/tests -p 'test_skincos_supervisor_gate.py' -v
      - name: Risk-selected release-manifest contract
        if: ${{ (needs.classify.outputs.risk == 'high' || needs.classify.outputs.risk == 'critical') && contains(needs.classify.outputs.surfaces, 'codex-baseline') }}
        run: |
          set -euo pipefail
          node scripts/codex-release-manifest.mjs --source HEAD --surface codex-baseline --output /tmp/codex-release-manifest.json
          test -s /tmp/codex-release-manifest.json

  codex-autonomy-gate:
    name: codex-autonomy-gate
    if: ${{ always() }}
    needs: [classify, focused-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required validation
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VALIDATION_RESULT: ${{ needs.focused-validation.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]] || { echo "::error::risk classification did not complete"; exit 1; }
          [[ "$VALIDATION_RESULT" == success ]] || { echo "::error::risk-selected validation did not complete"; exit 1; }
          echo "Codex autonomy aggregate gate passed."
