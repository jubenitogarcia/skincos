name: Codex BioEvo staging credential transfer

on:
  push:
    branches:
      - codex/admin/bioevo-cloudflare-secret-transfer

permissions:
  contents: read

concurrency:
  group: codex-bioevo-secret-transfer
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'Source Cloudflare token is absent'; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'Source Cloudflare account id is invalid'; exit 1; }
          response_file="$RUNNER_TEMP/cloudflare-verify.json"
          account_file="$RUNNER_TEMP/cloudflare-account.json"
          cleanup() { rm -f "$response_file" "$account_file"; }
          trap cleanup EXIT
          verify_status="$(curl --fail-with-body -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          [[ "$verify_status" == '200' ]] || { echo "Cloudflare token verification failed with HTTP $verify_status"; exit 1; }
          account_status="$(curl --fail-with-body -sS -o "$account_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
          [[ "$account_status" == '200' ]] || { echo "Cloudflare account read failed with HTTP $account_status"; exit 1; }
          node - "$response_file" "$account_file" <<'NODE'
          const fs = require('node:fs');
          for (const file of process.argv.slice(2)) {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (payload.success !== true) throw new Error('Cloudflare response was not successful');
          }
          NODE
          echo 'Source Cloudflare credential verified.'

      - name: Transfer credential directly to BioEvo environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'Source Cloudflare token is absent'; exit 1; }
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GitHub transfer token is absent'; exit 1; }
          printf '%s' "$CLOUDFLARE_API_TOKEN" | gh secret set CLOUDFLARE_API_TOKEN \
            --repo jubenitogarcia/bioevo \
            --env bioevo-staging
          echo 'BioEvo staging environment credential updated.'
