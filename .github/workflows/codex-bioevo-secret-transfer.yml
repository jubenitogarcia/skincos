name: Codex BioEvo staging credential transfer

on:
  push:
    branches:
      - codex/admin/bioevo-cloudflare-secret-transfer

permissions:
  contents: read

concurrency:
  group: codex-bioevo-secret-transfer
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SECURITY_API_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_API_TOKEN }}
          CLOUDFLARE_ALERTS_API_TOKEN: ${{ secrets.CLOUDFLARE_ALERTS_API_TOKEN }}
          PONTO_WAF_READ_API_TOKEN: ${{ secrets.PONTO_WAF_READ_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'Source Cloudflare account id is invalid'; exit 1; }
          cleanup() { rm -f "$RUNNER_TEMP"/cloudflare-candidate-*.json; }
          trap cleanup EXIT
          candidate_label=''
          candidate_token=''
          check_candidate() {
            local label="$1"
            local token="$2"
            local slug="${label,,}"
            [[ -n "$token" ]] || return 0
            local verify_file="$RUNNER_TEMP/cloudflare-candidate-${slug}-verify.json"
            local account_file="$RUNNER_TEMP/cloudflare-candidate-${slug}-account.json"
            local d1_file="$RUNNER_TEMP/cloudflare-candidate-${slug}-d1.json"
            local workers_file="$RUNNER_TEMP/cloudflare-candidate-${slug}-workers.json"
            local status
            status="$(curl -sS -o "$verify_file" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/user/tokens/verify')"
            if [[ "$status" != '200' ]]; then echo "Candidate $label rejected at token verification (HTTP $status)"; return 0; fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/user/tokens')"
            echo "Candidate $label token-list capability: HTTP $status"
            status="$(curl -sS -o "$account_file" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
            if [[ "$status" != '200' ]]; then echo "Candidate $label rejected at account read (HTTP $status)"; return 0; fi
            status="$(curl -sS -o "$d1_file" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            if [[ "$status" != '200' ]]; then echo "Candidate $label rejected at D1 read (HTTP $status)"; return 0; fi
            status="$(curl -sS -o "$workers_file" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
            if [[ "$status" != '200' ]]; then echo "Candidate $label rejected at Workers read (HTTP $status)"; return 0; fi
            candidate_label="$label"
            candidate_token="$token"
            echo "Candidate $label passed Cloudflare verification and surface reads."
          }
          check_candidate CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          [[ -n "$candidate_token" ]] || check_candidate CLOUDFLARE_SECURITY_API_TOKEN "${CLOUDFLARE_SECURITY_API_TOKEN:-}"
          [[ -n "$candidate_token" ]] || check_candidate CLOUDFLARE_ALERTS_API_TOKEN "${CLOUDFLARE_ALERTS_API_TOKEN:-}"
          [[ -n "$candidate_token" ]] || check_candidate PONTO_WAF_READ_API_TOKEN "${PONTO_WAF_READ_API_TOKEN:-}"
          [[ -n "$candidate_token" ]] || { echo 'No existing SKINCOS Cloudflare token can access BioEvo staging surfaces'; exit 1; }
          printf '%s' "$candidate_token" > "$RUNNER_TEMP/bioevo-cloudflare-token"
          echo "$candidate_label" > "$RUNNER_TEMP/bioevo-cloudflare-token-label"

      - name: Transfer credential directly to BioEvo environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SECURITY_API_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_API_TOKEN }}
          CLOUDFLARE_ALERTS_API_TOKEN: ${{ secrets.CLOUDFLARE_ALERTS_API_TOKEN }}
          PONTO_WAF_READ_API_TOKEN: ${{ secrets.PONTO_WAF_READ_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GitHub transfer token is absent'; exit 1; }
          token_file="$RUNNER_TEMP/bioevo-cloudflare-token"
          label_file="$RUNNER_TEMP/bioevo-cloudflare-token-label"
          [[ -s "$token_file" && -s "$label_file" ]] || { echo 'Verified Cloudflare candidate was not materialized'; exit 1; }
          printf '%s' "$(<"$token_file")" | gh secret set CLOUDFLARE_API_TOKEN \
            --repo jubenitogarcia/bioevo \
            --env bioevo-staging
          echo "BioEvo staging environment credential updated from $(<"$label_file")."
          rm -f "$token_file" "$label_file"
