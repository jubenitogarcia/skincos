name: codex-keep-prs-mergeable

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: codex-keep-prs-mergeable
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  keep_mergeable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: main
          fetch-depth: 1
      - name: Detect whether branch maintenance needs merge:main
        id: maintenance_scan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "main",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            const candidates = pulls.filter((pr) => {
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) return false;
              if (!String(pr.head?.ref || "").startsWith("codex/")) return false;
              return String(pr.user?.login || "") === "jubenitogarcia";
            });
            let needsMaintenance = false;
            for (const pr of candidates) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              if (response.data.mergeable_state === "behind") {
                needsMaintenance = true;
                break;
              }
            }
            core.setOutput("needs_maintenance", String(needsMaintenance));
            core.info(`Branch maintenance lease needed: ${needsMaintenance}`);
      - name: Acquire merge:main for branch maintenance
        id: acquire_branch_maintenance
        if: ${{ steps.maintenance_scan.outputs.needs_maintenance == 'true' }}
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          resource: merge:main
          module: merge
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-merge-maintenance.json
      - name: Check merge:main before PR branch maintenance
        id: check_branch_maintenance
        if: ${{ steps.acquire_branch_maintenance.outcome == 'success' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-merge-maintenance.json
          resource: merge:main
          module: merge
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
      - name: Keep codex PRs up-to-date (update-branch) + label conflicts
        if: ${{ always() }}
        env:
          ALLOW_BRANCH_UPDATES: ${{ steps.check_branch_maintenance.outcome == 'success' && 'true' || 'false' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowBranchUpdates = process.env.ALLOW_BRANCH_UPDATES === "true";

            const LABELS = {
              updated: {
                name: "automerge/updated-branch",
                color: "0E8A16",
                description: "Auto-updated branch to satisfy strict up-to-date requirement.",
              },
              conflict: {
                name: "automerge/conflict",
                color: "B60205",
                description: "PR has merge conflicts (needs conflict resolution).",
              },
              pending: {
                name: "automerge/pending-mergeability",
                color: "FBCA04",
                description: "GitHub mergeability state still computing/unknown.",
              },
              enabled: {
                name: "automerge/enabled",
                color: "1D76DB",
                description: "Legacy marker; merge authority must be acquired before integration.",
              },
            };

            const COMMENT_MARKERS = {
              updated: "<!-- codex-keep-prs-mergeable:updated -->",
              conflict: "<!-- codex-keep-prs-mergeable:conflict -->",
            };

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
                return;
              } catch (err) {
                if (err?.status !== 404) throw err;
              }
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Created label: ${label.name}`);
              } catch (err) {
                // Race-safe: label could have been created by another run.
                core.warning(`Could not create label ${label.name}: ${err?.message || err}`);
              }
            }

            async function addLabel(issue_number, labelName) {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [labelName] });
              } catch (err) {
                core.warning(`addLabels failed for #${issue_number} label=${labelName}: ${err?.message || err}`);
              }
            }

            async function removeLabel(issue_number, labelName) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: labelName });
              } catch (err) {
                // Ignore if label not present.
                if (err?.status !== 404) core.warning(`removeLabel failed for #${issue_number} label=${labelName}: ${err?.message || err}`);
              }
            }

            async function ensureCommentOnce(issue_number, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const has = comments.some((c) => String(c?.body || "").includes(marker));
              if (has) return;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `${marker}\n${body}`,
              });
            }

            async function authoritySignalIsOnlyBlock(pr) {
              const headSha = String(pr.head?.sha || '').trim().toLowerCase();
              if (!/^[0-9a-f]{40}$/.test(headSha)) return false;
              try {
                const [combined, checkRuns] = await Promise.all([
                  github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha }),
                  github.paginate(github.rest.checks.listForRef, {
                    owner,
                    repo,
                    ref: headSha,
                    per_page: 100,
                  }),
                ]);
                const statuses = combined.data.statuses || [];
                const authorityStatuses = statuses
                  .filter((status) => String(status.context || '') === 'global-merge-authority')
                  .sort((left, right) => Date.parse(String(left.created_at || '')) - Date.parse(String(right.created_at || '')));
                const latestAuthority = authorityStatuses.at(-1);
                if (String(latestAuthority?.state || '') !== 'failure') return false;
                if (statuses.some((status) => String(status.context || '') !== 'global-merge-authority' && String(status.state || '') !== 'success')) return false;
                const allowedConclusions = new Set(['success', 'skipped', 'neutral']);
                if (checkRuns.some((run) => String(run.status || '') !== 'completed' || !allowedConclusions.has(String(run.conclusion || '')))) return false;
                core.info(`PR #${pr.number} is blocked only by the deliberate global-merge-authority status; bootstrapping the official dispatch.`);
                return true;
              } catch (err) {
                core.warning(`Could not verify the authority-only block for #${pr.number}: ${err?.message || err}`);
                return false;
              }
            }

            async function dispatchMergeAuthorityIfEligible(pr) {
              const labels = new Set((pr.labels || []).map((label) => String(label?.name || '')));
              const authorityOnlyBlock = pr.mergeable_state === 'blocked' && await authoritySignalIsOnlyBlock(pr);
              if (pr.draft === true || !['clean', 'blocked'].includes(String(pr.mergeable_state || '')) || (pr.mergeable_state === 'blocked' && !authorityOnlyBlock) || !labels.has(LABELS.enabled.name)) return;
              const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'requested']);
              let runs = [];
              try {
                runs = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                  owner,
                  repo,
                  workflow_id: 'global-merge-authority.yml',
                  event: 'workflow_dispatch',
                  per_page: 100,
                });
              } catch (err) {
                core.warning(`Could not inspect global merge authority runs for #${pr.number}: ${err?.message || err}`);
                return;
              }
              const alreadyRunning = runs.some((run) => {
                if (!activeStatuses.has(String(run.status || ''))) return false;
                const title = String(run.display_title || run.name || '');
                return title.includes(`PR #${pr.number}`);
              });
              if (alreadyRunning) return;
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'global-merge-authority.yml',
                  ref: 'main',
                  inputs: {
                    pull_number: String(pr.number),
                    expected_head_sha: String(pr.head?.sha || ''),
                    merge_method: 'squash',
                  },
                });
                core.info(`Dispatched the official global merge authority for eligible PR #${pr.number}`);
              } catch (err) {
                core.warning(`Could not dispatch global merge authority for #${pr.number}: ${err?.message || err}`);
              }
            }

            async function disableUncoordinatedAutoMerge(pr) {
              if (!pr.node_id || !pr.auto_merge) return;
              try {
                await github.graphql(
                  `mutation DisableAutoMerge($pullRequestId: ID!) {
                    disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                      pullRequest { id }
                    }
                  }`,
                  { pullRequestId: pr.node_id },
                );
                await removeLabel(pr.number, LABELS.enabled.name);
                core.warning(`Disabled uncoordinated auto-merge for PR #${pr.number}; use global-merge-authority.yml`);
              } catch (err) {
                core.warning(`disable auto-merge failed for #${pr.number}: ${err?.message || err}`);
              }
            }

            // Ensure labels exist (best-effort).
            await ensureLabel(LABELS.updated);
            await ensureLabel(LABELS.conflict);
            await ensureLabel(LABELS.pending);
            await ensureLabel(LABELS.enabled);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "main",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });

            const candidates = pulls.filter((pr) => {
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) return false;
              if (!String(pr.head?.ref || "").startsWith("codex/")) return false;
              if (String(pr.user?.login || "") !== "jubenitogarcia") return false;
              return true;
            }).slice(0, 50);

            core.info(`Found ${candidates.length} open codex PR(s) to evaluate.`);

            for (const pr of candidates) {
              const prNumber = pr.number;
              let full;
              try {
                const resp = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                full = resp.data;
              } catch (err) {
                core.warning(`Failed to fetch PR #${prNumber}: ${err?.message || err}`);
                continue;
              }

              const mergeableState = full.mergeable_state; // behind | dirty | clean | unknown | blocked | unstable | ...
              const headSha = full.head?.sha || "";
              core.info(`PR #${prNumber}: mergeable_state=${mergeableState} head=${headSha.slice(0, 7)}`);

              await disableUncoordinatedAutoMerge(full);

              // GitHub may return null while computing mergeability.
              if (!mergeableState || mergeableState === "unknown") {
                await addLabel(prNumber, LABELS.pending.name);
                continue;
              }

              if (mergeableState === "behind") {
                if (!allowBranchUpdates) {
                  await addLabel(prNumber, LABELS.pending.name);
                  core.warning(`PR #${prNumber} is behind but branch maintenance lease is not held; leaving it unchanged.`);
                  continue;
                }
                // Keep strict up-to-date requirement satisfied.
                try {
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number: prNumber,
                    expected_head_sha: headSha || undefined,
                  });
                  core.info(`Updated branch for PR #${prNumber}`);
                  await addLabel(prNumber, LABELS.updated.name);
                  await removeLabel(prNumber, LABELS.pending.name);
                  await ensureCommentOnce(
                    prNumber,
                    COMMENT_MARKERS.updated,
                    "Atualizei a branch para ficar up-to-date com a `main` (exigência do strict). Checks devem rodar novamente."
                  );
                } catch (err) {
                  core.warning(`update-branch failed for PR #${prNumber}: ${err?.message || err}`);
                }
                continue;
              }

              if (mergeableState === "dirty") {
                await addLabel(prNumber, LABELS.conflict.name);
                await removeLabel(prNumber, LABELS.pending.name);
                await ensureCommentOnce(
                  prNumber,
                  COMMENT_MARKERS.conflict,
                  "Conflito detectado. O resolvedor (automação local do Codex) vai tentar destravar com merge/PR de correção."
                );
                continue;
              }

              // PR is not behind/dirty/unknown. Best-effort cleanup.
              await removeLabel(prNumber, LABELS.pending.name);
              // Keep conflict label unless it is clearly clean.
              if (mergeableState === "clean") {
                await removeLabel(prNumber, LABELS.conflict.name);
                await dispatchMergeAuthorityIfEligible(full);
              } else if (mergeableState === "blocked") {
                await dispatchMergeAuthorityIfEligible(full);
              }
            }
      - name: Release merge:main after branch maintenance
        if: always()
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-merge-maintenance.json
