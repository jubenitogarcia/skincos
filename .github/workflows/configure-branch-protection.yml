name: Configure Branch Protection

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure protection for main
        env:
          # Prefer an admin-scoped token if provided via secret or repository variable
          GH_ACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${ADMIN_TOKEN:-${GH_ACT_TOKEN}}"
          branch="main"
          echo "Configuring branch protection for $REPO@$branch"
          cat > body.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "CI Smoke (Assert)",
                "Central Lint & Typecheck",
                "Central E2E Smoke"
              ]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true
          }
          JSON
          set +e
          gh api -X PUT repos/$REPO/branches/$branch/protection -H "Accept: application/vnd.github+json" --input body.json
          code=$?
          set -e
          if [ $code -eq 403 ] || [ $code -eq 404 ]; then
            echo "Note: Configuring branch protection requires an admin-scoped token. If you set REPO_ADMIN_TOKEN as a repository variable/secret, ensure it is a classic token with admin:repo scope." >&2
            exit 1
          fi
          echo "Protection configured."
