name: CRM CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: crm/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: crm

    - name: Run ESLint
      run: npx eslint . --ext .ts,.tsx --max-warnings 1000
      working-directory: crm
      continue-on-error: false

    - name: Run type check
      run: npx tsc --noEmit
      working-directory: crm
      continue-on-error: true

    - name: Run tests
      run: npm run test:run
      working-directory: crm

    - name: Build project
      run: npm run build
      working-directory: crm

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crm-build-artifacts
        path: crm/dist/
