name: CRM CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - "backend/apps/crm-api/**"
      - ".github/workflows/crm-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - "backend/apps/crm-api/**"
      - ".github/workflows/crm-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: Build project
      run: npm run build
      working-directory: frontend

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crm-build-artifacts
        path: frontend/dist/
