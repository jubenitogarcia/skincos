---
name: CodeQL (Monorepo)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "modules/crm/web/**"
      - "modules/site-public/website/**"
      - "backend/**"
      - ".github/workflows/crm-codeql.yml"
      - ".github/codeql/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "modules/crm/web/**"
      - "modules/site-public/website/**"
      - "backend/**"
      - ".github/workflows/crm-codeql.yml"
      - ".github/codeql/**"
  schedule:
    # Executa semanalmente às quartas-feiras às 02:00 UTC
    - cron: "0 2 * * 3"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: ${{ matrix.language == 'javascript' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            modules/crm/web/package-lock.json
            modules/site-public/website/package-lock.json
      - name: Setup Python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install dependencies
        if: ${{ matrix.language == 'javascript' }}
        run: |
          set -euxo pipefail
          if [ -f modules/crm/web/package-lock.json ]; then
              (cd modules/crm/web && npm ci)
          fi
          if [ -f modules/site-public/website/package-lock.json ]; then
            (cd modules/site-public/website && npm ci)
          fi

      - name: Build (CRM + Website)
        if: ${{ matrix.language == 'javascript' }}
        run: |
          set -euxo pipefail
          if [ -f modules/crm/web/package-lock.json ]; then
              (cd modules/crm/web && npm run build)
          fi
          if [ -f modules/site-public/website/package-lock.json ]; then
            (cd modules/site-public/website && npm run build)
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
