---
name: CodeQL (Monorepo)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/crm-codeql.yml"
      - ".github/codeql/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/crm-codeql.yml"
      - ".github/codeql/**"
  schedule:
    # Executa semanalmente às quartas-feiras às 02:00 UTC
    - cron: "0 2 * * 3"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "python"]

    steps:
      - name: Checkout repository
        uses: ./.github/actions/checkout-with-fallback
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ssh_key: ${{ secrets.ACTIONS_DEPLOY_KEY != '' && secrets.ACTIONS_DEPLOY_KEY || '' }}

      - name: Setup Node.js
        if: ${{ matrix.language == 'javascript' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install dependencies
        if: ${{ matrix.language == 'javascript' }}
        run: npm ci
        working-directory: frontend

      - name: Build (CRM)
        if: ${{ matrix.language == 'javascript' }}
        run: npm run build
        working-directory: frontend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
