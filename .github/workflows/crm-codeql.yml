---
name: CodeQL (Monorepo)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "website/**"
      - "backend/**"
      - "messaging/**"
      - "orb/**"
      - "api/**"
      - "booking/**"
      - "integration/**"
      - "service/**"
      - "social/**"
      - "workforce/timekeeping/**"
      - ".github/workflows/crm-codeql.yml"
      - ".github/codeql/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "website/**"
      - "backend/**"
      - "messaging/**"
      - "orb/**"
      - "api/**"
      - "booking/**"
      - "integration/**"
      - "service/**"
      - "social/**"
      - "workforce/timekeeping/**"
      - ".github/workflows/crm-codeql.yml"
      - ".github/codeql/**"
  schedule:
    # Executa semanalmente às quartas-feiras às 02:00 UTC
    - cron: "0 2 * * 3"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Setup Node.js
        if: ${{ matrix.language == 'javascript' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            crm/console/package-lock.json
            website/package-lock.json
      - name: Setup Python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install dependencies
        if: ${{ matrix.language == 'javascript' }}
        run: |
          set -euxo pipefail
          if [ -f crm/console/package-lock.json ]; then
              (cd crm/console && npm ci)
          fi
          if [ -f website/package-lock.json ]; then
            (cd website && npm ci)
          fi

      - name: Build (CRM + Website)
        if: ${{ matrix.language == 'javascript' }}
        run: |
          set -euxo pipefail
          if [ -f crm/console/package-lock.json ]; then
              (cd crm/console && npm run build)
          fi
          if [ -f website/package-lock.json ]; then
            (cd website && npm run build)
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{matrix.language}}"
