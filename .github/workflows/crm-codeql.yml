---
name: CodeQL (Monorepo)

on:
  push:
    branches: [main, develop]
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "website/**"
      - "backend/**"
      - "messaging/**"
      - "orb/**"
      - "api/**"
      - "booking/**"
      - "integration/**"
      - "service/**"
      - "social/**"
      - "workforce/**"
      - "platform/**"
      - "ops/**"
      - "shared/**"
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "backend/requirements*.txt"
      - "backend/pyproject.toml"
      - "**/package*.json"
      - "**/package-lock.json"
      - ".github/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "website/**"
      - "backend/**"
      - "messaging/**"
      - "orb/**"
      - "api/**"
      - "booking/**"
      - "integration/**"
      - "service/**"
      - "social/**"
      - "workforce/**"
      - "platform/**"
      - "ops/**"
      - "shared/**"
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "backend/requirements*.txt"
      - "backend/pyproject.toml"
      - "**/package*.json"
      - "**/package-lock.json"
      - ".github/**"
  schedule:
    # Executa semanalmente às quartas-feiras às 02:00 UTC.
    - cron: "0 2 * * 3"
  workflow_dispatch:

jobs:
  scope:
    name: Scope CodeQL closure
    runs-on: ubuntu-latest
    outputs:
      run_js_codeql: ${{ steps.scope.outputs.run_js_codeql }}
      run_python_codeql: ${{ steps.scope.outputs.run_python_codeql }}
      run_crm: ${{ steps.scope.outputs.run_crm }}
      run_website: ${{ steps.scope.outputs.run_website }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - id: bounded-diff
        name: Prepare bounded immutable diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/codex-bounded-diff.mjs \
            --base "${PR_BASE_SHA:-$BEFORE_SHA}" \
            --head "${PR_HEAD_SHA:-$HEAD_SHA}" \
            --output "$GITHUB_OUTPUT"
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ steps.bounded-diff.outputs.base }}
          HEAD_SHA: ${{ steps.bounded-diff.outputs.head }}
        run: node scripts/github-actions/affected-crm-validation-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  analyze-javascript:
    name: Analyze (javascript)
    needs: scope
    if: ${{ needs.scope.outputs.run_js_codeql == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            crm/console/package-lock.json
            crm/api/package-lock.json
            website/package-lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install CRM dependencies
        if: ${{ needs.scope.outputs.run_crm == 'true' }}
        run: |
          set -euxo pipefail
          if [ -f crm/console/package-lock.json ]; then
            (cd crm/console && npm ci)
          fi
          if [ -f crm/api/package-lock.json ]; then
            (cd crm/api && npm ci)
          fi

      - name: Build CRM console
        if: ${{ needs.scope.outputs.run_crm == 'true' }}
        run: |
          set -euxo pipefail
          if [ -f crm/console/package-lock.json ]; then
            (cd crm/console && npm run build)
          fi

      - name: Install website dependencies
        if: ${{ needs.scope.outputs.run_website == 'true' }}
        run: |
          set -euxo pipefail
          if [ -f website/package-lock.json ]; then
            (cd website && npm ci)
          fi

      - name: Build website
        if: ${{ needs.scope.outputs.run_website == 'true' }}
        run: |
          set -euxo pipefail
          if [ -f website/package-lock.json ]; then
            (cd website && npm run build)
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:javascript"

  analyze-python:
    name: Analyze (python)
    needs: scope
    if: ${{ needs.scope.outputs.run_python_codeql == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:python"
