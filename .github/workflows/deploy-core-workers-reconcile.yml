name: Deploy Core Workers (api + insumos) reconcile

on:
  schedule:
    # Workaround: merges performed via GitHub Actions can skip some push-based deploy triggers.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force redeploy even if current main SHA was already deployed."
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-core-workers-reconcile-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve flags
        id: flags
        run: |
          set -euo pipefail
          FORCE_RAW="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}"
          FORCE="$(echo "${FORCE_RAW:-false}" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [[ "$FORCE" == "1" || "$FORCE" == "true" || "$FORCE" == "yes" || "$FORCE" == "on" ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard Cloudflare deploy secrets
        id: guard
        env:
          ENABLE: ${{ vars.ENABLE_CORE_WORKERS_DEPLOY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "${ENABLE:-true}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve target SHA
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: sha
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cache (skip if already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: core-workers-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/deployed_sha.txt

      - name: Skip (already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' && steps.flags.outputs.force != 'true' }}
        run: |
          set -euo pipefail
          echo "Already deployed sha=${{ steps.sha.outputs.sha }}; skipping."

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true') }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"

      - name: Install worker deps (insumos + api)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true') }}
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          (cd ../api && npm install --no-package-lock --no-audit --no-fund)
        working-directory: inventory

      - name: Deploy Workers (wrangler)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@3 deploy --config inventory/wrangler.toml --keep-vars
          npx --yes wrangler@3 deploy --config api/wrangler.toml --keep-vars

      - name: Smoke check API + Inventory Workers (production)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true') }}
        run: |
          set -euo pipefail
          python3 .github/scripts/workers_smoke.py \
            --attempts 5 \
            --sleep-seconds 6 \
            --user-agent "Mozilla/5.0 (compatible; CoreWorkerReconcileSmoke/1.0)"

      - name: Mark deployed SHA
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        run: |
          set -euo pipefail
          mkdir -p deploy-state
          echo "${{ steps.sha.outputs.sha }}" > deploy-state/deployed_sha.txt

      - name: Save deploy cache
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: core-workers-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/deployed_sha.txt
