name: Deploy Core Workers (api + insumos)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/apps/api/**"
      - "backend/apps/insumos/**"
      - ".github/workflows/deploy-core-workers.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare deploy secrets
        id: guard
        env:
          ENABLE: ${{ vars.ENABLE_CORE_WORKERS_DEPLOY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "${ENABLE:-true}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install worker deps (insumos + api)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          (cd ../api && npm install --no-package-lock --no-audit --no-fund)
        working-directory: backend/apps/insumos

      - name: Deploy Workers (wrangler)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@3 deploy --config backend/apps/insumos/wrangler.toml --keep-vars
          npx --yes wrangler@3 deploy --config backend/apps/api/wrangler.toml --keep-vars

      - name: Smoke check (basic)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          curl -fsS -H 'User-Agent: CoreWorkerSmoke/1.0' https://api.skincos.com.br/insumos/health >/dev/null
          curl -fsS -H 'User-Agent: CoreWorkerSmoke/1.0' https://api.skincos.com.br/api/ponto/health >/dev/null
