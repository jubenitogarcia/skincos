name: Deploy CRM API after automerge
run-name: "CRM API after-automerge PR #${{ github.event.pull_request.number || github.event.inputs.pr_number || inputs.pr_number || 'manual' }}"

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to deploy (uses merge commit SHA)"
        required: true

concurrency:
  group: deploy-crm-api-after-automerge-${{ github.event.pull_request.base.ref || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const resolvePr = require('./.github/scripts/resolve_after_automerge_pr.cjs');
            await resolvePr({
              github,
              context,
              core,
              options: {
                baseRef: 'main',
                headPrefix: 'codex/',
                requiredAuthor: 'jubenitogarcia',
              },
            });

      - name: Detect CRM API changes
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const detectChanges = require('./.github/scripts/detect_pr_file_changes.cjs');
            await detectChanges({
              github,
              context,
              core,
              options: {
                prNumber: '${{ steps.pr.outputs.pr_number }}',
                outputName: 'crm_api_changed',
                prefixes: ['backend/apps/crm-api/'],
                exact: [
                  'backend/pnpm-lock.yaml',
                  'backend/pnpm-workspace.yaml',
                  '.github/workflows/deploy-crm-api.yml',
                ],
              },
            });

      - name: Guard CRM API deploy secrets
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.crm_api_changed == 'true' }}
        id: guard
        env:
          ENABLE: ${{ vars.ENABLE_CRM_API_DEPLOY }}
          MODE: ${{ vars.CRM_API_DEPLOY_MODE }}
          HOST: ${{ secrets.CRM_API_SSH_HOST }}
          USER: ${{ secrets.CRM_API_SSH_USER }}
          KEY: ${{ secrets.CRM_API_SSH_KEY }}
          APP_DIR: ${{ vars.CRM_API_APP_DIR }}
          COMMAND: ${{ vars.CRM_API_DEPLOY_COMMAND }}
          RESTART_URL: ${{ vars.CRM_API_RESTART_URL }}
          BASIC_AUTH: ${{ secrets.CRM_API_BASIC_AUTH }}
        run: |
          set -euo pipefail
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "CRM API deploy disabled; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MODE_NORM="$(printf '%s' "${MODE:-ssh}" | tr '[:upper:]' '[:lower:]')"
          echo "mode=${MODE_NORM}" >> "$GITHUB_OUTPUT"
          if [[ "${MODE_NORM}" == "ssh" ]]; then
            if [[ -z "${HOST:-}" || -z "${USER:-}" || -z "${KEY:-}" || -z "${APP_DIR:-}" || -z "${COMMAND:-}" ]]; then
              echo "::error::CRM API deploy mode=ssh, but missing one or more required settings: CRM_API_SSH_HOST, CRM_API_SSH_USER, CRM_API_SSH_KEY, CRM_API_APP_DIR, CRM_API_DEPLOY_COMMAND."
              exit 1
            fi
          elif [[ "${MODE_NORM}" == "http_restart" ]]; then
            if [[ -z "${RESTART_URL:-}" || -z "${BASIC_AUTH:-}" ]]; then
              echo "::error::CRM API deploy mode=http_restart, but missing CRM_API_RESTART_URL or CRM_API_BASIC_AUTH."
              exit 1
            fi
          else
            echo "::error::Unsupported CRM_API_DEPLOY_MODE='${MODE_NORM}'. Use 'ssh' or 'http_restart'."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cache (skip if already deployed)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.crm_api_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: crm-api-after-automerge-deploy-${{ steps.pr.outputs.merge_commit_sha }}
          path: deploy-state/crm_api_after_automerge_sha.txt

      - name: Skip (already deployed)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.crm_api_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          echo "Already deployed merge sha=${{ steps.pr.outputs.merge_commit_sha }}; skipping."

      - name: Deploy via SSH (merge commit)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.crm_api_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.mode == 'ssh' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CRM_API_SSH_HOST }}
          username: ${{ secrets.CRM_API_SSH_USER }}
          key: ${{ secrets.CRM_API_SSH_KEY }}
          port: ${{ secrets.CRM_API_SSH_PORT != '' && secrets.CRM_API_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${CRM_API_APP_DIR}"
            git fetch --all
            git reset --hard "${GITHUB_SHA}"
            ${CRM_API_DEPLOY_COMMAND}
        env:
          CRM_API_APP_DIR: ${{ vars.CRM_API_APP_DIR }}
          CRM_API_DEPLOY_COMMAND: ${{ vars.CRM_API_DEPLOY_COMMAND }}
          GITHUB_SHA: ${{ steps.pr.outputs.merge_commit_sha }}

      - name: Deploy via HTTP restart (merge commit)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.crm_api_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.mode == 'http_restart' }}
        env:
          RESTART_URL: ${{ vars.CRM_API_RESTART_URL }}
          BASIC_AUTH: ${{ secrets.CRM_API_BASIC_AUTH }}
          GITHUB_SHA: ${{ steps.pr.outputs.merge_commit_sha }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf '%s' "${BASIC_AUTH}" | base64)"
          payload="$(cat <<JSON
          {"mode":"stack","reason":"github-actions-after-automerge-crm-api","sha":"${GITHUB_SHA}","syncRepo":true,"syncSha":"${GITHUB_SHA}","syncAutoStash":true}
          JSON
          )"
          response="$(curl -fsS --retry 3 --retry-delay 2 --retry-connrefused \
            -X POST "${RESTART_URL}" \
            -H "authorization: Basic ${AUTH_HEADER}" \
            -H "content-type: application/json" \
            --data "${payload}")"
          echo "${response}"
          python3 -c 'import json,sys; data=json.loads(sys.stdin.read()); ok=bool(data.get("success")); sys.exit(0 if ok else 1)' <<<"${response}"

      - name: Mark deployed SHA
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.crm_api_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        run: |
          set -euo pipefail
          mkdir -p deploy-state
          echo "${{ steps.pr.outputs.merge_commit_sha }}" > deploy-state/crm_api_after_automerge_sha.txt

      - name: Save deploy cache
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.crm_api_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          key: crm-api-after-automerge-deploy-${{ steps.pr.outputs.merge_commit_sha }}
          path: deploy-state/crm_api_after_automerge_sha.txt
