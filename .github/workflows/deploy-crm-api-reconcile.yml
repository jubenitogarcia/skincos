name: Deploy CRM API reconcile

on:
  schedule:
    # Ensure CRM API follows `main` even when merges performed by GitHub Actions skip `on: push` triggers.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: deploy-crm-api-reconcile-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard CRM API deploy secrets
        id: guard
        env:
          ENABLE: ${{ vars.ENABLE_CRM_API_DEPLOY }}
          MODE: ${{ vars.CRM_API_DEPLOY_MODE }}
          HOST: ${{ secrets.CRM_API_SSH_HOST }}
          USER: ${{ secrets.CRM_API_SSH_USER }}
          KEY: ${{ secrets.CRM_API_SSH_KEY }}
          APP_DIR: ${{ vars.CRM_API_APP_DIR }}
          COMMAND: ${{ vars.CRM_API_DEPLOY_COMMAND }}
          RESTART_URL: ${{ vars.CRM_API_RESTART_URL }}
          BASIC_AUTH: ${{ secrets.CRM_API_BASIC_AUTH }}
        run: |
          set -euo pipefail
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "CRM API deploy disabled; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MODE_NORM="$(printf '%s' "${MODE:-ssh}" | tr '[:upper:]' '[:lower:]')"
          echo "mode=${MODE_NORM}" >> "$GITHUB_OUTPUT"
          if [[ "${MODE_NORM}" == "ssh" ]]; then
            if [[ -z "${HOST:-}" || -z "${USER:-}" || -z "${KEY:-}" || -z "${APP_DIR:-}" || -z "${COMMAND:-}" ]]; then
              echo "::error::CRM API deploy mode=ssh, but missing one or more required settings: CRM_API_SSH_HOST, CRM_API_SSH_USER, CRM_API_SSH_KEY, CRM_API_APP_DIR, CRM_API_DEPLOY_COMMAND."
              exit 1
            fi
          elif [[ "${MODE_NORM}" == "http_restart" ]]; then
            if [[ -z "${RESTART_URL:-}" || -z "${BASIC_AUTH:-}" ]]; then
              echo "::error::CRM API deploy mode=http_restart, but missing CRM_API_RESTART_URL or CRM_API_BASIC_AUTH."
              exit 1
            fi
          else
            echo "::error::Unsupported CRM_API_DEPLOY_MODE='${MODE_NORM}'. Use 'ssh' or 'http_restart'."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve target SHA
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: sha
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          msg=$(git log -1 --pretty=%s | tr '\n' ' ')
          echo "message=$msg" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cache (skip if already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: crm-api-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/crm_api_deployed_sha.txt

      - name: Skip (already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          echo "Already deployed sha=${{ steps.sha.outputs.sha }}; skipping."

      - name: Deploy via SSH (main SHA)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.mode == 'ssh' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CRM_API_SSH_HOST }}
          username: ${{ secrets.CRM_API_SSH_USER }}
          key: ${{ secrets.CRM_API_SSH_KEY }}
          port: ${{ secrets.CRM_API_SSH_PORT != '' && secrets.CRM_API_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${CRM_API_APP_DIR}"
            git fetch --all
            git reset --hard "${GITHUB_SHA}"
            ${CRM_API_DEPLOY_COMMAND}
        env:
          CRM_API_APP_DIR: ${{ vars.CRM_API_APP_DIR }}
          CRM_API_DEPLOY_COMMAND: ${{ vars.CRM_API_DEPLOY_COMMAND }}
          GITHUB_SHA: ${{ steps.sha.outputs.sha }}

      - name: Deploy via HTTP restart (main SHA)
        id: http_restart
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.mode == 'http_restart' }}
        env:
          RESTART_URL: ${{ vars.CRM_API_RESTART_URL }}
          BASIC_AUTH: ${{ secrets.CRM_API_BASIC_AUTH }}
          GITHUB_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf '%s' "${BASIC_AUTH}" | base64)"
          payload="$(cat <<JSON
          {"mode":"stack","reason":"github-actions-reconcile-crm-api","sha":"${GITHUB_SHA}","syncRepo":true,"syncSha":"${GITHUB_SHA}","syncAutoStash":false}
          JSON
          )"
          response_file="$(mktemp)"
          http_code="$(curl -sS --retry 3 --retry-delay 2 --retry-connrefused \
            -o "${response_file}" \
            -w "%{http_code}" \
            -X POST "${RESTART_URL}" \
            -H "authorization: Basic ${AUTH_HEADER}" \
            -H "content-type: application/json" \
            --data "${payload}")"
          response="$(cat "${response_file}")"
          rm -f "${response_file}"
          echo "${response}"
          if ! decision="$(jq -r '
            if (.success == true) then "DEPLOYED"
            elif ((.error // "") == "RECOVERY_SYNC_REPO_DIRTY") then "SKIP_DIRTY"
            elif ((.error // "") == "LOCAL_RECOVERY_DISABLED") then "SKIP_DISABLED"
            else "FAIL:\((.error // "UNKNOWN_ERROR"))"
            end
          ' <<<"${response}" 2>/dev/null)"; then
            decision="FAIL:INVALID_JSON"
          fi
          case "${decision}" in
            DEPLOYED)
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              ;;
            SKIP_DIRTY)
              echo "::warning::CRM API reconcile skipped repo sync because workspace is dirty (http=${http_code}); retry will continue automatically."
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              ;;
            SKIP_DISABLED)
              echo "::warning::CRM API reconcile skipped because local recovery is disabled (http=${http_code}); no remote recovery was enabled."
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              ;;
            FAIL:*)
              echo "::error::CRM API reconcile http_restart failed (http=${http_code}, reason=${decision#FAIL:})."
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "::error::Unexpected deploy decision '${decision}' (http=${http_code})."
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

      - name: Mark deployed SHA
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() && (steps.guard.outputs.mode == 'ssh' || steps.http_restart.outputs.deployed == 'true') }}
        run: |
          set -euo pipefail
          mkdir -p deploy-state
          echo "${{ steps.sha.outputs.sha }}" > deploy-state/crm_api_deployed_sha.txt

      - name: Save deploy cache
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() && (steps.guard.outputs.mode == 'ssh' || steps.http_restart.outputs.deployed == 'true') }}
        uses: actions/cache/save@v4
        with:
          key: crm-api-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/crm_api_deployed_sha.txt
