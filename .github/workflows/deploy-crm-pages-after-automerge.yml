name: Deploy CRM (Cloudflare Pages) after automerge
run-name: "CRM Pages after-automerge PR #${{ github.event.pull_request.number || github.event.inputs.pr_number || inputs.pr_number || 'manual' }}"

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to deploy (uses merge commit SHA)"
        required: true

concurrency:
  group: deploy-crm-pages-after-automerge-${{ github.event.pull_request.base.ref || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = (() => {
              const n = context.payload?.pull_request?.number;
              if (n) return n;
              const input = context.payload?.inputs?.pr_number;
              const parsed = Number(String(input || '').trim());
              if (!Number.isFinite(parsed) || parsed <= 0) {
                core.warning(`Invalid or missing workflow_dispatch input pr_number: ${input}`);
                return null;
              }
              return parsed;
            })();

            if (!prNumber) {
              core.setOutput('eligible', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const eligible =
              pr.merged === true &&
              pr.base?.ref === 'main' &&
              pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              String(pr.head?.ref || '').startsWith('codex/') &&
              pr.user?.login === 'jubenitogarcia';

            core.info(`PR #${prNumber} merged=${pr.merged} base=${pr.base?.ref} head=${pr.head?.ref} eligible=${eligible}`);

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('merge_commit_sha', pr.merge_commit_sha || '');
            core.setOutput('eligible', eligible ? 'true' : 'false');

      - name: Detect frontend changes
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number('${{ steps.pr.outputs.pr_number }}'),
              per_page: 100,
            });
            const changed = files.some((f) => String(f.filename || '').startsWith('frontend/'));
            core.setOutput('frontend_changed', changed ? 'true' : 'false');

      - name: Guard Cloudflare Pages deploy
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' }}
        id: guard
        env:
          ENABLE_PROD: ${{ vars.ENABLE_CRM_PAGES_DEPLOY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_PROD: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          ENABLE="$ENABLE_PROD"
          PROJECT="${PROJECT_PROD:-skincos}"
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=main" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout merge commit
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.merge_commit_sha }}

      - name: Setup Node
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        run: npm ci
        working-directory: frontend

      - name: Fetch face models
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        run: npm run fetch-face-models
        working-directory: frontend

      - name: Build frontend
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        env:
          VITE_BUILD_SHA: ${{ steps.pr.outputs.merge_commit_sha }}
        run: npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages (wrangler)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: ${{ steps.guard.outputs.branch }}
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-skincos}"
          echo "Deploying Cloudflare Pages project=$PROJECT branch=$BRANCH_NAME (after automerge)"
          npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH_NAME" --commit-hash "${{ steps.pr.outputs.merge_commit_sha }}" --commit-message "after-automerge PR #${{ steps.pr.outputs.pr_number }}"
        working-directory: frontend

      - name: Smoke check Ponto (production)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.guard.outputs.branch == 'main' }}
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request

          base = os.environ.get("BASE_URL", "").rstrip("/")
          if not base:
            raise SystemExit("BASE_URL not set")

          def fetch_json(path: str):
            url = f"{base}{path}"
            headers = {"User-Agent": "Mozilla/5.0 (compatible; PontoSmoke/1.0)"}
            cid = os.environ.get("CF_ACCESS_CLIENT_ID", "").strip()
            csec = os.environ.get("CF_ACCESS_CLIENT_SECRET", "").strip()
            if cid and csec:
              headers["CF-Access-Client-Id"] = cid
              headers["CF-Access-Client-Secret"] = csec
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=15) as resp:
              data = resp.read().decode("utf-8", "ignore")
              return json.loads(data)

          def check():
            proxy = fetch_json("/api/ponto/_proxy-status")
            if not proxy.get("ok"):
              raise SystemExit("proxy-status ok=false")
            if not proxy.get("targetConfigured"):
              raise SystemExit("proxy-status targetConfigured=false")
            if not proxy.get("adminTokenConfigured"):
              raise SystemExit("proxy-status adminTokenConfigured=false")
            health = fetch_json("/api/ponto/health")
            if not health.get("ok"):
              raise SystemExit("health ok=false")
            if not health.get("cryptoTemplates"):
              raise SystemExit("health cryptoTemplates=false")
            return True

          for i in range(1, 6):
            try:
              check()
              print("Ponto smoke check OK")
              sys.exit(0)
            except Exception as exc:
              print(f"Attempt {i} failed: {exc}")
              if i >= 5:
                raise
              time.sleep(6)
          PY

      - name: Cache Playwright browsers (UI smoke)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.guard.outputs.branch == 'main' && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium

      - name: Install Playwright Chromium (UI smoke)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.guard.outputs.branch == 'main' && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        run: npx --yes playwright install --with-deps chromium
        working-directory: frontend

      - name: Ponto UI smoke (production)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.guard.outputs.branch == 'main' && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        env:
          CRM_URL: https://crm.skincos.com.br
          EXPECT_BUILD_SHA: ${{ steps.pr.outputs.merge_commit_sha }}
          BUILD_BADGE_WAIT_MS: "120000"
          AUTO_LOGIN: "1"
          SMOKE_EMAIL: ${{ secrets.PONTO_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_SMOKE_PASSWORD }}
          LOGIN_WAIT_MS: "120000"
          NO_SCREENSHOTS: "1"
          NODE_PATH: frontend/node_modules
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_EMAIL:-}" || -z "${SMOKE_PASSWORD:-}" ]]; then
            echo "Missing GitHub Actions secrets: PONTO_SMOKE_EMAIL / PONTO_SMOKE_PASSWORD"
            exit 1
          fi
          node frontend/scripts/ponto-ui-smoke.cjs
