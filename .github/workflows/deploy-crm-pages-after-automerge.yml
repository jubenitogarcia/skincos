name: Deploy CRM (Cloudflare Pages) after automerge
run-name: "CRM Pages after-automerge PR #${{ github.event.pull_request.number || github.event.inputs.pr_number || inputs.pr_number || 'manual' }}"

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to deploy (uses merge commit SHA)"
        required: true

concurrency:
  group: deploy-crm-pages-after-automerge-${{ github.event.pull_request.base.ref || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const resolvePr = require('./.github/scripts/resolve_after_automerge_pr.cjs');
            await resolvePr({
              github,
              context,
              core,
              options: {
                baseRef: 'main',
                headPrefix: 'codex/',
                requiredAuthor: 'jubenitogarcia',
              },
            });

      - name: Detect frontend changes
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const detectChanges = require('./.github/scripts/detect_pr_file_changes.cjs');
            await detectChanges({
              github,
              context,
              core,
              options: {
                prNumber: '${{ steps.pr.outputs.pr_number }}',
                outputName: 'frontend_changed',
                prefixes: ['modules/crm/web/'],
                exact: [],
              },
            });

      - name: Guard Cloudflare Pages deploy
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' }}
        id: guard
        env:
          ENABLE_PROD: ${{ vars.ENABLE_CRM_PAGES_DEPLOY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_PROD: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          ENABLE="$ENABLE_PROD"
          PROJECT="${PROJECT_PROD:-skincos}"
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=main" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cache (skip if already deployed)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: crm-pages-after-automerge-deploy-${{ steps.pr.outputs.merge_commit_sha }}
          path: deploy-state/crm_pages_after_automerge_sha.txt

      - name: Skip (already deployed)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          echo "Already deployed merge sha=${{ steps.pr.outputs.merge_commit_sha }}; skipping."

      - name: Checkout merge commit
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.merge_commit_sha }}

      - name: Setup Node
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: modules/crm/web/package-lock.json

      - name: Install frontend deps
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci
        working-directory: modules/crm/web

      - name: Fetch face models
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: npm run fetch-face-models
        working-directory: modules/crm/web

      - name: Build frontend
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          VITE_BUILD_SHA: ${{ steps.pr.outputs.merge_commit_sha }}
        run: npm run build
        working-directory: modules/crm/web

      - name: Deploy to Cloudflare Pages (wrangler)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: ${{ steps.guard.outputs.branch }}
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-skincos}"
          echo "Deploying Cloudflare Pages project=$PROJECT branch=$BRANCH_NAME (after automerge)"
          npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH_NAME" --commit-hash "${{ steps.pr.outputs.merge_commit_sha }}" --commit-message "after-automerge PR #${{ steps.pr.outputs.pr_number }}"
        working-directory: modules/crm/web

      - name: Smoke check Ponto (production)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.branch == 'main' }}
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          .github/scripts/ponto_smoke.py \
            --attempts 5 \
            --sleep-seconds 6 \
            --user-agent "Mozilla/5.0 (compatible; PontoSmoke/1.0)"

      - name: Cache Playwright browsers (UI smoke)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.branch == 'main' && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium

      - name: Install Playwright Chromium (UI smoke)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.branch == 'main' && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        run: npx --yes playwright install --with-deps chromium
        working-directory: modules/crm/web

      - name: Ponto UI smoke (production)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && steps.guard.outputs.branch == 'main' && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        env:
          CRM_URL: https://crm.skincos.com.br
          EXPECT_BUILD_SHA: ${{ steps.pr.outputs.merge_commit_sha }}
          BUILD_BADGE_WAIT_MS: "120000"
          AUTO_LOGIN: "1"
          SMOKE_EMAIL: ${{ secrets.PONTO_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_SMOKE_PASSWORD }}
          LOGIN_WAIT_MS: "120000"
          NO_SCREENSHOTS: "1"
          NODE_PATH: modules/crm/web/node_modules
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_EMAIL:-}" || -z "${SMOKE_PASSWORD:-}" ]]; then
            echo "Missing GitHub Actions secrets: PONTO_SMOKE_EMAIL / PONTO_SMOKE_PASSWORD"
            exit 1
          fi
          node modules/crm/web/scripts/ponto-ui-smoke.cjs

      - name: Mark deployed SHA
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        run: |
          set -euo pipefail
          mkdir -p deploy-state
          echo "${{ steps.pr.outputs.merge_commit_sha }}" > deploy-state/crm_pages_after_automerge_sha.txt

      - name: Save deploy cache
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          key: crm-pages-after-automerge-deploy-${{ steps.pr.outputs.merge_commit_sha }}
          path: deploy-state/crm_pages_after_automerge_sha.txt
