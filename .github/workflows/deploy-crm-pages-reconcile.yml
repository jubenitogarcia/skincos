name: Deploy CRM (Cloudflare Pages) reconcile

on:
  schedule:
    # Workaround: merges performed via GitHub Actions can skip `on: push` deploy triggers.
    # This job reconciles production to the latest `main` SHA.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force redeploy even if current main SHA was already deployed (useful after secret/env changes)."
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-crm-pages-reconcile-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve flags
        id: flags
        run: |
          set -euo pipefail
          FORCE_RAW="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}"
          FORCE="$(echo "${FORCE_RAW:-false}" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [[ "$FORCE" == "1" || "$FORCE" == "true" || "$FORCE" == "yes" || "$FORCE" == "on" ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard Cloudflare Pages deploy
        id: guard
        env:
          ENABLE_PROD: ${{ vars.ENABLE_CRM_PAGES_DEPLOY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_PROD: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          ENABLE="$ENABLE_PROD"
          PROJECT="${PROJECT_PROD:-skincos}"
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve target SHA
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: sha
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          msg=$(git log -1 --pretty=%s | tr '\n' ' ')
          echo "message=$msg" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cache (skip if already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: crm-pages-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/deployed_sha.txt

      - name: Skip (already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' && steps.flags.outputs.force != 'true' }}
        run: |
          set -euo pipefail
          echo "Already deployed sha=${{ steps.sha.outputs.sha }}; skipping."

      - name: Smoke check Ponto (production, pre-flight)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' && steps.flags.outputs.force != 'true' }}
        id: ponto_smoke_pre
        continue-on-error: true
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          .github/scripts/ponto_smoke.py \
            --attempts 5 \
            --sleep-seconds 5 \
            --require-proxy-token-configured \
            --require-actor-key-configured \
            --user-agent "Mozilla/5.0 (compatible; PontoSmoke/1.0)"

      - name: Decide redeploy (env drift)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' && steps.flags.outputs.force != 'true' }}
        id: redeploy
        run: |
          set -euo pipefail
          if [[ "${{ steps.ponto_smoke_pre.outcome }}" == "success" ]]; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "Ponto pre-flight succeeded; no redeploy needed."
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "Ponto pre-flight failed; forcing redeploy to pick up env changes."
          fi

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') }}
        run: npm ci
        working-directory: frontend

      - name: Fetch face models
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') }}
        run: npm run fetch-face-models
        working-directory: frontend

      - name: Build frontend
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') }}
        env:
          VITE_BUILD_SHA: ${{ steps.sha.outputs.sha }}
        run: npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages (wrangler)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: main
          GIT_SHA: ${{ steps.sha.outputs.sha }}
          GIT_MESSAGE: ${{ steps.sha.outputs.message }}
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-skincos}"
          echo "Reconciling Cloudflare Pages project=$PROJECT branch=$BRANCH_NAME sha=$GIT_SHA"
          npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH_NAME" --commit-hash "$GIT_SHA" --commit-message "$GIT_MESSAGE"
        working-directory: frontend

      - name: Smoke check Ponto (production)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') }}
        continue-on-error: true
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          .github/scripts/ponto_smoke.py \
            --attempts 15 \
            --sleep-seconds 10 \
            --require-proxy-token-configured \
            --require-actor-key-configured \
            --user-agent "Mozilla/5.0 (compatible; PontoSmoke/1.0)"

      - name: Cache Playwright browsers (UI smoke)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium

      - name: Install Playwright Chromium (UI smoke)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        run: npx --yes playwright install --with-deps chromium
        working-directory: frontend

      - name: Ponto UI smoke (production)
        if: ${{ steps.guard.outputs.skip != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.flags.outputs.force == 'true' || steps.redeploy.outputs.need == 'true') && vars.ENABLE_PONTO_UI_SMOKE == 'true' }}
        env:
          CRM_URL: https://crm.skincos.com.br
          EXPECT_BUILD_SHA: ${{ steps.sha.outputs.sha }}
          BUILD_BADGE_WAIT_MS: "120000"
          AUTO_LOGIN: "1"
          SMOKE_EMAIL: ${{ secrets.PONTO_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_SMOKE_PASSWORD }}
          LOGIN_WAIT_MS: "120000"
          NO_SCREENSHOTS: "1"
          NODE_PATH: frontend/node_modules
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_EMAIL:-}" || -z "${SMOKE_PASSWORD:-}" ]]; then
            echo "Missing GitHub Actions secrets: PONTO_SMOKE_EMAIL / PONTO_SMOKE_PASSWORD"
            exit 1
          fi
          node frontend/scripts/ponto-ui-smoke.cjs

      - name: Mark deployed SHA
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        run: |
          set -euo pipefail
          mkdir -p deploy-state
          echo "${{ steps.sha.outputs.sha }}" > deploy-state/deployed_sha.txt

      - name: Save deploy cache
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          key: crm-pages-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/deployed_sha.txt
