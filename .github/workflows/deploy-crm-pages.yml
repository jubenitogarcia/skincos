            if curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$restored_id" \
              > "$RUNNER_TEMP/pages-staging-restored.json"; then
              node - "$RUNNER_TEMP/pages-staging-restored.json" "$restored_id" <<'NODE' || status_code=$?
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const deployment = payload?.result;
          const stage = deployment?.latest_stage;
          const status = String(stage?.status || "").toLowerCase();
          const terminal = stage?.name === "deploy"
            && stage?.status === "success"
            && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
            && deployment?.is_skipped === false;
          const aliasHosts = new Set((deployment?.aliases || []).map((alias) => {
            try { return new URL(alias).hostname; } catch { return String(alias).replace(/^https?:\/\//, "").replace(/\/.*$/, ""); }
          }));
          if (
            payload?.success === true
            && deployment?.id === process.argv[3]
            && deployment?.project_name === "skincos-staging"
            && deployment?.environment === "production"
            && deployment?.deployment_trigger?.metadata?.branch === "staging"
            && String(deployment?.deployment_trigger?.metadata?.commit_hash || "").toLowerCase() === process.env.PAGES_STAGING_ROLLBACK_COMMIT_SHA
            && terminal
            && aliasHosts.has("crm-staging.skincos.com.br")
          ) process.exit(0);
          if (["active", "queued", "waiting", "pending", "building", "initializing"].includes(status)) process.exit(2);
          process.exit(3);
          NODE
            fi
            if [[ "$status_code" == 0 ]]; then restored=true; break; fi
            [[ "$status_code" == 2 ]] || { echo 'staging Pages compensation entered a failed or invalid state'; exit 1; }
            sleep 5
          done
          [[ "$restored" == true ]] || { echo 'staging Pages compensation did not reach terminal success'; exit 1; }
          node - "$RUNNER_TEMP/pages-staging-restored.json" "$restored_id" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const deployment = payload?.result;
          const stage = deployment?.latest_stage;
          const terminal = stage?.name === "deploy"
            && stage?.status === "success"
            && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
            && deployment?.is_skipped === false;
          const aliasHosts = new Set((deployment?.aliases || []).map((alias) => {
            try { return new URL(alias).hostname; } catch { return String(alias).replace(/^https?:\/\//, "").replace(/\/.*$/, ""); }
          }));
          if (
            payload?.success !== true
            || String(deployment?.id || "").toLowerCase() !== String(process.argv[3]).toLowerCase()
            || deployment?.project_name !== "skincos-staging"
            || deployment?.environment !== "production"
            || deployment?.production_branch !== "staging"
            || deployment?.deployment_trigger?.metadata?.branch !== "staging"
            || String(deployment?.deployment_trigger?.metadata?.commit_hash || "").toLowerCase() !== process.env.PAGES_STAGING_ROLLBACK_COMMIT_SHA
            || !terminal
            || !aliasHosts.has("crm-staging.skincos.com.br")
          ) throw new Error("restored staging Pages deployment identity or alias differs from the exact incumbent");
          NODE
          echo "PAGES_STAGING_RESTORED_DEPLOYMENT_ID=$restored_id" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/pages-staging-rollback-completed"
      - name: Write Ponto staging Pages mutation journal
        if: ${{ always() && inputs.release_scope == 'ponto' && inputs.target == 'staging' }}
        env:
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-staging-mutation"
          node - "$RUNNER_TEMP/pages-staging-mutation/mutation.json" <<'NODE'
          const fs = require("fs");
          const exists = (name) => fs.existsSync(`${process.env.RUNNER_TEMP}/${name}`);
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            surface: "crmPages",
            stage: "staging",
            sourceSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            orchestratorRunId: process.env.ORCHESTRATOR_RUN_ID || "",
            incumbentDeploymentId: process.env.PAGES_STAGING_ROLLBACK_DEPLOYMENT_ID || "",
            incumbentCommitSha: process.env.PAGES_STAGING_ROLLBACK_COMMIT_SHA || "",
            candidateDeploymentId: process.env.PAGES_STAGING_CANDIDATE_DEPLOYMENT_ID || "",
            restoredDeploymentId: process.env.PAGES_STAGING_RESTORED_DEPLOYMENT_ID || "",
            mutationStarted: exists("pages-staging-mutation-started"),
            mutationCompleted: exists("pages-staging-mutation-completed"),
            rollbackCompleted: exists("pages-staging-rollback-completed"),
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Upload Ponto staging Pages mutation journal
        if: ${{ always() && inputs.release_scope == 'ponto' && inputs.target == 'staging' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-mutation-crm-pages-staging-${{ needs.promotion.outputs.source_sha }}
          path: ${{ runner.temp }}/pages-staging-mutation/mutation.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.release_scope == 'ponto' && inputs.target == 'staging' }}
        with:
          name: ponto-surface-crm-pages-staging-${{ needs.promotion.outputs.source_sha }}
          path: ${{ runner.temp }}/crm-pages-staging-surface/surface.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove raw structured Pages output
        if: always()
        run: rm -f "$RUNNER_TEMP/crm-pages-deploy.ndjson"

      - name: Smoke check Ponto (production)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && inputs.target == 'production' }}
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          .github/scripts/ponto_smoke.py \
            --attempts 15 \
            --sleep-seconds 10 \
            --allow-ponto-disabled \
            --user-agent "Mozilla/5.0 (compatible; PontoSmoke/1.0)"
      - name: Write staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && inputs.target == 'staging' }}
        env:
          PROMOTION_UNIT: crm-pages
          PROMOTION_TARGET: staging
          PROMOTION_SOURCE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: PROMOTION_SOURCE_TREE="$(git rev-parse "${PROMOTION_SOURCE_SHA}^{tree}")" node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/promotion-evidence/promotion-evidence.json"
      - name: Upload staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && inputs.target == 'staging' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-crm-pages
          path: ${{ runner.temp }}/promotion-evidence/promotion-evidence.json
          retention-days: 14
          if-no-files-found: error

  ponto-progressive-release:
    needs: [coordination, progressive]
    if: ${{ github.run_attempt == 1 && inputs.release_scope == 'ponto' && contains(fromJSON('["pilot","canary","production","rollback"]'), inputs.target) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_SHA: ${{ needs.progressive.outputs.source_sha }}
      TARGET: ${{ inputs.target }}
      PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout trusted Ponto custody guard
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Revalidate the exact active coordinator before CRM Pages production secrets or mutation
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage || inputs.target }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Authorize global CRM Pages production mutation
        if: ${{ inputs.target != 'preview' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
          resource: global:crm-cloudflare-writer
          module: ${{ inputs.release_scope == 'ponto' && 'ponto' || 'crm-pages' }}
          source_sha: ${{ inputs.release_sha || github.sha }}
      - name: Guard canonical Ponto Pages release
        env:
          ENABLE_PONTO_CRM_PAGES_DEPLOY: ${{ vars.ENABLE_PONTO_CRM_PAGES_DEPLOY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODULE_CONTROL_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
        run: |
          set -euo pipefail
          [[ "$ENABLE_PONTO_CRM_PAGES_DEPLOY" == true ]] || { echo 'ENABLE_PONTO_CRM_PAGES_DEPLOY must be explicitly true'; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare credentials are required'; exit 1; }
          [[ "$MODULE_CONTROL_KV_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Production Pages module-control KV namespace ID is invalid'; exit 1; }
          [[ "$PROJECT" == skincos ]] || { echo 'Production Ponto release requires the exact skincos Pages project'; exit 1; }
      - name: Attest exact production Pages project metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/skincos" \
            > "$RUNNER_TEMP/pages-project.json"
          node - "$RUNNER_TEMP/pages-project.json" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const project = payload?.result;
          if (
            payload?.success !== true
            || project?.name !== "skincos"
            || project?.subdomain !== "skincos.pages.dev"
            || project?.production_branch !== "main"
            || !(project?.domains || []).includes("crm.skincos.com.br")
          ) throw new Error("production Pages project identity, branch, or CRM domain differs");
          NODE
          rm -f "$RUNNER_TEMP/pages-project.json"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: crm/console/package-lock.json
      - name: Attest remote Ponto Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pages_project="$RUNNER_TEMP/pages-ponto-project.json"
          trap 'rm -f "$pages_project"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > "$pages_project"
          node - "$pages_project" "$TARGET" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const envVars = payload?.result?.deployment_configs?.production?.env_vars;
          if (
            payload?.success !== true
            || !envVars
            || typeof envVars !== "object"
            || Array.isArray(envVars)
          ) throw new Error("Cloudflare Pages project response did not contain structured production env_vars");
          const required = [
            "PONTO_ACTOR_HMAC_KEY",
            "PONTO_NETWORK_CONTEXT_KEY",
            "PONTO_RELEASE_PROBE_HMAC_KEY",
          ];
          if (process.argv[3] !== "staging") required.push("PONTO_API_TARGET");
          for (const name of required) {
            const binding = envVars[name];
            if (!binding) throw new Error(`remote Pages value is absent: ${name}`);
            if (binding.type !== "secret_text") throw new Error(`remote Pages value must be secret_text: ${name}`);
          }
          NODE
      - name: Select Pages rollback deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREDECESSOR_CURRENT_ID: ${{ needs.progressive.outputs.pages_deployment_id }}
          PREDECESSOR_ROLLBACK_ID: ${{ needs.progressive.outputs.pages_rollback_deployment_id }}
          BASELINE_ROLLBACK_ID: ${{ needs.progressive.outputs.baseline_pages_deployment_id }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == pilot ]]; then
            [[ "$BASELINE_ROLLBACK_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Pilot requires an immutable Pages baseline'; exit 1; }
            current_id="$BASELINE_ROLLBACK_ID"
            id="$BASELINE_ROLLBACK_ID"
          else
            current_id="$PREDECESSOR_CURRENT_ID"
            id="$PREDECESSOR_ROLLBACK_ID"
          fi
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          [[ "$current_id" =~ $uuid && "$id" =~ $uuid ]] || {
            echo 'Pages predecessor ownership or rollback deployment is invalid'
            exit 1
          }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&per_page=25" \
            > "$RUNNER_TEMP/pages-incumbent.json"
          node - "$RUNNER_TEMP/pages-incumbent.json" "$current_id" "$TARGET" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const deployments = (payload.result || [])
            .filter(item => item.environment === "production")
            .sort((a, b) => String(b.created_on).localeCompare(String(a.created_on)));
          const expected = String(process.argv[3] || "").toLowerCase();
          const target = process.argv[4];
          const latest = deployments[0];
          const stage = latest?.latest_stage;
          const terminal = stage?.name === "deploy"
            && stage?.status === "success"
            && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
            && latest?.is_skipped === false;
          if (
            payload?.success !== true
            || !uuid.test(expected)
            || String(latest?.id || "").toLowerCase() !== expected
            || latest?.project_name !== "skincos"
            || latest?.environment !== "production"
            || latest?.deployment_trigger?.metadata?.branch !== "main"
            || !terminal
          ) throw new Error(`production Pages no longer equals the exact ${target} predecessor state`);
          NODE
          echo "PAGES_ROLLBACK_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/pages-incumbent.json"
      - name: Render exact Ponto Pages rollout identity
        if: inputs.target != 'rollback'
        env:
          CORE_CANDIDATE_VERSION_ID: ${{ inputs.core_candidate_version_id }}
          IDENTITY_CANDIDATE_VERSION_ID: ${{ inputs.identity_candidate_version_id }}
          MODULE_CONTROL_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
        run: |
          set -euo pipefail
          npm --prefix crm/console ci
          npm --prefix crm/console run typecheck
          npm --prefix crm/console test
          npm --prefix crm/console run fetch-face-models
          node - crm/console/wrangler.toml "$TARGET" "$RELEASE_SHA" "$CORE_CANDIDATE_VERSION_ID" "$IDENTITY_CANDIDATE_VERSION_ID" <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const stage = process.argv[3];
          const releaseSha = process.argv[4];
          const coreVersionId = process.argv[5];
          const identityVersionId = process.argv[6];
          const uuid = /^[0-9a-f-]{36}$/i;
          let source = fs.readFileSync(file, "utf8");
          source = source.replace(/__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__/g, process.env.MODULE_CONTROL_KV_ID);
          source = source.replace(/^PONTO_CORE_VERSION_ID\s*=.*\r?\n/gm, "");
          source = source.replace(/^PONTO_IDENTITY_VERSION_ID\s*=.*\r?\n/gm, "");
          source = source.replace(/__RELEASE_SHA__/g, releaseSha);
          source = source.replace(/^PONTO_ROLLOUT_STAGE\s*=\s*"[^"]*"/gm, `PONTO_ROLLOUT_STAGE = "${stage}"`);
          if (stage === "pilot" || stage === "canary") {
            if (!uuid.test(coreVersionId)) throw new Error(`${stage} requires a Core candidate UUID`);
            if (!uuid.test(identityVersionId)) throw new Error(`${stage} requires an Identity candidate UUID`);
            let inserted = false;
            source = source.replace(new RegExp(`^PONTO_ROLLOUT_STAGE\\s*=\\s*"${stage}"\\s*$`, "m"), line => {
              if (inserted) return line;
              inserted = true;
              return `${line}\nPONTO_CORE_VERSION_ID = "${coreVersionId}"\nPONTO_IDENTITY_VERSION_ID = "${identityVersionId}"`;
            });
            if (!inserted) throw new Error("production rollout stage field was not found");
          } else if (coreVersionId || identityVersionId) {
            throw new Error("Ponto version overrides are forbidden outside pilot/canary");
          }
          if (source.includes("__RELEASE_SHA__")) throw new Error("PONTO_RELEASE_SHA placeholder remains");
          if (source.includes("__CONFIGURE_")) throw new Error("Ponto Pages config contains an unresolved binding placeholder");
          const moduleControl = source.match(/\[\[env\.production\.kv_namespaces\]\]\s*\r?\nbinding\s*=\s*"MODULE_CONTROL"\s*\r?\nid\s*=\s*"([0-9a-f]{32})"/i);
          if (!moduleControl || moduleControl[1].toLowerCase() !== process.env.MODULE_CONTROL_KV_ID.toLowerCase()) throw new Error("Ponto Pages module-control KV binding differs from the production namespace");
          if (!["pilot", "canary"].includes(stage) && /^PONTO_(?:CORE|IDENTITY)_VERSION_ID/m.test(source)) throw new Error("stale Ponto version override remains");
          fs.writeFileSync(file, source);
          NODE
          VITE_BUILD_SHA="$RELEASE_SHA" npm --prefix crm/console run build
      - name: Deploy or roll back the exact Pages release
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/pages-mutation-started"
          if [[ "$TARGET" == rollback ]]; then
            curl --fail --silent --show-error --request POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$PAGES_ROLLBACK_DEPLOYMENT_ID/rollback" \
              > "$RUNNER_TEMP/pages-release-result.json"
          else
            (
              cd crm/console
              WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/pages-release-result.ndjson" npx --yes wrangler@4.112.0 pages deploy dist \
                --project-name "$PROJECT" \
                --branch main \
                --commit-hash "$RELEASE_SHA" \
                --commit-message "ponto:$TARGET:$RELEASE_SHA"
            )
            PONTO_EXPECTED_WRANGLER_ENV=production node .github/scripts/ponto-wrangler-output.mjs "$RUNNER_TEMP/pages-release-result.ndjson" pages-deploy "$PROJECT" > "$RUNNER_TEMP/pages-release-verified.txt"
          fi
          if [[ "$TARGET" == rollback ]]; then result_file="$RUNNER_TEMP/pages-release-result.json"; result_type=api; else result_file="$RUNNER_TEMP/pages-release-result.ndjson"; result_type=ndjson; fi
          IFS=$'\t' read -r deployment_id deployment_url < <(RESULT_TYPE="$result_type" node - "$result_file" <<'NODE'
          const fs = require("fs");
          let result;
          if (process.env.RESULT_TYPE === "ndjson") {
            const rows = fs.readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).map(JSON.parse);
            const row = rows.filter(item => item.type === "pages-deploy").at(-1);
            result = { id: row?.deployment_id || row?.id, url: row?.url || row?.deployment_url || row?.targets?.[0] };
          } else {
            const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (!payload.success) throw new Error("Pages rollback failed");
            result = payload.result;
          }
          if (!/^[0-9a-f-]{36}$/i.test(result?.id || "") || !/^https:\/\//.test(result?.url || "")) throw new Error("Pages deployment identity missing");
          process.stdout.write(`${result.id}\t${result.url}`);
          NODE
          )
          deployment_ready=false
          for attempt in {1..36}; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$deployment_id" \
              > "$RUNNER_TEMP/pages-active-deployment.json"
            status_code=0
            node - "$RUNNER_TEMP/pages-active-deployment.json" "$deployment_id" <<'NODE' || status_code=$?
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const deployment = payload?.result;
          const stage = deployment?.latest_stage;
          const status = String(stage?.status || "").toLowerCase();
          const terminal = stage?.name === "deploy"
            && stage?.status === "success"
            && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
            && deployment?.is_skipped === false;
          if (payload?.success !== true || deployment?.id !== process.argv[3]) process.exit(3);
          if (terminal) process.exit(0);
          if (["active", "queued", "waiting", "pending", "building", "initializing"].includes(status)) process.exit(2);
          process.exit(3);
          NODE
            if [[ "$status_code" == 0 ]]; then deployment_ready=true; break; fi
            [[ "$status_code" == 2 ]] || { echo 'Pages deployment entered a failed or invalid state'; exit 1; }
            sleep 5
          done
          [[ "$deployment_ready" == true ]] || { echo 'Pages deployment did not reach terminal success before timeout'; exit 1; }
          node - "$RUNNER_TEMP/pages-active-deployment.json" "$deployment_id" "$deployment_url" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const deployment = payload?.result;
          const metadata = deployment?.deployment_trigger?.metadata || {};
          const stage = deployment?.latest_stage;
          const terminal = stage?.name === "deploy"
            && stage?.status === "success"
            && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
            && deployment?.is_skipped === false;
          const aliasHosts = new Set((deployment?.aliases || []).map((alias) => {
            try { return new URL(alias).hostname; } catch { return String(alias).replace(/^https?:\/\//, "").replace(/\/.*$/, ""); }
          }));
          if (
            payload?.success !== true
            || deployment?.id !== process.argv[3]
            || deployment?.project_name !== "skincos"
            || deployment?.environment !== "production"
            || deployment?.url !== process.argv[4]
            || metadata.branch !== "main"
            || !terminal
            || !aliasHosts.has("crm.skincos.com.br")
          ) throw new Error("production Pages control-plane identity or aliases differ");
          if (process.env.TARGET !== "rollback" && String(metadata.commit_hash || "").toLowerCase() !== process.env.RELEASE_SHA) {
            throw new Error("production Pages commit SHA differs from the exact release");
          }
          NODE
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&per_page=25" \
            > "$RUNNER_TEMP/pages-production-deployments.json"
          node - "$RUNNER_TEMP/pages-production-deployments.json" "$deployment_id" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = (payload?.result || [])
            .filter((item) => item?.environment === "production")
            .sort((a, b) => String(b.created_on).localeCompare(String(a.created_on)))[0];
          if (payload?.success !== true || latest?.id !== process.argv[3]) {
            throw new Error("terminal Pages deployment is not the latest production deployment");
          }
          NODE
          access_args=()
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]] || { echo 'Partial Cloudflare Access service credential'; exit 1; }
            access_args=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            "${access_args[@]}" \
            --dump-header "$RUNNER_TEMP/pages-public-alias.headers" \
            "https://crm.skincos.com.br/api/ponto/_proxy-status" \
            > "$RUNNER_TEMP/pages-public-alias.json"
          if [[ "$TARGET" != rollback ]]; then
            node - "$RUNNER_TEMP/pages-public-alias.json" "$RUNNER_TEMP/pages-public-alias.headers" <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const headers = fs.readFileSync(process.argv[3], "utf8").toLowerCase();
          if (
            body?.ok !== true
            || body?.ready !== true
            || !headers.includes(`x-skincos-pages-release-sha: ${process.env.RELEASE_SHA}`)
            || !headers.includes("x-skincos-pages-environment: production")
          ) throw new Error("public CRM alias is not linked to the exact production Pages candidate");
          NODE
          fi
          touch "$RUNNER_TEMP/pages-mutation-completed"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/pages-release-result.ndjson" "$RUNNER_TEMP/pages-release-result.json" "$RUNNER_TEMP/pages-active-deployment.json" "$RUNNER_TEMP/pages-public-alias.headers" "$RUNNER_TEMP/pages-public-alias.json"
      - name: Roll back Pages after a failed mutation
        if: ${{ always() && (failure() || cancelled()) && env.PAGES_ROLLBACK_DEPLOYMENT_ID != '' && inputs.target != 'rollback' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_CANDIDATE_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          candidate_id="$EXPECTED_CANDIDATE_DEPLOYMENT_ID"
          if [[ ! "$candidate_id" =~ ^[0-9a-fA-F-]{36}$ && -f "$RUNNER_TEMP/pages-release-result.ndjson" ]]; then
            candidate_id="$(node - "$RUNNER_TEMP/pages-release-result.ndjson" <<'NODE'
          const fs = require("fs");
          const rows = fs.readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const row = rows.filter(item => item?.type === "pages-deploy").at(-1);
          process.stdout.write(String(row?.deployment_id || row?.id || ""));
          NODE
            )"
          fi
          [[ "$candidate_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]] || {
            echo 'Pages failure rollback has no exact owned candidate deployment; refusing to overwrite current state'
            exit 1
          }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&per_page=25" \
            > "$RUNNER_TEMP/pages-failure-current.json"
          CANDIDATE_ID="$candidate_id" node - "$RUNNER_TEMP/pages-failure-current.json" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = (payload?.result || [])
            .filter(item => item?.environment === "production")
            .sort((a, b) => String(b.created_on).localeCompare(String(a.created_on)))[0];
          const stage = latest?.latest_stage;
          const terminal = stage?.name === "deploy"
            && stage?.status === "success"
            && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
            && latest?.is_skipped === false;
          if (
            payload?.success !== true
            || latest?.id !== process.env.CANDIDATE_ID
            || latest?.project_name !== "skincos"
            || latest?.deployment_trigger?.metadata?.branch !== "main"
            || String(latest?.deployment_trigger?.metadata?.commit_hash || "").toLowerCase() !== process.env.RELEASE_SHA
            || !terminal
          ) throw new Error("Pages failure rollback lost exact ownership of the active candidate");
          NODE
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$PAGES_ROLLBACK_DEPLOYMENT_ID" \
            > "$RUNNER_TEMP/pages-failure-incumbent.json"
          incumbent_commit="$(node - "$RUNNER_TEMP/pages-failure-incumbent.json" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const deployment = payload?.result;
          const commit = String(deployment?.deployment_trigger?.metadata?.commit_hash || "").toLowerCase();
          if (
            payload?.success !== true
            || deployment?.id !== process.env.PAGES_ROLLBACK_DEPLOYMENT_ID
            || deployment?.project_name !== "skincos"
            || deployment?.environment !== "production"
            || deployment?.deployment_trigger?.metadata?.branch !== "main"
            || !/^[0-9a-f]{40}$/.test(commit)
          ) throw new Error("Pages failure rollback incumbent is invalid");
          process.stdout.write(commit);
          NODE
          )"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$PAGES_ROLLBACK_DEPLOYMENT_ID/rollback" \
            > "$RUNNER_TEMP/pages-failure-rollback-result.json"
          restored_id="$(node - "$RUNNER_TEMP/pages-failure-rollback-result.json" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const id = String(payload?.result?.id || "");
          if (payload?.success !== true || !/^[0-9a-f-]{36}$/i.test(id)) throw new Error("Pages failure rollback response is invalid");
          process.stdout.write(id);
          NODE
          )"
          restored=false
          for attempt in {1..36}; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$restored_id" \
              > "$RUNNER_TEMP/pages-failure-restored.json"
            status_code=0
            INCUMBENT_COMMIT="$incumbent_commit" node - "$RUNNER_TEMP/pages-failure-restored.json" "$restored_id" <<'NODE' || status_code=$?
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const deployment = payload?.result;
          const stage = deployment?.latest_stage;
          const status = String(stage?.status || "").toLowerCase();
          const terminal = stage?.name === "deploy"
            && stage?.status === "success"
            && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
            && deployment?.is_skipped === false;
          const aliasHosts = new Set((deployment?.aliases || []).map((alias) => {
            try { return new URL(alias).hostname; } catch { return String(alias).replace(/^https?:\/\//, "").replace(/\/.*$/, ""); }
          }));
          if (
            payload?.success === true
            && deployment?.id === process.argv[3]
            && deployment?.project_name === "skincos"
            && deployment?.environment === "production"
            && deployment?.deployment_trigger?.metadata?.branch === "main"
            && String(deployment?.deployment_trigger?.metadata?.commit_hash || "").toLowerCase() === process.env.INCUMBENT_COMMIT
            && terminal
            && aliasHosts.has("crm.skincos.com.br")
          ) process.exit(0);
          if (["active", "queued", "waiting", "pending", "building", "initializing"].includes(status)) process.exit(2);
          process.exit(3);
          NODE
            if [[ "$status_code" == 0 ]]; then restored=true; break; fi
            [[ "$status_code" == 2 ]] || { echo 'Pages failure rollback entered a failed or invalid state'; exit 1; }
            sleep 5
          done
          [[ "$restored" == true ]] || { echo 'Pages failure rollback did not reach terminal success'; exit 1; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&per_page=25" \
            > "$RUNNER_TEMP/pages-failure-restored-list.json"
          node - "$RUNNER_TEMP/pages-failure-restored-list.json" "$restored_id" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = (payload?.result || [])
            .filter((item) => item?.environment === "production")
            .sort((a, b) => String(b.created_on).localeCompare(String(a.created_on)))[0];
          if (payload?.success !== true || latest?.id !== process.argv[3]) throw new Error("restored Pages deployment is not latest");
          NODE
          echo "PAGES_RESTORED_DEPLOYMENT_ID=$restored_id" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/pages-rollback-completed"
      - name: Write sanitized CRM Pages mutation journal
        if: always()
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-mutation"
          node - "$RUNNER_TEMP/pages-mutation/mutation.json" <<'NODE'
          const fs = require("fs");
          const exists = name => fs.existsSync(`${process.env.RUNNER_TEMP}/${name}`);
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            surface: "crmPages",
            stage: process.env.TARGET,
            sourceSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            orchestratorRunId: process.env.ORCHESTRATOR_RUN_ID || "",
            baselineRunId: process.env.BASELINE_RUN_ID || "",
            incumbentDeploymentId: process.env.PAGES_ROLLBACK_DEPLOYMENT_ID || "",
            candidateDeploymentId: process.env.DEPLOYMENT_ID || "",
            restoredDeploymentId: process.env.PAGES_RESTORED_DEPLOYMENT_ID || "",
            mutationStarted: exists("pages-mutation-started"),
            mutationCompleted: exists("pages-mutation-completed"),
            rollbackCompleted: exists("pages-rollback-completed"),
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Upload CRM Pages mutation journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-mutation-crm-pages-${{ inputs.target }}-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/pages-mutation/mutation.json
          retention-days: 90
          if-no-files-found: error
      - name: Write sanitized CRM Pages surface manifest
        if: success()
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-surface"
          node - "$RUNNER_TEMP/pages-surface/surface.json" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            surface: "crmPages",
            stage: process.env.TARGET,
            sourceSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            baselineRunId: process.env.BASELINE_RUN_ID || "",
            deploymentId: process.env.DEPLOYMENT_ID,
            rollbackDeploymentId: process.env.PAGES_ROLLBACK_DEPLOYMENT_ID,
            candidateTag: `ponto:crmPages:${process.env.RELEASE_SHA}`,
            url: process.env.DEPLOYMENT_URL,
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: ponto-surface-crm-pages-${{ inputs.target }}-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/pages-surface/surface.json
          retention-days: 90
          if-no-files-found: error
  global-coordination-release:
    needs: [coordination, promotion, progressive, ponto-preview, deploy, ponto-progressive-release]
    if: ${{ always() && needs.coordination.outputs.global_lease_required == 'true' }}
    uses: ./.github/workflows/global-coordination-release.yml
    secrets:
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
    with:
      required: true
      proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
      coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
      key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
