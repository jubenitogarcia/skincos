name: Deploy CRM (Cloudflare Pages)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [preview, staging, production]
      release_sha: { description: "Immutable commit SHA", required: false, type: string }
      preview_run_id: { description: "Required for staging", required: false, type: string }
      staging_run_id: { description: "Required for production", required: false, type: string }

concurrency:
  group: deploy-crm-pages-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  promotion:
    uses: ./.github/workflows/promotion-gate.yml
    with:
      unit: crm-pages
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      preview_run_id: ${{ inputs.preview_run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
    secrets: inherit
  deploy:
    needs: promotion
    if: ${{ inputs.target != 'preview' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare Pages deploy
        id: guard
        env:
          ENABLE_PROD: ${{ vars.ENABLE_CRM_PAGES_DEPLOY }}
          ENABLE_STAGING: ${{ vars.ENABLE_CRM_PAGES_DEPLOY_STAGING }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_PROD: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PROJECT_STAGING: ${{ vars.CLOUDFLARE_PAGES_PROJECT_STAGING }}
          BRANCH_NAME: ${{ inputs.target == 'staging' && 'staging' || 'main' }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" == "staging" ]]; then
            ENABLE="$ENABLE_STAGING"
            PROJECT="${PROJECT_STAGING:-skincos-staging}"
          else
            ENABLE="$ENABLE_PROD"
            PROJECT="${PROJECT_PROD:-skincos}"
          fi
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}
          fetch-depth: 2

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: crm/console/package-lock.json

      - name: Hold Finance UI from production until an explicit release
        id: finance_production_gate
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          ALLOW_FINANCE_PRODUCTION: ${{ vars.ENABLE_FINANCE_PRODUCTION_DEPLOY }}
          BRANCH_NAME: ${{ inputs.target == 'staging' && 'staging' || 'main' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" != "main" || "${ALLOW_FINANCE_PRODUCTION:-}" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          if grep -Eq '^crm/console/(App\.tsx|Finance|financeApi|functions/api/finance/|public/_routes\.json|scripts/finance-)' <<< "$changed"; then
            echo "Finance production release requires ENABLE_FINANCE_PRODUCTION_DEPLOY=true; Pages deploy held."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend deps
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        run: npm ci
        working-directory: crm/console

      - name: Fetch face models
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        run: npm run fetch-face-models
        working-directory: crm/console

      - name: Build frontend
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        env:
          VITE_BUILD_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: npm run build
        working-directory: crm/console

      - name: Deploy to Cloudflare Pages (wrangler)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: ${{ steps.guard.outputs.branch }}
          GIT_SHA: ${{ github.sha }}
          GIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-skincos}"
          if [[ "$BRANCH_NAME" == "staging" ]]; then
            # Pages reads only wrangler.toml from its working directory. This
            # checkout is ephemeral, so stage the isolated config in place
            # rather than letting the staging project inherit production
            # proxy targets from the repository default.
            cp .wrangler-staging/wrangler.toml wrangler.toml
          fi
          echo "Deploying Cloudflare Pages project=$PROJECT branch=$BRANCH_NAME"
          npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH_NAME" --commit-hash "$GIT_SHA" --commit-message "$GIT_MESSAGE"
        working-directory: crm/console

      - name: Smoke check Ponto (production)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && steps.guard.outputs.branch == 'main' }}
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          .github/scripts/ponto_smoke.py \
            --attempts 15 \
            --sleep-seconds 10 \
            --allow-ponto-disabled \
            --user-agent "Mozilla/5.0 (compatible; PontoSmoke/1.0)"
      - name: Write staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && inputs.target == 'staging' }}
        env:
          PROMOTION_UNIT: crm-pages
          PROMOTION_TARGET: staging
          PROMOTION_SOURCE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: PROMOTION_SOURCE_TREE="$(git rev-parse "${PROMOTION_SOURCE_SHA}^{tree}")" node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/promotion-evidence/promotion-evidence.json"
      - name: Upload staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && inputs.target == 'staging' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-crm-pages
          path: ${{ runner.temp }}/promotion-evidence/promotion-evidence.json
          retention-days: 14
          if-no-files-found: error
