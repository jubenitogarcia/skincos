name: Deploy CRM (Cloudflare Pages)

on:
  push:
    branches: [ main, staging ]
    paths:
      - "crm/console/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-crm-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare Pages deploy
        id: guard
        env:
          ENABLE_PROD: ${{ vars.ENABLE_CRM_PAGES_DEPLOY }}
          ENABLE_STAGING: ${{ vars.ENABLE_CRM_PAGES_DEPLOY_STAGING }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_PROD: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PROJECT_STAGING: ${{ vars.CLOUDFLARE_PAGES_PROJECT_STAGING }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" == "staging" ]]; then
            ENABLE="$ENABLE_STAGING"
            PROJECT="${PROJECT_STAGING:-skincos-staging}"
          else
            ENABLE="$ENABLE_PROD"
            PROJECT="${PROJECT_PROD:-skincos}"
          fi
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "::error::The explicit deployment flag is not enabled for $BRANCH_NAME."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deploy credentials are missing."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: crm/console/package-lock.json

      - name: Sync required CRM Pages proxy secrets
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: ${{ steps.guard.outputs.branch }}
          PONTO_ACTOR_HMAC_KEY: ${{ secrets.PONTO_ACTOR_HMAC_KEY }}
          PONTO_NETWORK_CONTEXT_KEY: ${{ secrets.PONTO_NETWORK_CONTEXT_KEY }}
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          INTEGRATIONS_ENCRYPTION_SECRET: ${{ secrets.INTEGRATIONS_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          for name in PONTO_ACTOR_HMAC_KEY PONTO_NETWORK_CONTEXT_KEY ESCALA_ACTOR_HMAC_KEY INTEGRATIONS_ENCRYPTION_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret $name for the CRM Pages proxy."
              exit 1
            fi
          done
          if [[ "$BRANCH_NAME" == "staging" ]]; then
            pages_env=preview
            ponto_target=https://api-staging.skincos.com.br
          else
            pages_env=production
            ponto_target=https://api.skincos.com.br
          fi
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx --yes wrangler@4 pages secret put "$name" --project-name "$PROJECT" --env "$pages_env" >/dev/null
          }
          put_secret PONTO_API_TARGET "$ponto_target"
          put_secret PONTO_ACTOR_HMAC_KEY "$PONTO_ACTOR_HMAC_KEY"
          put_secret PONTO_NETWORK_CONTEXT_KEY "$PONTO_NETWORK_CONTEXT_KEY"
          put_secret ESCALA_ACTOR_HMAC_KEY "$ESCALA_ACTOR_HMAC_KEY"
          put_secret INTEGRATIONS_ENCRYPTION_SECRET "$INTEGRATIONS_ENCRYPTION_SECRET"

      - name: Hold Finance UI from production until an explicit release
        id: finance_production_gate
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          ALLOW_FINANCE_PRODUCTION: ${{ vars.ENABLE_FINANCE_PRODUCTION_DEPLOY }}
          BRANCH_NAME: ${{ github.ref_name }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" != "main" || "${ALLOW_FINANCE_PRODUCTION:-}" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$GITHUB_BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null || true)"
          if grep -Eq '^crm/console/(App\.tsx|Finance|financeApi|functions/api/finance/|public/_routes\.json|scripts/finance-)' <<< "$changed"; then
            echo "::error::Finance production release requires ENABLE_FINANCE_PRODUCTION_DEPLOY=true."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install frontend deps
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        run: npm ci
        working-directory: crm/console

      - name: Fetch face models
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        run: npm run fetch-face-models
        working-directory: crm/console

      - name: Build frontend
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
        working-directory: crm/console

      - name: Deploy to Cloudflare Pages (wrangler)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: ${{ steps.guard.outputs.branch }}
          GIT_SHA: ${{ github.sha }}
          GIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-skincos}"
          if [[ "$BRANCH_NAME" == "staging" ]]; then
            # Pages reads only wrangler.toml from its working directory. This
            # checkout is ephemeral, so stage the isolated config in place
            # rather than letting the staging project inherit production
            # proxy targets from the repository default.
            cp .wrangler-staging/wrangler.toml wrangler.toml
          fi
          echo "Deploying Cloudflare Pages project=$PROJECT branch=$BRANCH_NAME"
          npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH_NAME" --commit-hash "$GIT_SHA" --commit-message "$GIT_MESSAGE"
        working-directory: crm/console

      - name: Smoke check Ponto (production)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && steps.guard.outputs.branch == 'main' }}
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          .github/scripts/ponto_smoke.py \
            --attempts 15 \
            --sleep-seconds 10 \
            --allow-ponto-disabled \
            --user-agent "Mozilla/5.0 (compatible; PontoSmoke/1.0)"
