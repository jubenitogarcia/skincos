name: Deploy CRM (Cloudflare Pages)

on:
  push:
    branches: [ main, staging ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-crm-pages.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-crm-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare Pages deploy
        id: guard
        env:
          ENABLE_PROD: ${{ vars.ENABLE_CRM_PAGES_DEPLOY }}
          ENABLE_STAGING: ${{ vars.ENABLE_CRM_PAGES_DEPLOY_STAGING }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_PROD: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PROJECT_STAGING: ${{ vars.CLOUDFLARE_PAGES_PROJECT_STAGING }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" == "staging" ]]; then
            ENABLE="$ENABLE_STAGING"
            PROJECT="${PROJECT_STAGING:-skincos-staging}"
            WRANGLER_CWD=".wrangler-staging"
          else
            ENABLE="$ENABLE_PROD"
            PROJECT="${PROJECT_PROD:-skincos}"
            WRANGLER_CWD=""
          fi
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "wrangler_cwd=$WRANGLER_CWD" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: npm ci
        working-directory: frontend

      - name: Fetch face models
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: npm run fetch-face-models
        working-directory: frontend

      - name: Build frontend
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages (wrangler)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: ${{ steps.guard.outputs.branch }}
          GIT_SHA: ${{ github.sha }}
          GIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
          WRANGLER_CWD: ${{ steps.guard.outputs.wrangler_cwd }}
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-skincos}"
          if [[ -n "${WRANGLER_CWD:-}" ]]; then
            echo "Deploying Cloudflare Pages project=$PROJECT branch=$BRANCH_NAME (wrangler cwd=$WRANGLER_CWD)"
            npx --yes wrangler@3 --cwd "$WRANGLER_CWD" pages deploy ../dist --project-name "$PROJECT" --branch "$BRANCH_NAME" --commit-hash "$GIT_SHA" --commit-message "$GIT_MESSAGE"
          else
            echo "Deploying Cloudflare Pages project=$PROJECT branch=$BRANCH_NAME"
            npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH_NAME" --commit-hash "$GIT_SHA" --commit-message "$GIT_MESSAGE"
          fi
        working-directory: frontend

      - name: Smoke check Ponto (production)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.guard.outputs.branch == 'main' }}
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request

          base = os.environ.get("BASE_URL", "").rstrip("/")
          if not base:
            raise SystemExit("BASE_URL not set")

          def fetch_json(path: str):
            url = f"{base}{path}"
            headers = {"User-Agent": "Mozilla/5.0 (compatible; PontoSmoke/1.0)"}
            cid = os.environ.get("CF_ACCESS_CLIENT_ID", "").strip()
            csec = os.environ.get("CF_ACCESS_CLIENT_SECRET", "").strip()
            if cid and csec:
              headers["CF-Access-Client-Id"] = cid
              headers["CF-Access-Client-Secret"] = csec
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=15) as resp:
              data = resp.read().decode("utf-8", "ignore")
              return json.loads(data)

          def check():
            proxy = fetch_json("/api/ponto/_proxy-status")
            if not proxy.get("ok"):
              raise SystemExit("proxy-status ok=false")
            if not proxy.get("targetConfigured"):
              raise SystemExit("proxy-status targetConfigured=false")
            if not proxy.get("adminTokenConfigured"):
              raise SystemExit("proxy-status adminTokenConfigured=false")
            health = fetch_json("/api/ponto/health")
            if not health.get("ok"):
              raise SystemExit("health ok=false")
            if not health.get("cryptoTemplates"):
              raise SystemExit("health cryptoTemplates=false")
            return True

          for i in range(1, 6):
            try:
              check()
              print("Ponto smoke check OK")
              sys.exit(0)
            except Exception as exc:
              print(f"Attempt {i} failed: {exc}")
              if i >= 5:
                raise
              time.sleep(6)
          PY
