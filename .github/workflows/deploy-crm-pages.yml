name: Deploy CRM (Cloudflare Pages)
run-name: CRM Pages ${{ inputs.target }} ${{ inputs.release_sha }} orchestrator=${{ inputs.orchestrator_run_id }} nonce=${{ inputs.orchestrator_nonce }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [preview, staging, pilot, canary, production, rollback]
      release_sha: { description: "Immutable commit SHA", required: false, type: string }
      preview_run_id: { description: "Required for staging", required: false, type: string }
      staging_run_id: { description: "Required for production", required: false, type: string }
      release_scope:
        description: General CRM release or the governed Ponto composite release
        required: true
        default: general
        type: choice
        options: [general, ponto]
      predecessor_run_id: { description: "Required for Ponto live stages", required: false, type: string }
      baseline_run_id: { description: "Required for Ponto pilot; immutable production incumbent baseline", required: false, type: string }
      rollback_from_stage:
        description: Current live stage for Ponto rollback
        required: false
        default: production
        type: choice
        options: [pilot, canary, production]
      core_candidate_version_id: { description: "Required for Ponto staging, pilot and canary", required: false, type: string }
      identity_candidate_version_id: { description: "Required for Ponto staging, pilot and canary", required: false, type: string }
      orchestrator_run_id: { description: "Ponto coordinator correlation ID", required: false, type: string }
      orchestrator_stage: { description: "Exact stage of the issuing Ponto coordinator", required: false, type: string }
      orchestrator_issuer_run_id: { description: "Exact direct issuer run", required: false, type: string }
      orchestrator_nonce: { description: "Non-secret per-dispatch correlation nonce", required: false, type: string }

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  coordination:
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
    uses: ./.github/workflows/ponto-orchestrator-gate.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
    with:
      required: ${{ inputs.release_scope == 'ponto' && inputs.target != 'preview' }}
      global_lease_required: ${{ inputs.target != 'preview' }}
      global_resource: global:crm-cloudflare-writer
      global_module: ${{ inputs.release_scope == 'ponto' && 'ponto' || 'crm-pages' }}
      global_coordinator_url: ${{ contains(fromJSON('["pilot","canary","production","rollback"]'), inputs.target) && vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL || vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
      lease_key: pages
      stage: ${{ inputs.orchestrator_stage || inputs.target }}
      target: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
      release_sha: ${{ inputs.release_sha }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}
  promotion:
    needs: coordination
    if: ${{ inputs.release_scope != 'ponto' || inputs.target == 'preview' || inputs.target == 'staging' }}
    uses: ./.github/workflows/promotion-gate.yml
    with:
      unit: crm-pages
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      preview_run_id: ${{ inputs.preview_run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
      emit_preview_evidence: ${{ !(inputs.release_scope == 'ponto' && inputs.orchestrator_run_id != '') }}
  progressive:
    needs: coordination
    if: ${{ inputs.release_scope == 'ponto' && contains(fromJSON('["pilot","canary","production","rollback"]'), inputs.target) }}
    uses: ./.github/workflows/ponto-release-gate.yml
    with:
      stage: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      predecessor_run_id: ${{ inputs.predecessor_run_id }}
      rollback_from_stage: ${{ inputs.rollback_from_stage }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
  ponto-preview:
    needs: promotion
    if: ${{ inputs.release_scope == 'ponto' && inputs.target == 'preview' }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: crm/console/package-lock.json
      - name: Test and build the immutable CRM Pages source
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          npm --prefix crm/console ci
          npm --prefix crm/console run typecheck
          npm --prefix crm/console test
          npm --prefix crm/console run fetch-face-models
          sed -i "s/__RELEASE_SHA__/$RELEASE_SHA/g" crm/console/wrangler.toml crm/console/.wrangler-staging/wrangler.toml
          ! grep -R '__RELEASE_SHA__' crm/console/wrangler.toml crm/console/.wrangler-staging/wrangler.toml
          VITE_BUILD_SHA="$RELEASE_SHA" npm --prefix crm/console run build
      - name: Write validated CRM Pages preview artifacts
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          PROMOTION_UNIT=crm-pages PROMOTION_TARGET=preview PROMOTION_SOURCE_SHA="$RELEASE_SHA" \
          PROMOTION_SOURCE_TREE="$(git rev-parse "${RELEASE_SHA}^{tree}")" \
            node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/crm-pages-preview-evidence/promotion-evidence.json"
          mkdir -p "$RUNNER_TEMP/crm-pages-surface"
          node - "$RUNNER_TEMP/crm-pages-surface/surface.json" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            surface: "crmPages",
            stage: "preview",
            sourceSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            validation: "typecheck-tests-and-production-build",
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-crm-pages
          path: ${{ runner.temp }}/crm-pages-preview-evidence/promotion-evidence.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-surface-crm-pages-preview-${{ needs.promotion.outputs.source_sha }}
          path: ${{ runner.temp }}/crm-pages-surface/surface.json
          retention-days: 90
          if-no-files-found: error
  deploy:
    # The deploy job reads lease outputs from the reusable coordination job.
    # `promotion` depends on it transitively, but GitHub only exposes `needs`
    # outputs from direct dependencies.
    needs: [coordination, promotion]
    if: ${{ inputs.target != 'preview' && (inputs.release_scope != 'ponto' || github.run_attempt == 1) && (inputs.release_scope != 'ponto' || inputs.target == 'staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.target }}
    permissions:
      contents: read

    steps:
      - name: Checkout trusted Ponto custody guard
        if: ${{ inputs.release_scope == 'ponto' && inputs.orchestrator_run_id != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Preserve trusted Ponto Pages candidate resolver before release checkout
        if: ${{ inputs.release_scope == 'ponto' && inputs.orchestrator_run_id != '' }}
        run: |
          set -euo pipefail
          cp .github/scripts/ponto-pages-candidate.mjs "$RUNNER_TEMP/ponto-pages-candidate.mjs"
          test -s "$RUNNER_TEMP/ponto-pages-candidate.mjs"
      - name: Revalidate the exact active coordinator before CRM Pages staging secrets or mutation
        if: ${{ inputs.release_scope == 'ponto' && inputs.orchestrator_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage || inputs.target }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$PONTO_RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Checkout trusted general coordination actions
        if: ${{ inputs.release_scope == 'general' && inputs.target != 'preview' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          # The local coordination action runs before the candidate checkout.
          # Keep this gate on the immutable workflow dispatch revision so a
          # candidate cannot replace the action that authorizes the mutation.
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Authorize global CRM Pages surface mutation
        if: ${{ inputs.target != 'preview' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
          resource: global:crm-cloudflare-writer
          module: ${{ inputs.release_scope == 'ponto' && 'ponto' || 'crm-pages' }}
          source_sha: ${{ inputs.release_sha || github.sha }}
      - name: Guard Cloudflare Pages deploy
        id: guard
        env:
          # General CRM Pages controls are deliberately namespaced away from
          # the environment-scoped CLOUDFLARE_* containment overrides used by
          # the Ponto replay freeze. They target only the reviewed canonical
          # CRM projects below; Ponto keeps its own controls and custody.
          GENERAL_ENABLE_PROD: ${{ vars.ENABLE_CRM_GENERAL_PAGES_DEPLOY }}
          GENERAL_ENABLE_STAGING: ${{ vars.ENABLE_CRM_GENERAL_PAGES_DEPLOY_STAGING }}
          PONTO_ENABLE_PROD: ${{ vars.ENABLE_PONTO_CRM_PAGES_DEPLOY }}
          PONTO_ENABLE_STAGING: ${{ vars.ENABLE_PONTO_CRM_PAGES_DEPLOY_STAGING }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GENERAL_PROJECT_PROD: ${{ vars.CRM_GENERAL_PAGES_PROJECT }}
          GENERAL_PROJECT_STAGING: ${{ vars.CRM_GENERAL_PAGES_PROJECT_STAGING }}
          PONTO_PROJECT_PROD: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          PONTO_PROJECT_STAGING: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT_STAGING }}
          GENERAL_MODULE_CONTROL_PROD: ${{ vars.MODULE_CONTROL_PRODUCTION_KV_ID }}
          GENERAL_MODULE_CONTROL_STAGING: ${{ vars.MODULE_CONTROL_STAGING_KV_ID }}
          PONTO_MODULE_CONTROL_PROD: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
          PONTO_MODULE_CONTROL_STAGING: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          DEPLOY_TARGET: ${{ inputs.target }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_SCOPE" == ponto ]]; then
            ENABLE_PROD="$PONTO_ENABLE_PROD"
            ENABLE_STAGING="$PONTO_ENABLE_STAGING"
            PROJECT_PROD="$PONTO_PROJECT_PROD"
            PROJECT_STAGING="$PONTO_PROJECT_STAGING"
            MODULE_CONTROL_PROD="$PONTO_MODULE_CONTROL_PROD"
            MODULE_CONTROL_STAGING="$PONTO_MODULE_CONTROL_STAGING"
          else
            ENABLE_PROD="$GENERAL_ENABLE_PROD"
            ENABLE_STAGING="$GENERAL_ENABLE_STAGING"
            PROJECT_PROD="$GENERAL_PROJECT_PROD"
            PROJECT_STAGING="$GENERAL_PROJECT_STAGING"
            MODULE_CONTROL_PROD="$GENERAL_MODULE_CONTROL_PROD"
            MODULE_CONTROL_STAGING="$GENERAL_MODULE_CONTROL_STAGING"
          fi
          if [[ "$DEPLOY_TARGET" == "staging" ]]; then
            ENABLE="$ENABLE_STAGING"
            PROJECT="$PROJECT_STAGING"
            MODULE_CONTROL_KV_ID="$MODULE_CONTROL_STAGING"
            BRANCH_NAME=staging
          else
            ENABLE="$ENABLE_PROD"
            PROJECT="$PROJECT_PROD"
            MODULE_CONTROL_KV_ID="$MODULE_CONTROL_PROD"
            BRANCH_NAME=main
          fi
          if [[ "$DEPLOY_TARGET" == staging ]]; then
            [[ "$PROJECT" == skincos-staging ]] || { echo 'Staging Pages release requires the exact skincos-staging project'; exit 1; }
          else
            [[ "$PROJECT" == skincos ]] || { echo 'Production Pages release requires the exact skincos project'; exit 1; }
          fi
          if [[ "${ENABLE:-}" != "true" ]]; then
            echo "Cloudflare Pages deploy flag must be explicitly true."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare Pages credentials are required."
            exit 1
          fi
          [[ "$MODULE_CONTROL_KV_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Selected Pages environment requires a valid module-control KV namespace ID.'; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "module_control_kv_id=$MODULE_CONTROL_KV_ID" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Attest exact isolated Pages project and production branch
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          BRANCH_NAME: ${{ steps.guard.outputs.branch }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > "$RUNNER_TEMP/pages-project.json"
          node - "$RUNNER_TEMP/pages-project.json" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expectedName = process.env.DEPLOY_TARGET === "staging" ? "skincos-staging" : "skincos";
          const expectedSubdomain = `${expectedName}.pages.dev`;
          const expectedBranch = process.env.DEPLOY_TARGET === "staging" ? "staging" : "main";
          const expectedApiTarget = process.env.DEPLOY_TARGET === "staging"
            ? { type: "plain_text", value: "https://api-staging.skincos.com.br" }
            : { type: "secret_text" };
          const project = payload?.result;
          const apiTarget = project?.deployment_configs?.production?.env_vars?.PONTO_API_TARGET;
          if (
            payload?.success !== true
            || project?.name !== expectedName
            || project?.subdomain !== expectedSubdomain
            || project?.production_branch !== expectedBranch
            || process.env.BRANCH_NAME !== expectedBranch
            || apiTarget?.type !== expectedApiTarget.type
            || (expectedApiTarget.value && apiTarget?.value !== expectedApiTarget.value)
          ) throw new Error("Pages project identity or production branch differs from the reviewed isolated target");
          NODE
          rm -f "$RUNNER_TEMP/pages-project.json"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}
          fetch-depth: 2

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: crm/console/package-lock.json

      - name: Render fail-closed Ponto identity for every general Pages deploy
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid promoted release SHA'; exit 1; }
          sed -i "s/__RELEASE_SHA__/$RELEASE_SHA/g" crm/console/wrangler.toml crm/console/.wrangler-staging/wrangler.toml
          ! grep -R '__RELEASE_SHA__' crm/console/wrangler.toml crm/console/.wrangler-staging/wrangler.toml || { echo 'PONTO_RELEASE_SHA placeholder remains'; exit 1; }
          ! grep -RE '^PONTO_(CORE|IDENTITY)_VERSION_ID' crm/console/wrangler.toml crm/console/.wrangler-staging/wrangler.toml || { echo 'General Pages deploy refuses stale Ponto pilot overrides'; exit 1; }

      - name: Hold Finance UI from production until an explicit release
        id: finance_production_gate
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          ALLOW_FINANCE_PRODUCTION: ${{ vars.ENABLE_FINANCE_PRODUCTION_DEPLOY }}
          DEPLOY_TARGET: ${{ inputs.target }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_TARGET" != "production" || "${ALLOW_FINANCE_PRODUCTION:-}" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          if grep -Eq '^(finance/ui/|crm/console/(App\.tsx|financeBootstrap\.ts|functions/api/finance/|public/_routes\.json|scripts/finance-|modules/RemoteFinanceModule\.tsx))' <<< "$changed"; then
            echo "Finance production release requires ENABLE_FINANCE_PRODUCTION_DEPLOY=true; Pages deploy held."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend deps
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        run: npm ci
        working-directory: crm/console

      - name: Fetch face models
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        run: npm run fetch-face-models
        working-directory: crm/console

      - name: Build frontend
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        env:
          VITE_BUILD_SHA: ${{ needs.promotion.outputs.source_sha }}
          VITE_FINANCE_MODULE_URL: ${{ vars.FINANCE_UI_MODULE_URL }}
        run: npm run build
        working-directory: crm/console

      - name: Attest remote Ponto Pages values before Ponto deployment
        # General CRM releases intentionally use the canonical general Pages
        # project while Ponto remains independently fenced. Only a governed
        # Ponto release may require Ponto-owned remote secrets; a general
        # release must not hydrate or mutate that namespace.
        if: ${{ inputs.release_scope == 'ponto' && steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.guard.outputs.project }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          pages_project="$RUNNER_TEMP/pages-ponto-project.json"
          trap 'rm -f "$pages_project"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            > "$pages_project"
          node - "$pages_project" "$DEPLOY_TARGET" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const envVars = payload?.result?.deployment_configs?.production?.env_vars;
          if (
            payload?.success !== true
            || !envVars
            || typeof envVars !== "object"
            || Array.isArray(envVars)
          ) throw new Error("Cloudflare Pages project response did not contain structured production env_vars");
          const required = [
            "PONTO_ACTOR_HMAC_KEY",
            "PONTO_NETWORK_CONTEXT_KEY",
            "PONTO_RELEASE_PROBE_HMAC_KEY",
          ];
          if (process.argv[3] !== "staging") required.push("PONTO_API_TARGET");
          for (const name of required) {
            const binding = envVars[name];
            if (!binding) throw new Error(`remote Pages value is absent: ${name}`);
            if (binding.type !== "secret_text") throw new Error(`remote Pages value must be secret_text: ${name}`);
          }
          NODE

      - name: Capture Ponto staging Pages rollback deployment
        if: ${{ inputs.release_scope == 'ponto' && inputs.target == 'staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.guard.outputs.project }}
          PAGES_STAGING_ALIAS: crm-staging.skincos.com.br
        run: |
          set -euo pipefail
          selected=false
          for attempt in {1..12}; do
            pages_dir="$RUNNER_TEMP/pages-staging-incumbent-$attempt"
            mkdir -p "$pages_dir"
            rm -f "$pages_dir"/page-*.json
            total_pages=1
            page=1
            inventory_ok=true
            while (( page <= total_pages )); do
              incumbent_page="$pages_dir/page-$page.json"
              if ! curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&page=$page&per_page=25" \
                > "$incumbent_page"; then
                inventory_ok=false
                break
              fi
              if ! total_pages="$(node - "$incumbent_page" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const totalPages = Number(payload?.result_info?.total_pages || 1);
          if (
            payload?.success !== true
            || !Array.isArray(payload?.result)
            || !Number.isInteger(totalPages)
            || totalPages < 1
            || totalPages > 100
          ) throw new Error("Cloudflare Pages deployment inventory is not paginable");
          process.stdout.write(String(totalPages));
          NODE
              )"; then
                inventory_ok=false
                break
              fi
              (( page += 1 ))
            done
            if [[ "$inventory_ok" != true ]]; then
              if [[ "$attempt" != 12 ]]; then sleep 5; fi
              continue
            fi
            selection="$(node - "$pages_dir" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const pagesDir = process.argv[2];
          const expectedProject = process.env.PROJECT;
          const expectedAlias = process.env.PAGES_STAGING_ALIAS;
          const aliasHost = (value) => {
            try { return new URL(value).hostname; } catch { return String(value).replace(/^https?:\/\//, "").replace(/\/.*$/, ""); }
          };
          const files = fs.readdirSync(pagesDir)
            .filter(file => /^page-[0-9]+\.json$/.test(file))
            .sort((a, b) => Number(a.match(/[0-9]+/)[0]) - Number(b.match(/[0-9]+/)[0]));
          const payloads = files.map(file => JSON.parse(fs.readFileSync(path.join(pagesDir, file), "utf8")));
          if (!payloads.length || payloads.some(item => item?.success !== true || !Array.isArray(item?.result))) {
            throw new Error("Cloudflare Pages deployment inventory contains an invalid page");
          }
          const deployments = payloads
            .flatMap(item => item.result)
            .filter(item => {
              const metadata = item?.deployment_trigger?.metadata || {};
              const stage = item?.latest_stage;
              const aliases = new Set((item?.aliases || []).map(aliasHost));
              const terminal = stage?.name === "deploy"
                && stage?.status === "success"
                && Number.isFinite(Date.parse(String(stage?.ended_on || "")))
                && item?.is_skipped === false;
              return item?.project_name === expectedProject
