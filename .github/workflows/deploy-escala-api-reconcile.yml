name: Retired duplicate deploy path - Escala API reconcile

on:
  workflow_dispatch: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired deployment path
        run: |
          echo "::error::RETIRED_DUPLICATE_DEPLOY_PIPELINE: use deploy-escala-api.yml for Escala API."
          exit 1
