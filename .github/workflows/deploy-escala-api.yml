name: Deploy Escala API Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [preview, staging, production]
      release_sha: { description: "Immutable commit SHA", required: false, type: string }
      preview_run_id: { description: "Required for staging", required: false, type: string }
      staging_run_id: { description: "Required for production", required: false, type: string }
      production_manifest_sha256: { description: "SHA-256 of the protected production manifest", required: false, type: string }
      enable_schedule_public_read:
        description: "Explicit HMAC-gated opt-in; production requires same-SHA staging and protected manifest"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-escala-api-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  promotion:
    uses: ./.github/workflows/promotion-gate.yml
    with:
      unit: escala-api
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      preview_run_id: ${{ inputs.preview_run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
    secrets: inherit

  schedule-public-read-policy:
    needs: promotion
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Guard explicit Schedule public-read enablement
        env:
          TARGET: ${{ inputs.target }}
          ENABLE_SCHEDULE_PUBLIC_READ: ${{ inputs.enable_schedule_public_read && 'true' || 'false' }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$ENABLE_SCHEDULE_PUBLIC_READ" == 'true' || "$ENABLE_SCHEDULE_PUBLIC_READ" == 'false' ]] || { echo 'Schedule public-read opt-in is invalid'; exit 1; }
          if [[ "$ENABLE_SCHEDULE_PUBLIC_READ" == 'true' && "$TARGET" != 'staging' && "$TARGET" != 'production' ]]; then
            echo 'Schedule public-read may be enabled only by the canonical staging or production Escala workflow.'
            exit 1
          fi
          if [[ "$ENABLE_SCHEDULE_PUBLIC_READ" == 'true' && "$DISPATCH_REF" != 'refs/heads/main' ]]; then
            echo 'Schedule public-read core opt-in must dispatch from protected main.'
            exit 1
          fi
          if [[ "$ENABLE_SCHEDULE_PUBLIC_READ" == 'true' && "$RUN_ATTEMPT" != '1' ]]; then
            echo 'Schedule public-read core opt-in refuses reruns after a potentially mutating attempt.'
            exit 1
          fi


      - name: Checkout production opt-in verifier
        if: ${{ inputs.target == 'production' && inputs.enable_schedule_public_read }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}

      - name: Setup production opt-in verifier Node
        if: ${{ inputs.target == 'production' && inputs.enable_schedule_public_read }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: Validate protected production manifest before any core mutation
        if: ${{ inputs.target == 'production' && inputs.enable_schedule_public_read }}
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULE_PUBLIC_READ_PRODUCTION_MANIFEST: ${{ vars.SCHEDULE_PUBLIC_READ_PRODUCTION_MANIFEST }}
          PRODUCTION_MANIFEST_SHA256: ${{ inputs.production_manifest_sha256 }}
          ENABLE_SCHEDULE_PUBLIC_READ_PRODUCTION: ${{ vars.ENABLE_SCHEDULE_PUBLIC_READ_PRODUCTION }}
          SKINCOS_GLOBAL_COORDINATION_REQUIRED: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          [[ "$ENABLE_SCHEDULE_PUBLIC_READ_PRODUCTION" == 'true' ]] || { echo 'Production Schedule public-read opt-in is disabled'; exit 1; }
          [[ "$SKINCOS_GLOBAL_COORDINATION_REQUIRED" == 'true' && -n "$SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL" ]] || { echo 'Production coordination is required before any core mutation'; exit 1; }
          node workforce/schedule/scripts/public-read-production-manifest.mjs verify

      - name: Verify successful same-SHA core staging opt-in before production
        if: ${{ inputs.target == 'production' && inputs.enable_schedule_public_read }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: node workforce/schedule/scripts/public-read-production-predecessor.mjs core-staging

  deploy:
    needs: [promotion, schedule-public-read-policy]
    if: ${{ inputs.target != 'preview' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}

    steps:
      - name: Guard Escala deploy settings
        id: guard
        env:
          ENABLE: ${{ inputs.target == 'staging' && vars.ENABLE_ESCALA_API_DEPLOY_STAGING || vars.ENABLE_ESCALA_API_DEPLOY }}
          ENABLE_SCHEDULE_PUBLIC_READ: ${{ inputs.enable_schedule_public_read && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY: ${{ secrets.SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY }}
          SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          SKINCOS_GLOBAL_COORDINATION_KEY_ID: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ "${ENABLE:-true}" != "true" ]]; then
            echo "Deploy flag not enabled; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deploy secrets missing."
            exit 1
          fi
          if [[ -z "${ESCALA_ACTOR_HMAC_KEY:-}" ]]; then
            echo "::error::Missing GitHub secret ESCALA_ACTOR_HMAC_KEY."
            exit 1
          fi
          if [[ "$ENABLE_SCHEDULE_PUBLIC_READ" == 'true' && -z "${SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY:-}" ]]; then
            echo "::error::Missing GitHub secret SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY for staging core opt-in."
            exit 1
          fi
          if [[ "$ENABLE_SCHEDULE_PUBLIC_READ" == 'true' && "$ESCALA_ACTOR_HMAC_KEY" == "$SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY" ]]; then
            echo '::error::Schedule public-read core capability must differ from ESCALA_ACTOR_HMAC_KEY'
            exit 1
          fi
          if [[ -n "${SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY:-}" ]]; then
            if [[ -z "${SKINCOS_GLOBAL_COORDINATION_KEY_ID:-}" || "$SKINCOS_GLOBAL_COORDINATION_KEY_ID" == 'legacy-v1' ]]; then
              echo '::error::Active global coordination custody requires a non-legacy key ID.'
              exit 1
            fi
          elif [[ -n "${SKINCOS_GLOBAL_COORDINATION_KEY_ID:-}" && "$SKINCOS_GLOBAL_COORDINATION_KEY_ID" != 'legacy-v1' ]]; then
            echo '::error::Pinned global coordination custody requires the active coordination key.'
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: Validate Schedule public-read core opt-in source contract
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && inputs.enable_schedule_public_read }}
        run: node --test workforce/schedule/public-read-contract.test.js workforce/schedule/public-read-core.test.js workforce/schedule/public-read-core-opt-in-evidence.test.js

      - name: Acquire Escala API deployment lease
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json

      - name: Check Escala API deployment lease before secret mutation
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Sync Escala worker secret (production)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' && !inputs.enable_schedule_public_read }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
        run: |
          set -euo pipefail
          printf "%s" "$ESCALA_ACTOR_HMAC_KEY" | npx --yes wrangler@4 secret put ESCALA_ACTOR_HMAC_KEY --config workforce/schedule/wrangler.toml >/dev/null
          echo "Synced ESCALA_ACTOR_HMAC_KEY for production."

      - name: Check Escala API deployment lease before production migration
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Apply Escala D1 migrations (production)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLE_SCHEDULE_PUBLIC_READ: ${{ inputs.enable_schedule_public_read && 'true' || 'false' }}
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          SCHEDULE_PUBLIC_READ_PRODUCTION_MANIFEST: ${{ vars.SCHEDULE_PUBLIC_READ_PRODUCTION_MANIFEST }}
          PRODUCTION_MANIFEST_SHA256: ${{ inputs.production_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$ENABLE_SCHEDULE_PUBLIC_READ" == 'true' ]]; then
            node workforce/schedule/scripts/public-read-production-manifest.mjs verify
          fi
          npx --yes wrangler@4 d1 migrations apply skincos-escala --remote --config workforce/schedule/wrangler.toml

      - name: Check Escala API deployment lease before production deployment
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Deploy Escala worker (production)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' && !inputs.enable_schedule_public_read }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config workforce/schedule/wrangler.toml --keep-vars --var "SCHEDULE_PUBLIC_READ_ENABLED:false"

      - name: Sync Escala worker secret (staging)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && !inputs.enable_schedule_public_read }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
        run: |
          set -euo pipefail
          printf "%s" "$ESCALA_ACTOR_HMAC_KEY" | npx --yes wrangler@4 secret put ESCALA_ACTOR_HMAC_KEY --config workforce/schedule/wrangler.toml --env staging >/dev/null
          echo "Synced ESCALA_ACTOR_HMAC_KEY for staging."

      - name: Check Escala API deployment lease before staging migration
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Apply Escala D1 migrations (staging)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply skincos-escala-staging --remote --config workforce/schedule/wrangler.toml --env staging

      - name: Check Escala API deployment lease before unpublished Schedule public-read core candidate
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && inputs.enable_schedule_public_read }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Create unpublished Schedule public-read core candidate with both capabilities
        id: schedule-public-read-core-candidate-version
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && inputs.enable_schedule_public_read }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY: ${{ secrets.SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY }}
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate_tag="escala-api-staging-schedule-public-read-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE' | npx --yes wrangler@4 versions upload --config workforce/schedule/wrangler.toml --env staging --keep-vars --var "SCHEDULE_PUBLIC_READ_ENABLED:true" --secrets-file /dev/stdin --tag "$candidate_tag" --message "escala-api:staging-schedule-public-read:${RELEASE_SHA}:${GITHUB_RUN_ID}" >/dev/null
          const actor = String(process.env.ESCALA_ACTOR_HMAC_KEY || '').trim()
          const core = String(process.env.SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY || '').trim()
          if (!actor || !core) throw new Error('core capability custody changed after preflight')
          process.stdout.write(JSON.stringify({
            ESCALA_ACTOR_HMAC_KEY: actor,
            SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY: core,
          }))
          NODE
          echo 'Created one unpublished core candidate version; capability values were streamed only through stdin.'

      - name: Check Escala API deployment lease before staging deployment
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Deploy Escala worker (staging, default public-read disabled)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && !inputs.enable_schedule_public_read }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config workforce/schedule/wrangler.toml --env staging --keep-vars --var "SCHEDULE_PUBLIC_READ_ENABLED:false"

      - name: Deploy explicit Schedule public-read core candidate (staging)
        id: schedule-public-read-core-candidate-deploy
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && inputs.enable_schedule_public_read }}
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          CANDIDATE_TAG: ${{ steps.schedule-public-read-core-candidate-version.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CANDIDATE_TAG" ]] || { echo 'unpublished core candidate tag is missing'; exit 1; }
          echo 'mutated=true' >> "$GITHUB_OUTPUT"
          npx --yes wrangler@4 versions deploy --config workforce/schedule/wrangler.toml --env staging --version-tag "${CANDIDATE_TAG}@100%" --yes --message "escala-api:staging-schedule-public-read:${RELEASE_SHA}:${GITHUB_RUN_ID}"

      - name: Smoke check Escala API (production)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' && !inputs.enable_schedule_public_read }}
        env:
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          ESCALA_SMOKE_BASE_URL: https://escala-api.skincos.com.br
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/smoke.mjs

      - name: Prove default production Schedule public-read stays disabled
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' && !inputs.enable_schedule_public_read }}
        env:
          SCHEDULE_PUBLIC_READ_CORE_TARGET: production
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_BASE_URL: https://escala-api.skincos.com.br
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_MODE: disabled
        run: node workforce/schedule/scripts/public-read-core-staging-smoke.mjs

      - name: Smoke check Escala API (staging)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        env:
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          ESCALA_SMOKE_BASE_URL: https://escala-api-staging.skincos.com.br
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/smoke.mjs

      - name: Run authenticated Schedule public-read core smoke (staging)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && inputs.enable_schedule_public_read }}
        env:
          SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY: ${{ secrets.SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY }}
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_BASE_URL: https://escala-api-staging.skincos.com.br
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_MODE: ready
        run: node workforce/schedule/scripts/public-read-core-staging-smoke.mjs

      - name: Write Schedule public-read core opt-in evidence
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && inputs.enable_schedule_public_read }}
        env:
          PROMOTION_SOURCE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: node workforce/schedule/scripts/public-read-core-opt-in-evidence.mjs write "$RUNNER_TEMP/schedule-public-read-core-opt-in/schedule-public-read-core-opt-in-evidence.json"

      - name: Upload Schedule public-read core opt-in evidence
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' && inputs.enable_schedule_public_read }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schedule-public-read-core-opt-in-evidence
          path: ${{ runner.temp }}/schedule-public-read-core-opt-in/schedule-public-read-core-opt-in-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Write staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        env:
          PROMOTION_UNIT: escala-api
          PROMOTION_TARGET: staging
          PROMOTION_SOURCE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: PROMOTION_SOURCE_TREE="$(git rev-parse "${PROMOTION_SOURCE_SHA}^{tree}")" node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/promotion-evidence/promotion-evidence.json"
      - name: Upload staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-escala-api
          path: ${{ runner.temp }}/promotion-evidence/promotion-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Check Escala API deployment lease before automatic disabled Schedule public-read core fallback version
        id: schedule-public-read-core-automatic-disabled-version-lease
        if: ${{ failure() && steps.schedule-public-read-core-candidate-deploy.outputs.mutated == 'true' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Create automatic disabled Schedule public-read core fallback version
        id: schedule-public-read-core-automatic-disabled-version
        if: ${{ failure() && steps.schedule-public-read-core-candidate-deploy.outputs.mutated == 'true' && steps.schedule-public-read-core-automatic-disabled-version-lease.outcome == 'success' }}
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          disabled_tag="escala-api-staging-schedule-public-read-disabled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$disabled_tag" >> "$GITHUB_OUTPUT"
          npx --yes wrangler@4 versions upload --config workforce/schedule/wrangler.toml --env staging --keep-vars --var "SCHEDULE_PUBLIC_READ_ENABLED:false" --tag "$disabled_tag" --message "escala-api:staging-schedule-public-read-disabled:${RELEASE_SHA}:${GITHUB_RUN_ID}" >/dev/null

      - name: Check Escala API deployment lease before automatic disabled Schedule public-read core fallback deployment
        id: schedule-public-read-core-automatic-disabled-deployment-lease
        if: ${{ failure() && steps.schedule-public-read-core-candidate-deploy.outputs.mutated == 'true' && steps.schedule-public-read-core-automatic-disabled-version.outcome == 'success' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}

      - name: Deploy automatic disabled Schedule public-read core fallback
        id: schedule-public-read-core-automatic-disabled-fallback
        if: ${{ failure() && steps.schedule-public-read-core-candidate-deploy.outputs.mutated == 'true' && steps.schedule-public-read-core-automatic-disabled-deployment-lease.outcome == 'success' }}
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          DISABLED_TAG: ${{ steps.schedule-public-read-core-automatic-disabled-version.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$DISABLED_TAG" ]] || { echo 'automatic disabled core version tag is missing'; exit 1; }
          npx --yes wrangler@4 versions deploy --config workforce/schedule/wrangler.toml --env staging --version-tag "${DISABLED_TAG}@100%" --yes --message "escala-api:staging-schedule-public-read-disabled:${RELEASE_SHA}:${GITHUB_RUN_ID}"

      - name: Prove automatic disabled Schedule public-read core fallback
        if: ${{ !cancelled() && steps.schedule-public-read-core-automatic-disabled-fallback.outcome == 'success' }}
        env:
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_BASE_URL: https://escala-api-staging.skincos.com.br
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_MODE: disabled
        run: node workforce/schedule/scripts/public-read-core-staging-smoke.mjs

      - name: Release Escala API deployment lease
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api.json

  production-public-read:
    needs: [promotion, deploy]
    # Job-level cancellation must not prevent the checked disabled fallback.
    if: ${{ always() && needs.promotion.result == 'success' && needs.deploy.result == 'success' && inputs.target == 'production' && inputs.enable_schedule_public_read && needs.deploy.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
      SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY: ${{ secrets.SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY }}
      SCHEDULE_PUBLIC_READ_PRODUCTION_MANIFEST: ${{ vars.SCHEDULE_PUBLIC_READ_PRODUCTION_MANIFEST }}
      PRODUCTION_MANIFEST_SHA256: ${{ inputs.production_manifest_sha256 }}
    steps:
      - name: Checkout immutable production core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
      - name: Revalidate manifest and distinct core custody
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/public-read-production-manifest.mjs verify
          node workforce/schedule/scripts/public-read-production-release-guard.mjs window
          node --input-type=module <<'NODE'
          const actor = String(process.env.ESCALA_ACTOR_HMAC_KEY || '').trim()
          const core = String(process.env.SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY || '').trim()
          if (actor.length < 32 || core.length < 32 || actor === core) throw new Error('production core custody invalid')
          NODE
      - name: Capture production core rollback checkpoint
        run: node workforce/schedule/scripts/public-read-production-resources.mjs checkpoint core
      - name: Acquire production core opt-in lease
        id: production-lease
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api-production-opt-in.json

      - name: Check production core lease before candidate upload
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api-production-opt-in.json

      - name: Upload production core candidate with capabilities only through stdin
        id: production-version
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/public-read-production-manifest.mjs verify
          candidate_tag="escala-api-production-public-read-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE' | npx --yes wrangler@4.120.0 versions upload --config workforce/schedule/wrangler.toml --keep-vars --var "SCHEDULE_PUBLIC_READ_ENABLED:true" --secrets-file /dev/stdin --tag "$candidate_tag" --message "escala-api:production-schedule-public-read:${RELEASE_SHA}:${GITHUB_RUN_ID}" >/dev/null
          process.stdout.write(JSON.stringify({
            ESCALA_ACTOR_HMAC_KEY: process.env.ESCALA_ACTOR_HMAC_KEY.trim(),
            SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY: process.env.SCHEDULE_PUBLIC_READ_CORE_HMAC_KEY.trim(),
          }))
          NODE

      - name: Check production core lease before candidate deployment
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api-production-opt-in.json

      - name: Promote production core candidate
        id: production-candidate
        env:
          CANDIDATE_TAG: ${{ steps.production-version.outputs.tag }}
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/public-read-production-manifest.mjs verify
          [[ -n "$CANDIDATE_TAG" ]] || exit 1
          echo 'mutated=true' >> "$GITHUB_OUTPUT"
          npx --yes wrangler@4.120.0 versions deploy --config workforce/schedule/wrangler.toml --version-tag "${CANDIDATE_TAG}@100%" --yes --message "escala-api:production-schedule-public-read:${RELEASE_SHA}:${GITHUB_RUN_ID}"
      - name: Verify production core authenticated readiness and legacy surface
        env:
          SCHEDULE_PUBLIC_READ_CORE_TARGET: production
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_BASE_URL: https://escala-api.skincos.com.br
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_MODE: ready
          ESCALA_SMOKE_BASE_URL: https://escala-api.skincos.com.br
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/public-read-core-staging-smoke.mjs
          node workforce/schedule/scripts/smoke.mjs
      - name: Read back production core exact enabled version
        run: node workforce/schedule/scripts/public-read-production-resources.mjs readback core ready
      - name: Write exact production core opt-in evidence
        env:
          PROMOTION_SOURCE_SHA: ${{ needs.promotion.outputs.source_sha }}
          SCHEDULE_PUBLIC_READ_TARGET: production
        run: node workforce/schedule/scripts/public-read-core-opt-in-evidence.mjs write "$RUNNER_TEMP/schedule-public-read-core-opt-in/schedule-public-read-core-opt-in-evidence.json"
      - name: Upload production core opt-in evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schedule-public-read-core-opt-in-evidence
          path: ${{ runner.temp }}/schedule-public-read-core-opt-in/schedule-public-read-core-opt-in-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Check production core lease before disabled fallback upload
        id: production-fallback-upload-lease
        if: ${{ always() && (failure() || cancelled()) && steps.production-candidate.outputs.mutated == 'true' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api-production-opt-in.json

      - name: Upload disabled production core fallback
        id: production-fallback-version
        if: ${{ always() && (failure() || cancelled()) && steps.production-candidate.outputs.mutated == 'true' && steps.production-fallback-upload-lease.outcome == 'success' }}
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/public-read-production-manifest.mjs verify
          disabled_tag="escala-api-production-public-read-disabled-${GITHUB_RUN_ID}"
          echo "tag=$disabled_tag" >> "$GITHUB_OUTPUT"
          npx --yes wrangler@4.120.0 versions upload --config workforce/schedule/wrangler.toml --keep-vars --var "SCHEDULE_PUBLIC_READ_ENABLED:false" --tag "$disabled_tag" --message "escala-api:production-schedule-public-read-disabled:${RELEASE_SHA}:${GITHUB_RUN_ID}" >/dev/null

      - name: Check production core lease before disabled fallback deployment
        id: production-fallback-deploy-lease
        if: ${{ always() && (failure() || cancelled()) && steps.production-fallback-version.outcome == 'success' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:crm-cloudflare-writer
          module: escala-api
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api-production-opt-in.json

      - name: Promote disabled production core fallback
        id: production-fallback
        if: ${{ always() && (failure() || cancelled()) && steps.production-fallback-deploy-lease.outcome == 'success' }}
        env:
          DISABLED_TAG: ${{ steps.production-fallback-version.outputs.tag }}
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/public-read-production-manifest.mjs verify
          [[ -n "$DISABLED_TAG" ]] || exit 1
          npx --yes wrangler@4.120.0 versions deploy --config workforce/schedule/wrangler.toml --version-tag "${DISABLED_TAG}@100%" --yes --message "escala-api:production-schedule-public-read-disabled:${RELEASE_SHA}:${GITHUB_RUN_ID}"
      - name: Prove production core disabled fallback after prior failure
        if: ${{ always() && steps.production-fallback.outcome == 'success' }}
        env:
          SCHEDULE_PUBLIC_READ_CORE_TARGET: production
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_BASE_URL: https://escala-api.skincos.com.br
          SCHEDULE_PUBLIC_READ_CORE_SMOKE_MODE: disabled
        run: node workforce/schedule/scripts/public-read-core-staging-smoke.mjs
      - name: Read back production core disabled fallback identity
        if: ${{ always() && steps.production-fallback.outcome == 'success' }}
        run: node workforce/schedule/scripts/public-read-production-resources.mjs readback core disabled
      - name: Retain sanitized production core checkpoint and readback
        if: ${{ always() && steps.production-lease.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schedule-public-read-production-core-resource-evidence
          path: ${{ runner.temp }}/schedule-production-core-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Release production core opt-in lease
        if: ${{ always() && steps.production-lease.outcome == 'success' }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: 'true'
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-escala-api-production-opt-in.json
