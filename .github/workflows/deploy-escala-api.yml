name: Deploy Escala API Worker

on:
  push:
    branches: [main, staging]
    paths:
      - "workforce/schedule/**"
      - ".github/workflows/deploy-escala-api.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Isolated target environment"
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-escala-api-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read

    steps:
      - name: Resolve isolated deployment target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target="$INPUT_TARGET"
          elif [[ "$BRANCH_NAME" == "main" ]]; then
            target="production"
          elif [[ "$BRANCH_NAME" == "staging" ]]; then
            target="staging"
          else
            echo "::error::Unsupported deployment source: $BRANCH_NAME"
            exit 1
          fi
          echo "name=$target" >> "$GITHUB_OUTPUT"
          if [[ "$target" == "staging" ]]; then
            echo "wrangler_env=--env staging" >> "$GITHUB_OUTPUT"
            echo "base_url=https://escala-api-staging.skincos.com.br" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler_env=" >> "$GITHUB_OUTPUT"
            echo "base_url=https://escala-api.skincos.com.br" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard Escala deploy settings
        env:
          TARGET: ${{ steps.target.outputs.name }}
          ENABLE_PRODUCTION: ${{ vars.ENABLE_ESCALA_API_DEPLOY }}
          ENABLE_STAGING: ${{ vars.ENABLE_ESCALA_API_DEPLOY_STAGING }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "production" ]]; then
            enabled="$ENABLE_PRODUCTION"
          else
            enabled="$ENABLE_STAGING"
          fi
          if [[ "${enabled:-}" != "true" ]]; then
            echo "::error::The explicit Escala deployment flag is not enabled for $TARGET."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deploy credentials are missing."
            exit 1
          fi
          if [[ -z "${ESCALA_ACTOR_HMAC_KEY:-}" ]]; then
            echo "::error::Missing GitHub secret ESCALA_ACTOR_HMAC_KEY."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Sync Escala worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          WRANGLER_ENV: ${{ steps.target.outputs.wrangler_env }}
        run: |
          set -euo pipefail
          printf "%s" "$ESCALA_ACTOR_HMAC_KEY" | npx --yes wrangler@4 secret put ESCALA_ACTOR_HMAC_KEY --config workforce/schedule/wrangler.toml $WRANGLER_ENV >/dev/null

      - name: Apply additive Escala D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ steps.target.outputs.wrangler_env }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply skincos-escala --remote --config workforce/schedule/wrangler.toml $WRANGLER_ENV

      - name: Deploy Escala worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ steps.target.outputs.wrangler_env }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config workforce/schedule/wrangler.toml --keep-vars $WRANGLER_ENV

      - name: Smoke check Escala API
        env:
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          ESCALA_SMOKE_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          set -euo pipefail
          node workforce/schedule/scripts/smoke.mjs
