name: Deploy Finance UI artifact

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        type: choice
        default: staging
        options: [preview, staging, production]
      release_sha: { description: Immutable main commit SHA, required: false, type: string }
      preview_run_id: { description: Required for staging, required: false, type: string }
      staging_run_id: { description: Required for production, required: false, type: string }

concurrency:
  group: deploy-finance-ui-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  promotion:
    uses: ./.github/workflows/promotion-gate.yml
    with:
      unit: finance-ui
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      preview_run_id: ${{ inputs.preview_run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
  deploy:
    needs: promotion
    if: ${{ inputs.target != 'preview' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: crm/console/package-lock.json
      - name: Guard isolated Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.target == 'production' && vars.FINANCE_UI_PAGES_PROJECT_PRODUCTION || vars.FINANCE_UI_PAGES_PROJECT_STAGING }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PROJECT; do [[ -n "${!name:-}" ]] || { echo "Missing required value: $name"; exit 1; }; done
      - run: npm ci
        working-directory: crm/console
      - name: Build immutable Finance artifact
        run: |
          set -euo pipefail
          npx vite build --config vite.finance.config.ts
          cat > dist-finance/_headers <<'EOF'
          /*
            Access-Control-Allow-Origin: *
            Access-Control-Allow-Methods: GET, HEAD, OPTIONS
            Cache-Control: no-store
          EOF
        working-directory: crm/console
      - name: Acquire Finance UI deployment lease
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          resource: deploy:finance-ui:${{ inputs.target }}
          module: finance-ui
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-ui.json
      - name: Check Finance UI deployment lease before publication
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-ui.json
          resource: deploy:finance-ui:${{ inputs.target }}
          module: finance-ui
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
      - name: Publish only Finance UI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.target == 'production' && vars.FINANCE_UI_PAGES_PROJECT_PRODUCTION || vars.FINANCE_UI_PAGES_PROJECT_STAGING }}
          BRANCH: ${{ inputs.target == 'production' && 'main' || 'staging' }}
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          # crm/console/wrangler.toml belongs to the shell Pages deployment and
          # contains Worker-only secret declarations. Pages does not allow a
          # custom config path, so deploy from a temporary directory without
          # inheriting the shell config.
          FINANCE_PAGES_DIR="$RUNNER_TEMP/finance-pages"
          mkdir -p "$FINANCE_PAGES_DIR"
          cp -R dist-finance/. "$FINANCE_PAGES_DIR/"
          pushd "$FINANCE_PAGES_DIR" >/dev/null
          npx --yes wrangler@4.114.0 pages deploy . \
            --project-name "$PROJECT" \
            --branch "$BRANCH" \
            --commit-hash "$RELEASE_SHA"
          popd >/dev/null
        working-directory: crm/console
      - name: Write staging promotion evidence
        if: inputs.target == 'staging'
        env:
          PROMOTION_UNIT: finance-ui
          PROMOTION_TARGET: staging
          PROMOTION_SOURCE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: PROMOTION_SOURCE_TREE="$(git rev-parse "${PROMOTION_SOURCE_SHA}^{tree}")" node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/promotion-evidence/promotion-evidence.json"
      - if: inputs.target == 'staging'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-finance-ui
          path: ${{ runner.temp }}/promotion-evidence/promotion-evidence.json
          retention-days: 14
          if-no-files-found: error
      - name: Release Finance UI deployment lease
        if: always()
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-ui.json
