name: Deploy Cloudflare Workers (API + Insumos)

on:
  push:
    branches: [ main, staging ]
    paths:
      - "backend/apps/api/**"
      - "backend/apps/insumos/**"
      - "backend/scripts/cloudflare-workers.sh"
      - "backend/pnpm-lock.yaml"
      - "backend/pnpm-workspace.yaml"
      - ".github/workflows/deploy-insumos-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare deploy secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLE_STAGING: ${{ vars.ENABLE_INSUMOS_DEPLOY_STAGING }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" == "staging" && "${ENABLE_STAGING:-}" != "true" ]]; then
            echo "ENABLE_INSUMOS_DEPLOY_STAGING!=true; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm (corepack)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install backend workspace deps
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: pnpm -C backend install --frozen-lockfile

      - name: Deploy changed Workers
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSUMOS_D1_DB_NAME: ${{ vars.INSUMOS_D1_DB_NAME }}
          INSUMOS_D1_DB_NAME_STAGING: ${{ vars.INSUMOS_D1_DB_NAME_STAGING }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_ENV: ${{ github.ref_name == 'staging' && 'staging' || '' }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ENV:-}" == "staging" ]]; then
            bash backend/scripts/cloudflare-workers.sh deploy --before "$GITHUB_BEFORE_SHA" --after "$GITHUB_SHA" --env staging
          else
            bash backend/scripts/cloudflare-workers.sh deploy --before "$GITHUB_BEFORE_SHA" --after "$GITHUB_SHA"
          fi

      - name: Smoke check Ponto (production)
        if: ${{ steps.guard.outputs.skip != 'true' && github.ref_name == 'main' }}
        env:
          BASE_URL: https://crm.skincos.com.br
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request

          base = os.environ.get("BASE_URL", "").rstrip("/")
          if not base:
            raise SystemExit("BASE_URL not set")

          def fetch_json(path: str):
            url = f"{base}{path}"
            req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; PontoDeploySmoke/1.0)"})
            with urllib.request.urlopen(req, timeout=15) as resp:
              data = resp.read().decode("utf-8", "ignore")
              return json.loads(data)

          def check():
            proxy = fetch_json("/api/ponto/_proxy-status")
            if not proxy.get("ok"):
              raise SystemExit(f"proxy-status ok=false: {proxy}")
            if not proxy.get("effectiveTargetConfigured"):
              raise SystemExit(f"proxy-status effectiveTargetConfigured=false: {proxy}")
            if not proxy.get("adminTokenConfigured"):
              raise SystemExit(f"proxy-status adminTokenConfigured=false: {proxy}")
            health = fetch_json("/api/ponto/health")
            if not health.get("ok"):
              raise SystemExit(f"health ok=false: {health}")
            return True

          for i in range(1, 6):
            try:
              check()
              print("Ponto deploy smoke OK")
              sys.exit(0)
            except Exception as exc:
              print(f"Attempt {i} failed: {exc}")
              if i >= 5:
                raise
              time.sleep(6)
          PY
