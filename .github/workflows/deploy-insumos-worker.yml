name: Deploy Insumos Worker

on:
  push:
    branches: [ main ]
    paths:
      - "backend/apps/insumos/**"
      - "backend/pnpm-lock.yaml"
      - ".github/workflows/deploy-insumos-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare deploy secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm (corepack)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install backend workspace deps
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: pnpm -C backend install --frozen-lockfile

      - name: Apply D1 migrations (best effort)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSUMOS_D1_DB_NAME: ${{ vars.INSUMOS_D1_DB_NAME }}
        run: |
          set -euo pipefail
          DB_NAME="${INSUMOS_D1_DB_NAME:-skincos-db}"
          pnpm -C backend exec wrangler d1 migrations apply "$DB_NAME" --config apps/insumos/wrangler.toml || true

      - name: Deploy Worker
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm -C backend -F @skincos/insumos-worker run deploy
