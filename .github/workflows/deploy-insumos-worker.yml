name: Deploy Insumos Worker

on:
  push:
    branches: [ main ]
    paths:
      - "backend/apps/insumos/**"
      - "backend/pnpm-lock.yaml"
      - ".github/workflows/deploy-insumos-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    # Skip cleanly if secrets are not configured (keeps CI green in forks/new repos).
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install backend workspace deps
        run: pnpm -C backend install --frozen-lockfile

      - name: Apply D1 migrations (best effort)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSUMOS_D1_DB_NAME: ${{ vars.INSUMOS_D1_DB_NAME }}
        run: |
          set -euo pipefail
          DB_NAME="${INSUMOS_D1_DB_NAME:-skincos-db}"
          pnpm -C backend exec wrangler d1 migrations apply "$DB_NAME" --config apps/insumos/wrangler.toml || true

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm -C backend -F @skincos/insumos-worker run deploy
