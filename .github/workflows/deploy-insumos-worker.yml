name: Deploy Cloudflare Workers (API + Insumos)

on:
  push:
    branches: [ main, staging ]
    paths:
      - "api/**"
      - "inventory/**"
      - "finance/**"
      - "shared/finance-contracts/**"
      - "shared/crm-auth/**"
      - "backend/pnpm-lock.yaml"
      - "backend/pnpm-workspace.yaml"
  workflow_dispatch: {}

concurrency:
  group: deploy-core-workers-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare deploy secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLE_STAGING: ${{ vars.ENABLE_INSUMOS_DEPLOY_STAGING }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" == "staging" && "${ENABLE_STAGING:-}" != "true" ]]; then
            echo "::error::ENABLE_INSUMOS_DEPLOY_STAGING must be true for a staging deploy."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deploy credentials are missing."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Setup pnpm (corepack)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Hold Finance changes from production until an explicit release
        id: finance_production_gate
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          ALLOW_FINANCE_PRODUCTION: ${{ vars.ENABLE_FINANCE_PRODUCTION_DEPLOY }}
          BRANCH_NAME: ${{ github.ref_name }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_NAME" != "main" || "${ALLOW_FINANCE_PRODUCTION:-}" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$GITHUB_BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null || true)"
          if grep -Eq '^(finance/|shared/finance-contracts/|shared/crm-auth/|api/src/(gateway|router)\.js$)' <<< "$changed"; then
            echo "::error::Finance production release requires ENABLE_FINANCE_PRODUCTION_DEPLOY=true."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install Worker dependencies
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        run: |
          npm --prefix api ci
          pnpm -C inventory install --frozen-lockfile

      # Staging owns its session secret and must never receive or overwrite
      # production recovery credentials through this workflow.  Staging does
      # not exercise password delivery; controlled test identities use the
      # normal auth lifecycle with the pre-provisioned staging SESSION_SECRET.
      - name: Sync password-recovery secrets (production only)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && github.ref_name == 'main' }}
        working-directory: inventory
        env:
          AUTH_RESET_SMTP_HOST: ${{ secrets.AUTH_RESET_SMTP_HOST }}
          AUTH_RESET_SMTP_PORT: ${{ secrets.AUTH_RESET_SMTP_PORT }}
          AUTH_RESET_SMTP_USERNAME: ${{ secrets.AUTH_RESET_SMTP_USERNAME }}
          AUTH_RESET_SMTP_PASSWORD: ${{ secrets.AUTH_RESET_SMTP_PASSWORD }}
          AUTH_RESET_EMAIL_FROM: ${{ secrets.AUTH_RESET_EMAIL_FROM }}
          AUTH_RESET_CODE_PEPPER: ${{ secrets.AUTH_RESET_CODE_PEPPER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" && "$value" != "__KEEP_EXISTING__" ]]; then
              printf '%s' "$value" | ./node_modules/.bin/wrangler secret put "$name" --config wrangler.toml
            fi
          }
          put_secret AUTH_RESET_SMTP_HOST "$AUTH_RESET_SMTP_HOST"
          put_secret AUTH_RESET_SMTP_PORT "$AUTH_RESET_SMTP_PORT"
          put_secret AUTH_RESET_SMTP_USERNAME "$AUTH_RESET_SMTP_USERNAME"
          put_secret AUTH_RESET_SMTP_PASSWORD "$AUTH_RESET_SMTP_PASSWORD"
          put_secret AUTH_RESET_EMAIL_FROM "$AUTH_RESET_EMAIL_FROM"
          put_secret AUTH_RESET_CODE_PEPPER "$AUTH_RESET_CODE_PEPPER"

      - name: Apply audited Finance migrations (staging only)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && github.ref_name == 'staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The command fails on an unknown historical baseline or checksum
          # drift. It writes only the isolated staging D1 and runs before the
          # gateway can serve a schema-dependent Finance route.
          bash finance/scripts/apply-d1-migrations.sh --remote --env staging --adopt-existing-schema

      - name: Deploy changed Workers
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSUMOS_D1_DB_NAME: ${{ vars.INSUMOS_D1_DB_NAME }}
          INSUMOS_D1_DB_NAME_STAGING: ${{ vars.INSUMOS_D1_DB_NAME_STAGING }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_ENV: ${{ github.ref_name == 'staging' && 'staging' || '' }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ENV:-}" == "staging" ]]; then
            bash backend/scripts/cloudflare-workers.sh deploy --before "$GITHUB_BEFORE_SHA" --after "$GITHUB_SHA" --env staging
          else
            bash backend/scripts/cloudflare-workers.sh deploy --before "$GITHUB_BEFORE_SHA" --after "$GITHUB_SHA"
          fi

      - name: Smoke check API + Inventory Workers (production)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.finance_production_gate.outputs.skip != 'true' && github.ref_name == 'main' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/workers_smoke.py \
            --attempts 5 \
            --sleep-seconds 6 \
            --user-agent "Mozilla/5.0 (compatible; WorkersDeploySmoke/1.0)"
