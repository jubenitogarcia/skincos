name: Deploy Meta Ads Report Worker

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Explicitly confirm that this module is released for production"
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-meta-ads-report-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare deploy secrets
        env:
          ENABLE_DEPLOY: ${{ vars.ENABLE_META_ADS_REPORT_WORKER_DEPLOY }}
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_AUTHORIZED:-false}" != "true" || "${ENABLE_DEPLOY:-}" != "true" ]]; then
            echo "::error::Meta Ads Report Worker is not authorized for production publication."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deploy credentials are missing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Deploy Worker (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@3 deploy --config ads/meta/apps/report-ingest-worker/wrangler.toml --keep-vars
