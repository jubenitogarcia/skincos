          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-schedule-public-read-adapter-production.json

      - name: Remove only this run probe and prove remote absence
        if: ${{ always() && steps.probe-cleanup-lease.outcome == 'success' }}
        run: node workforce/schedule/scripts/public-read-production-resources.mjs cleanup
      - name: Retain sanitized production checkpoint readback and cleanup evidence
        if: ${{ always() && steps.production-lease.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schedule-public-read-production-resource-evidence
          path: ${{ runner.temp }}/schedule-production-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Release private production adapter and probe lease
        if: ${{ always() && steps.production-lease.outcome == 'success' }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: 'true'
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-schedule-public-read-adapter-production.json
