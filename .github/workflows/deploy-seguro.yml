name: Deploy Seguro & Rollback

description: >
  Deploy automatizado com rollback seguro e preview para PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-preview:
    name: Deploy Preview (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview (Vercel/Netlify/Heroku)
        run: |
          echo "Simulação de deploy preview para PR #${{ github.event.pull_request.number }}"
          # Adapte aqui para seu provider real (ex: vercel --token $VERCEL_TOKEN)

  deploy-main:
    name: Deploy Produção com Rollback
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy produção
        run: |
          echo "Deploy de produção iniciado para commit $GITHUB_SHA"
          # Adapte aqui para seu provider real (ex: vercel --prod --token $VERCEL_TOKEN)
      - name: Verificar saúde do deploy
        run: |
          echo "Simulação de healthcheck pós-deploy"
          # Adapte para healthcheck real (ex: curl -f https://sua-api/health)
      - name: Rollback automático em caso de falha
        if: failure()
        run: |
          echo "Rollback automático acionado!"
          # Adapte para rollback real (ex: vercel --prod --token $VERCEL_TOKEN --rollback)
