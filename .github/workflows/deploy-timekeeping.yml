          PONTO_EXPECTED_SHA="$RELEASE_SHA" \
          PONTO_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
            node .github/scripts/ponto-release-evidence.mjs verify "$predecessor_dir/ponto-release-evidence.json"
          workforce/timekeeping/node_modules/.bin/wrangler deployments status \
            --json \
            --config workforce/timekeeping/wrangler.toml \
            > "$RUNNER_TEMP/timekeeping-live-deployment.json"
          node - \
            "$predecessor_dir/ponto-release-evidence.json" \
            "$RUNNER_TEMP/timekeeping-live-deployment.json" \
            "$TARGET" \
            "$PREDECESSOR_STAGE" \
            "$ROLLBACK_FROM_STAGE" \
            "$TIMEKEEPING_CANDIDATE_VERSION_ID" \
            "$TIMEKEEPING_INCUMBENT_VERSION_ID" \
            "$GITHUB_ENV" \
            "$RUNNER_TEMP/timekeeping-root-custody/root-custody.json" <<'NODE'
          const fs = require("fs");
          const [
            evidenceFile,
            liveFile,
            target,
            predecessorStage,
            rollbackFromStage,
            governedCandidateId,
            governedIncumbentId,
            githubEnv,
            custodyFile,
          ] = process.argv.slice(2);
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const evidence = JSON.parse(fs.readFileSync(evidenceFile, "utf8"));
          const live = JSON.parse(fs.readFileSync(liveFile, "utf8"));
          const surface = evidence?.surfaces?.timekeeping;
          const expectedPredecessor = target === "canary"
            ? "pilot"
            : target === "production"
              ? "canary"
              : rollbackFromStage;
          if (predecessorStage !== expectedPredecessor || surface?.stage !== predecessorStage) {
            throw new Error("Timekeeping predecessor stage does not govern the requested live mutation");
          }
          const candidateId = String(surface?.candidateVersionId || "").toLowerCase();
          const incumbentId = String(surface?.incumbentVersionId || "").toLowerCase();
          if (
            !uuid.test(candidateId)
            || !uuid.test(incumbentId)
            || candidateId === incumbentId
            || candidateId !== governedCandidateId.toLowerCase()
            || incumbentId !== governedIncumbentId.toLowerCase()
          ) throw new Error("Timekeeping predecessor version ownership differs from the progressive gate");
          const candidatePercent = Number(surface?.candidatePercent);
          const incumbentPercent = Number(surface?.incumbentPercent);
          if (
            !Number.isInteger(candidatePercent)
            || !Number.isInteger(incumbentPercent)
            || candidatePercent < 0
            || incumbentPercent < 0
            || candidatePercent + incumbentPercent !== 100
          ) throw new Error("Timekeeping predecessor weights are invalid");
          const deploymentId = String(live?.id || live?.deployment_id || live?.latest?.id || "").toLowerCase();
          const evidenceDeploymentId = String(surface?.deploymentId || "").toLowerCase();
          if (!uuid.test(deploymentId) || deploymentId !== evidenceDeploymentId) {
            throw new Error("current active Timekeeping deployment differs from governed predecessor evidence");
          }
          const versions = live?.versions || live?.latest?.versions || [];
          const expectedActive = new Map([
            [candidateId, candidatePercent],
            [incumbentId, incumbentPercent],
          ].filter(([, percentage]) => predecessorStage !== "production" || percentage > 0));
          if (!Array.isArray(versions) || versions.length !== expectedActive.size) {
            throw new Error("current active Timekeeping deployment does not contain the exact governed version set");
          }
          const actual = new Map();
          for (const version of versions) {
            const id = String(version?.version_id || version?.id || "").toLowerCase();
            const percentage = Number(version?.percentage);
            if (!uuid.test(id) || !Number.isInteger(percentage) || percentage < 0 || percentage > 100 || actual.has(id)) {
              throw new Error("current active Timekeeping version weights are malformed");
            }
            actual.set(id, percentage);
          }
          if (
            actual.size !== expectedActive.size
            || [...expectedActive].some(([id, percentage]) => actual.get(id) !== percentage)
            || [...actual.values()].reduce((sum, value) => sum + value, 0) !== 100
          ) throw new Error("current active Timekeeping weights drifted from governed predecessor evidence");
          fs.appendFileSync(
            githubEnv,
            `TIMEKEEPING_PREDECESSOR_DEPLOYMENT_ID=${evidenceDeploymentId}\n`
              + `TIMEKEEPING_PREDECESSOR_CANDIDATE_PERCENT=${candidatePercent}\n`
              + `TIMEKEEPING_PREDECESSOR_INCUMBENT_PERCENT=${incumbentPercent}\n`,
          );
          if (!surface?.rootCustody) throw new Error("Timekeeping predecessor lacks root custody evidence");
          fs.mkdirSync(require("path").dirname(custodyFile), { recursive: true });
          fs.writeFileSync(custodyFile, `${JSON.stringify(surface.rootCustody, null, 2)}\n`, { mode: 0o600 });
          NODE
          touch "$RUNNER_TEMP/timekeeping-live-predecessor-attested"
          rm -f "$predecessor_dir/ponto-release-evidence.json"
          rmdir "$predecessor_dir"
          rm -f "$RUNNER_TEMP/timekeeping-live-deployment.json"
      - name: Deploy exact Timekeeping weights or execute rollback
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" =~ ^(canary|production|rollback)$ && ! -f "$RUNNER_TEMP/timekeeping-live-predecessor-attested" ]]; then
            echo 'Live Timekeeping predecessor ownership was not attested; refusing mutation'
            exit 1
          fi
          if [[ "$TARGET" == staging ]]; then
            env_args=(--env staging); candidate=100; incumbent=0
          elif [[ "$TARGET" == pilot || "$TARGET" == canary ]]; then
            env_args=(); candidate=0; incumbent=100
          elif [[ "$TARGET" == production ]]; then
            env_args=(); candidate=100; incumbent=0
          else
            env_args=(); candidate=0; incumbent=100
          fi
          touch "$RUNNER_TEMP/timekeeping-mutation-started"
          if [[ "$TARGET" == rollback ]]; then
            workforce/timekeeping/node_modules/.bin/wrangler rollback "$TIMEKEEPING_INCUMBENT_VERSION_ID" --yes --message "ponto:rollback:$RELEASE_SHA" --config workforce/timekeeping/wrangler.toml
          elif [[ "$incumbent" == 0 ]]; then
            WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/timekeeping-version-deploy.ndjson" workforce/timekeeping/node_modules/.bin/wrangler versions deploy "$TIMEKEEPING_CANDIDATE_VERSION_ID@100%" --yes --message "ponto:$TARGET:$RELEASE_SHA" --config workforce/timekeeping/wrangler.toml "${env_args[@]}"
          else
            WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/timekeeping-version-deploy.ndjson" workforce/timekeeping/node_modules/.bin/wrangler versions deploy "$TIMEKEEPING_INCUMBENT_VERSION_ID@100%" "$TIMEKEEPING_CANDIDATE_VERSION_ID@0%" --yes --message "ponto:$TARGET:$RELEASE_SHA" --config workforce/timekeeping/wrangler.toml "${env_args[@]}"
          fi
          if [[ "$TARGET" == rollback ]]; then
            workforce/timekeeping/node_modules/.bin/wrangler deployments status --json --config workforce/timekeeping/wrangler.toml "${env_args[@]}" > "$RUNNER_TEMP/timekeeping-deployment.json"
            deployment_id="$(node - "$RUNNER_TEMP/timekeeping-deployment.json" <<'NODE'
          const fs = require("fs"); const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); process.stdout.write(String(value.id || value.deployment_id || value.latest?.id || ""));
          NODE
            )"
          else
            if [[ "$TARGET" == staging ]]; then worker_name=skincos-timekeeping-staging; runtime_environment=staging; else worker_name=skincos-timekeeping; runtime_environment=production; fi
            PONTO_EXPECTED_WRANGLER_ENV="$runtime_environment" node .github/scripts/ponto-wrangler-output.mjs "$RUNNER_TEMP/timekeeping-version-deploy.ndjson" version-deploy "$worker_name" > "$RUNNER_TEMP/timekeeping-deploy-verified.txt"
            deployment_id="$(node - "$RUNNER_TEMP/timekeeping-version-deploy.ndjson" <<'NODE'
          const fs = require("fs"); const rows = fs.readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).map(JSON.parse); const row = rows.filter(item => item.type === "version-deploy").at(-1); process.stdout.write(String(row?.deployment_id || row?.id || ""));
          NODE
            )"
          fi
          [[ "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Unable to attest Timekeeping deployment ID'; exit 1; }
          touch "$RUNNER_TEMP/timekeeping-mutation-completed"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "candidate_percent=$candidate" >> "$GITHUB_OUTPUT"
          echo "incumbent_percent=$incumbent" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/timekeeping-version-deploy.ndjson" "$RUNNER_TEMP/timekeeping-deployment.json"
      - name: Read-only Timekeeping health probe
        env:
          BASE_URL: ${{ inputs.target == 'staging' && 'https://api-staging.skincos.com.br' || 'https://api.skincos.com.br' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 4 "$BASE_URL/api/ponto/health" > "$RUNNER_TEMP/timekeeping-health.json"
          node -e "const p=require(process.argv[1]);if(typeof p.ok!=='boolean'||!p.version)process.exit(1)" "$RUNNER_TEMP/timekeeping-health.json"
      - name: Roll back this publisher after a failed mutation
        if: ${{ always() && (failure() || cancelled()) && env.TIMEKEEPING_INCUMBENT_VERSION_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/timekeeping-mutation-started" ]]; then
            echo 'No Timekeeping mutation started; compensation is intentionally a no-op'
            printf '%s\n' not-started > "$RUNNER_TEMP/timekeeping-compensation-disposition"
            exit 0
          fi
          if [[ "$TARGET" == staging ]]; then env_args=(--env staging); else env_args=(); fi
          workforce/timekeeping/node_modules/.bin/wrangler deployments status --json --config workforce/timekeeping/wrangler.toml "${env_args[@]}" \
            > "$RUNNER_TEMP/timekeeping-compensation-status.json"
          ownership="$(node .github/scripts/ponto-rollback-ownership.mjs \
            classify-worker-compensation \
            "$RUNNER_TEMP/timekeeping-compensation-status.json" \
            "$TARGET" \
            "$TIMEKEEPING_CANDIDATE_VERSION_ID" \
            "$TIMEKEEPING_INCUMBENT_VERSION_ID" \
            "$DEPLOYMENT_ID" \
            "$RUNNER_TEMP/timekeeping-compensation-ownership.json")"
          case "$ownership" in
            already-incumbent)
              echo 'Timekeeping is already on the exact incumbent; compensation is a no-op'
              printf '%s\n' already-incumbent > "$RUNNER_TEMP/timekeeping-compensation-disposition"
              exit 0
              ;;
            candidate-owned)
              printf '%s\n' rollback-attempted > "$RUNNER_TEMP/timekeeping-compensation-disposition"
              ;;
            ownership-conflict)
              echo 'Timekeeping compensation ownership conflict; refusing to mutate external state'
              printf '%s\n' ownership-conflict > "$RUNNER_TEMP/timekeeping-compensation-disposition"
              exit 1
              ;;
            *) echo 'Unexpected Timekeeping compensation classification'; exit 1 ;;
          esac
          workforce/timekeeping/node_modules/.bin/wrangler rollback "$TIMEKEEPING_INCUMBENT_VERSION_ID" --yes --message "ponto:auto-abort:$RELEASE_SHA" --config workforce/timekeeping/wrangler.toml "${env_args[@]}"
          workforce/timekeeping/node_modules/.bin/wrangler deployments status --json --config workforce/timekeeping/wrangler.toml "${env_args[@]}" \
            > "$RUNNER_TEMP/timekeeping-compensation-after.json"
          node - "$RUNNER_TEMP/timekeeping-compensation-after.json" "$TIMEKEEPING_INCUMBENT_VERSION_ID" <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const versions = value.versions || value.latest?.versions || [];
          const deploymentId = String(value.id || value.deployment_id || value.latest?.id || "");
          if (
            !/^[0-9a-f-]{36}$/i.test(deploymentId)
            || versions.length !== 1
            || Number(versions[0]?.percentage) !== 100
            || String(versions[0]?.version_id || versions[0]?.id || "").toLowerCase() !== process.argv[3].toLowerCase()
          ) throw new Error("Timekeeping compensation did not restore the exact incumbent");
          NODE
          printf '%s\n' rolled-back > "$RUNNER_TEMP/timekeeping-compensation-disposition"
          touch "$RUNNER_TEMP/timekeeping-rollback-completed"
      - name: Write sanitized Timekeeping mutation journal
        if: ${{ always() && contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.target) }}
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          CHECKPOINT_DIGEST: ${{ steps.checkpoint.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/timekeeping-mutation"
          node - "$RUNNER_TEMP/timekeeping-mutation/mutation.json" <<'NODE'
          const fs = require("fs");
          const exists = name => fs.existsSync(`${process.env.RUNNER_TEMP}/${name}`);
          const pilotBaselinePreconditionFile = `${process.env.RUNNER_TEMP}/timekeeping-pilot-baseline-precondition.json`;
          const compensationOwnershipFile = `${process.env.RUNNER_TEMP}/timekeeping-compensation-ownership.json`;
          const compensationDispositionFile = `${process.env.RUNNER_TEMP}/timekeeping-compensation-disposition`;
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            surface: "timekeeping",
            stage: process.env.TARGET,
            sourceSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            orchestratorRunId: process.env.ORCHESTRATOR_RUN_ID || "",
            baselineRunId: process.env.BASELINE_RUN_ID || "",
            incumbentVersionId: process.env.TIMEKEEPING_INCUMBENT_VERSION_ID || "",
            candidateVersionId: process.env.TIMEKEEPING_CANDIDATE_VERSION_ID || "",
            deploymentId: process.env.DEPLOYMENT_ID || "",
            migrationStarted: exists("timekeeping-migration-started"),
            migrationCompleted: exists("timekeeping-migration-completed"),
            migrationDisposition: exists("timekeeping-migration-started") ? "retained-additive-schema" : "not-run",
            checkpoint: process.env.CHECKPOINT_DIGEST ? {
              artifactName: `timekeeping-${process.env.TARGET}-pre-migration-${process.env.RELEASE_SHA}`,
              sha256: process.env.CHECKPOINT_DIGEST,
            } : null,
            mutationStarted: exists("timekeeping-mutation-started"),
            mutationCompleted: exists("timekeeping-mutation-completed"),
            rollbackCompleted: exists("timekeeping-rollback-completed"),
            pilotBaselinePrecondition: fs.existsSync(pilotBaselinePreconditionFile) ? JSON.parse(fs.readFileSync(pilotBaselinePreconditionFile, "utf8")) : null,
            compensationOwnership: fs.existsSync(compensationOwnershipFile) ? JSON.parse(fs.readFileSync(compensationOwnershipFile, "utf8")) : null,
            compensationDisposition: fs.existsSync(compensationDispositionFile) ? fs.readFileSync(compensationDispositionFile, "utf8").trim() : "not-required",
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Upload Timekeeping mutation journal
        if: ${{ always() && contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.target) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-mutation-timekeeping-${{ inputs.target }}-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/timekeeping-mutation/mutation.json
          retention-days: 90
          if-no-files-found: error
      - name: Write sanitized Timekeeping surface manifest
        if: ${{ success() }}
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          CANDIDATE_PERCENT: ${{ steps.deployment.outputs.candidate_percent }}
          INCUMBENT_PERCENT: ${{ steps.deployment.outputs.incumbent_percent }}
          CHECKPOINT_DIGEST: ${{ steps.checkpoint.outputs.digest }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/timekeeping-surface"
          node - "$RUNNER_TEMP/timekeeping-surface/surface.json" <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const stage = process.env.TARGET;
          const rootCustodyFile = process.env.RUNNER_TEMP + "/timekeeping-root-custody/root-custody.json";
          if (!fs.existsSync(rootCustodyFile)) throw new Error("Timekeeping root custody evidence is absent");
          const rootCustody = JSON.parse(fs.readFileSync(rootCustodyFile, "utf8"));
          const migrations = stage === "staging" || stage === "pilot"
            ? fs.readdirSync("workforce/timekeeping/migrations")
              .filter(name => /^\d+.*\.sql$/.test(name))
              .sort()
              .map(name => ({
                name,
                sha256: crypto.createHash("sha256").update(fs.readFileSync(path.join("workforce/timekeeping/migrations", name))).digest("hex"),
                status: "applied-or-preexisting",
              }))
            : [];
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            surface: "timekeeping",
            stage,
            sourceSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            baselineRunId: process.env.BASELINE_RUN_ID || "",
            candidateVersionId: process.env.TIMEKEEPING_CANDIDATE_VERSION_ID,
            incumbentVersionId: process.env.TIMEKEEPING_INCUMBENT_VERSION_ID,
            deploymentId: process.env.DEPLOYMENT_ID,
            candidatePercent: Number(process.env.CANDIDATE_PERCENT),
            incumbentPercent: Number(process.env.INCUMBENT_PERCENT),
            candidateTag: `ponto:timekeeping:${process.env.RELEASE_SHA}`,
            rootCustody,
            url: stage === "staging" ? "https://api-staging.skincos.com.br/api/ponto/health" : "https://api.skincos.com.br/api/ponto/health",
            checkpoint: process.env.CHECKPOINT_DIGEST ? {
              artifactName: `timekeeping-${stage}-pre-migration-${process.env.RELEASE_SHA}`,
              sha256: process.env.CHECKPOINT_DIGEST,
              releaseSha: process.env.RELEASE_SHA,
            } : null,
            migrations,
          }, null, 2)}\n`);
          NODE
      - name: Write staging promotion evidence
        if: inputs.target == 'staging'
        env:
          PROMOTION_UNIT: timekeeping
          PROMOTION_TARGET: staging
          PROMOTION_SOURCE_SHA: ${{ env.RELEASE_SHA }}
        run: PROMOTION_SOURCE_TREE="$(git rev-parse "${PROMOTION_SOURCE_SHA}^{tree}")" node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/timekeeping-staging-evidence/promotion-evidence.json"
      - if: inputs.target == 'staging'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-timekeeping
          path: ${{ runner.temp }}/timekeeping-staging-evidence/promotion-evidence.json
          retention-days: 90
          if-no-files-found: error
      - if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-surface-timekeeping-${{ inputs.target }}-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/timekeeping-surface/surface.json
          retention-days: 90
          if-no-files-found: error
  global-coordination-release:
    needs: [coordination, promotion, progressive, preview, release]
    if: ${{ always() && needs.coordination.outputs.global_lease_required == 'true' }}
    uses: ./.github/workflows/global-coordination-release.yml
    secrets:
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
    with:
      required: true
      proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
      coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
      key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
