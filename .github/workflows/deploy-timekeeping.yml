name: Deploy Workforce Timekeeping
run-name: Timekeeping ${{ inputs.target }} ${{ inputs.release_sha }} orchestrator=${{ inputs.orchestrator_run_id }} nonce=${{ inputs.orchestrator_nonce }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Canonical release stage
        required: true
        default: staging
        type: choice
        options: [preview, staging, pilot, canary, production, rollback]
      release_sha:
        description: Immutable main commit SHA
        required: true
        type: string
      preview_run_id:
        description: Required for staging
        required: false
        type: string
      staging_run_id:
        description: Retained for the immutable promotion contract; Ponto live stages use predecessor_run_id
        required: false
        type: string
      release_scope:
        description: Governed Ponto composite release; only preview is independently dispatchable
        required: true
        default: ponto
        type: choice
        options: [ponto]
      predecessor_run_id:
        description: Required for pilot, canary, production, and rollback
        required: false
        type: string
      baseline_run_id:
        description: Required for pilot; immutable production incumbent baseline
        required: false
        type: string
      root_custody_run_id:
        description: Required for staging and pilot; exact successful pre-mutation root-custody child run
        required: false
        type: string
      rollback_from_stage:
        description: Required for rollback
        required: false
        default: production
        type: choice
        options: [pilot, canary, production]
      orchestrator_run_id:
        description: Correlation ID of the Ponto progressive coordinator
        required: false
        type: string
      orchestrator_stage:
        description: Exact stage of the issuing Ponto coordinator
        required: false
        type: string
      orchestrator_issuer_run_id:
        description: Exact direct issuer run; equals the coordinator except for approved grandchildren
        required: false
        type: string
      orchestrator_nonce:
        description: Non-secret per-dispatch correlation nonce
        required: false
        type: string

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  coordination:
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
    uses: ./.github/workflows/ponto-orchestrator-gate.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
    with:
      required: ${{ inputs.target != 'preview' }}
      global_lease_required: ${{ inputs.target != 'preview' }}
      global_resource: global:ponto-workers-writer
      global_module: ponto
      global_coordinator_url: ${{ contains(fromJSON('["pilot","canary","production","rollback"]'), inputs.target) && vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL || vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
      lease_key: timekeeping
      stage: ${{ inputs.orchestrator_stage || inputs.target }}
      target: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
      release_sha: ${{ inputs.release_sha }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}
  promotion:
    needs: coordination
    if: ${{ inputs.target == 'preview' || inputs.target == 'staging' }}
    uses: ./.github/workflows/promotion-gate.yml
    with:
      unit: timekeeping
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      preview_run_id: ${{ inputs.preview_run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
      emit_preview_evidence: false

  progressive:
    needs: coordination
    if: ${{ contains(fromJSON('["pilot","canary","production","rollback"]'), inputs.target) }}
    uses: ./.github/workflows/ponto-release-gate.yml
    with:
      stage: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      predecessor_run_id: ${{ inputs.predecessor_run_id }}
      rollback_from_stage: ${{ inputs.rollback_from_stage }}
      baseline_run_id: ${{ inputs.baseline_run_id }}

  preview:
    needs: promotion
    if: ${{ inputs.target == 'preview' }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: workforce/timekeeping/package-lock.json
      - name: Test and dry-run the immutable Timekeeping source
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          npm --prefix workforce/timekeeping ci --ignore-scripts
          npm --prefix workforce/timekeeping test
          sed -i \
            's/__CONFIGURE_TIMEKEEPING_D1_ID__/00000000-0000-4000-8000-000000000001/;s/__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__/00000000000000000000000000000001/;s/__CONFIGURE_TIMEKEEPING_STAGING_D1_ID__/00000000-0000-4000-8000-000000000002/' \
            workforce/timekeeping/wrangler.toml
          workforce/timekeeping/node_modules/.bin/wrangler versions upload \
            --dry-run \
            --outdir "$RUNNER_TEMP/timekeeping-preview" \
            --config workforce/timekeeping/wrangler.toml \
            --env staging \
            --var "APP_VERSION:$RELEASE_SHA" \
            --var "ENVIRONMENT:staging"
      - name: Write validated preview artifacts
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          PROMOTION_UNIT=timekeeping PROMOTION_TARGET=preview PROMOTION_SOURCE_SHA="$RELEASE_SHA" \
          PROMOTION_SOURCE_TREE="$(git rev-parse "${RELEASE_SHA}^{tree}")" \
            node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/timekeeping-preview-evidence/promotion-evidence.json"
          mkdir -p "$RUNNER_TEMP/timekeeping-surface"
          node - "$RUNNER_TEMP/timekeeping-surface/surface.json" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            surface: "timekeeping",
            stage: "preview",
            sourceSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            validation: "tests-and-wrangler-versions-upload-dry-run",
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-timekeeping
          path: ${{ runner.temp }}/timekeeping-preview-evidence/promotion-evidence.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-surface-timekeeping-preview-${{ needs.promotion.outputs.source_sha }}
          path: ${{ runner.temp }}/timekeeping-surface/surface.json
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [coordination, promotion, progressive]
    if: >-
      ${{
        always() &&
        github.run_attempt == 1 &&
        inputs.target != 'preview' &&
        (
          (inputs.target == 'staging' && needs.promotion.result == 'success') ||
          (contains(fromJSON('["pilot","canary","production","rollback"]'), inputs.target) && needs.progressive.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ needs.promotion.outputs.source_sha || needs.progressive.outputs.source_sha }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Checkout trusted Ponto custody guard
        if: ${{ inputs.orchestrator_run_id != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Revalidate the exact active coordinator before Timekeeping secrets or mutation
        if: ${{ inputs.orchestrator_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage || inputs.target }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Authorize global Timekeeping surface mutation
        if: ${{ inputs.target != 'preview' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
          resource: global:ponto-workers-writer
          module: ponto
          source_sha: ${{ inputs.release_sha || github.sha }}
      - name: Guard target resources and explicit production authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID_RAW: ${{ vars.PONTO_TIMEKEEPING_D1_STAGING_ID }}
          PRODUCTION_D1_ID_RAW: ${{ vars.PONTO_TIMEKEEPING_D1_PRODUCTION_ID }}
          STAGING_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PRODUCTION_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
          ENABLE_PRODUCTION: ${{ vars.ENABLE_PONTO_TIMEKEEPING_PRODUCTION_DEPLOY }}
          TIMEKEEPING_BACKUP_PASSPHRASE: ${{ secrets.TIMEKEEPING_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging)
              D1_ID="$STAGING_D1_ID_RAW"; OPPOSITE_D1_ID="$PRODUCTION_D1_ID_RAW"
              MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"; OPPOSITE_MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"
              ;;
            pilot|canary|production|rollback)
              D1_ID="$PRODUCTION_D1_ID_RAW"; OPPOSITE_D1_ID="$STAGING_D1_ID_RAW"
              MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"; OPPOSITE_MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"
              ;;
            *) echo 'Unsupported Timekeeping release target'; exit 1 ;;
          esac
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_ID MODULE_CONTROL_KV_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing required value: $name"; exit 1; }
          done
          [[ -z "${OPPOSITE_D1_ID:-}" || "$D1_ID" != "$OPPOSITE_D1_ID" ]] || { echo 'Timekeeping D1 databases are not isolated'; exit 1; }
          [[ -z "${OPPOSITE_MODULE_CONTROL_KV_ID:-}" || "$MODULE_CONTROL_KV_ID" != "$OPPOSITE_MODULE_CONTROL_KV_ID" ]] || { echo 'Module-control namespaces are not isolated'; exit 1; }
          [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Invalid Timekeeping D1 id'; exit 1; }
          [[ "$MODULE_CONTROL_KV_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Invalid module-control KV id'; exit 1; }
          if [[ "$TARGET" != staging ]]; then
            [[ "$ENABLE_PRODUCTION" == true ]] || { echo 'ENABLE_PONTO_TIMEKEEPING_PRODUCTION_DEPLOY must be explicitly true'; exit 1; }
          fi
          if [[ "$TARGET" =~ ^(staging|pilot)$ ]]; then
            [[ -n "${TIMEKEEPING_BACKUP_PASSPHRASE:-}" ]] || { echo 'TIMEKEEPING_BACKUP_PASSPHRASE is required before migrations'; exit 1; }
          fi
          {
            echo "D1_ID=$D1_ID"
            echo "OPPOSITE_D1_ID=$OPPOSITE_D1_ID"
            echo "MODULE_CONTROL_KV_ID=$MODULE_CONTROL_KV_ID"
            echo "OPPOSITE_MODULE_CONTROL_KV_ID=$OPPOSITE_MODULE_CONTROL_KV_ID"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: workforce/timekeeping/package-lock.json
      - name: Attest exact selected D1 and module-control identities before checkpoint or mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_RESOURCE_TARGET: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
          PONTO_RESOURCE_IDENTITY_REPORT: ${{ runner.temp }}/ponto-resource-identity.json
        run: |
          set -euo pipefail
          export PONTO_TIMEKEEPING_D1_ID="$D1_ID"
          export PONTO_OPPOSITE_TIMEKEEPING_D1_ID="$OPPOSITE_D1_ID"
          export PONTO_MODULE_CONTROL_KV_ID="$MODULE_CONTROL_KV_ID"
          export PONTO_OPPOSITE_MODULE_CONTROL_KV_ID="$OPPOSITE_MODULE_CONTROL_KV_ID"
          node .github/scripts/ponto-cloudflare-resource-identity.mjs
      - name: Fetch the exact staging root custody predecessor
        if: ${{ inputs.target == 'pilot' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
        run: |
          set -euo pipefail
          [[ "$PREDECESSOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'pilot requires the exact staging predecessor'; exit 1; }
          mkdir -p "$RUNNER_TEMP/timekeeping-root-custody/staging-evidence"
          gh run download "$PREDECESSOR_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ponto-release-evidence-staging-$RELEASE_SHA" \
            --dir "$RUNNER_TEMP/timekeeping-root-custody/staging-evidence"
          PONTO_EXPECTED_STAGE=staging \
          PONTO_EXPECTED_SHA="$RELEASE_SHA" \
          PONTO_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
            node .github/scripts/ponto-release-evidence.mjs verify \
              "$RUNNER_TEMP/timekeeping-root-custody/staging-evidence/ponto-release-evidence.json"
          node - \
            "$RUNNER_TEMP/timekeeping-root-custody/staging-evidence/ponto-release-evidence.json" \
            "$RUNNER_TEMP/timekeeping-root-custody/staging.json" <<'NODE'
          const fs = require("fs");
          const evidence = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const custody = evidence?.surfaces?.timekeeping?.rootCustody;
          if (!custody) throw new Error("staging release evidence does not contain root custody");
          fs.writeFileSync(process.argv[3], `${JSON.stringify(custody, null, 2)}\n`, { mode: 0o600 });
          NODE
          rm -rf "$RUNNER_TEMP/timekeeping-root-custody/staging-evidence"
      - name: Prove environment root separation before checkpoint or migration
        if: ${{ inputs.target == 'staging' || inputs.target == 'pilot' }}
        env:
          PONTO_PROFILE_DATA_KEY: ${{ secrets.PONTO_PROFILE_DATA_KEY }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_ROOT_ATTESTATION_KEY_SHARED: ${{ secrets.PONTO_ROOT_ATTESTATION_KEY_SHARED }}
          PONTO_PROFILE_DATA_KEY_CUSTODY_REF: ${{ vars.PONTO_PROFILE_DATA_KEY_CUSTODY_REF }}
          PONTO_IDEMPOTENCY_KEY_CUSTODY_REF: ${{ vars.PONTO_IDEMPOTENCY_KEY_CUSTODY_REF }}
          PONTO_ROOT_ATTESTATION_KEY_ID: ${{ vars.PONTO_ROOT_ATTESTATION_KEY_ID }}
        run: |
          set -euo pipefail
          target=staging
          [[ "$TARGET" == pilot ]] && target=production
          mkdir -p "$RUNNER_TEMP/timekeeping-root-custody"
          staging_args=()
          if [[ "$target" == production ]]; then
            [[ -f "$RUNNER_TEMP/timekeeping-root-custody/staging.json" ]] || {
              echo 'exact staging root custody predecessor is absent'
              exit 1
            }
            staging_args=("$RUNNER_TEMP/timekeeping-root-custody/staging.json")
          fi
          node .github/scripts/ponto-root-custody.mjs write \
            "$target" \
            "$RELEASE_SHA" \
            "$RUNNER_TEMP/timekeeping-root-custody/root-custody.json" \
            "${staging_args[@]}"
          rm -f "$RUNNER_TEMP/timekeeping-root-custody/staging.json"
      - name: Test and render only the selected environment
        run: |
          set -euo pipefail
          npm --prefix workforce/timekeeping ci --ignore-scripts
          npm --prefix workforce/timekeeping test
          if [[ "$TARGET" == staging ]]; then
            sed -i \
              "s/__CONFIGURE_TIMEKEEPING_D1_ID__/00000000-0000-4000-8000-000000000001/;s/__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__/00000000000000000000000000000001/;s/__CONFIGURE_TIMEKEEPING_STAGING_D1_ID__/$D1_ID/" \
              workforce/timekeeping/wrangler.toml
          else
            sed -i \
              "s/__CONFIGURE_TIMEKEEPING_D1_ID__/$D1_ID/;s/__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__/$MODULE_CONTROL_KV_ID/;s/__CONFIGURE_TIMEKEEPING_STAGING_D1_ID__/00000000-0000-4000-8000-000000000001/" \
              workforce/timekeeping/wrangler.toml
          fi
          ! grep -q '__CONFIGURE_.*_ID__' workforce/timekeeping/wrangler.toml || { echo 'Unresolved binding placeholder'; exit 1; }
      - name: Require selected-environment custody for both candidate root secrets
        if: ${{ inputs.target == 'staging' || inputs.target == 'pilot' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required for candidate secret custody attestation'; exit 1; }
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/secrets?per_page=100" > "$RUNNER_TEMP/timekeeping-environment-secrets.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" > "$RUNNER_TEMP/timekeeping-repository-secrets.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/variables?per_page=100" > "$RUNNER_TEMP/timekeeping-environment-variables.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/variables?per_page=100" > "$RUNNER_TEMP/timekeeping-repository-variables.json"
          node - \
            "$RUNNER_TEMP/timekeeping-environment-secrets.json" \
            "$RUNNER_TEMP/timekeeping-repository-secrets.json" \
            "$RUNNER_TEMP/timekeeping-environment-variables.json" \
            "$RUNNER_TEMP/timekeeping-repository-variables.json" <<'NODE'
          const fs = require("fs");
          const names = (file, key) => {
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            const entries = Array.isArray(payload)
              ? payload.flatMap(page => Array.isArray(page?.[key]) ? page[key] : [])
              : (Array.isArray(payload?.[key]) ? payload[key] : []);
            return new Set(entries.map(item => item.name));
          };
          const environmentSecrets = names(process.argv[2], "secrets");
          const repositorySecrets = names(process.argv[3], "secrets");
          const environmentVariables = names(process.argv[4], "variables");
          const repositoryVariables = names(process.argv[5], "variables");
          for (const name of ["PONTO_PROFILE_DATA_KEY", "PONTO_IDEMPOTENCY_KEY"]) {
            if (!environmentSecrets.has(name)) {
              throw new Error(`${name} must exist in the selected GitHub environment; repository fallback is refused`);
            }
          }
          if (
            repositorySecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
            || !environmentSecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
          ) throw new Error("shared root attestation key must exist only in the selected GitHub environment");
          for (const name of ["PONTO_PROFILE_DATA_KEY_CUSTODY_REF", "PONTO_IDEMPOTENCY_KEY_CUSTODY_REF"]) {
            if (!environmentVariables.has(name)) throw new Error(`${name} must exist in the selected GitHub environment`);
          }
          if (
            !repositoryVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
            || environmentVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
          ) throw new Error("shared root attestation key ID must exist only at repository scope");
          NODE
          rm -f \
            "$RUNNER_TEMP/timekeeping-environment-secrets.json" \
            "$RUNNER_TEMP/timekeeping-repository-secrets.json" \
            "$RUNNER_TEMP/timekeeping-environment-variables.json" \
            "$RUNNER_TEMP/timekeeping-repository-variables.json"
      - name: Attest remote Worker secrets before checkpoint or migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == staging ]]; then env_args=(--env staging); else env_args=(); fi
          list="$RUNNER_TEMP/timekeeping-secret-list.json"
          workforce/timekeeping/node_modules/.bin/wrangler secret list --config workforce/timekeeping/wrangler.toml "${env_args[@]}" > "$list"
          node - "$list" <<'NODE'
          const fs = require("fs");
          const names = new Set(JSON.parse(fs.readFileSync(process.argv[2], "utf8")).map(item => item.name));
          for (const name of ["PONTO_ACTOR_HMAC_KEY", "PONTO_IDEMPOTENCY_KEY", "PONTO_TEMPLATES_KEY", "PONTO_NETWORK_CONTEXT_KEY", "ESCALA_ACTOR_HMAC_KEY", "IDENTITY_WORKFORCE_HMAC_KEY"]) {
            if (!names.has(name)) throw new Error(`remote Worker secret is absent: ${name}`);
          }
          NODE
          rm -f "$list"
      - name: Resolve incumbent version before pilot mutation
        if: ${{ inputs.target == 'staging' || inputs.target == 'pilot' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_INCUMBENT_ID: ${{ needs.progressive.outputs.baseline_timekeeping_version_id }}
          BASELINE_INCUMBENT_DEPLOYMENT_ID: ${{ needs.progressive.outputs.baseline_timekeeping_deployment_id }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == staging ]]; then env_args=(--env staging); else env_args=(); fi
          workforce/timekeeping/node_modules/.bin/wrangler deployments status --json --config workforce/timekeeping/wrangler.toml "${env_args[@]}" > "$RUNNER_TEMP/timekeeping-incumbent.json"
          if [[ "$TARGET" == pilot ]]; then
            PONTO_BASELINE_DEPLOYMENT_ID="$BASELINE_INCUMBENT_DEPLOYMENT_ID" \
            PONTO_BASELINE_VERSION_ID="$BASELINE_INCUMBENT_ID" \
              node .github/scripts/ponto-live-deployment-precondition.mjs \
                pilot-baseline \
                "$RUNNER_TEMP/timekeeping-incumbent.json" \
                timekeeping \
                "$RUNNER_TEMP/timekeeping-pilot-baseline-precondition.json"
            id="$BASELINE_INCUMBENT_ID"
          else
            id="$(node - "$RUNNER_TEMP/timekeeping-incumbent.json" <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const versions = value.versions || value.latest?.versions || [];
          const selected = [...versions].sort((a, b) => Number(b.percentage || 0) - Number(a.percentage || 0))[0];
          process.stdout.write(String(selected?.version_id || selected?.id || ""));
          NODE
            )"
          fi
          [[ "$id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Unable to resolve incumbent Timekeeping version'; exit 1; }
          echo "TIMEKEEPING_INCUMBENT_VERSION_ID=$id" >> "$GITHUB_ENV"
      - name: Select predecessor version IDs
        if: ${{ inputs.target == 'canary' || inputs.target == 'production' || inputs.target == 'rollback' }}
        env:
          CANDIDATE_ID: ${{ needs.progressive.outputs.timekeeping_candidate_version_id }}
          INCUMBENT_ID: ${{ needs.progressive.outputs.timekeeping_incumbent_version_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ID" =~ ^[0-9a-fA-F-]{36}$ && "$INCUMBENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Predecessor Timekeeping version IDs are invalid'; exit 1; }
          echo "TIMEKEEPING_CANDIDATE_VERSION_ID=$CANDIDATE_ID" >> "$GITHUB_ENV"
          echo "TIMEKEEPING_INCUMBENT_VERSION_ID=$INCUMBENT_ID" >> "$GITHUB_ENV"
      - name: Capture encrypted D1 checkpoint
        id: checkpoint
        if: ${{ inputs.target == 'staging' || inputs.target == 'pilot' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIMEKEEPING_BACKUP_PASSPHRASE: ${{ secrets.TIMEKEEPING_BACKUP_PASSPHRASE }}
        working-directory: workforce/timekeeping
        run: |
          set -euo pipefail
          if [[ "$TARGET" == staging ]]; then env_args=(--env staging); database=skincos-timekeeping-staging; else env_args=(); database=skincos-timekeeping; fi
          plain="$RUNNER_TEMP/timekeeping-${TARGET}-pre-migration-${RELEASE_SHA}.sql"
          encrypted="${plain}.gpg"
          ./node_modules/.bin/wrangler d1 export "$database" --remote --output "$plain" --config wrangler.toml "${env_args[@]}"
          printf '%s' "$TIMEKEEPING_BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$plain"
