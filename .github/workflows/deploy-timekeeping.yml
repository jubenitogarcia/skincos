          node - "$secrets_file" <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const derive = (domain) => crypto.createHmac("sha256", process.env.PONTO_IDEMPOTENCY_KEY)
            .update(domain)
            .digest("base64url");
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            PONTO_PROFILE_DATA_KEY: process.env.PONTO_PROFILE_DATA_KEY,
            PONTO_IDEMPOTENCY_KEY: process.env.PONTO_IDEMPOTENCY_KEY,
            PONTO_ACTOR_HMAC_KEY: derive("skincos/ponto/actor/v1"),
            PONTO_NETWORK_CONTEXT_KEY: derive("skincos/ponto/network-context/v1"),
          })}\n`, { mode: 0o600 });
