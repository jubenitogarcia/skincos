          [[ "${#custody_files[@]}" == 1 ]] || { echo 'Root custody child artifact must contain exactly one root-custody.json'; exit 1; }
          node .github/scripts/ponto-root-custody.mjs verify \
            "$target" \
            "$RELEASE_SHA" \
            "${custody_files[0]}"
          install -m 600 \
            "${custody_files[0]}" \
            "$RUNNER_TEMP/timekeeping-root-custody/preflight-root-custody.json"
          rm -rf "$preflight_dir"
          rm -f \
            "$RUNNER_TEMP/timekeeping-root-custody-run.json" \
            "$RUNNER_TEMP/timekeeping-root-custody-workflow.json" \
            "$artifact_list" \
            "$artifact_metadata"
      - name: Compare live root custody immediately before mutation
        if: ${{ inputs.target == 'staging' || inputs.target == 'pilot' }}
        env:
          ROOT_CUSTODY_RUN_ID: ${{ inputs.root_custody_run_id }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          PONTO_PROFILE_DATA_KEY: ${{ secrets.PONTO_PROFILE_DATA_KEY }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_ROOT_ATTESTATION_KEY_SHARED: ${{ secrets.PONTO_ROOT_ATTESTATION_KEY_SHARED }}
          PONTO_PROFILE_DATA_KEY_CUSTODY_REF: ${{ vars.PONTO_PROFILE_DATA_KEY_CUSTODY_REF }}
          PONTO_IDEMPOTENCY_KEY_CUSTODY_REF: ${{ vars.PONTO_IDEMPOTENCY_KEY_CUSTODY_REF }}
          PONTO_ROOT_ATTESTATION_KEY_ID: ${{ vars.PONTO_ROOT_ATTESTATION_KEY_ID }}
