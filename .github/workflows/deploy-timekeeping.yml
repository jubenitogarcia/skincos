          NODE
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$artifact_metadata"
          node - \
            "$artifact_list" \
            "$artifact_metadata" \
            "$artifact_provenance" \
            "$artifact_name" \
            "$artifact_id" \
            "$RUNNER_TEMP/timekeeping-root-custody-run.json" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const artifact = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const run = JSON.parse(fs.readFileSync(process.argv[7], "utf8"));
          const outputFile = process.argv[4];
          const artifactName = process.argv[5];
          const artifactId = process.argv[6];
          const listed = (payload.artifacts || []).filter(item => item?.name === artifactName);
          const digest = String(artifact.digest || "");
          const expiresAt = Date.parse(String(artifact.expires_at || ""));
          if (
            listed.length !== 1
            || String(listed[0].id || "") !== artifactId
            || String(artifact.id || "") !== artifactId
            || artifact.name !== artifactName
            || artifact.expired !== false
            || !Number.isFinite(expiresAt)
            || expiresAt <= Date.now()
            || !/^sha256:[0-9a-f]{64}$/.test(digest)
            || artifact.workflow_run?.id !== Number(process.env.ROOT_CUSTODY_RUN_ID)
            || artifact.workflow_run?.head_sha !== run.head_sha
            || String(listed[0].digest || "") !== digest
            || listed[0].workflow_run?.id !== artifact.workflow_run.id
            || listed[0].workflow_run?.head_sha !== artifact.workflow_run.head_sha
          ) {
            throw new Error("root custody artifact metadata is not exact, current, and tied to the attested run");
          }
          const provenance = {
            workflowRunId: String(process.env.ROOT_CUSTODY_RUN_ID),
            coordinatorRunId: String(process.env.ORCHESTRATOR_RUN_ID),
            workflowPath: ".github/workflows/cloudflare-workers-sync-ponto-secrets.yml",
            artifactId,
            artifactDigest: digest.slice("sha256:".length),
            artifactName,
            repository: process.env.GITHUB_REPOSITORY,
          };
          fs.writeFileSync(outputFile, `${JSON.stringify(provenance, null, 2)}\n`, { mode: 0o600 });
          NODE
          preflight_dir="$RUNNER_TEMP/timekeeping-root-custody/preflight"
          mkdir -p "$preflight_dir/unpacked"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$preflight_dir/artifact.zip"
          expected_artifact_digest="$(
            node -e "process.stdout.write(require(process.argv[1]).artifactDigest)" "$artifact_provenance"
