          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_PROFILE_DATA_KEY: ${{ secrets.PONTO_PROFILE_DATA_KEY }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${PONTO_PROFILE_DATA_KEY:-}" ]] || { echo 'PONTO_PROFILE_DATA_KEY must be owned by the selected GitHub environment'; exit 1; }
          [[ -n "${PONTO_IDEMPOTENCY_KEY:-}" ]] || { echo 'PONTO_IDEMPOTENCY_KEY must be owned by the selected GitHub environment'; exit 1; }
          if [[ "$TARGET" == staging ]]; then env_args=(--env staging); worker_name=skincos-timekeeping-staging; runtime_environment=staging; else env_args=(); worker_name=skincos-timekeeping; runtime_environment=production; fi
          output_file="$RUNNER_TEMP/timekeeping-version-upload.ndjson"
          secrets_file="$RUNNER_TEMP/timekeeping-candidate-secrets.json"
