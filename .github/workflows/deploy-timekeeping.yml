        with:
          name: timekeeping-${{ inputs.target }}-pre-migration-${{ env.RELEASE_SHA }}
          path: |
            ${{ steps.checkpoint.outputs.artifact }}
            ${{ steps.checkpoint.outputs.artifact }}.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Resolve exact root custody artifact before mutation
        if: ${{ inputs.target == 'staging' || inputs.target == 'pilot' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_CUSTODY_RUN_ID: ${{ inputs.root_custody_run_id }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          [[ "$ROOT_CUSTODY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'root_custody_run_id must be numeric'; exit 1; }
          [[ "$ORCHESTRATOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'orchestrator_run_id must be numeric'; exit 1; }
          target=staging
          [[ "$TARGET" == pilot ]] && target=production
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROOT_CUSTODY_RUN_ID" > "$RUNNER_TEMP/timekeeping-root-custody-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-workers-sync-ponto-secrets.yml" > "$RUNNER_TEMP/timekeeping-root-custody-workflow.json"
          node --input-type=module - \
            "$RUNNER_TEMP/timekeeping-root-custody-run.json" \
            "$RUNNER_TEMP/timekeeping-root-custody-workflow.json" \
            "$target" <<'NODE'
          import fs from "node:fs";
          import { pontoSourceClosureMatches } from "./.github/scripts/ponto-source-closure.mjs";
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const workflow = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const target = process.argv[4];
          const releaseRef = `refs/tags/skincos/release/ponto/${process.env.RELEASE_SHA}`;
          const releaseTag = releaseRef.slice("refs/tags/".length);
          const expectedTitle = new RegExp(
            `^Attest Ponto Workers ${target} ${process.env.RELEASE_SHA} orchestrator=${process.env.ORCHESTRATOR_RUN_ID} nonce=([0-9a-f]{32})$`,
          ).exec(String(run.display_title || ""));
          if (
            workflow.state !== "active"
            || workflow.path !== ".github/workflows/cloudflare-workers-sync-ponto-secrets.yml"
            || workflow.name !== "Attest Ponto Worker secret custody"
            || run.id !== Number(process.env.ROOT_CUSTODY_RUN_ID)
            || run.workflow_id !== workflow.id
            || ![workflow.path, `${workflow.path}@${releaseRef}`].includes(run.path)
            || run.run_attempt !== 1
            || run.status !== "completed"
            || run.conclusion !== "success"
            || run.event !== "workflow_dispatch"
            || run.head_branch !== releaseTag
            || String(run.head_sha || "").toLowerCase() !== process.env.RELEASE_SHA
            || !pontoSourceClosureMatches(process.env.RELEASE_SHA, String(run.head_sha || "").toLowerCase())
            || !expectedTitle
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
            || String(run.repository?.id || "") !== process.env.GITHUB_REPOSITORY_ID
            || String(run.head_repository?.id || "") !== process.env.GITHUB_REPOSITORY_ID
          ) throw new Error("root custody run provenance differs from the governed pre-mutation child");
          NODE
          artifact_name="ponto-root-custody-$target-$RELEASE_SHA"
          artifact_list="$RUNNER_TEMP/timekeeping-root-custody-artifacts.json"
          artifact_metadata="$RUNNER_TEMP/timekeeping-root-custody-artifact.json"
          artifact_provenance="$RUNNER_TEMP/timekeeping-root-custody-provenance.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROOT_CUSTODY_RUN_ID/artifacts?per_page=100" > "$artifact_list"
          artifact_id="$(
            node - "$artifact_list" "$artifact_name" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const artifactName = process.argv[3];
          const artifacts = Array.isArray(payload.artifacts) ? payload.artifacts : [];
          if (!Number.isInteger(payload.total_count) || payload.total_count !== artifacts.length) {
            throw new Error("root custody artifact listing is incomplete");
          }
          const matches = artifacts.filter(artifact => artifact?.name === artifactName);
          if (matches.length !== 1 || !/^[1-9][0-9]*$/.test(String(matches[0]?.id || ""))) {
            throw new Error("exactly one root custody artifact with a positive numeric ID is required");
