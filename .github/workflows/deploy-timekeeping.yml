          [[ "$downloaded_artifact_digest" == "$expected_artifact_digest" ]] || {
            echo 'Downloaded root custody archive differs from the exact artifact metadata digest'
            exit 1
          }
          unzip -q "$preflight_dir/artifact.zip" -d "$preflight_dir/unpacked"
