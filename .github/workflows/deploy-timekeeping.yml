          chmod 600 "$secrets_file"
          WRANGLER_OUTPUT_FILE_PATH="$output_file" workforce/timekeeping/node_modules/.bin/wrangler versions upload \
            --config workforce/timekeeping/wrangler.toml \
            --keep-vars \
            --strict \
            --secrets-file "$secrets_file" \
            "${env_args[@]}" \
            --tag "ponto:timekeeping:$RELEASE_SHA" \
            --message "ponto:timekeeping:$RELEASE_SHA" \
            --var "APP_VERSION:$RELEASE_SHA" \
            --var "ENVIRONMENT:$runtime_environment"
          PONTO_EXPECTED_WRANGLER_ENV="$runtime_environment" node .github/scripts/ponto-wrangler-output.mjs "$output_file" version-upload "$worker_name" > "$RUNNER_TEMP/timekeeping-upload-verified.txt"
          id="$(node - "$output_file" <<'NODE'
          const fs = require("fs");
          const rows = fs.readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).map(JSON.parse);
          process.stdout.write(String(rows.filter(row => row.type === "version-upload").at(-1)?.version_id || ""));
          NODE
          )"
          [[ "$id" =~ ^[0-9a-fA-F-]{36}$ && "$id" != "$TIMEKEEPING_INCUMBENT_VERSION_ID" ]] || { echo 'Invalid or non-distinct Timekeeping candidate version'; exit 1; }
          echo "TIMEKEEPING_CANDIDATE_VERSION_ID=$id" >> "$GITHUB_ENV"
          rm -f "$secrets_file" "$output_file"
          trap - EXIT
      - name: Prove live Timekeeping still matches the governed predecessor
        if: ${{ inputs.target == 'canary' || inputs.target == 'production' || inputs.target == 'rollback' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
          PREDECESSOR_STAGE: ${{ needs.progressive.outputs.predecessor_stage }}
          ROLLBACK_FROM_STAGE: ${{ inputs.rollback_from_stage }}
        run: |
          set -euo pipefail
          [[ "$PREDECESSOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'predecessor_run_id must be numeric'; exit 1; }
          [[ "$PREDECESSOR_STAGE" =~ ^(pilot|canary|production)$ ]] || { echo 'governed predecessor stage is invalid for live Timekeeping'; exit 1; }
          predecessor_dir="$RUNNER_TEMP/timekeeping-live-predecessor"
          artifact="ponto-release-evidence-${PREDECESSOR_STAGE}-${RELEASE_SHA}"
          mkdir -p "$predecessor_dir"
          gh run download "$PREDECESSOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$predecessor_dir"
