            "$RUNNER_TEMP/timekeeping-root-custody/preflight-root-custody.json" \
            "$RUNNER_TEMP/timekeeping-root-custody/root-custody.json" \
            "$RUNNER_TEMP/timekeeping-root-custody-provenance.json" \
            "$target" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import {
            attestationKeyCommitment,
            rootFingerprint,
            validateRootCustody,
          } from "./.github/scripts/ponto-root-custody.mjs";
          const target = process.argv[5];
          const options = { target, releaseSha: process.env.RELEASE_SHA };
          const raw = fs.readFileSync(process.argv[2]);
          const preflight = validateRootCustody(
            JSON.parse(raw),
            options,
          );
          const current = validateRootCustody(
            JSON.parse(fs.readFileSync(process.argv[3], "utf8")),
            options,
          );
          const artifactProvenance = JSON.parse(fs.readFileSync(process.argv[4], "utf8"));
          const canonicalRaw = Buffer.from(`${JSON.stringify(preflight, null, 2)}\n`, "utf8");
          if (!raw.equals(canonicalRaw)) {
            throw new Error("root custody artifact attestation is not canonical");
          }
          const provenance = {
            ...artifactProvenance,
            attestationSha256: crypto.createHash("sha256").update(canonicalRaw).digest("hex"),
          };
          const expectedProvenance = {
            workflowRunId: String(process.env.ROOT_CUSTODY_RUN_ID),
            coordinatorRunId: String(process.env.ORCHESTRATOR_RUN_ID),
            workflowPath: ".github/workflows/cloudflare-workers-sync-ponto-secrets.yml",
            artifactName: `ponto-root-custody-${target}-${process.env.RELEASE_SHA}`,
            repository: process.env.GITHUB_REPOSITORY,
          };
          if (
            Object.entries(expectedProvenance).some(([key, value]) => provenance[key] !== value)
            || !/^[1-9][0-9]*$/.test(String(provenance.artifactId || ""))
            || !/^[0-9a-f]{64}$/.test(String(provenance.artifactDigest || ""))
            || !/^[0-9a-f]{64}$/.test(String(provenance.attestationSha256 || ""))
          ) {
            throw new Error("root custody durable provenance is invalid");
          }
          const liveCommitment = {
            profileDigest: rootFingerprint(
              process.env.PONTO_PROFILE_DATA_KEY,
              process.env.PONTO_ROOT_ATTESTATION_KEY_SHARED,
            ),
            idempotencyDigest: rootFingerprint(
              process.env.PONTO_IDEMPOTENCY_KEY,
              process.env.PONTO_ROOT_ATTESTATION_KEY_SHARED,
            ),
            attestationKeyCommitment: attestationKeyCommitment(
              process.env.PONTO_ROOT_ATTESTATION_KEY_SHARED,
            ),
            profileCustodyRef: process.env.PONTO_PROFILE_DATA_KEY_CUSTODY_REF,
            idempotencyCustodyRef: process.env.PONTO_IDEMPOTENCY_KEY_CUSTODY_REF,
            attestationKeyId: process.env.PONTO_ROOT_ATTESTATION_KEY_ID,
          };
          if (
            JSON.stringify(current) !== JSON.stringify(preflight)
            || Object.entries(liveCommitment).some(([key, value]) => preflight[key] !== value)
          ) {
            throw new Error("current Timekeeping roots differ from the exact pre-mutation custody attestation");
          }
          const durable = validateRootCustody({
            ...current,
            provenance,
          }, {
            ...options,
            requireProvenance: true,
            repository: process.env.GITHUB_REPOSITORY,
          });
          fs.writeFileSync(process.argv[3], `${JSON.stringify(durable, null, 2)}\n`, { mode: 0o600 });
          fs.chmodSync(process.argv[3], 0o600);
          NODE
          touch "$RUNNER_TEMP/timekeeping-root-custody-pre-mutation-attested"
          rm -f \
            "$RUNNER_TEMP/timekeeping-root-custody/preflight-root-custody.json" \
            "$RUNNER_TEMP/timekeeping-root-custody-provenance.json"
      - name: Apply additive Timekeeping migrations
        if: ${{ inputs.target == 'staging' || inputs.target == 'pilot' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workforce/timekeeping
        run: |
          set -euo pipefail
          [[ -f "$RUNNER_TEMP/timekeeping-root-custody-pre-mutation-attested" ]] || { echo 'Exact root custody was not revalidated immediately before mutation'; exit 1; }
          if [[ "$TARGET" == staging ]]; then env_args=(--env staging); database=skincos-timekeeping-staging; else env_args=(); database=skincos-timekeeping; fi
          touch "$RUNNER_TEMP/timekeeping-migration-started"
          ./node_modules/.bin/wrangler d1 migrations apply "$database" --remote --config wrangler.toml "${env_args[@]}"
