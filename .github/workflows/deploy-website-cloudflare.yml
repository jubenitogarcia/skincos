name: Deploy Website to Cloudflare

on:
  workflow_dispatch:
    inputs:
      target: { description: Target stage, required: true, default: preview, type: choice, options: [preview, staging, production] }
      release_sha: { description: Immutable commit SHA, required: false, type: string }
      preview_run_id: { description: Required for staging, required: false, type: string }
      staging_run_id: { description: Required for production, required: false, type: string }

concurrency:
  group: deploy-website-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  promotion:
    uses: ./.github/workflows/promotion-gate.yml
    with:
      unit: public-website-release
      target: ${{ inputs.target }}
      release_sha: ${{ inputs.release_sha }}
      preview_run_id: ${{ inputs.preview_run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
      staging_supported: true
    secrets: inherit
  deploy:
    needs: promotion
    if: ${{ inputs.target != 'preview' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    steps:
      - name: Guard Cloudflare deploy secrets
        id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy secrets not configured; skipping website deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promotion.outputs.source_sha }}

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Upgrade npm
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          npm i -g npm@11.6.0
          node --version
          npm --version

      - name: Install dependencies
        if: ${{ steps.guard.outputs.skip != 'true' }}
        working-directory: website
        run: npm ci

      - name: Typecheck
        if: ${{ steps.guard.outputs.skip != 'true' }}
        working-directory: website
        run: npm run typecheck

      - name: Lint
        if: ${{ steps.guard.outputs.skip != 'true' }}
        working-directory: website
        run: npm run lint

      - name: Acquire Website release lease
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json

      - name: Check Website release lease before worker-secret mutation
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Sync worker secrets (optional)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        continue-on-error: true
        working-directory: website
        run: |
          is_placeholder() {
            local value="$1"
            [ "${value}" = "__KEEP_EXISTING__" ]
          }

          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "${value}" ] && ! is_placeholder "${value}"; then
              printf "%s" "${value}" | npx wrangler secret put "${name}" --name espacofacial-site
            fi
          }

          put_secret "NEXT_PUBLIC_META_PIXEL_ID" "${NEXT_PUBLIC_META_PIXEL_ID}"
          put_secret "META_PIXEL_ID" "${META_PIXEL_ID}"
          put_secret "META_ACCESS_TOKEN" "${META_ACCESS_TOKEN}"
          put_secret "AGENDA_SYNC_TOKEN" "${AGENDA_SYNC_TOKEN}"
          put_secret "TURNSTILE_SECRET_KEY" "${TURNSTILE_SECRET_KEY}"
          put_secret "CADASTRO_WHEEL_SECRET" "${CADASTRO_WHEEL_SECRET}"
          put_secret "BEAUTY_MOVEMENT_TOKEN_HMAC_KEY" "${BEAUTY_MOVEMENT_TOKEN_HMAC_KEY}"
          put_secret "BEAUTY_MOVEMENT_PII_KEY" "${BEAUTY_MOVEMENT_PII_KEY}"
          put_secret "TITAN_SMTP_HOST" "${TITAN_SMTP_HOST}"
          put_secret "TITAN_SMTP_PORT" "${TITAN_SMTP_PORT}"
          put_secret "TITAN_SMTP_USER_BARRA" "${TITAN_SMTP_USER_BARRA}"
          put_secret "TITAN_SMTP_PASS_BARRA" "${TITAN_SMTP_PASS_BARRA}"
          put_secret "TITAN_SMTP_USER_NH" "${TITAN_SMTP_USER_NH}"
          put_secret "TITAN_SMTP_PASS_NH" "${TITAN_SMTP_PASS_NH}"
          put_secret "BOOKING_EMAIL_FROM" "${BOOKING_EMAIL_FROM}"
          put_secret "RESEND_API_KEY" "${RESEND_API_KEY}"
          put_secret "BOOKING_EMAIL_WEBHOOK_URL" "${BOOKING_EMAIL_WEBHOOK_URL}"
          put_secret "BOOKING_EMAIL_WEBHOOK_SECRET" "${BOOKING_EMAIL_WEBHOOK_SECRET}"
          put_secret "BOOKING_WHATSAPP_WEBHOOK_URL" "${BOOKING_WHATSAPP_WEBHOOK_URL}"
          put_secret "BOOKING_WHATSAPP_WEBHOOK_SECRET" "${BOOKING_WHATSAPP_WEBHOOK_SECRET}"
          put_secret "BOOKING_WEBHOOK_URL" "${BOOKING_WEBHOOK_URL}"
          put_secret "BOOKING_WEBHOOK_SECRET" "${BOOKING_WEBHOOK_SECRET}"
          put_secret "TRACKING_DASHBOARD_TOKEN" "${TRACKING_DASHBOARD_TOKEN}"
          put_secret "BOOKING_EMAIL_LOGO_URL" "${BOOKING_EMAIL_LOGO_URL}"
          put_secret "BOOKING_EMAIL_AMBASSADOR_MALE_IMAGE_URL" "${BOOKING_EMAIL_AMBASSADOR_MALE_IMAGE_URL}"
          put_secret "BOOKING_EMAIL_AMBASSADOR_FEMALE_IMAGE_URL" "${BOOKING_EMAIL_AMBASSADOR_FEMALE_IMAGE_URL}"
          put_secret "INSTAGRAM_SYNC_TOKEN" "${INSTAGRAM_SYNC_TOKEN}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID != '' && secrets.NEXT_PUBLIC_META_PIXEL_ID || secrets.META_PIXEL_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AGENDA_SYNC_TOKEN: ${{ secrets.AGENDA_SYNC_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CADASTRO_WHEEL_SECRET: ${{ secrets.CADASTRO_WHEEL_SECRET }}
          BEAUTY_MOVEMENT_TOKEN_HMAC_KEY: ${{ secrets.BEAUTY_MOVEMENT_TOKEN_HMAC_KEY }}
          BEAUTY_MOVEMENT_PII_KEY: ${{ secrets.BEAUTY_MOVEMENT_PII_KEY }}
          TITAN_SMTP_HOST: ${{ secrets.TITAN_SMTP_HOST }}
          TITAN_SMTP_PORT: ${{ secrets.TITAN_SMTP_PORT }}
          TITAN_SMTP_USER_BARRA: ${{ secrets.TITAN_SMTP_USER_BARRA }}
          TITAN_SMTP_PASS_BARRA: ${{ secrets.TITAN_SMTP_PASS_BARRA }}
          TITAN_SMTP_USER_NH: ${{ secrets.TITAN_SMTP_USER_NH }}
          TITAN_SMTP_PASS_NH: ${{ secrets.TITAN_SMTP_PASS_NH }}
          BOOKING_EMAIL_FROM: ${{ secrets.BOOKING_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BOOKING_EMAIL_WEBHOOK_URL: ${{ secrets.BOOKING_EMAIL_WEBHOOK_URL }}
          BOOKING_EMAIL_WEBHOOK_SECRET: ${{ secrets.BOOKING_EMAIL_WEBHOOK_SECRET }}
          BOOKING_WHATSAPP_WEBHOOK_URL: ${{ secrets.BOOKING_WHATSAPP_WEBHOOK_URL }}
          BOOKING_WHATSAPP_WEBHOOK_SECRET: ${{ secrets.BOOKING_WHATSAPP_WEBHOOK_SECRET }}
          BOOKING_WEBHOOK_URL: ${{ secrets.BOOKING_WEBHOOK_URL }}
          BOOKING_WEBHOOK_SECRET: ${{ secrets.BOOKING_WEBHOOK_SECRET }}
          TRACKING_DASHBOARD_TOKEN: ${{ secrets.TRACKING_DASHBOARD_TOKEN }}
          BOOKING_EMAIL_LOGO_URL: ${{ secrets.BOOKING_EMAIL_LOGO_URL }}
          BOOKING_EMAIL_AMBASSADOR_MALE_IMAGE_URL: ${{ secrets.BOOKING_EMAIL_AMBASSADOR_MALE_IMAGE_URL }}
          BOOKING_EMAIL_AMBASSADOR_FEMALE_IMAGE_URL: ${{ secrets.BOOKING_EMAIL_AMBASSADOR_FEMALE_IMAGE_URL }}
          INSTAGRAM_SYNC_TOKEN: ${{ secrets.INSTAGRAM_SYNC_TOKEN }}

      - name: Check Website release lease before website deployment
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Prepare Beauty Movement production rollback checkpoint
        id: beautyMovementRollbackCheckpoint
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_BUILD_SHA: ${{ needs.promotion.outputs.source_sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.run_id }}
          DEPLOY_RELEASE_OWNER: bm-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_SITE_URL: https://espacofacial.com
          DEPLOY_ROLLBACK_MANIFEST_PATH: ${{ runner.temp }}/website-deploy-checkpoints/incumbent.json
        run: node scripts/deploy-worker.mjs --prepare-rollback-only

      - name: Persist Beauty Movement production incumbent checkpoint
        if: ${{ steps.beautyMovementRollbackCheckpoint.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-production-incumbent-${{ needs.promotion.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-deploy-checkpoints/incumbent.json
          retention-days: 14
          if-no-files-found: error

      - name: Deploy website (OpenNext -> Workers)
        id: deployWebsite
        if: ${{ steps.guard.outputs.skip != 'true' }}
        working-directory: website
        run: |
          if [ "${DEPLOY_TARGET}" = "staging" ]; then
            npm run deploy -- --env staging
          else
            npm run deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_TARGET: ${{ inputs.target }}
          DEPLOY_SITE_URL: ${{ inputs.target == 'staging' && 'https://espacofacial-site-staging.skincos.workers.dev' || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.target == 'staging' && 'https://espacofacial-site-staging.skincos.workers.dev' || 'https://espacofacial.com' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ inputs.target == 'production' && (secrets.NEXT_PUBLIC_META_PIXEL_ID != '' && secrets.NEXT_PUBLIC_META_PIXEL_ID || secrets.META_PIXEL_ID) || '' }}
          NEXT_PUBLIC_BUILD_SHA: ${{ needs.promotion.outputs.source_sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.run_id }}
          DEPLOY_RELEASE_OWNER: ${{ inputs.target == 'production' && format('bm-{0}-{1}', github.run_id, github.run_attempt) || '' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ inputs.target == 'production' && secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '' }}
          DEPLOY_ROLLBACK_MANIFEST_PATH: ${{ inputs.target == 'production' && format('{0}/website-deploy-checkpoints/candidate.json', runner.temp) || '' }}

      - name: Persist Beauty Movement production candidate checkpoint
        if: ${{ always() && inputs.target == 'production' && steps.beautyMovementRollbackCheckpoint.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-production-candidate-${{ needs.promotion.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-deploy-checkpoints/candidate.json
          retention-days: 14
          if-no-files-found: warn

      - name: Inspect Beauty Movement production release state
        id: beautyMovementRelease
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        env:
          RELEASE_SHA: ${{ needs.promotion.outputs.source_sha }}
          RELEASE_OWNER: bm-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/website-deploy-checkpoints/candidate.json" <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (state.phase !== 'candidate' || state.releaseSha !== process.env.RELEASE_SHA || state.releaseOwner !== process.env.RELEASE_OWNER || !/^[0-9a-f-]{36}$/i.test(state.candidateVersionId ?? '')) {
            throw new Error('beauty_movement_release_manifest_invalid');
          }
          if (Number(state.beautyMovementActiveCampaignCount) > 0 && (
            !/^[0-9a-f-]{36}$/i.test(state.previousVersionId ?? '')
            || !/^[0-9a-f]{40}$/.test(state.previousBuildSha ?? '')
          )) {
            throw new Error('beauty_movement_release_rollback_target_invalid');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active=${Number(state.beautyMovementActiveCampaignCount) > 0}\n`);
          NODE

      - name: Recheck Website release lease before Beauty Movement production fixture
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' && steps.beautyMovementRelease.outputs.active == 'true' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Install Beauty Movement production smoke browser
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' && steps.beautyMovementRelease.outputs.active == 'true' }}
        working-directory: website
        run: npx playwright install --with-deps chromium >/dev/null

      - name: Run Beauty Movement production isolation and journey smoke
        id: beautyMovementReleaseSmoke
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' && steps.beautyMovementRelease.outputs.active == 'true' }}
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEAUTY_MOVEMENT_TOKEN_HMAC_KEY: ${{ secrets.BEAUTY_MOVEMENT_TOKEN_HMAC_KEY }}
          BEAUTY_MOVEMENT_PII_KEY: ${{ secrets.BEAUTY_MOVEMENT_PII_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          node scripts/beauty-movement-production-release-smoke.mjs \
            --base-url https://espacofacial.com \
            --database espacofacial-beauty-movement \
            --config wrangler.toml \
            --release-sha "${{ needs.promotion.outputs.source_sha }}" \
            --private-root "$RUNNER_TEMP/beauty-movement-production-release-smoke/private" \
            --evidence-file "$RUNNER_TEMP/beauty-movement-production-release-smoke/evidence.json"

      - name: Upload Beauty Movement production release evidence
        id: beautyMovementReleaseEvidence
        if: ${{ always() && inputs.target == 'production' && steps.beautyMovementRelease.outputs.active == 'true' && steps.beautyMovementReleaseSmoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beauty-movement-production-release-${{ needs.promotion.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beauty-movement-production-release-smoke/evidence.json
          retention-days: 14
          if-no-files-found: warn

      - name: Reconcile Beauty Movement production release
        id: beautyMovementReconcile
        if: ${{ always() && inputs.target == 'production' && steps.beautyMovementRollbackCheckpoint.outcome == 'success' }}
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/beauty-movement-production-reconcile.mjs \
            --base-url https://espacofacial.com \
            --database espacofacial-beauty-movement \
            --config wrangler.toml \
            --release-sha "${{ needs.promotion.outputs.source_sha }}" \
            --incumbent-manifest "$RUNNER_TEMP/website-deploy-checkpoints/incumbent.json" \
            --candidate-manifest "$RUNNER_TEMP/website-deploy-checkpoints/candidate.json" \
            --trigger-run-id "${{ github.run_id }}" \
            --trigger-run-attempt "${{ github.run_attempt }}" \
            --conclusion "${{ steps.beautyMovementReleaseSmoke.outcome == 'success' && 'success' || job.status }}" \
            --evidence-file "$RUNNER_TEMP/beauty-movement-production-reconcile/evidence.json"

      - name: Upload Beauty Movement production reconciliation evidence
        if: ${{ always() && inputs.target == 'production' && steps.beautyMovementRollbackCheckpoint.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beauty-movement-production-reconcile-${{ needs.promotion.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beauty-movement-production-reconcile/evidence.json
          retention-days: 14
          if-no-files-found: warn

      - name: Check Website release lease before legal-hub deployment
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Deploy SKINCOS legal hub (OpenNext -> Workers)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        working-directory: website
        run: npm run deploy:skincos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID != '' && secrets.NEXT_PUBLIC_META_PIXEL_ID || secrets.META_PIXEL_ID }}
          NEXT_PUBLIC_BUILD_SHA: ${{ needs.promotion.outputs.source_sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.run_id }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Check Website release lease before security-settings mutation
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Sync Cloudflare security settings (optional)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        working-directory: website
        run: npm run cf:security
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_API_TOKEN != '' && secrets.CLOUDFLARE_SECURITY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: espacofacial.com

      - name: Verify Cloudflare security settings
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        working-directory: website
        run: npm run cf:security:check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_API_TOKEN != '' && secrets.CLOUDFLARE_SECURITY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: espacofacial.com

      - name: Check Website release lease before redirects-worker deployment
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Deploy redirects worker (esfa.co)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        working-directory: website
        run: npm run deploy:esfa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check Website release lease before redirects-D1 mutation
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
          resource: release:website
          module: website
          source_sha: ${{ needs.promotion.outputs.source_sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}

      - name: Sync esfa.co managed redirects (D1)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        working-directory: website
        run: npm run custom-urls:migrate:esfa -- --apply --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test deployed website
        if: ${{ steps.guard.outputs.skip != 'true' }}
        working-directory: website
        run: |
          for attempt in $(seq 1 6); do
            if npm run smoke; then
              exit 0
            fi
            if [ "${attempt}" -lt 6 ]; then
              echo "Smoke not yet reachable after deploy; retrying (${attempt}/6) in 10 seconds."
              sleep 10
            fi
          done
          exit 1
        env:
          SMOKE_AGENDA_TOKEN: ${{ inputs.target == 'production' && secrets.AGENDA_SYNC_TOKEN || '' }}
          SMOKE_BASE_URL: ${{ inputs.target == 'staging' && 'https://espacofacial-site-staging.skincos.workers.dev' || 'https://espacofacial.com' }}

      - name: Smoke test SKINCOS legal pages
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'production' }}
        run: |
          set -euo pipefail
          curl -fsS https://skincos.com.br/privacidade >/dev/null
          curl -fsS https://skincos.com.br/dados >/dev/null
          curl -fsS https://skincos.com.br/termos >/dev/null

      - name: Write staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        env:
          PROMOTION_UNIT: public-website-release
          PROMOTION_TARGET: staging
          PROMOTION_SOURCE_SHA: ${{ needs.promotion.outputs.source_sha }}
        run: PROMOTION_SOURCE_TREE="$(git rev-parse "${PROMOTION_SOURCE_SHA}^{tree}")" node .github/scripts/promotion-evidence.mjs write "$RUNNER_TEMP/promotion-evidence/promotion-evidence.json"

      - name: Upload staging promotion evidence
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.target == 'staging' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-evidence-public-website-release
          path: ${{ runner.temp }}/promotion-evidence/promotion-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Release Website release lease
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ inputs.target == 'staging' && vars.SKINCOS_GLOBAL_COORDINATOR_URL || vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-website.json
