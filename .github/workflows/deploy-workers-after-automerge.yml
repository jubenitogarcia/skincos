name: Retired duplicate deploy path - Workers after automerge

on:
  workflow_dispatch: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired deployment path
        run: |
          echo "::error::RETIRED_DUPLICATE_DEPLOY_PIPELINE: use deploy-insumos-worker.yml for API and Inventory Workers."
          exit 1
