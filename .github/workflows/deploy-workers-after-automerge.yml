name: Deploy Cloudflare Workers (API + Insumos) after automerge
run-name: "Workers after-automerge PR #${{ github.event.pull_request.number || github.event.inputs.pr_number || inputs.pr_number || 'manual' }}"

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to deploy (uses merge commit SHA)"
        required: true

concurrency:
  group: deploy-workers-after-automerge-${{ github.event.pull_request.base.ref || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const resolvePr = require('./.github/scripts/resolve_after_automerge_pr.cjs');
            await resolvePr({
              github,
              context,
              core,
              options: {
                baseRef: 'main',
                headPrefix: 'codex/',
                requiredAuthor: 'jubenitogarcia',
              },
            });

      - name: Detect worker changes
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const detectChanges = require('./.github/scripts/detect_pr_file_changes.cjs');
            await detectChanges({
              github,
              context,
              core,
              options: {
                prNumber: '${{ steps.pr.outputs.pr_number }}',
                outputName: 'workers_changed',
                prefixes: [
                  'api/',
                  'inventory/',
                ],
                exact: [
                  'backend/scripts/cloudflare-workers.sh',
                  'backend/pnpm-lock.yaml',
                  'backend/pnpm-workspace.yaml',
                  '.github/workflows/deploy-insumos-worker.yml',
                  '.github/workflows/deploy-workers-after-automerge.yml',
                  '.github/workflows/deploy-workers-reconcile.yml',
                ],
              },
            });

      - name: Guard Cloudflare deploy secrets
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' }}
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cache (skip if already deployed)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: workers-after-automerge-deploy-${{ steps.pr.outputs.merge_commit_sha }}
          path: deploy-state/workers_after_automerge_sha.txt

      - name: Skip (already deployed)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          echo "Already deployed merge sha=${{ steps.pr.outputs.merge_commit_sha }}; skipping."

      - name: Checkout merge commit
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.merge_commit_sha }}

      - name: Setup Node
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Setup pnpm (corepack)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install backend workspace deps
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: pnpm -C backend install --frozen-lockfile

      - name: Deploy Workers (deploy-all)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash backend/scripts/cloudflare-workers.sh deploy-all

      - name: Smoke check API + Inventory Workers (production)
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          API_BASE_URL: https://api.skincos.com.br
        run: |
          set -euo pipefail
          python3 .github/scripts/workers_smoke.py \
            --attempts 5 \
            --sleep-seconds 6 \
            --user-agent "Mozilla/5.0 (compatible; WorkersAfterAutomergeSmoke/1.0)"

      - name: Mark deployed SHA
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        run: |
          set -euo pipefail
          mkdir -p deploy-state
          echo "${{ steps.pr.outputs.merge_commit_sha }}" > deploy-state/workers_after_automerge_sha.txt

      - name: Save deploy cache
        if: ${{ steps.pr.outputs.eligible == 'true' && steps.changes.outputs.workers_changed == 'true' && steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          key: workers-after-automerge-deploy-${{ steps.pr.outputs.merge_commit_sha }}
          path: deploy-state/workers_after_automerge_sha.txt
