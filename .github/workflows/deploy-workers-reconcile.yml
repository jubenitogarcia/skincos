name: Deploy Cloudflare Workers (API + Insumos) reconcile

on:
  schedule:
    # Workaround: merges performed via GitHub Actions can skip `on: push` deploy triggers.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: deploy-workers-reconcile-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard Cloudflare deploy secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deploy secrets not configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve target SHA
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: sha
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore deploy cache (skip if already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: workers-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/deployed_sha.txt

      - name: Skip (already deployed)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          echo "Already deployed sha=${{ steps.sha.outputs.sha }}; skipping."

      - name: Setup Node
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm (corepack)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install backend workspace deps
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: pnpm -C backend install --frozen-lockfile

      - name: Deploy Workers (deploy-all)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash backend/scripts/cloudflare-workers.sh deploy-all

      - name: Mark deployed SHA
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        run: |
          set -euo pipefail
          mkdir -p deploy-state
          echo "${{ steps.sha.outputs.sha }}" > deploy-state/deployed_sha.txt

      - name: Save deploy cache
        if: ${{ steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          key: workers-deploy-${{ steps.sha.outputs.sha }}
          path: deploy-state/deployed_sha.txt

      - name: Smoke check Ponto (production)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          BASE_URL: https://crm.skincos.com.br
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request

          base = os.environ.get("BASE_URL", "").rstrip("/")
          if not base:
            raise SystemExit("BASE_URL not set")

          def fetch_json(path: str):
            url = f"{base}{path}"
            headers = {"User-Agent": "Mozilla/5.0 (compatible; PontoWorkersReconcile/1.0)"}
            cid = os.environ.get("CF_ACCESS_CLIENT_ID", "").strip()
            csec = os.environ.get("CF_ACCESS_CLIENT_SECRET", "").strip()
            if cid and csec:
              headers["CF-Access-Client-Id"] = cid
              headers["CF-Access-Client-Secret"] = csec
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=15) as resp:
              data = resp.read().decode("utf-8", "ignore")
              return json.loads(data)

          def check():
            proxy = fetch_json("/api/ponto/_proxy-status")
            if not proxy.get("ok"):
              raise SystemExit(f"proxy-status ok=false: {proxy}")
            if not proxy.get("targetConfigured"):
              raise SystemExit(f"proxy-status targetConfigured=false: {proxy}")
            if not proxy.get("adminTokenConfigured"):
              raise SystemExit(f"proxy-status adminTokenConfigured=false: {proxy}")
            health = fetch_json("/api/ponto/health")
            if not health.get("ok"):
              raise SystemExit(f"health ok=false: {health}")
            if not health.get("cryptoTemplates"):
              raise SystemExit(f"health cryptoTemplates=false: {health}")
            return True

          for i in range(1, 6):
            try:
              check()
              print("Ponto workers reconcile smoke OK")
              sys.exit(0)
            except Exception as exc:
              print(f"Attempt {i} failed: {exc}")
              if i >= 5:
                raise
              time.sleep(6)
          PY
