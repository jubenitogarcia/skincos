name: Dispatch after-automerge fallback

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: dispatch-after-automerge-fallback
  cancel-in-progress: true
permissions:
  actions: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch missing after-automerge deploy workflows
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = Date.now();
            const windowMs = 90 * 60 * 1000; // 90 minutes
            const workflows = [
              { id: "deploy-workers-after-automerge.yml", label: "workers" },
              { id: "deploy-crm-pages-after-automerge.yml", label: "crm-pages" },
            ];

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              base: "main",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });

            const recent = pulls.filter((pr) => {
              if (!pr.merged_at) return false;
              if (now - Date.parse(pr.merged_at) > windowMs) return false;
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) return false;
              if (!String(pr.head?.ref || "").startsWith("codex/")) return false;
              return true;
            }).slice(0, 10);

            if (!recent.length) {
              core.info("No recent merged codex PRs in fallback window.");
              return;
            }

            const decisionLog = [];
            for (const pr of recent) {
              const prNumber = String(pr.number);
              const titleNeedle = `PR #${prNumber}`;
              const mergeSha = String(pr.merge_commit_sha || "");
              core.info(`Evaluating merged PR #${prNumber} (${pr.head?.ref || "?"})`);
              for (const wf of workflows) {
                const runsResp = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: wf.id,
                  per_page: 100,
                });
                const hasRun = runsResp.data.workflow_runs.some((run) => {
                  const title = String(run.display_title || "");
                  const headSha = String(run.head_sha || "");
                  const event = String(run.event || "");
                  const eligibleEvent =
                    event === "pull_request_target" ||
                    event === "workflow_dispatch" ||
                    event === "workflow_call";
                  if (!eligibleEvent) return false;
                  if (title.includes(titleNeedle)) return true;
                  if (mergeSha && headSha === mergeSha) return true;
                  return false;
                });
                if (hasRun) {
                  const msg = `- ${wf.label}: already has run for ${titleNeedle} (sha=${mergeSha || "unknown"})`;
                  core.info(msg);
                  decisionLog.push(`PR #${prNumber} | ${wf.label} | skip | existing run found`);
                  continue;
                }
                core.warning(`- ${wf.label}: missing run for ${titleNeedle}; dispatching fallback`);
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: wf.id,
                  ref: "main",
                  inputs: { pr_number: prNumber },
                });
                decisionLog.push(`PR #${prNumber} | ${wf.label} | dispatched | fallback triggered`);
              }
            }

            if (decisionLog.length) {
              core.notice("after-automerge fallback decisions:\\n" + decisionLog.join("\\n"));
            }
