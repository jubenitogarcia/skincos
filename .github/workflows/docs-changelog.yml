name: Docs & Changelog Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  js-ts-docs:
    name: JS/TS Docs & Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Install dependencies (all projects)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package-lock.json" ] || [ -f "$dir/pnpm-lock.yaml" ] || [ -f "$dir/yarn.lock" ]; then
              (cd "$dir" && npm install --no-audit --no-fund)
            fi
          done
      - name: Generate TypeDoc (if configured)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package.json" ] && jq -e '.scripts["docs"]' "$dir/package.json" >/dev/null; then
              (cd "$dir" && npm run docs)
            fi
          done
      - name: Generate Conventional Changelog (if configured)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package.json" ] && jq -e '.scripts["changelog"]' "$dir/package.json" >/dev/null; then
              (cd "$dir" && npm run changelog)
            fi
          done
      - name: Upload docs/changelog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: js-ts-docs-changelog
          path: |
            **/docs
            **/CHANGELOG.md

  python-docs:
    name: Python Docs & Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dev dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
      - name: Generate Sphinx docs (if configured)
        run: |
          if [ -f backend/docs/Makefile ]; then
            make -C backend/docs html
          fi
      - name: Generate Python changelog (if configured)
        run: |
          if [ -f backend/scripts/changelog.sh ]; then
            bash backend/scripts/changelog.sh
          fi
      - name: Upload docs/changelog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-docs-changelog
          path: |
            backend/docs/_build/html
            backend/CHANGELOG.md
