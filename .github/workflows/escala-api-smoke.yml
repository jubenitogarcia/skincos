name: Escala API Smoke

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: escala-api-smoke-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_ESCALA_API_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"

      - name: Resolve target
        id: target
        env:
          INPUT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          ENVIRONMENT="${INPUT_ENVIRONMENT}"
          if [[ "$ENVIRONMENT" == "staging" ]]; then
            echo "base_url=https://escala-api-staging.skincos.com.br" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://escala-api.skincos.com.br" >> "$GITHUB_OUTPUT"
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Run Escala smoke
        env:
          ESCALA_ACTOR_HMAC_KEY: ${{ secrets.ESCALA_ACTOR_HMAC_KEY }}
          ESCALA_SMOKE_BASE_URL: ${{ steps.target.outputs.base_url }}
          ESCALA_SMOKE_ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: |
          set -euo pipefail
          echo "Running Escala smoke for environment=${ESCALA_SMOKE_ENVIRONMENT}"
          node workforce/schedule/scripts/smoke.mjs
