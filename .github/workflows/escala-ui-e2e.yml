name: Escala UI E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "workforce/**"
      - "shared/**"
      - "platform/**"
      - "api/**"
      - "ops/**"
      - ".github/**"
      - "scripts/github-actions/**"
  push:
    branches: [main]
    paths:
      - "crm/console/**"
      - "crm/api/**"
      - "workforce/**"
      - "shared/**"
      - "platform/**"
      - "api/**"
      - "ops/**"
      - ".github/**"
      - "scripts/github-actions/**"
  workflow_dispatch: {}

jobs:
  scope:
    name: Scope Escala E2E closure
    runs-on: ubuntu-latest
    outputs:
      run_escala_e2e: ${{ steps.scope.outputs.run_escala_e2e }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - id: bounded-diff
        name: Prepare bounded immutable diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/codex-bounded-diff.mjs \
            --base "${PR_BASE_SHA:-$BEFORE_SHA}" \
            --head "${PR_HEAD_SHA:-$HEAD_SHA}" \
            --output "$GITHUB_OUTPUT"
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ steps.bounded-diff.outputs.base }}
          HEAD_SHA: ${{ steps.bounded-diff.outputs.head }}
        run: node scripts/github-actions/affected-crm-validation-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  e2e:
    name: Escala UI E2E
    needs: scope
    if: ${{ needs.scope.outputs.run_escala_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: crm/console/package-lock.json

      - name: Install frontend deps
        run: |
          set -euxo pipefail
          cd crm/console
          npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium

      - name: Install Playwright Chromium
        run: |
          set -euxo pipefail
          cd crm/console
          npx --yes playwright install --with-deps chromium

      - name: Start frontend
        run: |
          set -euxo pipefail
          cd crm/console
          npm run dev -- --host 127.0.0.1 --port 5173 &
          echo $! > /tmp/escala-vite.pid
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:5173/" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Vite did not become ready"
          exit 1

      - name: Run Escala E2E
        env:
          CI: "true"
          RUN_ESCALA_E2E_IN_CI: "1"
          E2E_BASE_URL: http://127.0.0.1:5173
        run: |
          set -euxo pipefail
          cd crm/console
          npx playwright test e2e/escala-module.spec.ts

      - name: Stop frontend
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /tmp/escala-vite.pid ]]; then
            pid="$(cat /tmp/escala-vite.pid 2>/dev/null || true)"
            if [[ "${pid}" =~ ^[0-9]+$ ]]; then
              kill "${pid}" 2>/dev/null || true
            fi
          fi
