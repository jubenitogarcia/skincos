name: Finance staging smoke identity

on:
  workflow_dispatch:
    inputs:
      action:
        description: Staging-only lifecycle action for the synthetic Finance actor
        required: true
        type: choice
        options: [provision, rotate, revoke]
      expires_at:
        description: UTC ISO-8601 expiration recorded in audit evidence
        required: true
        type: string
      acknowledge_staging_only:
        description: Confirm that this affects only the removable staging identity
        required: true
        type: boolean
        default: false

concurrency:
  group: finance-staging-smoke-identity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
      - name: Guard staging-only synthetic identity operation
        env:
          ACTION: ${{ inputs.action }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          ACKNOWLEDGED: ${{ inputs.acknowledge_staging_only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINANCE_SMOKE_PASSWORD: ${{ secrets.FINANCE_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$ACKNOWLEDGED" == true ]] || { echo 'Staging-only acknowledgement is required.'; exit 1; }
          [[ "$ACTION" =~ ^(provision|rotate|revoke)$ ]] || { echo 'Unsupported lifecycle action.'; exit 1; }
          date --date="$EXPIRES_AT" --iso-8601=seconds >/dev/null
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [[ -n "${!name:-}" ]] || { echo "Missing required staging value: $name"; exit 1; }; done
          if [[ "$ACTION" != revoke ]]; then [[ ${#FINANCE_SMOKE_PASSWORD} -ge 24 ]] || { echo 'FINANCE_SMOKE_PASSWORD is missing or too short.'; exit 1; }; fi

      - name: Acquire Finance release lease for synthetic identity
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          resource: release:finance
          module: finance
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-smoke-identity.json

      - name: Acquire shared staging D1 lease for synthetic identity
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          resource: global:staging-d1
          module: finance
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-staging-d1.json

      - name: Check Finance release lease before identity lifecycle SQL
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-smoke-identity.json
          resource: release:finance
          module: finance
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
      - name: Verify one safe synthetic-identity target
        env:
          ACTION: ${{ inputs.action }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          counts="$(
            npx --yes wrangler@4.114.0 d1 execute skincos-db-staging --remote \
              --command "SELECT COUNT(*) AS total_count, COALESCE(SUM(CASE WHEN ativo=1 THEN 1 ELSE 0 END), 0) AS active_count FROM crm_users WHERE username='finance-staging-smoke';" \
              --json |
              node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(0,"utf8")); const row=x[0]?.results?.[0] ?? {}; process.stdout.write(`${row.active_count ?? ""}:${row.total_count ?? ""}`);'
          )"
          IFS=: read -r active_count total_count <<< "$counts"
          echo "Observed synthetic staging identity counts: active=$active_count total=$total_count"
          [[ "$active_count" =~ ^[0-9]+$ && "$total_count" =~ ^[0-9]+$ ]] || { echo 'Could not verify the synthetic-identity count.'; exit 1; }
          if [[ "$ACTION" == provision ]]; then
            [[ "$total_count" == 0 || ( "$total_count" == 1 && "$active_count" == 0 ) ]] || { echo 'Synthetic identity must be absent or a single inactive row before provisioning.'; exit 1; }
          else
            [[ "$active_count" == 1 && "$total_count" == 1 ]] || { echo 'Expected exactly one active synthetic identity.'; exit 1; }
          fi
      - name: Recheck Finance release lease before identity lifecycle SQL
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-smoke-identity.json
          resource: release:finance
          module: finance
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
      - name: Check shared staging D1 lease before identity lifecycle SQL
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-staging-d1.json
          resource: global:staging-d1
          module: finance
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
      - name: Apply audited staging identity lifecycle SQL
        env:
          ACTION: ${{ inputs.action }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          FINANCE_SMOKE_IDENTITY_ACK: "1"
          FINANCE_SMOKE_PASSWORD: ${{ secrets.FINANCE_SMOKE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          core_sql="$RUNNER_TEMP/finance-staging-smoke-core.sql"
          finance_sql="$RUNNER_TEMP/finance-staging-smoke-finance.sql"
          node finance/scripts/staging-smoke-identity-sql.mjs "$ACTION" --expires-at "$EXPIRES_AT" --core-output "$core_sql" --finance-output "$finance_sql"
          npx --yes wrangler@4.114.0 d1 execute skincos-db-staging --remote --file "$core_sql"
          npx --yes wrangler@4.114.0 d1 execute skincos-finance-staging --remote --file "$finance_sql"
          rm -f "$core_sql" "$finance_sql"

      - name: Release Finance release lease for synthetic identity
        if: always()
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-smoke-identity.json
      - name: Release shared staging D1 lease for synthetic identity
        if: always()
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-finance-staging-d1.json
