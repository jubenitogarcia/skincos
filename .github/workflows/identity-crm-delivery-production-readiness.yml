name: Identity CRM delivery production readiness

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail unless the externally read back production gate is complete
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: identity-crm-delivery-production-readiness
  cancel-in-progress: true

jobs:
  audit:
    name: Read back Identity production owner and custody
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.12.0'

      - name: Read Cloudflare metadata without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IDENTITY_CRM_PRODUCTION_WORKER_NAME: ${{ vars.IDENTITY_CRM_PRODUCTION_WORKER_NAME }}
          IDENTITY_CRM_STAGING_WORKER_NAME: ${{ vars.IDENTITY_CRM_STAGING_WORKER_NAME }}
          IDENTITY_CRM_DELIVERY_PRODUCTION_CUSTODY_REF: ${{ vars.IDENTITY_CRM_DELIVERY_PRODUCTION_CUSTODY_REF }}
          IDENTITY_CRM_DELIVERY_PRODUCTION_CUSTODY_ATTESTED: ${{ vars.IDENTITY_CRM_DELIVERY_PRODUCTION_CUSTODY_ATTESTED }}
          IDENTITY_CRM_DELIVERY_PRODUCTION_CALLER_ATTESTED: ${{ vars.IDENTITY_CRM_DELIVERY_PRODUCTION_CALLER_ATTESTED }}
          IDENTITY_CRM_DELIVERY_PRODUCTION_REPLAY_ATTESTED: ${{ vars.IDENTITY_CRM_DELIVERY_PRODUCTION_REPLAY_ATTESTED }}
          IDENTITY_CRM_DELIVERY_PRODUCTION_ROTATION_ATTESTED: ${{ vars.IDENTITY_CRM_DELIVERY_PRODUCTION_ROTATION_ATTESTED }}
          IDENTITY_CRM_PRODUCTION_READINESS_STRICT: ${{ inputs.strict }}
          IDENTITY_CRM_PRODUCTION_READINESS_REPORT: ${{ runner.temp }}/identity-crm-production-readiness/report.json
        run: |
          set -euo pipefail
          node .github/scripts/identity-crm-production-readiness.mjs

      - name: Upload sanitized readback artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: identity-crm-production-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/identity-crm-production-readiness/report.json
          if-no-files-found: error
          retention-days: 30
