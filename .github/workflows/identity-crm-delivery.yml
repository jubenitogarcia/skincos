          ACTIVE="$ACTIVE" INCUMBENT="$INCUMBENT" node - "$RUNNER_TEMP/crm-identity-issuer-rollback-status.json" <<'NODE'
          const fs = require('node:fs'); const versions = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))?.versions || [];
