      - name: Upload sanitised caller-disabled bootstrap evidence
        if: ${{ inputs.operation == 'bootstrap' && steps.bootstrap_runtime_preflight.outputs.state == 'caller-disabled' && steps.bootstrap_readback.outputs.state == 'both-present' && steps.bootstrap_runtime_readback.outputs.state == 'caller-disabled' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
