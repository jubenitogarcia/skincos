name: Influencer Intelligence calibration

on:
  pull_request:
    paths:
      - "social/influencer-intelligence/**"
      - ".github/workflows/influencer-intelligence-calibration.yml"

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run deterministic calibration and report readback
        run: node --test social/influencer-intelligence/tests/calibration.test.mjs
