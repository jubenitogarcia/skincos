name: Influencer Intelligence gap analysis governance

on:
  pull_request:
    paths:
      - ".github/workflows/influencer-intelligence-gap-analysis-governance.yml"
      - "social/influencer-intelligence/EXTERNAL_PROVIDER_GAP_ANALYSIS.md"
      - "social/influencer-intelligence/tests/external-provider-gap-analysis.test.mjs"
      - "social/influencer-intelligence/architecture.mjs"
      - "social/influencer-intelligence/README.md"
      - "docs/decisions/adr-influencer-intelligence-external-provider-gap-analysis.md"
      - "docs/decisions/adr-influencer-intelligence-architecture.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/influencer-intelligence-gap-analysis-governance.yml"
      - "social/influencer-intelligence/EXTERNAL_PROVIDER_GAP_ANALYSIS.md"
      - "social/influencer-intelligence/tests/external-provider-gap-analysis.test.mjs"
      - "social/influencer-intelligence/architecture.mjs"
      - "social/influencer-intelligence/README.md"
      - "docs/decisions/adr-influencer-intelligence-external-provider-gap-analysis.md"
      - "docs/decisions/adr-influencer-intelligence-architecture.md"

permissions:
  contents: read

jobs:
  m13-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test Influencer Intelligence gap analysis contract
        run: node --test social/influencer-intelligence/tests/external-provider-gap-analysis.test.mjs social/influencer-intelligence/tests/architecture.test.mjs
