name: Issues Audit & Auto-Close

# Trivial comment: Forçar atualização do workflow para garantir uso da versão mais recente

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Update system and essential tools
        run: |
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y jq curl git
          # Atualizar o GitHub CLI (gh) para a versão mais recente
          type -p gh && gh --version
          # Não remover o gh CLI, apenas garantir instalação/atualização
          type -p gh && gh --version || true
          type -p curl && curl --version
          # Instalação oficial do gh
          type -p gh || (type -p curl && sudo mkdir -p -m 755 /etc/apt/keyrings && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/etc/apt/keyrings/githubcli-archive-keyring.gpg && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt-get update -y && sudo apt-get install -y gh)
          gh --version
      - name: Ensure jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
      - name: Close issues with merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # List open issues (exclude PRs)
          gh api -H "Accept: application/vnd.github+json" repos/$REPO/issues --paginate -f state=open > issues.json
          if ! jq -e . issues.json >/dev/null 2>&1; then
            echo "No issues or failed to list."; exit 0
          fi
          for issue in $(jq -r '.[] | select(.pull_request|not) | .number' issues.json); do
            echo "Evaluating issue #$issue"
            # If labeled as resolved or done, close immediately
            labels=$(gh api repos/$REPO/issues/$issue/labels -q '.[].name' | tr '\n' ',' || true)
            if echo "$labels" | grep -qiE '(resolved|done|fixed)'; then
              gh issue close "$issue" -R "$REPO" || true
              if ! gh issue comment "$issue" -R "$REPO" -b "Fechado automaticamente: label indica resolvido."; then
                echo "[DEBUG] gh issue comment falhou para issue #$issue, tentando curl..."
                curl -v -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  -d '{"body": "Fechado automaticamente: label indica resolvido."}' \
                  "https://api.github.com/repos/$REPO/issues/$issue/comments" || echo "[DEBUG] curl também falhou para issue #$issue"
              fi
              continue
            fi
            # Find linked PRs via timeline events and closing keywords in PR bodies
            links=$(gh api repos/$REPO/issues/$issue/timeline --paginate -H "Accept: application/vnd.github+json" | jq -r '.[].source.issue.number? // empty' | sort -u || true)
            closed_via_pr=false
            if [ -n "$links" ]; then
              for pr in $links; do
                merged=$(gh pr view "$pr" -R "$REPO" --json merged -q .merged || echo false)
                if [ "$merged" = "true" ]; then closed_via_pr=true; break; fi
              done
            fi
            if [ "$closed_via_pr" = true ]; then
              gh issue close "$issue" -R "$REPO" || true
              if ! gh issue comment "$issue" -R "$REPO" -b "Fechado automaticamente: PR relacionado foi mergeado."; then
                echo "[DEBUG] gh issue comment falhou para issue #$issue, tentando curl..."
                curl -v -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  -d '{"body": "Fechado automaticamente: PR relacionado foi mergeado."}' \
                  "https://api.github.com/repos/$REPO/issues/$issue/comments" || echo "[DEBUG] curl também falhou para issue #$issue"
              fi
              continue
            fi
            # Check closing keywords in comments and recent merged PRs mentioning the issue
            comments=$(gh api repos/$REPO/issues/$issue/comments --paginate -q '.[].body' | tr '\n' ' ' || true)
            if echo "$comments" | grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#$issue\b"; then
              gh issue close "$issue" -R "$REPO" || true
              if ! gh issue comment "$issue" -R "$REPO" -b "Fechado automaticamente: comentários indicam fechamento."; then
                echo "[DEBUG] gh issue comment falhou para issue #$issue, tentando curl..."
                curl -v -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  -d '{"body": "Fechado automaticamente: comentários indicam fechamento."}' \
                  "https://api.github.com/repos/$REPO/issues/$issue/comments" || echo "[DEBUG] curl também falhou para issue #$issue"
              fi
              continue
            fi
            # Look back at last 50 merged PRs only
            prs=$(gh api -H "Accept: application/vnd.github+json" repos/$REPO/pulls --paginate -f state=closed | jq -r '.[] | select(.merged_at!=null) | .number' | head -n 50)
            for pr in $prs; do
              body=$(gh pr view "$pr" -R "$REPO" --json body -q .body || echo "")
              if echo "$body" | grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#$issue\b"; then
                gh issue close "$issue" -R "$REPO" || true
                if ! gh issue comment "$issue" -R "$REPO" -b "Fechado automaticamente: fechado por PR #$pr (keywords)."; then
                  echo "[DEBUG] gh issue comment falhou para issue #$issue, tentando curl..."
                  curl -v -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    -d '{"body": "Fechado automaticamente: fechado por PR #$pr (keywords)."}' \
                    "https://api.github.com/repos/$REPO/issues/$issue/comments" || echo "[DEBUG] curl também falhou para issue #$issue"
                fi
                break
              fi
            done
          done
