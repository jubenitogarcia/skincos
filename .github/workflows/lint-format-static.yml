name: Lint, Format & Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  js-ts-lint:
    name: JS/TS Checks (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Repository policy checks
        run: |
          set -euxo pipefail
          python3 scripts/check-large-artifacts.py --allowlist .github/allowlists/large-artifacts.txt --max-bytes 5242880
          python3 scripts/validate-n8n-workflows.py
          node scripts/check-js-security-exceptions.mjs
          bash backend/scripts/ci-no-demo-guard.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            website/package-lock.json

      - name: Frontend install
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm ci

      - name: Frontend lint
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm run lint

      - name: Frontend typecheck
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm run typecheck

      - name: Frontend unit tests
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm run test

      - name: Frontend build
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm run build

      - name: Website install
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm ci

      - name: Website lint
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run lint

      - name: Website build
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run build

      - name: Setup pnpm (for backend workspace)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Backend workspace install (pnpm)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend install --frozen-lockfile

      - name: Backend lint/format/typecheck (workspace advisory)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend -r run lint --if-present
          pnpm -C backend -r run format:check --if-present
          pnpm -C backend -r run typecheck --if-present

      - name: CRM API tests
        if: ${{ hashFiles('backend/apps/crm-api/package.json') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend --filter crm-api test

  python-lint:
    name: Python Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run flake8 (core strict)
        run: |
          python -m flake8 backend/config backend/libs --count --show-source --statistics

      - name: Run flake8 (legacy advisory)
        run: |
          python -m flake8 backend/apps/automations/sales_chart_messenger backend/tools/scripts --exclude backend/tools/scripts/xiaomi --count --show-source --statistics --exit-zero

      - name: Run black (core strict)
        run: |
          python -m black --check backend/config backend/libs

      - name: Run black (legacy advisory)
        continue-on-error: true
        run: |
          python -m black --check backend/apps/automations/sales_chart_messenger backend/tools/scripts

      - name: Run mypy (core strict)
        run: |
          python -m mypy backend/config backend/libs --ignore-missing-imports

      - name: Run mypy (legacy advisory)
        continue-on-error: true
        run: |
          python -m mypy backend/apps/automations/sales_chart_messenger backend/tools/scripts --ignore-missing-imports
