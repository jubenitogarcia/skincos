name: Lint, Format & Static Analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "ops/codex/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/governance/**"
      - ".github/workflows/codex-autonomy-gate.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/project-orchestration/**"
      - "docs/project-state/**"
      - ".codex/**"
      - "skills/**"
      - "ops/codex/**"
      - "scripts/codex-*.mjs"
      - "scripts/tests/codex-*.mjs"
      - "scripts/codex-*.sh"
      - "scripts/*codex*.ps1"
      - ".github/governance/**"
      - ".github/workflows/codex-autonomy-gate.yml"
  workflow_dispatch:

jobs:
  changes:
    name: Classify lint surface
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      website: ${{ steps.scope.outputs.website }}
      backend: ${{ steps.scope.outputs.backend }}
      crm_api: ${{ steps.scope.outputs.crm_api }}
      python: ${{ steps.scope.outputs.python }}
      node: ${{ steps.scope.outputs.node }}
      workflow: ${{ steps.scope.outputs.workflow }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - id: bounded-diff
        name: Prepare bounded immutable diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/codex-bounded-diff.mjs --base "${PR_BASE_SHA:-$BEFORE_SHA}" --head "${PR_HEAD_SHA:-$HEAD_SHA}" --output "$GITHUB_OUTPUT"
      - id: scope
        env:
          BOUNDED_BASE_SHA: ${{ steps.bounded-diff.outputs.base }}
          BOUNDED_HEAD_SHA: ${{ steps.bounded-diff.outputs.head }}
        run: |
          set -euo pipefail
          base="$BOUNDED_BASE_SHA"
          head="$BOUNDED_HEAD_SHA"
          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          changed() {
            if git diff --quiet "$base...$head" -- "$@"; then printf false; else printf true; fi
          }
          frontend="$(changed crm/console package.json package-lock.json)"
          website="$(changed website booking package.json package-lock.json)"
          backend="$(changed backend package.json package-lock.json pnpm-lock.yaml)"
          crm_api="$(changed crm/api package.json package-lock.json)"
          python="$(changed backend)"
          workflow="$(changed .github/workflows/lint-format-static.yml)"
          node=false
          if [[ "$frontend" == true || "$website" == true || "$backend" == true || "$crm_api" == true || "$workflow" == true ]]; then node=true; fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "crm_api=$crm_api" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

  js-ts-lint:
    name: JS/TS Checks (workspace)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Repository policy checks
        run: |
          set -euxo pipefail
          python3 scripts/check-large-artifacts.py --allowlist .github/allowlists/large-artifacts.txt --max-bytes 5242880
          node scripts/check-js-security-exceptions.mjs
          bash backend/scripts/ci-no-demo-guard.sh

      - name: Set up Node.js
        if: ${{ needs.changes.outputs.node == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            crm/console/package-lock.json
            website/package-lock.json

      - name: Frontend install
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm ci

      - name: Frontend lint
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run lint

      - name: Frontend typecheck
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run typecheck

      - name: Frontend unit tests
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run test

      - name: Frontend build
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run build

      - name: Website install
        if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd website
          npm ci

      - name: Website lint
        if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd website
          npm run lint

      - name: Website build
        if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          cd website
          npm run build

      - name: Setup pnpm (for backend workspace)
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Backend workspace install (pnpm)
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          pnpm -C backend install --frozen-lockfile

      - name: Backend lint/format/typecheck (workspace advisory)
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          pnpm -C backend -r run lint --if-present
          pnpm -C backend -r run format:check --if-present
          pnpm -C backend -r run typecheck --if-present

      - name: CRM API tests
        if: ${{ needs.changes.outputs.crm_api == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: |
          set -euxo pipefail
          npm --prefix crm/api ci
          npm --prefix crm/api test

  python-lint:
    name: Python Lint & Static Analysis
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run flake8 (core strict)
        run: |
          python -m flake8 backend/config backend/libs --count --show-source --statistics

      - name: Run flake8 (legacy advisory)
        run: |
          python -m flake8 backend/apps/automations/sales_chart_messenger backend/tools/scripts --exclude backend/tools/scripts/xiaomi --count --show-source --statistics --exit-zero

      - name: Run black (core strict)
        run: |
          python -m black --check backend/config backend/libs

      - name: Run black (legacy advisory)
        continue-on-error: true
        run: |
          python -m black --check backend/apps/automations/sales_chart_messenger backend/tools/scripts

      - name: Run mypy (core strict)
        run: |
          python -m mypy backend/config backend/libs --ignore-missing-imports

      - name: Run mypy (legacy advisory)
        continue-on-error: true
        run: |
          python -m mypy backend/apps/automations/sales_chart_messenger backend/tools/scripts --ignore-missing-imports
