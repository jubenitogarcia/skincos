name: Lint, Format & Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  js-ts-lint:
    name: JS/TS Checks (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Frontend install
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm ci

      - name: Frontend lint
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm run lint

      - name: Frontend typecheck (advisory)
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        continue-on-error: true
        run: |
          set -euxo pipefail
          cd frontend
          npm run typecheck

      - name: Frontend build
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm run build

      - name: Setup pnpm (for backend workspace)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Backend workspace install (pnpm)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend install --frozen-lockfile

      - name: Backend lint/format/typecheck (best-effort)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend -r run lint --if-present
          pnpm -C backend -r run format:check --if-present
          pnpm -C backend -r run typecheck --if-present

  python-lint:
    name: Python Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run flake8
        run: |
          python -m flake8 backend/config backend/libs backend/archive/tools/repo_checks --count --show-source --statistics --exit-zero
      - name: Run black (check only)
        continue-on-error: true
        run: |
          python -m black --check backend/config backend/libs backend/archive/tools/repo_checks
      - name: Run mypy (type checking)
        continue-on-error: true
        run: |
          python -m mypy backend/config backend/libs backend/archive/tools/repo_checks --ignore-missing-imports
