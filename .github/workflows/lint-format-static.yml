name: Lint, Format & Static Analysis

on:
  workflow_call:
    inputs:
      run_crm:
        required: false
        type: boolean
        default: false
      run_website:
        required: false
        type: boolean
        default: false
      run_backend:
        required: false
        type: boolean
        default: false
      run_python:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_crm:
        description: Run CRM console and API quality checks.
        required: false
        type: boolean
        default: true
      run_website:
        description: Run website quality checks.
        required: false
        type: boolean
        default: true
      run_backend:
        description: Run backend workspace checks.
        required: false
        type: boolean
        default: true
      run_python:
        description: Run Python static analysis and coverage.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  js-ts-lint:
    name: JS/TS Checks (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Repository policy checks
        run: |
          set -euxo pipefail
          python3 scripts/check-large-artifacts.py --allowlist .github/allowlists/large-artifacts.txt --max-bytes 5242880
          python3 scripts/validate-n8n-workflows.py
          node scripts/check-js-security-exceptions.mjs
          bash backend/scripts/ci-no-demo-guard.sh

      - name: Set up Node.js
        if: ${{ inputs.run_crm || inputs.run_website || inputs.run_backend }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            crm/console/package-lock.json
            website/package-lock.json

      - name: Frontend install
        if: ${{ inputs.run_crm && hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm ci

      - name: Frontend lint
        if: ${{ inputs.run_crm && hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run lint

      - name: Frontend typecheck
        if: ${{ inputs.run_crm && hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run typecheck

      - name: Frontend coverage
        if: ${{ inputs.run_crm && hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run test:coverage

      - name: Frontend build
        if: ${{ inputs.run_crm && hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run build

      - name: Website install
        if: ${{ inputs.run_website && hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm ci

      - name: Website lint
        if: ${{ inputs.run_website && hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run lint

      - name: Website typecheck
        if: ${{ inputs.run_website && hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run typecheck

      - name: Website tests
        if: ${{ inputs.run_website && hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run test

      - name: Website build
        if: ${{ inputs.run_website && hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run build

      - name: Setup pnpm (for backend workspace)
        if: ${{ inputs.run_backend && hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Backend workspace install (pnpm)
        if: ${{ inputs.run_backend && hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend install --frozen-lockfile

      - name: Backend lint/format/typecheck (workspace advisory)
        if: ${{ inputs.run_backend && hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend -r run lint --if-present
          pnpm -C backend -r run format:check --if-present
          pnpm -C backend -r run typecheck --if-present

      - name: CRM API tests
        if: ${{ (inputs.run_crm || inputs.run_backend) && hashFiles('crm/api/package.json') != '' }}
        run: |
          set -euxo pipefail
          npm --prefix crm/api ci
          npm --prefix crm/api test

  python-lint:
    name: Python Lint & Static Analysis
    if: ${{ inputs.run_python }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run flake8 (core strict)
        run: |
          python -m flake8 backend/config backend/libs --count --show-source --statistics

      - name: Run flake8 (legacy advisory)
        run: |
          python -m flake8 backend/apps/automations/sales_chart_messenger backend/tools/scripts --exclude backend/tools/scripts/xiaomi --count --show-source --statistics --exit-zero

      - name: Run black (core strict)
        run: |
          python -m black --check backend/config backend/libs

      - name: Run black (legacy advisory)
        continue-on-error: true
        run: |
          python -m black --check backend/apps/automations/sales_chart_messenger backend/tools/scripts

      - name: Run mypy (core strict)
        run: |
          python -m mypy backend/config backend/libs --ignore-missing-imports

      - name: Run mypy (legacy advisory)
        continue-on-error: true
        run: |
          python -m mypy backend/apps/automations/sales_chart_messenger backend/tools/scripts --ignore-missing-imports

      - name: Run pytest with coverage
        run: |
          cd backend
          python -m pytest tests/unit --cov=config --cov-fail-under=80 --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: backend/coverage.xml
