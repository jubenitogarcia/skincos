name: Lint, Format & Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  js-ts-lint:
    name: JS/TS Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Install dependencies (all projects)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package-lock.json" ] || [ -f "$dir/pnpm-lock.yaml" ] || [ -f "$dir/yarn.lock" ]; then
              (cd "$dir" && npm install --no-audit --no-fund)
            fi
          done
      - name: Run ESLint (all projects)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package.json" ] && jq -e '.scripts["lint"]' "$dir/package.json" >/dev/null; then
              (cd "$dir" && npm run lint)
            fi
          done
      - name: Run Prettier (all projects)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package.json" ] && jq -e '.scripts["format:check"]' "$dir/package.json" >/dev/null; then
              (cd "$dir" && npm run format:check)
            fi
          done

  python-lint:
    name: Python Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dev dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
      - name: Run flake8
        run: |
          python -m flake8 backend/ --count --show-source --statistics
      - name: Run black (check only)
        run: |
          python -m black --check backend/
      - name: Run mypy (type checking)
        run: |
          python -m mypy backend/
