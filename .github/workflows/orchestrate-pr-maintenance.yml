name: Orchestrate PR Maintenance

on:
  push:
    branches:
      - feat/ai-knowledge-dashboard-ui
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Configure Branch Protection
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '')
            const resp = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'configure-branch-protection.yml',
              ref,
            })
            core.info(`configure-branch-protection => ${resp.status}`)

      - name: Dispatch PR Auto Rebase
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '')
            const resp = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-auto-rebase.yml',
              ref,
            })
            core.info(`pr-auto-rebase => ${resp.status}`)

      - name: Dispatch PR Maintainer Auto-Merge
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '')
            const resp = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-maintainer.yml',
              ref,
            })
            core.info(`pr-maintainer => ${resp.status}`)
