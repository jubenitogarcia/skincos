name: Capture legacy Ponto backfill snapshot
run-name: Capture legacy Ponto snapshot ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA to bind the one-use snapshot authorization.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ponto-legacy-backfill-capture
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'jubenitogarcia/skincos' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify the exact current main source before protected capture custody
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'PONTO_LEGACY_CAPTURE_RELEASE_SHA_INVALID'; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || { echo 'PONTO_LEGACY_CAPTURE_WORKFLOW_SHA_MISMATCH'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'PONTO_LEGACY_CAPTURE_CHECKOUT_SHA_MISMATCH'; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]] || { echo 'PONTO_LEGACY_CAPTURE_MAIN_ADVANCED'; exit 1; }
          echo 'PONTO_LEGACY_CAPTURE_PREFLIGHT_OK values_emitted=false'

  capture:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, skincos-native-custody]
    environment: ponto-legacy-backfill-capture
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Sign an exact short-lived capture authorization without exposing its private key
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_LEGACY_SNAPSHOT_CAPTURE_PRIVATE_KEY: ${{ secrets.PONTO_LEGACY_SNAPSHOT_CAPTURE_PRIVATE_KEY }}
          PONTO_LEGACY_SNAPSHOT_CAPTURE_KEY_ID: ${{ vars.PONTO_LEGACY_SNAPSHOT_CAPTURE_KEY_ID }}
          PONTO_LEGACY_SNAPSHOT_CAPTURE_POLICY_SHA256: ${{ vars.PONTO_LEGACY_SNAPSHOT_CAPTURE_POLICY_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo 'PONTO_LEGACY_CAPTURE_RUN_CONTEXT_INVALID'; exit 1; }
          [[ -n "${PONTO_LEGACY_SNAPSHOT_CAPTURE_PRIVATE_KEY:-}" ]] || { echo 'PONTO_LEGACY_CAPTURE_PRIVATE_KEY_REQUIRED'; exit 1; }
          [[ "$PONTO_LEGACY_SNAPSHOT_CAPTURE_KEY_ID" =~ ^[a-z][a-z0-9-]{1,63}$ ]] || { echo 'PONTO_LEGACY_CAPTURE_KEY_ID_INVALID'; exit 1; }
          [[ "$PONTO_LEGACY_SNAPSHOT_CAPTURE_POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'PONTO_LEGACY_CAPTURE_POLICY_SHA256_INVALID'; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" && "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'PONTO_LEGACY_CAPTURE_MAIN_ADVANCED'; exit 1; }
          authorization="$RUNNER_TEMP/ponto-legacy-snapshot-authorization.json"
          umask 077
          RELEASE_SHA="$RELEASE_SHA" PONTO_AUTHORIZATION_FILE="$authorization" node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const fields = [
            "schemaVersion", "domain", "operation", "authorizationId", "policySha256",
            "repositoryId", "repository", "workflowPath", "githubRef", "workflowJob",
            "sourceSha", "workflowRunId", "runAttempt", "target", "purpose",
            "issuedAt", "expiresAt", "singleUse",
          ];
          const now = Date.now();
          const claims = {
            schemaVersion: 1,
            domain: "skincos/ponto/legacy-snapshot-custody/v1",
            operation: "capture",
            authorizationId: crypto.randomUUID(),
            policySha256: process.env.PONTO_LEGACY_SNAPSHOT_CAPTURE_POLICY_SHA256,
            repositoryId: String(process.env.GITHUB_REPOSITORY_ID || ""),
            repository: process.env.GITHUB_REPOSITORY,
            workflowPath: ".github/workflows/ponto-legacy-backfill-capture.yml",
            githubRef: process.env.GITHUB_REF,
            workflowJob: "capture",
            sourceSha: process.env.RELEASE_SHA,
            workflowRunId: String(process.env.GITHUB_RUN_ID || ""),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || "0"),
            target: "staging",
            purpose: "ponto-legacy-snapshot-capture",
            issuedAt: new Date(now).toISOString(),
            expiresAt: new Date(now + 5 * 60_000).toISOString(),
            singleUse: true,
          };
          const key = crypto.createPrivateKey(process.env.PONTO_LEGACY_SNAPSHOT_CAPTURE_PRIVATE_KEY);
          if (key.asymmetricKeyType !== "ed25519") throw new Error("PONTO_LEGACY_CAPTURE_PRIVATE_KEY_TYPE_INVALID");
          const canonical = JSON.stringify(Object.fromEntries(fields.map((field) => [field, claims[field]])));
          const authorization = {
            ...claims,
            signature: {
              algorithm: "Ed25519",
              keyId: process.env.PONTO_LEGACY_SNAPSHOT_CAPTURE_KEY_ID,
              valueBase64url: crypto.sign(null, Buffer.from(canonical), key).toString("base64url"),
            },
          };
          fs.writeFileSync(process.env.PONTO_AUTHORIZATION_FILE, `${JSON.stringify(authorization)}\n`, { mode: 0o600 });
          NODE
          unset PONTO_LEGACY_SNAPSHOT_CAPTURE_PRIVATE_KEY
          echo "PONTO_LEGACY_CAPTURE_AUTHORIZATION_FILE=$authorization" >> "$GITHUB_ENV"

      - name: Capture the fixed legacy pair and emit only a sanitized receipt
        env:
          AUTHORIZATION_FILE: ${{ env.PONTO_LEGACY_CAPTURE_AUTHORIZATION_FILE }}
        run: |
          set -euo pipefail
          [[ -s "$AUTHORIZATION_FILE" ]] || { echo 'PONTO_LEGACY_CAPTURE_AUTHORIZATION_REQUIRED'; exit 1; }
          raw_receipt="$RUNNER_TEMP/ponto-legacy-snapshot-receipt.raw.json"
          sanitized_receipt="$RUNNER_TEMP/ponto-legacy-snapshot-receipt.json"
          trap 'rm -f "$AUTHORIZATION_FILE" "$raw_receipt"' EXIT
          sudo -n /usr/local/sbin/skincos-capture-ponto-legacy-snapshot capture < "$AUTHORIZATION_FILE" > "$raw_receipt"
          node .github/scripts/ponto-legacy-snapshot-receipt.mjs validate "$raw_receipt" > "$sanitized_receipt"
          [[ -s "$sanitized_receipt" ]] || { echo 'PONTO_LEGACY_CAPTURE_RECEIPT_INVALID'; exit 1; }

      - name: Upload the sanitized capture receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-legacy-snapshot-receipt-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-legacy-snapshot-receipt.json
          retention-days: 90
          if-no-files-found: error
