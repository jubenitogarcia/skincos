name: Ponto orchestrator single-use gate

on:
  workflow_call:
    inputs:
      required:
        required: true
        type: boolean
      lease_key:
        required: true
        type: string
      stage:
        required: true
        type: string
      target:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      orchestrator_run_id:
        required: false
        type: string
permissions:
  actions: read
  checks: write
  contents: read
  deployments: read

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replayed governed invocation
        if: ${{ inputs.required }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo 'Governed Ponto capabilities cannot be consumed from a workflow rerun'; exit 1; }
      - name: Allow only explicitly non-Ponto or preview publishers without a lease
        if: ${{ !inputs.required }}
        run: echo "Single-use Ponto orchestrator capability is not required for this invocation."
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        if: ${{ inputs.required }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Refuse candidate-controlled gate code
        if: ${{ inputs.required }}
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Ponto release SHA is invalid'; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Ponto gate must execute from main'; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || { echo 'Ponto gate source differs from the coordinator SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Ponto gate checkout is not the trusted workflow revision'; exit 1; }
      - name: Revalidate protected target environment before consuming authority
        if: ${{ inputs.required }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_ENVIRONMENT_TARGET: ${{ inputs.target }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          [[ "$PONTO_ENVIRONMENT_TARGET" == staging || "$PONTO_ENVIRONMENT_TARGET" == production ]] || {
            echo 'Governed Ponto capability target must be staging or production'
            exit 1
          }
          [[ "$ORCHESTRATOR_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Governed Ponto capability consumption requires the direct coordinator run'
            exit 1
          }
          issuer_actor="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORCHESTRATOR_RUN_ID" --jq '.actor.login')"
          [[ "$issuer_actor" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,38})$ ]] || {
            echo 'Governed Ponto coordinator actor is invalid'
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/environments/$PONTO_ENVIRONMENT_TARGET" \
            > "$RUNNER_TEMP/ponto-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/$PONTO_ENVIRONMENT_TARGET/deployment-branch-policies?per_page=100" \
            > "$RUNNER_TEMP/ponto-environment-branch-policies.json"
          # A workflow-dispatch child runs as github-actions[bot]; preserve the
          # direct coordinator actor for the single-operator attestation.
          GITHUB_ACTOR="$issuer_actor" node .github/scripts/ponto-environment-protection.mjs \
            "$RUNNER_TEMP/ponto-environment.json" \
            "$RUNNER_TEMP/ponto-environment-branch-policies.json" \
            "$RUNNER_TEMP/ponto-environment-protection.json"
          rm -f \
            "$RUNNER_TEMP/ponto-environment.json" \
            "$RUNNER_TEMP/ponto-environment-branch-policies.json"
      - name: Validate, transition, and confirm the exact child-bound coordinator capability
        if: ${{ inputs.required }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON: ${{ vars.PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON }}
          LEASE_KEY: ${{ inputs.lease_key }}
          ORCHESTRATOR_STAGE: ${{ inputs.stage }}
          ORCHESTRATOR_TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs consume-check \
            "$LEASE_KEY" \
            "$ORCHESTRATOR_STAGE" \
            "$ORCHESTRATOR_TARGET" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
