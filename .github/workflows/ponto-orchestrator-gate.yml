name: Ponto orchestrator single-use gate

on:
  workflow_call:
    inputs:
      required:
        required: true
        type: boolean
      lease_key:
        required: true
        type: string
      stage:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      orchestrator_run_id:
        required: false
        type: string
      orchestrator_lease_token:
        required: false
        type: string

permissions:
  actions: write
  contents: read

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only explicitly non-Ponto or preview publishers without a lease
        if: ${{ !inputs.required }}
        run: echo "Single-use Ponto orchestrator capability is not required for this invocation."
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        if: ${{ inputs.required }}
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Download exact lease issued by the active coordinator
        if: ${{ inputs.required }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          LEASE_KEY: ${{ inputs.lease_key }}
        run: |
          set -euo pipefail
          [[ "$ORCHESTRATOR_RUN_ID" =~ ^[0-9]+$ && "$LEASE_KEY" =~ ^[a-z][a-z0-9-]{1,63}$ ]] || { echo 'Ponto orchestrator lease identity is invalid'; exit 1; }
          mkdir -p "$RUNNER_TEMP/ponto-orchestrator-lease"
          gh run download "$ORCHESTRATOR_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ponto-orchestrator-lease-$ORCHESTRATOR_RUN_ID-$LEASE_KEY" \
            --dir "$RUNNER_TEMP/ponto-orchestrator-lease"
      - name: Validate and atomically consume the exact coordinator capability
        if: ${{ inputs.required }}
        env:
          GH_TOKEN: ${{ github.token }}
          LEASE_KEY: ${{ inputs.lease_key }}
          ORCHESTRATOR_STAGE: ${{ inputs.stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          ORCHESTRATOR_LEASE_TOKEN: ${{ inputs.orchestrator_lease_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORCHESTRATOR_LEASE_TOKEN"
          node .github/scripts/ponto-orchestrator-lease.mjs consume \
            "$RUNNER_TEMP/ponto-orchestrator-lease/$LEASE_KEY.json" \
            "$LEASE_KEY" \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID" \
            "$ORCHESTRATOR_LEASE_TOKEN"
