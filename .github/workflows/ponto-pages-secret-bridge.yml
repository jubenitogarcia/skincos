name: Ponto Pages environment secret bridge
run-name: Ponto Pages secret bridge ${{ inputs.target }} ${{ inputs.release_sha }} apply=${{ inputs.apply }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Source root environment and exact dedicated Pages target.
        required: true
        default: staging
        type: choice
        options: [staging, production]
      release_sha:
        description: Full current main SHA that owns the bridge invocation.
        required: true
        type: string
      root_custody_run_id:
        description: Successful exact Ponto Worker root-custody run for this SHA and target.
        required: true
        type: string
      apply:
        description: Explicitly write the five missing target-environment secrets. Defaults to false.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Deliberately shares the dedicated Pages publisher mutex for the same target;
  # this bridge never mutates Cloudflare itself.
  group: ponto-pages-governed-publisher-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'jubenitogarcia/skincos' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact current main source without secret access
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROOT_CUSTODY_RUN_ID: ${{ inputs.root_custody_run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_RELEASE_SHA_INVALID'; exit 1; }
          [[ "$ROOT_CUSTODY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_ROOT_CUSTODY_RUN_ID_INVALID'; exit 1; }
          [[ "$WORKFLOW_SHA" == "$RELEASE_SHA" ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_WORKFLOW_SHA_MISMATCH'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_CHECKOUT_SHA_MISMATCH'; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_MAIN_ADVANCED'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          echo 'PONTO_PAGES_SECRET_BRIDGE_PREFLIGHT_OK values_emitted=false'

  bridge:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && inputs.apply == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This is intentionally the source-root environment, never the Pages target
    # environment. The target is hardcoded in the bridge contract.
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Resolve the hardcoded source-to-target environment map
        env:
          SOURCE_ENVIRONMENT: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$SOURCE_ENVIRONMENT" in
            staging) TARGET_ENVIRONMENT='ponto-pages-staging' ;;
            production) TARGET_ENVIRONMENT='ponto-pages-production' ;;
            *) echo 'PONTO_PAGES_SECRET_BRIDGE_TARGET_IS_INVALID'; exit 1 ;;
          esac
          echo "PONTO_PAGES_BRIDGE_TARGET_ENVIRONMENT=$TARGET_ENVIRONMENT" >> "$GITHUB_ENV"

      - name: Verify source custody and the empty dedicated target baseline by name only
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_ENVIRONMENT: ${{ inputs.target }}
          TARGET_ENVIRONMENT: ${{ env.PONTO_PAGES_BRIDGE_TARGET_ENVIRONMENT }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_GH_TOKEN_REQUIRED'; exit 1; }
          source_secrets="$RUNNER_TEMP/ponto-pages-bridge-source-secrets.json"
          repository_secrets="$RUNNER_TEMP/ponto-pages-bridge-repository-secrets.json"
          source_variables="$RUNNER_TEMP/ponto-pages-bridge-source-variables.json"
          repository_variables="$RUNNER_TEMP/ponto-pages-bridge-repository-variables.json"
          target_secrets="$RUNNER_TEMP/ponto-pages-bridge-target-secrets-before.json"
          target_variables="$RUNNER_TEMP/ponto-pages-bridge-target-variables-before.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$SOURCE_ENVIRONMENT/secrets?per_page=100" > "$source_secrets"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" > "$repository_secrets"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$SOURCE_ENVIRONMENT/variables?per_page=100" > "$source_variables"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/variables?per_page=100" > "$repository_variables"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/secrets?per_page=100" > "$target_secrets"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/variables?per_page=100" > "$target_variables"
          node .github/scripts/ponto-pages-secret-bridge.mjs validate-custody \
            "$SOURCE_ENVIRONMENT" \
            "$source_secrets" \
            "$repository_secrets" \
            "$source_variables" \
            "$repository_variables"
          node .github/scripts/ponto-pages-secret-bridge.mjs validate-target \
            "$SOURCE_ENVIRONMENT" before "$target_secrets" "$target_variables"
          rm -f "$source_secrets" "$repository_secrets" "$source_variables" "$repository_variables" "$target_secrets" "$target_variables"

      - name: Download and verify the exact canonical root-custody artifact
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_ENVIRONMENT: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROOT_CUSTODY_RUN_ID: ${{ inputs.root_custody_run_id }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_GH_TOKEN_REQUIRED'; exit 1; }
          workflow_file="$RUNNER_TEMP/ponto-pages-bridge-root-workflow.json"
          run_file="$RUNNER_TEMP/ponto-pages-bridge-root-run.json"
          artifacts_file="$RUNNER_TEMP/ponto-pages-bridge-root-artifacts.json"
          artifact_metadata_file="$RUNNER_TEMP/ponto-pages-bridge-root-artifact-metadata.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-workers-sync-ponto-secrets.yml" > "$workflow_file"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROOT_CUSTODY_RUN_ID" > "$run_file"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$ROOT_CUSTODY_RUN_ID/artifacts?per_page=100" > "$artifacts_file"
          artifact_name="ponto-root-custody-$SOURCE_ENVIRONMENT-$RELEASE_SHA"
          SOURCE_ENVIRONMENT="$SOURCE_ENVIRONMENT" \
          RELEASE_SHA="$RELEASE_SHA" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
          PONTO_ARTIFACT_METADATA_FILE="$artifact_metadata_file" \
          node --input-type=module - "$workflow_file" "$run_file" "$artifacts_file" <<'NODE'
          import fs from "node:fs";
          const [workflowFile, runFile, artifactsFile] = process.argv.slice(2);
          const workflow = JSON.parse(fs.readFileSync(workflowFile, "utf8"));
          const run = JSON.parse(fs.readFileSync(runFile, "utf8"));
          const payload = JSON.parse(fs.readFileSync(artifactsFile, "utf8"));
          const pages = Array.isArray(payload) ? payload : [payload];
          const artifacts = pages.flatMap((page) => Array.isArray(page?.artifacts) ? page.artifacts : []);
          const fail = (code) => { throw new Error(`PONTO_PAGES_SECRET_BRIDGE_ROOT_CUSTODY_${code}`); };
          const expectedPath = ".github/workflows/cloudflare-workers-sync-ponto-secrets.yml";
          const sourceEnvironment = process.env.SOURCE_ENVIRONMENT;
          const releaseSha = process.env.RELEASE_SHA;
          const expectedArtifact = `ponto-root-custody-${sourceEnvironment}-${releaseSha}`;
          const expectedTitle = `Attest Ponto Workers ${sourceEnvironment} ${releaseSha} mode=read-only-bridge-attestation`;
          if (
            workflow?.state !== "active"
            || workflow?.path !== expectedPath
            || workflow?.name !== "Attest Ponto Worker secret custody"
            || Number(run?.workflow_id) !== Number(workflow?.id)
            || ![expectedPath, `${expectedPath}@refs/heads/main`].includes(run?.path)
            || run?.status !== "completed"
            || run?.conclusion !== "success"
            || run?.event !== "workflow_dispatch"
            || Number(run?.run_attempt) !== 1
            || run?.head_branch !== "main"
            || String(run?.head_sha || "").toLowerCase() !== releaseSha
            || String(run?.display_title || "") !== expectedTitle
            || run?.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || Number(run?.repository?.id) !== Number(process.env.GITHUB_REPOSITORY_ID)
            || run?.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
            || Number(run?.head_repository?.id) !== Number(process.env.GITHUB_REPOSITORY_ID)
          ) fail("RUN_PROVENANCE_INVALID");
          const matches = artifacts.filter((artifact) => artifact?.name === expectedArtifact);
          if (matches.length !== 1) fail("ARTIFACT_CARDINALITY_INVALID");
          const artifact = matches[0];
          if (
            !/^[1-9][0-9]*$/.test(String(artifact?.id || ""))
            || artifact?.expired !== false
            || !Number.isInteger(Number(artifact?.size_in_bytes))
            || Number(artifact.size_in_bytes) <= 0
            || !/^sha256:[0-9a-f]{64}$/.test(String(artifact?.digest || "").toLowerCase())
          ) fail("ARTIFACT_METADATA_INVALID");
          fs.writeFileSync(process.env.PONTO_ARTIFACT_METADATA_FILE, `${JSON.stringify({
            name: expectedArtifact,
            id: String(artifact.id),
            digest: String(artifact.digest).toLowerCase(),
          })}\n`, { mode: 0o600 });
          NODE
          read -r artifact_id artifact_digest < <(
            node --input-type=module - "$artifact_metadata_file" <<'NODE'
          import fs from "node:fs";
          const metadata = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            !/^[1-9][0-9]*$/.test(String(metadata?.id || ""))
            || !/^sha256:[0-9a-f]{64}$/.test(String(metadata?.digest || ""))
          ) throw new Error("PONTO_PAGES_SECRET_BRIDGE_ROOT_CUSTODY_ARTIFACT_METADATA_IS_INVALID");
          process.stdout.write(`${metadata.id} ${metadata.digest}\n`);
          NODE
          )
          artifact_dir="$RUNNER_TEMP/ponto-pages-bridge-root-custody"
          artifact_archive="$RUNNER_TEMP/ponto-pages-bridge-root-custody.zip"
          mkdir -p "$artifact_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$artifact_archive"
          [[ "$(sha256sum "$artifact_archive" | awk '{print "sha256:" $1}')" == "$artifact_digest" ]] \
            || { echo 'PONTO_PAGES_SECRET_BRIDGE_ROOT_CUSTODY_ARTIFACT_DIGEST_MISMATCH'; exit 1; }
          unzip -q "$artifact_archive" -d "$artifact_dir"
          mapfile -t custody_files < <(find "$artifact_dir" -type f -name root-custody.json -print)
          [[ "${#custody_files[@]}" == 1 ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_ROOT_CUSTODY_FILE_INVALID'; exit 1; }
          printf '%s\n' \
            "PONTO_PAGES_BRIDGE_ROOT_CUSTODY_ARTIFACT_NAME=$artifact_name" \
            "PONTO_PAGES_BRIDGE_ROOT_CUSTODY_ARTIFACT_ID=$artifact_id" \
            "PONTO_PAGES_BRIDGE_ROOT_CUSTODY_ARTIFACT_DIGEST=$artifact_digest" \
            "PONTO_PAGES_BRIDGE_ROOT_CUSTODY_FILE=${custody_files[0]}" >> "$GITHUB_ENV"
          rm -f "$workflow_file" "$run_file" "$artifacts_file" "$artifact_metadata_file" "$artifact_archive"

      - name: Match the source root to the exact custody commitment without printing it
        env:
          SOURCE_ENVIRONMENT: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROOT_CUSTODY_FILE: ${{ env.PONTO_PAGES_BRIDGE_ROOT_CUSTODY_FILE }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_ROOT_ATTESTATION_KEY_SHARED: ${{ secrets.PONTO_ROOT_ATTESTATION_KEY_SHARED }}
          PONTO_IDEMPOTENCY_KEY_CUSTODY_REF: ${{ vars.PONTO_IDEMPOTENCY_KEY_CUSTODY_REF }}
          PONTO_ROOT_ATTESTATION_KEY_ID: ${{ vars.PONTO_ROOT_ATTESTATION_KEY_ID }}
        run: |
          set -euo pipefail
          [[ -s "$ROOT_CUSTODY_FILE" ]] || { echo 'PONTO_PAGES_SECRET_BRIDGE_ROOT_CUSTODY_FILE_REQUIRED'; exit 1; }
          node .github/scripts/ponto-pages-secret-bridge.mjs verify-root \
            "$SOURCE_ENVIRONMENT" "$RELEASE_SHA" "$ROOT_CUSTODY_FILE"
          unset PONTO_IDEMPOTENCY_KEY PONTO_ROOT_ATTESTATION_KEY_SHARED

      - name: Revalidate the disabled target immediately before the secret write
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_ENVIRONMENT: ${{ inputs.target }}
          TARGET_ENVIRONMENT: ${{ env.PONTO_PAGES_BRIDGE_TARGET_ENVIRONMENT }}
        run: |
          set -euo pipefail
          umask 077
          target_secrets="$RUNNER_TEMP/ponto-pages-bridge-target-secrets-final-prewrite.json"
          target_variables="$RUNNER_TEMP/ponto-pages-bridge-target-variables-final-prewrite.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/secrets?per_page=100" > "$target_secrets"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/variables?per_page=100" > "$target_variables"
          node .github/scripts/ponto-pages-secret-bridge.mjs validate-target \
            "$SOURCE_ENVIRONMENT" before "$target_secrets" "$target_variables"
          rm -f "$target_secrets" "$target_variables"

      - name: Seed only the dedicated Pages secrets through stdin
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_ENVIRONMENT: ${{ inputs.target }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-pages-secret-bridge.mjs provision \
            "$SOURCE_ENVIRONMENT" "$GITHUB_REPOSITORY"
          unset PONTO_IDEMPOTENCY_KEY CLOUDFLARE_API_TOKEN SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET GH_TOKEN

      - name: Read back target secret names and write a sanitised receipt
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_ENVIRONMENT: ${{ inputs.target }}
          TARGET_ENVIRONMENT: ${{ env.PONTO_PAGES_BRIDGE_TARGET_ENVIRONMENT }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROOT_CUSTODY_RUN_ID: ${{ inputs.root_custody_run_id }}
          ROOT_CUSTODY_ARTIFACT_ID: ${{ env.PONTO_PAGES_BRIDGE_ROOT_CUSTODY_ARTIFACT_ID }}
          ROOT_CUSTODY_ARTIFACT_DIGEST: ${{ env.PONTO_PAGES_BRIDGE_ROOT_CUSTODY_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          umask 077
          target_secrets="$RUNNER_TEMP/ponto-pages-bridge-target-secrets-after.json"
          target_variables="$RUNNER_TEMP/ponto-pages-bridge-target-variables-after.json"
          receipt="$RUNNER_TEMP/ponto-pages-secret-bridge-receipt.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/secrets?per_page=100" > "$target_secrets"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/variables?per_page=100" > "$target_variables"
          node .github/scripts/ponto-pages-secret-bridge.mjs write-receipt \
            "$SOURCE_ENVIRONMENT" "$GITHUB_REPOSITORY" "$RELEASE_SHA" \
            "$ROOT_CUSTODY_RUN_ID" "$ROOT_CUSTODY_ARTIFACT_ID" "$ROOT_CUSTODY_ARTIFACT_DIGEST" \
            "$target_secrets" "$target_variables" "$receipt"
          rm -f "$target_secrets" "$target_variables"

      - name: Upload sanitised Pages environment-secret bridge receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-pages-secret-bridge-${{ inputs.target }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-pages-secret-bridge-receipt.json
          retention-days: 90
          if-no-files-found: error
