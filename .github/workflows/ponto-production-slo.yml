name: Ponto production SLO
run-name: Ponto SLO ${{ inputs.stage }} ${{ inputs.release_sha }} orchestrator=${{ inputs.orchestrator_run_id }} nonce=${{ inputs.orchestrator_nonce }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Live stage under observation
        required: true
        type: choice
        options: [pilot, canary, production, rollback]
      release_sha:
        description: Immutable promoted SHA
        required: true
        type: string
      orchestrator_run_id:
        description: Ponto coordinator correlation ID
        required: true
        type: string
      orchestrator_stage:
        description: Exact coordinator stage bound to the single-use capability
        required: true
        type: string
      core_version_id:
        description: Exact Core Worker version selected for the observed cohort
        required: true
        type: string
      timekeeping_version_id:
        description: Exact Timekeeping Worker version selected by Core
        required: true
        type: string
      identity_version_id:
        description: Exact Identity/Workforce Worker version selected for contract proof
        required: true
        type: string
      pages_deployment_id:
        description: Exact CRM Pages deployment attested by the publisher
        required: true
        type: string
      orchestrator_issuer_run_id:
        description: Exact direct issuer run
        required: false
        type: string
      orchestrator_nonce:
        description: Non-secret per-dispatch correlation nonce
        required: false
        type: string

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  orchestrator:
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
    uses: ./.github/workflows/ponto-orchestrator-gate.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
    with:
      required: true
      global_lease_required: true
      global_resource: ${{ inputs.orchestrator_run_id != '' && 'release:ponto-child' || 'release:ponto' }}
      global_module: ponto
      global_coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
      lease_key: production-slo
      stage: ${{ inputs.orchestrator_stage }}
      target: production
      release_sha: ${{ inputs.release_sha }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}
  control-plane-preflight:
    needs: orchestrator
    if: ${{ needs.orchestrator.result == 'success' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/skincos/release/ponto/') && inputs.orchestrator_run_id != '' && github.sha == inputs.release_sha)) && inputs.stage != 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-preflight.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-preflight.outputs.artifact-digest }}
      runner_labels_json: ${{ steps.runner-inventory.outputs.runner_labels_json }}
      runner_encryption_public_key_pem_base64: ${{ steps.runner-inventory.outputs.runner_encryption_public_key_pem_base64 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact protected preflight source and active coordinator
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'SLO release SHA is invalid'; exit 1; }
          [[ "$ORCHESTRATOR_STAGE" == "$RELEASE_STAGE" ]] || { echo 'SLO stage differs from its coordinator capability'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'SLO preflight checkout differs from the trusted workflow revision'; exit 1; }
          PONTO_RELEASE_SHA="$RELEASE_SHA" PONTO_OBSERVED_SHA="$GITHUB_SHA" node --input-type=module <<'NODE'
          import { assertPontoSourceClosureUnchanged } from "./.github/scripts/ponto-source-closure.mjs";
          assertPontoSourceClosureUnchanged(process.env.PONTO_RELEASE_SHA, process.env.PONTO_OBSERVED_SHA);
          NODE
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Authorize global Ponto SLO journey mutation
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.orchestrator.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_b64: ${{ needs.orchestrator.outputs.global_proof_b64 }}
          resource: ${{ inputs.orchestrator_run_id != '' && 'release:ponto-child' || 'release:ponto' }}
          module: ponto
          source_sha: ${{ inputs.release_sha }}
      - name: Attest the exact registered clinic runner before hydrating control-plane authority
        id: runner-inventory
        env:
          # Repository runner inventory and the repository-scoped runs-on
          # selector require Administration:read and Variables:read, which are
          # intentionally unavailable to the automatic GITHUB_TOKEN. This
          # protected production job hydrates the existing governed PAT only
          # for these read-only attestation calls.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PONTO_PILOT_RUNNER_LABELS_JSON: ${{ vars.PONTO_PILOT_RUNNER_LABELS_JSON }}
          PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM: ${{ vars.PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Administration:read and Variables:read is required for clinic runner attestation'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" > "$RUNNER_TEMP/ponto-clinic-runners.json"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/variables/PONTO_PILOT_RUNNER_LABELS_JSON" > "$RUNNER_TEMP/ponto-clinic-runner-labels-repository-variable.json"; then
            node - "$RUNNER_TEMP/ponto-clinic-runner-labels-repository-variable.json" <<'NODE'
            const fs = require("fs");
            fs.writeFileSync(process.argv[2], JSON.stringify({
              name: "PONTO_PILOT_RUNNER_LABELS_JSON",
              value: process.env.PONTO_PILOT_RUNNER_LABELS_JSON || "",
            }));
            NODE
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/variables/PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/ponto-clinic-runner-encryption-repository-variable.json"; then
            node - "$RUNNER_TEMP/ponto-clinic-runner-encryption-repository-variable.json" <<'NODE'
            const fs = require("fs");
            fs.writeFileSync(process.argv[2], JSON.stringify({
              name: "PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM",
              value: process.env.PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM || "",
            }));
            NODE
          fi
          gh api "repos/$GITHUB_REPOSITORY/environments/production/variables?per_page=100" > "$RUNNER_TEMP/ponto-clinic-runner-environment-variables.json"
          node - \
            "$RUNNER_TEMP/ponto-clinic-runners.json" \
            "$RUNNER_TEMP/ponto-clinic-runner-labels-repository-variable.json" \
            "$RUNNER_TEMP/ponto-clinic-runner-environment-variables.json" \
            "$RUNNER_TEMP/ponto-clinic-runner-encryption-repository-variable.json" <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const policy = JSON.parse(fs.readFileSync(".github/governance/progressive-release-policy.json", "utf8"));
          const expected = policy?.pilotRunner?.production;
          const requiredBaseLabels = ["self-hosted", "Linux", "X64"];
          const customLabels = Array.isArray(expected?.requiredLabels)
            ? expected.requiredLabels.filter(label => !requiredBaseLabels.includes(label))
            : [];
          const jitPaths = [
            expected?.jitAttestationFilePath,
            expected?.jitCredentialBundleFilePath,
            expected?.jitDecryptKeyFilePath,
          ].map(value => String(value || ""));
          let jitPublicKey = null;
          const repositoryEncryptionVariable = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          let runnerEncryptionPublicKey = null;
          let runnerEncryptionFingerprint = "";
          try { jitPublicKey = crypto.createPublicKey(String(expected?.jitAttestationPublicKeyPem || "")); } catch {}
          try {
            runnerEncryptionPublicKey = crypto.createPublicKey(String(repositoryEncryptionVariable?.value || ""));
            const publicDer = runnerEncryptionPublicKey.export({ type: "spki", format: "der" });
            runnerEncryptionFingerprint = crypto.createHash("sha256").update(publicDer).digest("hex");
          } catch {}
          if (
            !/^[1-9][0-9]{0,19}$/.test(String(expected?.runnerId || ""))
            || typeof expected?.runnerName !== "string"
            || !expected.runnerName.trim()
            || typeof expected?.runnerIsolationRef !== "string"
            || !expected.runnerIsolationRef.trim()
            || !Array.isArray(expected?.requiredLabels)
            || expected.requiredLabels.length !== 4
            || new Set(expected.requiredLabels).size !== expected.requiredLabels.length
            || expected.requiredLabels.some(label => typeof label !== "string" || !/^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$/.test(label))
            || !requiredBaseLabels.every(label => expected.requiredLabels.includes(label))
            || customLabels.length !== 1
            || !/^ponto-jit-[a-z0-9][a-z0-9-]{15,63}$/.test(customLabels[0])
            || typeof expected?.networkContextCustodyRef !== "string"
            || !expected.networkContextCustodyRef.trim()
            || !/^[0-9a-f]{64}$/.test(String(expected?.encryptionPublicKeySha256 || ""))
            || expected?.jitMode !== "ephemeral-pre-job-hook-ed25519-v1"
            || !/^[a-z][a-z0-9-]{1,63}$/.test(String(expected?.jitAttestationKeyId || ""))
            || jitPublicKey?.asymmetricKeyType !== "ed25519"
            || repositoryEncryptionVariable?.name !== "PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM"
            || runnerEncryptionPublicKey?.asymmetricKeyType !== "rsa"
            || Number(runnerEncryptionPublicKey?.asymmetricKeyDetails?.modulusLength || 0) < 2048
            || runnerEncryptionFingerprint !== String(expected?.encryptionPublicKeySha256 || "").toLowerCase()
            || jitPaths.some(value => !path.posix.isAbsolute(value))
            || new Set(jitPaths).size !== jitPaths.length
            || new Set(jitPaths.map(value => path.posix.dirname(value))).size !== 1
            || typeof expected?.jitSupervisorCustodyRef !== "string"
            || !expected.jitSupervisorCustodyRef.trim()
            || typeof expected?.jitCleanupHookCustodyRef !== "string"
            || !expected.jitCleanupHookCustodyRef.trim()
          ) throw new Error("production one-shot pilot runner policy remains fail-closed");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const repositoryVariable = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const environmentVariables = JSON.parse(fs.readFileSync(process.argv[4], "utf8")).variables || [];
          const shadowed = new Set(environmentVariables.map(item => item?.name));
          if (
            shadowed.has("PONTO_PILOT_RUNNER_LABELS_JSON")
            || shadowed.has("PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM")
          ) {
            throw new Error("Ponto pilot runner repository variables may not be shadowed by the production environment");
          }
          let configuredLabels;
          try { configuredLabels = JSON.parse(repositoryVariable?.value || ""); } catch {}
          if (
            repositoryVariable?.name !== "PONTO_PILOT_RUNNER_LABELS_JSON"
            || JSON.stringify(configuredLabels) !== JSON.stringify(expected.requiredLabels)
          ) {
            throw new Error("repository Ponto runner labels differ from the versioned policy");
          }
          if (payload.total_count !== (payload.runners || []).length) {
            throw new Error("runner inventory exceeds the bounded complete attestation page");
          }
          const matching = (payload.runners || []).filter((runner) => {
            const labels = (runner.labels || []).map(label => String(label?.name || ""));
            const normalizedLabels = new Set(labels.map(label => label.toLowerCase()));
            return labels.length === configuredLabels.length
              && configuredLabels.every(label => normalizedLabels.has(label.toLowerCase()));
          });
          if (
            matching.length !== 1
            || String(matching[0]?.id || "") !== String(expected.runnerId)
            || matching[0]?.name !== expected.runnerName
            || matching[0]?.status !== "online"
            || matching[0]?.busy !== false
          ) throw new Error("the policy-pinned one-shot clinic runner is not the unique online idle selector match");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runner_labels_json=${JSON.stringify(configuredLabels)}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `runner_encryption_public_key_pem_base64=${Buffer.from(repositoryEncryptionVariable.value).toString("base64")}\n`,
          );
          NODE
          rm -f \
            "$RUNNER_TEMP/ponto-clinic-runners.json" \
            "$RUNNER_TEMP/ponto-clinic-runner-labels-repository-variable.json" \
            "$RUNNER_TEMP/ponto-clinic-runner-environment-variables.json" \
            "$RUNNER_TEMP/ponto-clinic-runner-encryption-repository-variable.json"
      - name: Attest exact Pages control plane without pilot or root custody
        if: ${{ inputs.stage == 'production' }}
        env:
          PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_RELEASE_STAGE: ${{ inputs.stage }}
          PONTO_ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          PONTO_ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
          PONTO_SLO_PREFLIGHT_DIR: ${{ runner.temp }}/ponto-slo-preflight
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
        run: node .github/scripts/ponto-production-slo-preflight.mjs
      - name: Attest control plane and issue runner-encrypted one-time probe delegation
        if: ${{ inputs.stage == 'pilot' || inputs.stage == 'canary' }}
        env:
          PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_RELEASE_STAGE: ${{ inputs.stage }}
          PONTO_ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          PONTO_ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
          PONTO_SLO_PREFLIGHT_DIR: ${{ runner.temp }}/ponto-slo-preflight
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM_BASE64: ${{ steps.runner-inventory.outputs.runner_encryption_public_key_pem_base64 }}
        run: |
          set -euo pipefail
          [[ "$PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || { echo 'Runner encryption public key output is invalid'; exit 1; }
          export PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM
          PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM="$(printf '%s' "$PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM_BASE64" | base64 --decode)"
          node .github/scripts/ponto-production-slo-preflight.mjs
      - id: upload-preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-slo-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-slo-preflight
          retention-days: 1
          if-no-files-found: error
  consultor-journey:
    needs: [orchestrator, control-plane-preflight]
    if: ${{ needs.orchestrator.result == 'success' && needs.control-plane-preflight.result == 'success' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/skincos/release/ponto/') && inputs.orchestrator_run_id != '' && github.sha == inputs.release_sha)) && inputs.stage != 'rollback' }}
    runs-on: ${{ fromJSON(needs.control-plane-preflight.outputs.runner_labels_json || '["ponto-unavailable"]') }}
    timeout-minutes: 30
    environment: production
    env:
      PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
      PONTO_RELEASE_STAGE: ${{ inputs.stage }}
      PONTO_ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
      PONTO_ORCHESTRATOR_ISSUER_RUN_ID: ${{ inputs.orchestrator_issuer_run_id }}
      PONTO_ORCHESTRATOR_NONCE: ${{ inputs.orchestrator_nonce }}
      PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
      PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
      PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
      PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
      PONTO_SLO_PREFLIGHT_ARTIFACT_ID: ${{ needs.control-plane-preflight.outputs.artifact_id }}
      PONTO_SLO_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.control-plane-preflight.outputs.artifact_digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted exact release source before hydrating secrets
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'SLO release SHA is invalid'; exit 1; }
          [[ "$ORCHESTRATOR_STAGE" == "$RELEASE_STAGE" ]] || { echo 'SLO stage differs from its coordinator capability'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'SLO checkout differs from the trusted workflow revision'; exit 1; }
          PONTO_RELEASE_SHA="$RELEASE_SHA" PONTO_OBSERVED_SHA="$GITHUB_SHA" node --input-type=module <<'NODE'
          import { assertPontoSourceClosureUnchanged } from "./.github/scripts/ponto-source-closure.mjs";
          assertPontoSourceClosureUnchanged(process.env.PONTO_RELEASE_SHA, process.env.PONTO_OBSERVED_SHA);
          NODE
      - name: Revalidate the exact active coordinator before production journey secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Authorize global Ponto rollback observation mutation
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.orchestrator.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_b64: ${{ needs.orchestrator.outputs.global_proof_b64 }}
          resource: ${{ inputs.orchestrator_run_id != '' && 'release:ponto-child' || 'release:ponto' }}
          module: ponto
          source_sha: ${{ inputs.release_sha }}
      - name: Attest exact immutable preflight artifact before clinic secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.control-plane-preflight.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.control-plane-preflight.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Preflight artifact ID is invalid'; exit 1; }
          [[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]] || { echo 'Preflight artifact digest is invalid'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/ponto-slo-artifact.json"
          node - "$RUNNER_TEMP/ponto-slo-artifact.json" <<'NODE'
          const fs = require("fs");
          const artifact = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expectedDigest = String(process.env.ARTIFACT_DIGEST || "").replace(/^sha256:/, "");
          const actualDigest = String(artifact?.digest || "").replace(/^sha256:/, "");
          if (
            String(artifact?.id || "") !== process.env.ARTIFACT_ID
            || artifact?.name !== `ponto-slo-preflight-${process.env.GITHUB_RUN_ID}`
            || String(artifact?.workflow_run?.id || "") !== process.env.GITHUB_RUN_ID
            || artifact?.expired !== false
            || actualDigest !== expectedDigest
          ) throw new Error("immutable Ponto SLO preflight artifact metadata differs");
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.control-plane-preflight.outputs.artifact_id }}
          path: ${{ runner.temp }}/ponto-slo-preflight
          merge-multiple: true
      - name: Run external read-only CONSULTOR journey
        env:
          PONTO_RELEASE_CRM_URL: https://crm.skincos.com.br
          PONTO_RELEASE_SLO_REPORT: ${{ runner.temp }}/ponto-production-slo.json
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          PONTO_SLO_CONTROL_PLANE_ATTESTATION: ${{ runner.temp }}/ponto-slo-preflight/control-plane-attestation.json
          PONTO_RELEASE_PROBE_CAPABILITY: ${{ runner.temp }}/ponto-slo-preflight/release-probe-capability.json
        run: node .github/scripts/ponto-production-journey.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-slo-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-production-slo.json
          retention-days: 90
          if-no-files-found: error

      - name: Remove any unconsumed JIT and delegated material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-jit-credential-attestation.mjs cleanup
          rm -f \
            "$RUNNER_TEMP/ponto-slo-artifact.json" \
            "$RUNNER_TEMP/ponto-slo-preflight/control-plane-attestation.json" \
            "$RUNNER_TEMP/ponto-slo-preflight/release-probe-capability.json"
  global-coordination-release:
    needs: [orchestrator, control-plane-preflight, consultor-journey, rollback-observation]
    if: ${{ always() && needs.orchestrator.outputs.global_lease_required == 'true' }}
    uses: ./.github/workflows/global-coordination-release.yml
    secrets:
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
    with:
      required: true
      proof_b64: ${{ needs.orchestrator.outputs.global_proof_b64 }}
      coordinator_url: ${{ needs.orchestrator.outputs.global_coordinator_url }}
  rollback-observation:
    needs: orchestrator
    if: ${{ needs.orchestrator.result == 'success' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/skincos/release/ponto/') && inputs.orchestrator_run_id != '' && github.sha == inputs.release_sha)) && inputs.stage == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify trusted exact rollback source before hydrating secrets
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Rollback release SHA is invalid'; exit 1; }
          [[ "$RELEASE_STAGE" == rollback && "$ORCHESTRATOR_STAGE" == rollback ]] || { echo 'Rollback stage differs from its coordinator capability'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Rollback checkout differs from the trusted workflow revision'; exit 1; }
          PONTO_RELEASE_SHA="$RELEASE_SHA" PONTO_OBSERVED_SHA="$GITHUB_SHA" node --input-type=module <<'NODE'
          import { assertPontoSourceClosureUnchanged } from "./.github/scripts/ponto-source-closure.mjs";
          assertPontoSourceClosureUnchanged(process.env.PONTO_RELEASE_SHA, process.env.PONTO_OBSERVED_SHA);
          NODE
      - name: Revalidate the exact active coordinator before rollback observation secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Attest exact rollback versions and Pages deployment from Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EXPECTED_CORE_VERSION_ID EXPECTED_TIMEKEEPING_VERSION_ID EXPECTED_IDENTITY_VERSION_ID EXPECTED_PAGES_DEPLOYMENT_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing rollback attestation input: $name"; exit 1; }
          done
          npx --yes wrangler@4.112.0 deployments status --name skincos-ponto-core --json > "$RUNNER_TEMP/core-status.json"
          npx --yes wrangler@4.112.0 deployments status --name skincos-timekeeping --json > "$RUNNER_TEMP/timekeeping-status.json"
          npx --yes wrangler@4.112.0 deployments status --name skincos-insumos --json > "$RUNNER_TEMP/identity-status.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments" \
            > "$RUNNER_TEMP/pages-status.json"
          node - "$RUNNER_TEMP/core-status.json" "$RUNNER_TEMP/timekeeping-status.json" "$RUNNER_TEMP/identity-status.json" "$RUNNER_TEMP/pages-status.json" "$RUNNER_TEMP/rollback-control-plane.json" <<'NODE'
          const fs = require("fs");
          const uuid = /^[0-9a-f-]{36}$/i;
          const exactWorker = (file, expected, name) => {
            if (!uuid.test(expected)) throw new Error(`${name} expected version is invalid`);
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            const versions = payload.versions || payload.latest?.versions || [];
            if (versions.length !== 1 || String(versions[0]?.version_id || versions[0]?.id || "").toLowerCase() !== expected.toLowerCase() || Number(versions[0]?.percentage) !== 100) {
              throw new Error(`${name} is not exactly 100 percent on the attested incumbent`);
            }
          };
          exactWorker(process.argv[2], process.env.EXPECTED_CORE_VERSION_ID, "Core");
          exactWorker(process.argv[3], process.env.EXPECTED_TIMEKEEPING_VERSION_ID, "Timekeeping");
          exactWorker(process.argv[4], process.env.EXPECTED_IDENTITY_VERSION_ID, "Identity");
          const pagesPayload = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          if (pagesPayload.success !== true) throw new Error("Pages deployments API failed");
          const production = (pagesPayload.result || []).filter(item => item.environment === "production").sort((a, b) => String(b.created_on).localeCompare(String(a.created_on)));
          if (String(production[0]?.id || "").toLowerCase() !== process.env.EXPECTED_PAGES_DEPLOYMENT_ID.toLowerCase()) throw new Error("latest production Pages deployment differs");
          fs.writeFileSync(process.argv[6], `${JSON.stringify({
            passed: true,
            coreVersionId: process.env.EXPECTED_CORE_VERSION_ID,
            timekeepingVersionId: process.env.EXPECTED_TIMEKEEPING_VERSION_ID,
            identityVersionId: process.env.EXPECTED_IDENTITY_VERSION_ID,
            pagesDeploymentId: process.env.EXPECTED_PAGES_DEPLOYMENT_ID,
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          rm -f "$RUNNER_TEMP/core-status.json" "$RUNNER_TEMP/timekeeping-status.json" "$RUNNER_TEMP/identity-status.json" "$RUNNER_TEMP/pages-status.json"
      - name: Observe rolled-back health and fail-closed state
        env:
          PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_RELEASE_STAGE: rollback
          PONTO_RELEASE_CRM_URL: https://crm.skincos.com.br
          PONTO_RELEASE_SLO_REPORT: ${{ runner.temp }}/ponto-production-slo.json
          PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PONTO_ROLLBACK_CONTROL_PLANE_ATTESTATION: ${{ runner.temp }}/rollback-control-plane.json
        run: node .github/scripts/ponto-production-journey.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-slo-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-production-slo.json
          retention-days: 90
          if-no-files-found: error
