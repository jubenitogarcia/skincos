name: Ponto production SLO
run-name: Ponto SLO ${{ inputs.stage }} ${{ inputs.release_sha }} orchestrator=${{ inputs.orchestrator_run_id }} nonce=${{ inputs.orchestrator_nonce }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Live stage under observation
        required: true
        type: choice
        options: [pilot, canary, production, rollback]
      release_sha:
        description: Immutable promoted SHA
        required: true
        type: string
      orchestrator_run_id:
        description: Ponto coordinator correlation ID
        required: true
        type: string
      orchestrator_stage:
        description: Exact coordinator stage bound to the single-use capability
        required: true
        type: string
      core_version_id:
        description: Exact Core Worker version selected for the observed cohort
        required: true
        type: string
      timekeeping_version_id:
        description: Exact Timekeeping Worker version selected by Core
        required: true
        type: string
      identity_version_id:
        description: Exact Identity/Workforce Worker version selected for contract proof
        required: true
        type: string
      pages_deployment_id:
        description: Exact CRM Pages deployment attested by the publisher
        required: true
        type: string
      orchestrator_issuer_run_id:
        description: Exact direct issuer run
        required: false
        type: string
      orchestrator_nonce:
        description: Non-secret per-dispatch correlation nonce
        required: false
        type: string

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  orchestrator:
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
    uses: ./.github/workflows/ponto-orchestrator-gate.yml
    with:
      required: true
      lease_key: production-slo
      stage: ${{ inputs.orchestrator_stage }}
      target: production
      release_sha: ${{ inputs.release_sha }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}
  control-plane-preflight:
    needs: orchestrator
    if: ${{ needs.orchestrator.result == 'success' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && inputs.stage != 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-preflight.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-preflight.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact protected preflight source and active coordinator
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'SLO release SHA is invalid'; exit 1; }
          [[ "$ORCHESTRATOR_STAGE" == "$RELEASE_STAGE" ]] || { echo 'SLO stage differs from its coordinator capability'; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" && "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'SLO preflight source differs'; exit 1; }
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Attest the exact registered clinic runner before hydrating control-plane authority
        env:
          # Repository runner inventory requires Administration:read, which is
          # intentionally unavailable to the automatic GITHUB_TOKEN. This
          # protected production job hydrates the existing governed PAT only
          # for the read-only inventory call.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CONFIGURED_RUNNER_LABELS_JSON: ${{ vars.PONTO_PILOT_RUNNER_LABELS_JSON }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Administration:read is required for clinic runner attestation'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" > "$RUNNER_TEMP/ponto-clinic-runners.json"
          node - "$RUNNER_TEMP/ponto-clinic-runners.json" <<'NODE'
          const fs = require("fs");
          const policy = JSON.parse(fs.readFileSync(".github/governance/progressive-release-policy.json", "utf8"));
          const expected = policy?.pilotRunner?.production;
          if (
            !/^[1-9][0-9]{0,19}$/.test(String(expected?.runnerId || ""))
            || typeof expected?.runnerName !== "string"
            || !expected.runnerName.trim()
            || typeof expected?.runnerIsolationRef !== "string"
            || !expected.runnerIsolationRef.trim()
            || !Array.isArray(expected?.requiredLabels)
            || expected.requiredLabels.length < 4
            || typeof expected?.networkContextCustodyRef !== "string"
            || !expected.networkContextCustodyRef.trim()
            || !/^[0-9a-f]{64}$/.test(String(expected?.encryptionPublicKeySha256 || ""))
          ) throw new Error("production pilot runner policy remains fail-closed");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          let configuredLabels;
          try { configuredLabels = JSON.parse(process.env.CONFIGURED_RUNNER_LABELS_JSON || ""); } catch {}
          if (JSON.stringify(configuredLabels) !== JSON.stringify(expected.requiredLabels)) {
            throw new Error("mutable Ponto runner labels differ from the versioned policy");
          }
          const exact = (payload.runners || []).filter(
            runner => String(runner?.id || "") === String(expected.runnerId)
              && runner?.name === expected.runnerName,
          );
          if (exact.length !== 1 || exact[0]?.status !== "online") {
            throw new Error("the exact policy-pinned clinic runner is absent or offline");
          }
          const labels = new Set((exact[0].labels || []).map(label => String(label?.name || "")));
          if (labels.size !== expected.requiredLabels.length || !expected.requiredLabels.every(label => labels.has(label))) {
            throw new Error("the exact clinic runner label set differs from the closed policy allowlist");
          }
          NODE
      - name: Attest exact Pages control plane without pilot or root custody
        if: ${{ inputs.stage == 'production' }}
        env:
          PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_RELEASE_STAGE: ${{ inputs.stage }}
          PONTO_ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          PONTO_ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
          PONTO_SLO_PREFLIGHT_DIR: ${{ runner.temp }}/ponto-slo-preflight
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
        run: node .github/scripts/ponto-production-slo-preflight.mjs
      - name: Attest control plane and issue runner-encrypted one-time probe delegation
        if: ${{ inputs.stage == 'pilot' || inputs.stage == 'canary' }}
        env:
          PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_RELEASE_STAGE: ${{ inputs.stage }}
          PONTO_ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          PONTO_ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
          PONTO_SLO_PREFLIGHT_DIR: ${{ runner.temp }}/ponto-slo-preflight
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM: ${{ vars.PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM }}
        run: node .github/scripts/ponto-production-slo-preflight.mjs
      - id: upload-preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-slo-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-slo-preflight
          retention-days: 1
          if-no-files-found: error
  consultor-journey:
    needs: [orchestrator, control-plane-preflight]
    if: ${{ needs.orchestrator.result == 'success' && needs.control-plane-preflight.result == 'success' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && inputs.stage != 'rollback' }}
    runs-on: ${{ fromJSON(vars.PONTO_PILOT_RUNNER_LABELS_JSON || '["self-hosted","ponto-pilot"]') }}
    timeout-minutes: 30
    environment: production
    env:
      PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
      PONTO_RELEASE_STAGE: ${{ inputs.stage }}
      PONTO_ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
      PONTO_ORCHESTRATOR_ISSUER_RUN_ID: ${{ inputs.orchestrator_issuer_run_id }}
      PONTO_ORCHESTRATOR_NONCE: ${{ inputs.orchestrator_nonce }}
      PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
      PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
      PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
      PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
      PONTO_SLO_PREFLIGHT_ARTIFACT_ID: ${{ needs.control-plane-preflight.outputs.artifact_id }}
      PONTO_SLO_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.control-plane-preflight.outputs.artifact_digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted exact release source before hydrating secrets
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'SLO release SHA is invalid'; exit 1; }
          [[ "$ORCHESTRATOR_STAGE" == "$RELEASE_STAGE" ]] || { echo 'SLO stage differs from its coordinator capability'; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || { echo 'SLO workflow revision differs'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'SLO checkout differs'; exit 1; }
      - name: Revalidate the exact active coordinator before production journey secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Attest exact immutable preflight artifact before clinic secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.control-plane-preflight.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.control-plane-preflight.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Preflight artifact ID is invalid'; exit 1; }
          [[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]] || { echo 'Preflight artifact digest is invalid'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/ponto-slo-artifact.json"
          node - "$RUNNER_TEMP/ponto-slo-artifact.json" <<'NODE'
          const fs = require("fs");
          const artifact = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expectedDigest = String(process.env.ARTIFACT_DIGEST || "").replace(/^sha256:/, "");
          const actualDigest = String(artifact?.digest || "").replace(/^sha256:/, "");
          if (
            String(artifact?.id || "") !== process.env.ARTIFACT_ID
            || artifact?.name !== `ponto-slo-preflight-${process.env.GITHUB_RUN_ID}`
            || String(artifact?.workflow_run?.id || "") !== process.env.GITHUB_RUN_ID
            || artifact?.expired !== false
            || actualDigest !== expectedDigest
          ) throw new Error("immutable Ponto SLO preflight artifact metadata differs");
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.control-plane-preflight.outputs.artifact_id }}
          path: ${{ runner.temp }}/ponto-slo-preflight
          merge-multiple: true
      - name: Run external read-only CONSULTOR journey
        env:
          PONTO_RELEASE_CRM_URL: https://crm.skincos.com.br
          PONTO_RELEASE_SLO_REPORT: ${{ runner.temp }}/ponto-production-slo.json
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          PONTO_SLO_CONTROL_PLANE_ATTESTATION: ${{ runner.temp }}/ponto-slo-preflight/control-plane-attestation.json
          PONTO_RELEASE_PROBE_CAPABILITY: ${{ runner.temp }}/ponto-slo-preflight/release-probe-capability.json
        run: node .github/scripts/ponto-production-journey.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-slo-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-production-slo.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove any unconsumed JIT and delegated material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-jit-credential-attestation.mjs cleanup
          rm -f \
            "$RUNNER_TEMP/ponto-slo-artifact.json" \
            "$RUNNER_TEMP/ponto-slo-preflight/control-plane-attestation.json" \
            "$RUNNER_TEMP/ponto-slo-preflight/release-probe-capability.json"
  rollback-observation:
    needs: orchestrator
    if: ${{ needs.orchestrator.result == 'success' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && inputs.stage == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify trusted exact rollback source before hydrating secrets
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Rollback release SHA is invalid'; exit 1; }
          [[ "$RELEASE_STAGE" == rollback && "$ORCHESTRATOR_STAGE" == rollback ]] || { echo 'Rollback stage differs from its coordinator capability'; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || { echo 'Rollback workflow revision differs'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'Rollback checkout differs'; exit 1; }
      - name: Revalidate the exact active coordinator before rollback observation secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Attest exact rollback versions and Pages deployment from Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EXPECTED_CORE_VERSION_ID EXPECTED_TIMEKEEPING_VERSION_ID EXPECTED_IDENTITY_VERSION_ID EXPECTED_PAGES_DEPLOYMENT_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing rollback attestation input: $name"; exit 1; }
          done
          npx --yes wrangler@4.112.0 deployments status --name skincos-ponto-core --json > "$RUNNER_TEMP/core-status.json"
          npx --yes wrangler@4.112.0 deployments status --name skincos-timekeeping --json > "$RUNNER_TEMP/timekeeping-status.json"
          npx --yes wrangler@4.112.0 deployments status --name skincos-insumos --json > "$RUNNER_TEMP/identity-status.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments" \
            > "$RUNNER_TEMP/pages-status.json"
          node - "$RUNNER_TEMP/core-status.json" "$RUNNER_TEMP/timekeeping-status.json" "$RUNNER_TEMP/identity-status.json" "$RUNNER_TEMP/pages-status.json" "$RUNNER_TEMP/rollback-control-plane.json" <<'NODE'
          const fs = require("fs");
          const uuid = /^[0-9a-f-]{36}$/i;
          const exactWorker = (file, expected, name) => {
            if (!uuid.test(expected)) throw new Error(`${name} expected version is invalid`);
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            const versions = payload.versions || payload.latest?.versions || [];
            if (versions.length !== 1 || String(versions[0]?.version_id || versions[0]?.id || "").toLowerCase() !== expected.toLowerCase() || Number(versions[0]?.percentage) !== 100) {
              throw new Error(`${name} is not exactly 100 percent on the attested incumbent`);
            }
          };
          exactWorker(process.argv[2], process.env.EXPECTED_CORE_VERSION_ID, "Core");
          exactWorker(process.argv[3], process.env.EXPECTED_TIMEKEEPING_VERSION_ID, "Timekeeping");
          exactWorker(process.argv[4], process.env.EXPECTED_IDENTITY_VERSION_ID, "Identity");
          const pagesPayload = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          if (pagesPayload.success !== true) throw new Error("Pages deployments API failed");
          const production = (pagesPayload.result || []).filter(item => item.environment === "production").sort((a, b) => String(b.created_on).localeCompare(String(a.created_on)));
          if (String(production[0]?.id || "").toLowerCase() !== process.env.EXPECTED_PAGES_DEPLOYMENT_ID.toLowerCase()) throw new Error("latest production Pages deployment differs");
          fs.writeFileSync(process.argv[6], `${JSON.stringify({
            passed: true,
            coreVersionId: process.env.EXPECTED_CORE_VERSION_ID,
            timekeepingVersionId: process.env.EXPECTED_TIMEKEEPING_VERSION_ID,
            identityVersionId: process.env.EXPECTED_IDENTITY_VERSION_ID,
            pagesDeploymentId: process.env.EXPECTED_PAGES_DEPLOYMENT_ID,
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          rm -f "$RUNNER_TEMP/core-status.json" "$RUNNER_TEMP/timekeeping-status.json" "$RUNNER_TEMP/identity-status.json" "$RUNNER_TEMP/pages-status.json"
      - name: Observe rolled-back health and fail-closed state
        env:
          PONTO_RELEASE_SHA: ${{ inputs.release_sha }}
          PONTO_RELEASE_STAGE: rollback
          PONTO_RELEASE_CRM_URL: https://crm.skincos.com.br
          PONTO_RELEASE_SLO_REPORT: ${{ runner.temp }}/ponto-production-slo.json
          PONTO_EXPECTED_CORE_VERSION_ID: ${{ inputs.core_version_id }}
          PONTO_EXPECTED_TIMEKEEPING_VERSION_ID: ${{ inputs.timekeeping_version_id }}
          PONTO_EXPECTED_IDENTITY_VERSION_ID: ${{ inputs.identity_version_id }}
          PONTO_EXPECTED_PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PONTO_ROLLBACK_CONTROL_PLANE_ATTESTATION: ${{ runner.temp }}/rollback-control-plane.json
        run: node .github/scripts/ponto-production-journey.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-slo-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-production-slo.json
          retention-days: 90
          if-no-files-found: error
