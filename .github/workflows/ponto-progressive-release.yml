            conclusion: run.conclusion,
            event: run.event,
            headBranch: run.head_branch,
            headSha: run.head_sha,
            repository: process.env.GITHUB_REPOSITORY,
            url: run.html_url,
            reused: true,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          fi
