name: Ponto progressive release
run-name: Ponto ${{ inputs.stage }} ${{ inputs.release_sha }} orchestrator=${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Ordered Ponto release stage
        required: true
        default: preview
        type: choice
        options: [preview, staging, pilot, canary, production, rollback]
      release_sha:
        description: Exact immutable coordinator SHA at main for every surface
        required: true
        type: string
      predecessor_run_id:
        description: Required after preview; completed Ponto progressive run for the exact predecessor
        required: false
        type: string
      rollback_from_stage:
        description: Current live stage when stage=rollback
        required: false
        default: production
        type: choice
        options: [pilot, canary, production]

concurrency:
  # Coordination only. Every child that mutates a Cloudflare surface takes
  # the direct ponto-surface-mutation lock in its own workflow.
  group: ponto-release-coordinator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main Ponto coordinator execution
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Ponto coordinator must execute from main'; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo 'Ponto coordinator full reruns are forbidden; dispatch a new governed run'; exit 1; }
  emergency-broker-staging:
    needs: source
    if: ${{ inputs.stage != 'preview' && github.run_attempt == 1 }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: ponto-emergency-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Functionally attest the staging close-only broker before release
        env:
          PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL: ${{ secrets.PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL }}
          PONTO_EMERGENCY_CLOSE_BROKER_URL: ${{ vars.PONTO_EMERGENCY_CLOSE_BROKER_URL }}
          PONTO_EMERGENCY_CLOSE_CUSTODY_REF: ${{ vars.PONTO_EMERGENCY_CLOSE_CUSTODY_REF }}
          PONTO_EMERGENCY_TARGET: staging
        run: node .github/scripts/ponto-emergency-broker.mjs attest "$RUNNER_TEMP/ponto-emergency-broker-staging.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-emergency-broker-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-emergency-broker-staging.json
          retention-days: 90
          if-no-files-found: error
  emergency-broker-production:
    needs: source
    if: ${{ inputs.stage != 'preview' && github.run_attempt == 1 }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: ponto-emergency-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Functionally attest the production close-only broker before release
        env:
          PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL: ${{ secrets.PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL }}
          PONTO_EMERGENCY_CLOSE_BROKER_URL: ${{ vars.PONTO_EMERGENCY_CLOSE_BROKER_URL }}
          PONTO_EMERGENCY_CLOSE_CUSTODY_REF: ${{ vars.PONTO_EMERGENCY_CLOSE_CUSTODY_REF }}
          PONTO_EMERGENCY_TARGET: production
        run: node .github/scripts/ponto-emergency-broker.mjs attest "$RUNNER_TEMP/ponto-emergency-broker-production.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-emergency-broker-production-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-emergency-broker-production.json
          retention-days: 90
          if-no-files-found: error
  orchestrate:
    needs: [source, emergency-broker-staging, emergency-broker-production]
    if: ${{ always() && github.run_attempt == 1 && needs.source.result == 'success' && (inputs.stage == 'preview' || (needs.emergency-broker-staging.result == 'success' && needs.emergency-broker-production.result == 'success')) }}
    permissions:
      actions: write
      checks: write
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage == 'preview' && 'preview' || inputs.stage == 'staging' && 'staging' || 'production' }}
    timeout-minutes: 360
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGE: ${{ inputs.stage }}
      PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
      ROLLBACK_FROM_STAGE: ${{ inputs.rollback_from_stage }}
      # 20-minute default child custody, with script-enforced 35/65-minute
      # journey/drill budgets, leaves at least 50 minutes for fail-close,
      # reconciliation, rollback, and evidence before the 330-minute job cap.
      PONTO_DISPATCH_TIMEOUT_MS: "1200000"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Initialize private release artifact directory
        run: |
          echo "PONTO_ARTIFACT_DIR=$RUNNER_TEMP/ponto-release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ponto-release"
      - name: Verify immutable source and ordered predecessor provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full SHA'; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || { echo 'release_sha must equal the immutable main coordinator SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'checkout differs from release_sha'; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'release_sha is not reachable from main'; exit 1; }
          tree="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          mkdir -p "$PONTO_ARTIFACT_DIR/predecessor" "$PONTO_ARTIFACT_DIR/runs" "$PONTO_ARTIFACT_DIR/surfaces" "$PONTO_ARTIFACT_DIR/module-transitions"
          case "$STAGE" in
            preview) predecessor='' ;;
            staging) predecessor=preview ;;
            pilot) predecessor=staging ;;
            canary) predecessor=pilot ;;
            production) predecessor=canary ;;
            rollback) predecessor="$ROLLBACK_FROM_STAGE" ;;
            *) exit 1 ;;
          esac
          echo "predecessor=$predecessor" >> "$GITHUB_OUTPUT"
          [[ "$STAGE" == preview ]] && exit 0
          [[ "$PREDECESSOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'numeric predecessor_run_id is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ponto-progressive-release.yml" > "$RUNNER_TEMP/ponto-workflow.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREDECESSOR_RUN_ID" > "$RUNNER_TEMP/predecessor-run.json"
          PREDECESSOR_STAGE="$predecessor" node - "$RUNNER_TEMP/ponto-workflow.json" "$RUNNER_TEMP/predecessor-run.json" <<'NODE'
          const fs = require("fs");
          const workflow = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const run = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const expectedTitle = `Ponto ${process.env.PREDECESSOR_STAGE} ${process.env.RELEASE_SHA} orchestrator=${process.env.PREDECESSOR_RUN_ID}`;
          if (
            workflow?.state !== "active"
            || workflow?.path !== ".github/workflows/ponto-progressive-release.yml"
            || !Number.isInteger(workflow?.id)
            || String(run?.id || "") !== process.env.PREDECESSOR_RUN_ID
            || run.workflow_id !== workflow.id
            || ![workflow.path, `${workflow.path}@refs/heads/main`].includes(run.path)
            || run.status !== "completed"
            || run.conclusion !== "success"
            || run.run_attempt !== 1
            || run.event !== "workflow_dispatch"
            || run.head_branch !== "main"
            || String(run.head_sha || "").toLowerCase() !== process.env.RELEASE_SHA
            || run.name !== expectedTitle
            || run.display_title !== expectedTitle
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || String(run.repository?.id || "") !== process.env.GITHUB_REPOSITORY_ID
            || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
            || String(run.head_repository?.id || "") !== process.env.GITHUB_REPOSITORY_ID
          ) throw new Error("predecessor run provenance is invalid");
          NODE
          artifact="ponto-release-evidence-${predecessor}-${RELEASE_SHA}"
          gh run download "$PREDECESSOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$PONTO_ARTIFACT_DIR/predecessor"
          PONTO_EXPECTED_STAGE="$predecessor" PONTO_EXPECTED_SHA="$RELEASE_SHA" PONTO_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
            node .github/scripts/ponto-release-evidence.mjs verify "$PONTO_ARTIFACT_DIR/predecessor/ponto-release-evidence.json"
          rm -f "$RUNNER_TEMP/ponto-workflow.json" "$RUNNER_TEMP/predecessor-run.json"
      - name: Attest canonical merged PR and required checks for the immutable SHA
        if: ${{ inputs.stage != 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" > "$RUNNER_TEMP/ponto-release-pulls.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/ponto-release-checks.json"
          node - "$RUNNER_TEMP/ponto-release-pulls.json" "$RUNNER_TEMP/ponto-release-checks.json" <<'NODE'
          const fs = require("fs");
          const read = file => JSON.parse(fs.readFileSync(file, "utf8"));
          const pulls = read(process.argv[2]);
          const checks = read(process.argv[3]);
          const sha = process.env.RELEASE_SHA.toLowerCase();
          const policy = read(".github/governance/progressive-release-policy.json");
          const merged = (Array.isArray(pulls) ? pulls : []).filter(pr =>
            pr?.base?.ref === "main" && pr?.state === "closed" && pr?.merged_at
            && String(pr?.merge_commit_sha || "").toLowerCase() === sha
            && String(pr?.head?.repo?.full_name || "") === process.env.GITHUB_REPOSITORY
          );
          if (merged.length !== 1) throw new Error("immutable release SHA lacks exactly one canonical merged PR into main");
          const byName = new Map((checks.check_runs || []).map(run => [String(run.name || ""), run]));
          for (const name of policy.governance.requiredChecks || []) {
            const run = byName.get(name);
            if (!run || run.conclusion !== "success") throw new Error(`required check is not successful for immutable release SHA: ${name}`);
          }
          NODE
          rm -f "$RUNNER_TEMP/ponto-release-pulls.json" "$RUNNER_TEMP/ponto-release-checks.json"
      - name: Attest single-operator Codex governance and protected environment before issuing any capability
        if: ${{ inputs.stage != 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required for protection attestation'; exit 1; }
          target=production
          [[ "$STAGE" == staging ]] && target=staging
          mkdir -p "$PONTO_ARTIFACT_DIR/governance"
          gh api "repos/$GITHUB_REPOSITORY/environments/$target" \
            > "$RUNNER_TEMP/ponto-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/$target/deployment-branch-policies?per_page=100" \
            > "$RUNNER_TEMP/ponto-environment-branch-policies.json"
          PONTO_ENVIRONMENT_TARGET="$target" \
            node .github/scripts/ponto-environment-protection.mjs \
              "$RUNNER_TEMP/ponto-environment.json" \
              "$RUNNER_TEMP/ponto-environment-branch-policies.json" \
              "$PONTO_ARTIFACT_DIR/governance/ponto-environment-protection.json"
          rm -f \
            "$RUNNER_TEMP/ponto-environment.json" \
            "$RUNNER_TEMP/ponto-environment-branch-policies.json"
      - name: Refuse a latched Ponto emergency stop before issuing capabilities
        if: ${{ contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_NAMESPACE_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PRODUCTION_NAMESPACE_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            staging) NAMESPACE_ID="$STAGING_NAMESPACE_ID_RAW"; OPPOSITE_NAMESPACE_ID="$PRODUCTION_NAMESPACE_ID_RAW" ;;
            pilot|canary|production|rollback) NAMESPACE_ID="$PRODUCTION_NAMESPACE_ID_RAW"; OPPOSITE_NAMESPACE_ID="$STAGING_NAMESPACE_ID_RAW" ;;
            *) echo 'Unsupported emergency-latch release stage'; exit 1 ;;
          esac
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NAMESPACE_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing emergency-latch preflight value: $name"; exit 1; }
          done
          if [[ -n "${OPPOSITE_NAMESPACE_ID:-}" && "$NAMESPACE_ID" == "$OPPOSITE_NAMESPACE_ID" ]]; then
            echo 'Selected and opposite Ponto namespaces must be independent'
            exit 1
          fi
          [[ "$NAMESPACE_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Invalid module-control KV id'; exit 1; }
          resource_target=production
          [[ "$STAGE" == staging ]] && resource_target=staging
          PONTO_RESOURCE_TARGET="$resource_target" \
          PONTO_MODULE_CONTROL_KV_ID="$NAMESPACE_ID" \
          PONTO_OPPOSITE_MODULE_CONTROL_KV_ID="$OPPOSITE_NAMESPACE_ID" \
          PONTO_RESOURCE_IDENTITY_REPORT="$RUNNER_TEMP/ponto-root-module-control-identity.json" \
            node .github/scripts/ponto-cloudflare-resource-identity.mjs
          prior="$RUNNER_TEMP/ponto-emergency-latch.json"
          npx --yes wrangler@4.112.0 kv key get "module-control:timekeeping:emergency-latch" --namespace-id "$NAMESPACE_ID" --remote > "$prior"
          PONTO_EXPECTED_LATCH_TARGET="$resource_target" node - "$prior" <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            value?.schemaVersion !== 1
            || value?.module !== "timekeeping"
            || value?.target !== process.env.PONTO_EXPECTED_LATCH_TARGET
            || value?.latched !== false
            || !Number.isFinite(Date.parse(String(value?.changedAt || "")))
            || !String(value?.changedBy || "").trim()
          ) throw new Error("Ponto emergency latch is missing, unreadable, malformed, or active; run a monotonic emergency close and the protected reset before release");
          NODE
          rm -f "$prior"
      - name: Verify target-bound asymmetric child capability custody
        if: ${{ inputs.stage != 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_ORCHESTRATOR_CAPABILITY_PRIVATE_KEY: ${{ secrets.PONTO_ORCHESTRATOR_CAPABILITY_PRIVATE_KEY }}
          PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON: ${{ vars.PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'Environment custody metadata access is required'; exit 1; }
          target=production
          [[ "$STAGE" == staging ]] && target=staging
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" > "$RUNNER_TEMP/ponto-capability-repository-secrets.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/variables?per_page=100" > "$RUNNER_TEMP/ponto-capability-repository-variables.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/$target/secrets?per_page=100" > "$RUNNER_TEMP/ponto-capability-environment-secrets.json"
          node - \
            "$RUNNER_TEMP/ponto-capability-repository-secrets.json" \
            "$RUNNER_TEMP/ponto-capability-repository-variables.json" \
            "$RUNNER_TEMP/ponto-capability-environment-secrets.json" <<'NODE'
          const fs = require("fs");
          const names = (file, key) => new Set((JSON.parse(fs.readFileSync(file, "utf8"))[key] || []).map(item => item.name));
          const repositorySecrets = names(process.argv[2], "secrets");
          const repositoryVariables = names(process.argv[3], "variables");
          const environmentSecrets = names(process.argv[4], "secrets");
          const privateName = "PONTO_ORCHESTRATOR_CAPABILITY_PRIVATE_KEY";
          const publicMapName = "PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON";
          if (
            repositorySecrets.has(privateName)
            || !repositoryVariables.has(publicMapName)
            || !environmentSecrets.has(privateName)
          ) throw new Error("Ponto Ed25519 signer must be target-environment-only and its verifier map repository-public");
          NODE
          PONTO_CAPABILITY_TARGET="$target" node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import { resolveCapabilityVerifier } from "./.github/scripts/ponto-orchestrator-lease.mjs";
          const privateKey = crypto.createPrivateKey(process.env.PONTO_ORCHESTRATOR_CAPABILITY_PRIVATE_KEY || "");
          const verifier = resolveCapabilityVerifier(
            process.env.PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON,
            process.env.PONTO_CAPABILITY_TARGET,
          );
          const publicKey = crypto.createPublicKey(verifier.publicKey);
          if (privateKey.asymmetricKeyType !== "ed25519") throw new Error("Ponto capability signer is not Ed25519");
          const probe = crypto.randomBytes(32);
          if (!crypto.verify(null, probe, publicKey, crypto.sign(null, probe, privateKey))) {
            throw new Error("Ponto capability private/public target pair does not match");
          }
          NODE
          rm -f "$RUNNER_TEMP"/ponto-capability-*.json
      - name: Preflight selected environment secret-root custody
        if: ${{ contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required for custody attestation'; exit 1; }
          target=production
          [[ "$STAGE" == staging ]] && target=staging
          gh api "repos/$GITHUB_REPOSITORY/environments/$target/secrets?per_page=100" > "$RUNNER_TEMP/ponto-root-environment-secrets.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/staging/secrets?per_page=100" > "$RUNNER_TEMP/ponto-root-staging-secrets.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/secrets?per_page=100" > "$RUNNER_TEMP/ponto-root-production-secrets.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" > "$RUNNER_TEMP/ponto-root-repository-secrets.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/$target/variables?per_page=100" > "$RUNNER_TEMP/ponto-root-environment-variables.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/variables?per_page=100" > "$RUNNER_TEMP/ponto-root-repository-variables.json"
          node - \
            "$RUNNER_TEMP/ponto-root-environment-secrets.json" \
            "$RUNNER_TEMP/ponto-root-repository-secrets.json" \
            "$RUNNER_TEMP/ponto-root-environment-variables.json" \
            "$RUNNER_TEMP/ponto-root-repository-variables.json" \
            "$RUNNER_TEMP/ponto-root-staging-secrets.json" \
            "$RUNNER_TEMP/ponto-root-production-secrets.json" <<'NODE'
          const fs = require("fs");
          const names = (file, key) => new Set((JSON.parse(fs.readFileSync(file, "utf8"))[key] || []).map(item => item.name));
          const environmentSecrets = names(process.argv[2], "secrets");
          const repositorySecrets = names(process.argv[3], "secrets");
          const environmentVariables = names(process.argv[4], "variables");
          const repositoryVariables = names(process.argv[5], "variables");
          const stagingSecrets = names(process.argv[6], "secrets");
          const productionSecrets = names(process.argv[7], "secrets");
          for (const name of ["PONTO_PROFILE_DATA_KEY", "PONTO_IDEMPOTENCY_KEY"]) {
            if (repositorySecrets.has(name) || !environmentSecrets.has(name)) {
              throw new Error(`${name} must be owned only by the selected GitHub environment; repository fallback is refused`);
            }
          }
          if (
            repositorySecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
            || !environmentSecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
            || !stagingSecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
            || !productionSecrets.has("PONTO_ROOT_ATTESTATION_KEY_SHARED")
          ) throw new Error("shared root attestation key must exist only in both protected target environments");
          if (
            repositorySecrets.has("PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY")
            || !environmentSecrets.has("PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY")
            || !stagingSecrets.has("PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY")
            || !productionSecrets.has("PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY")
          ) throw new Error("Pages rollback intent key must exist only in both protected target environments");
          if (
            !repositorySecrets.has("PONTO_WAF_READ_API_TOKEN")
            || repositorySecrets.has("PONTO_WAF_WRITE_API_TOKEN")
            || environmentSecrets.has("PONTO_WAF_READ_API_TOKEN")
            || stagingSecrets.has("PONTO_WAF_READ_API_TOKEN")
            || stagingSecrets.has("PONTO_WAF_WRITE_API_TOKEN")
            || productionSecrets.has("PONTO_WAF_READ_API_TOKEN")
            || !productionSecrets.has("PONTO_WAF_WRITE_API_TOKEN")
          ) throw new Error("Ponto WAF read/write tokens are missing or violate repository/production custody separation");
          for (const name of ["PONTO_PROFILE_DATA_KEY_CUSTODY_REF", "PONTO_IDEMPOTENCY_KEY_CUSTODY_REF"]) {
            if (!environmentVariables.has(name)) throw new Error(`${name} must be owned by the selected GitHub environment`);
          }
          if (
            !repositoryVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
            || environmentVariables.has("PONTO_ROOT_ATTESTATION_KEY_ID")
          ) {
            throw new Error("shared root attestation key ID must exist only at repository scope");
          }
          NODE
          rm -f \
            "$RUNNER_TEMP/ponto-root-environment-secrets.json" \
            "$RUNNER_TEMP/ponto-root-staging-secrets.json" \
            "$RUNNER_TEMP/ponto-root-production-secrets.json" \
            "$RUNNER_TEMP/ponto-root-repository-secrets.json" \
            "$RUNNER_TEMP/ponto-root-environment-variables.json" \
            "$RUNNER_TEMP/ponto-root-repository-variables.json"
      - name: Require the single-operator no-review true-only emergency close path
        if: ${{ contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments read is required for emergency custody'; exit 1; }
          for target in staging production; do
            environment="ponto-emergency-$target"
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment" > "$RUNNER_TEMP/$environment.json"
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment/secrets?per_page=100" > "$RUNNER_TEMP/$environment-secrets.json"
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment/variables?per_page=100" > "$RUNNER_TEMP/$environment-variables.json"
          done
          node - "$RUNNER_TEMP/ponto-emergency-staging.json" \
            "$RUNNER_TEMP/ponto-emergency-staging-secrets.json" \
            "$RUNNER_TEMP/ponto-emergency-staging-variables.json" \
            "$RUNNER_TEMP/ponto-emergency-production.json" \
            "$RUNNER_TEMP/ponto-emergency-production-secrets.json" \
            "$RUNNER_TEMP/ponto-emergency-production-variables.json" <<'NODE'
           const fs = require("fs");
           const read = file => JSON.parse(fs.readFileSync(file, "utf8"));
           const brokerPolicies = read(".github/governance/progressive-release-policy.json").emergencyBrokers || {};
          const configurations = [
            ["staging", read(process.argv[2]), read(process.argv[3]), read(process.argv[4])],
            ["production", read(process.argv[5]), read(process.argv[6]), read(process.argv[7])],
          ];
          const custodyRefs = [];
          for (const [target, environment, secretPayload, variablePayload] of configurations) {
            const protectionRules = environment?.protection_rules || [];
            if (
              environment?.name !== `ponto-emergency-${target}`
              || environment?.can_admins_bypass !== false
              || protectionRules.length !== 1
              || protectionRules[0]?.type !== "branch_policy"
              || !Number.isInteger(Number(protectionRules[0]?.id))
              || Number(protectionRules[0]?.id) <= 0
              || environment?.deployment_branch_policy?.protected_branches !== true
              || environment?.deployment_branch_policy?.custom_branch_policies !== false
            ) throw new Error(`${target} emergency environment must disable admin bypass and contain only its protected-branch policy`);
            const secretNames = new Set((secretPayload.secrets || []).map(item => item.name));
            const forbiddenSecrets = [
              "CLOUDFLARE_API_TOKEN",
              "PONTO_EMERGENCY_CLOSE_API_TOKEN",
              "PONTO_ORCHESTRATOR_CAPABILITY_PRIVATE_KEY",
              "PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY",
              "PONTO_ROOT_ATTESTATION_KEY_SHARED",
            ];
            if (
              !secretNames.has("PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL")
              || forbiddenSecrets.some((name) => secretNames.has(name))
            ) throw new Error(`${target} close-only broker credential is absent or a direct Cloudflare credential remains`);
            const variables = Object.fromEntries((variablePayload.variables || []).map(item => [item.name, item.value]));
            for (const name of [
              "PONTO_EMERGENCY_CLOSE_BROKER_URL",
              "PONTO_EMERGENCY_CLOSE_CUSTODY_REF",
            ]) if (!String(variables[name] || "").trim()) throw new Error(`${target} emergency variable ${name} is absent`);
             if (variables.PONTO_EMERGENCY_CLOSE_MODE !== "external-close-only-broker-v1") {
               throw new Error(`${target} emergency credential is not bound to the close-only broker contract`);
             }
             const brokerPolicy = brokerPolicies[target];
             if (
               !brokerPolicy
               || !String(brokerPolicy.url || "").trim()
               || !String(brokerPolicy.custodyRef || "").trim()
               || !String(brokerPolicy.responseKeyId || "").trim()
               || !String(brokerPolicy.responsePublicKeyPem || "").trim()
               || variables.PONTO_EMERGENCY_CLOSE_BROKER_URL !== brokerPolicy.url
               || variables.PONTO_EMERGENCY_CLOSE_CUSTODY_REF !== brokerPolicy.custodyRef
             ) {
               throw new Error(`${target} close-only broker identity is absent from or differs from reviewed policy`);
             }
             const brokerUrl = new URL(variables.PONTO_EMERGENCY_CLOSE_BROKER_URL);
            if (
              brokerUrl.protocol !== "https:"
              || brokerUrl.username
              || brokerUrl.password
              || brokerUrl.search
              || brokerUrl.hash
              || brokerUrl.pathname === "/"
            ) {
              throw new Error(`${target} close-only broker URL is invalid`);
            }
            custodyRefs.push(variables.PONTO_EMERGENCY_CLOSE_CUSTODY_REF);
          }
          if (custodyRefs[0] === custodyRefs[1]) throw new Error("staging and production close-only broker custody is not isolated");
          NODE
          rm -f "$RUNNER_TEMP"/ponto-emergency-*.json
      - name: Preflight production custody, approved cohort, and online pilot runner
        if: ${{ contains(fromJSON('["pilot","canary","production"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_COHORT_PERCENTAGE: ${{ vars.PONTO_CANARY_COHORT_PERCENTAGE }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments, Actions, Variables, and Administration read is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/environments/production/secrets?per_page=100" > "$RUNNER_TEMP/production-secret-names.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" > "$RUNNER_TEMP/repository-runners.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/variables/PONTO_PILOT_RUNNER_LABELS_JSON" > "$RUNNER_TEMP/ponto-pilot-runner-labels-repository-variable.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/variables/PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/ponto-pilot-runner-encryption-repository-variable.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/variables?per_page=100" > "$RUNNER_TEMP/ponto-pilot-runner-environment-variables.json"
          node - \
            "$RUNNER_TEMP/production-secret-names.json" \
            "$RUNNER_TEMP/repository-runners.json" \
            "$RUNNER_TEMP/ponto-pilot-runner-labels-repository-variable.json" \
            "$RUNNER_TEMP/ponto-pilot-runner-environment-variables.json" \
            "$RUNNER_TEMP/ponto-pilot-runner-encryption-repository-variable.json" \
            "$PONTO_ARTIFACT_DIR/cohort-summary.json" <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const secretPayload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const names = new Set((secretPayload.secrets || []).map(item => item.name));
          for (const name of ["PONTO_PILOT_LOGIN", "PONTO_PILOT_PASSWORD", "PONTO_PILOT_COHORT_JSON", "PONTO_PROFILE_DATA_KEY", "PONTO_IDEMPOTENCY_KEY"]) {
            if (!names.has(name)) throw new Error(`${name} must be owned by the production environment`);
          }
          const policy = JSON.parse(fs.readFileSync(".github/governance/progressive-release-policy.json", "utf8"));
          const expected = policy?.pilotRunner?.production;
          const requiredBaseLabels = ["self-hosted", "Linux", "X64"];
          const customLabels = Array.isArray(expected?.requiredLabels)
            ? expected.requiredLabels.filter(label => !requiredBaseLabels.includes(label))
            : [];
          const jitPaths = [
            expected?.jitAttestationFilePath,
            expected?.jitCredentialBundleFilePath,
            expected?.jitDecryptKeyFilePath,
          ].map(value => String(value || ""));
          const repositoryEncryptionVariable = JSON.parse(fs.readFileSync(process.argv[6], "utf8"));
          let jitPublicKey = null;
          let runnerEncryptionPublicKey = null;
          let runnerEncryptionFingerprint = "";
          try { jitPublicKey = crypto.createPublicKey(String(expected?.jitAttestationPublicKeyPem || "")); } catch {}
          try {
            runnerEncryptionPublicKey = crypto.createPublicKey(String(repositoryEncryptionVariable?.value || ""));
            const publicDer = runnerEncryptionPublicKey.export({ type: "spki", format: "der" });
            runnerEncryptionFingerprint = crypto.createHash("sha256").update(publicDer).digest("hex");
          } catch {}
          if (
            !/^[1-9][0-9]{0,19}$/.test(String(expected?.runnerId || ""))
            || typeof expected?.runnerName !== "string"
            || !expected.runnerName.trim()
            || typeof expected?.runnerIsolationRef !== "string"
            || !expected.runnerIsolationRef.trim()
            || !Array.isArray(expected?.requiredLabels)
            || expected.requiredLabels.length !== 4
            || new Set(expected.requiredLabels).size !== expected.requiredLabels.length
            || expected.requiredLabels.some(label => typeof label !== "string" || !/^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$/.test(label))
            || !requiredBaseLabels.every(label => expected.requiredLabels.includes(label))
            || customLabels.length !== 1
            || !/^ponto-jit-[a-z0-9][a-z0-9-]{15,63}$/.test(customLabels[0])
            || typeof expected?.networkContextCustodyRef !== "string"
            || !expected.networkContextCustodyRef.trim()
            || !/^[0-9a-f]{64}$/.test(String(expected?.encryptionPublicKeySha256 || ""))
            || expected?.jitMode !== "ephemeral-pre-job-hook-ed25519-v1"
            || !/^[a-z][a-z0-9-]{1,63}$/.test(String(expected?.jitAttestationKeyId || ""))
            || jitPublicKey?.asymmetricKeyType !== "ed25519"
            || repositoryEncryptionVariable?.name !== "PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM"
            || runnerEncryptionPublicKey?.asymmetricKeyType !== "rsa"
            || Number(runnerEncryptionPublicKey?.asymmetricKeyDetails?.modulusLength || 0) < 2048
            || runnerEncryptionFingerprint !== String(expected?.encryptionPublicKeySha256 || "").toLowerCase()
            || jitPaths.some(value => !path.posix.isAbsolute(value))
            || new Set(jitPaths).size !== jitPaths.length
            || new Set(jitPaths.map(value => path.posix.dirname(value))).size !== 1
            || typeof expected?.jitSupervisorCustodyRef !== "string"
            || !expected.jitSupervisorCustodyRef.trim()
            || typeof expected?.jitCleanupHookCustodyRef !== "string"
            || !expected.jitCleanupHookCustodyRef.trim()
          ) throw new Error("production one-shot pilot runner policy remains fail-closed");
          const repositoryVariable = JSON.parse(fs.readFileSync(process.argv[4], "utf8"));
          const environmentVariables = JSON.parse(fs.readFileSync(process.argv[5], "utf8")).variables || [];
          const shadowed = new Set(environmentVariables.map(item => item?.name));
          if (
            shadowed.has("PONTO_PILOT_RUNNER_LABELS_JSON")
            || shadowed.has("PONTO_PILOT_RUNNER_ENCRYPTION_PUBLIC_KEY_PEM")
          ) {
            throw new Error("Ponto pilot runner repository variables may not be shadowed by the production environment");
          }
          let requiredLabels;
          try { requiredLabels = JSON.parse(repositoryVariable?.value || ""); } catch {}
          if (
            repositoryVariable?.name !== "PONTO_PILOT_RUNNER_LABELS_JSON"
            || JSON.stringify(requiredLabels) !== JSON.stringify(expected.requiredLabels)
          ) throw new Error("repository runner selector differs from the versioned one-shot policy");
          const runnerPayload = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const runners = runnerPayload.runners || [];
          if (runnerPayload.total_count !== runners.length) {
            throw new Error("runner inventory exceeds the bounded complete attestation page");
          }
          const matching = runners.filter((runner) => {
            const labels = (runner.labels || []).map(item => String(item?.name || ""));
            return labels.length === requiredLabels.length
              && requiredLabels.every(label => labels.includes(label));
          });
          if (
            matching.length !== 1
            || String(matching[0]?.id || "") !== String(expected.runnerId)
            || matching[0]?.name !== expected.runnerName
            || matching[0]?.status !== "online"
            || matching[0]?.busy !== false
          ) throw new Error("exact policy-pinned one-shot clinic runner is not uniquely online and idle");
          if (process.env.STAGE === "canary") {
            const percentage = Number(process.env.CANARY_COHORT_PERCENTAGE);
            if (!Number.isInteger(percentage) || percentage < 1 || percentage > 100) throw new Error("PONTO_CANARY_COHORT_PERCENTAGE must be 1..100");
          }
          fs.writeFileSync(process.argv[7], `${JSON.stringify({
            configured: true,
            valuesHydratedOnCoordinator: false,
            validatedByName: true,
            validationDeferredToModuleTransition: true,
            validationDeferredToApprovedRunner: true,
            approvedRunnerAvailable: true,
            runnerId: String(expected.runnerId),
            runnerName: expected.runnerName,
            oneShotSelectorValidated: true,
            runnerLabelCount: requiredLabels.length,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          rm -f \
            "$RUNNER_TEMP/production-secret-names.json" \
            "$RUNNER_TEMP/repository-runners.json" \
            "$RUNNER_TEMP/ponto-pilot-runner-labels-repository-variable.json" \
            "$RUNNER_TEMP/ponto-pilot-runner-environment-variables.json" \
            "$RUNNER_TEMP/ponto-pilot-runner-encryption-repository-variable.json"
      - name: Attest unconditional edge blocks before any candidate mutation
        if: ${{ contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
        env:
          PONTO_WAF_READ_API_TOKEN: ${{ secrets.PONTO_WAF_READ_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
