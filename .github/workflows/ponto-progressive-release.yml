          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs module-availability.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/module-staging-active.json" "$PONTO_ARTIFACT_DIR/runs/module-staging-active.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/module-staging-active.json")"
          mkdir -p "$PONTO_ARTIFACT_DIR/module-transitions/staging-active"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "module-transition-timekeeping-staging-active-$GITHUB_RUN_ID" \
            --dir "$PONTO_ARTIFACT_DIR/module-transitions/staging-active"
      - name: Execute authenticated synthetic staging journey
        id: staging_journey
        if: inputs.stage == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEKEEPING_RUN: ${{ steps.timekeeping.outputs.run_id }}
          CORE_RUN: ${{ steps.core.outputs.run_id }}
          IDENTITY_RUN: ${{ steps.identity.outputs.run_id }}
          PAGES_RUN: ${{ steps.pages.outputs.run_id }}
        run: |
          set -euo pipefail
          pages_url="$(node -e "process.stdout.write(require(process.argv[1]).url)" "$PONTO_ARTIFACT_DIR/surfaces/pages/surface.json")"
          timekeeping_id="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json")"
          identity_id="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json")"
          node - "$RUNNER_TEMP/staging-journey-inputs.json" "$pages_url" "$timekeeping_id" "$identity_id" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(process.argv[2], JSON.stringify({
            release_sha: process.env.RELEASE_SHA,
            timekeeping_staging_run_id: process.env.TIMEKEEPING_RUN,
            core_api_staging_run_id: process.env.CORE_RUN,
            identity_staging_run_id: process.env.IDENTITY_RUN,
            crm_pages_staging_run_id: process.env.PAGES_RUN,
            pages_url: process.argv[3],
            timekeeping_version_id: process.argv[4],
            identity_version_id: process.argv[5],
          }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs timekeeping-staging-journey.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/staging-journey-inputs.json" "$PONTO_ARTIFACT_DIR/runs/staging-journey.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/staging-journey.json")"
