      - name: Exercise staging rollback and restore the exact candidates
        if: inputs.stage == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/staging-rollback-drill-inputs.json" \
            "$PONTO_ARTIFACT_DIR/runs/staging-journey.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/pages/surface.json" <<'NODE'
          const fs = require("fs");
          const journey = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const timekeeping = JSON.parse(fs.readFileSync(process.argv[4], "utf8"));
          const core = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          const identity = JSON.parse(fs.readFileSync(process.argv[6], "utf8"));
          const pages = JSON.parse(fs.readFileSync(process.argv[7], "utf8"));
          fs.writeFileSync(process.argv[2], JSON.stringify({
            release_sha: process.env.RELEASE_SHA,
            orchestrator_run_id: process.env.GITHUB_RUN_ID,
            staging_journey_run_id: String(journey.runId),
            timekeeping_candidate_version_id: timekeeping.candidateVersionId,
            timekeeping_incumbent_version_id: timekeeping.incumbentVersionId,
            core_candidate_version_id: core.candidateVersionId,
            core_incumbent_version_id: core.incumbentVersionId,
            identity_candidate_version_id: identity.candidateVersionId,
            identity_incumbent_version_id: identity.incumbentVersionId,
            pages_candidate_deployment_id: pages.deploymentId,
            pages_incumbent_deployment_id: pages.rollbackDeploymentId,
          }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs ponto-staging-rollback-drill.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/staging-rollback-drill-inputs.json" "$PONTO_ARTIFACT_DIR/runs/staging-rollback-drill.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/staging-rollback-drill.json")"
          mkdir -p "$PONTO_ARTIFACT_DIR/staging-rollback-drill"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "ponto-staging-rollback-drill-$RELEASE_SHA" \
            --dir "$PONTO_ARTIFACT_DIR/staging-rollback-drill"
          node - "$PONTO_ARTIFACT_DIR/staging-rollback-drill/ponto-staging-rollback-drill.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/pages/surface.json" <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            value.releaseSha !== process.env.RELEASE_SHA
            || value.orchestratorRunId !== process.env.GITHUB_RUN_ID
            || value.passed !== true
            || value.credentialsIncluded !== false
            || value.piiIncluded !== false
            || value.recovery?.disposition !== "candidate-restored-under-maintenance"
          ) {
            throw new Error("staging rollback drill evidence is invalid");
          }
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const entries = [
            ["timekeeping", process.argv[3]],
            ["coreApi", process.argv[4]],
            ["identityWorkforce", process.argv[5]],
          ];
          for (const [surface, file] of entries) {
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const proof = value.restoration?.surfaces?.[surface];
            if (
              manifest.surface !== surface
              || proof?.passed !== true
              || !uuid.test(proof.deploymentId)
              || String(proof.versionId || "").toLowerCase() !== String(manifest.candidateVersionId || "").toLowerCase()
            ) throw new Error(`${surface} rollback-drill restoration identity is invalid`);
            fs.writeFileSync(file, `${JSON.stringify({
              ...manifest,
              preRollbackDrillDeploymentId: manifest.deploymentId,
              deploymentId: proof.deploymentId,
              rollbackDrillRunId: value.runId,
            }, null, 2)}\n`, { mode: 0o600 });
          }
          const pagesFile = process.argv[6];
          const pages = JSON.parse(fs.readFileSync(pagesFile, "utf8"));
          const pagesProof = value.restoration?.surfaces?.crmPages;
          if (
            pages.surface !== "crmPages"
            || pagesProof?.passed !== true
            || !uuid.test(pagesProof.activeDeploymentId)
            || pagesProof.sourceDeploymentId !== pages.deploymentId
            || String(pagesProof.commitHash || "").toLowerCase() !== process.env.RELEASE_SHA
          ) throw new Error("CRM Pages rollback-drill restoration identity is invalid");
          fs.writeFileSync(pagesFile, `${JSON.stringify({
            ...pages,
            preRollbackDrillDeploymentId: pages.deploymentId,
            deploymentId: pagesProof.activeDeploymentId,
            rollbackDrillRunId: value.runId,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Open the approved live cohort or activate production
        if: ${{ contains(fromJSON('["pilot","canary","production"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_COHORT_PERCENTAGE: ${{ vars.PONTO_CANARY_COHORT_PERCENTAGE }}
        run: |
          set -euo pipefail
          tk_candidate="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json")"
          tk_incumbent="$(node -e "process.stdout.write(require(process.argv[1]).incumbentVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json")"
          core_candidate="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json")"
          core_incumbent="$(node -e "process.stdout.write(require(process.argv[1]).incumbentVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json")"
          identity_candidate="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json")"
          identity_incumbent="$(node -e "process.stdout.write(require(process.argv[1]).incumbentVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json")"
          expires_at="$(node -e "process.stdout.write(new Date(Date.now()+2*60*60*1000).toISOString())")"
          node - "$RUNNER_TEMP/module-open.json" "$tk_candidate" "$tk_incumbent" "$core_candidate" "$core_incumbent" "$identity_candidate" "$identity_incumbent" "$expires_at" <<'NODE'
          const fs = require("fs");
          const stage = process.env.STAGE;
          const inputs = {
            module: "timekeeping",
            target: "production",
            state: stage === "production" ? "active" : "canary",
            release_sha: process.env.RELEASE_SHA,
            timekeeping_candidate_version_id: process.argv[3],
            timekeeping_incumbent_version_id: process.argv[4],
            core_candidate_version_id: process.argv[5],
            core_incumbent_version_id: process.argv[6],
            identity_candidate_version_id: process.argv[7],
            identity_incumbent_version_id: process.argv[8],
            message: "",
            orchestrator_run_id: process.env.GITHUB_RUN_ID,
          };
          if (stage !== "production") Object.assign(inputs, {
            rollout_stage: stage,
            worker_percentage: "0",
            cohort_percentage: stage === "pilot" ? "100" : process.env.CANARY_COHORT_PERCENTAGE,
            expires_at: process.argv[9],
          });
          fs.writeFileSync(process.argv[2], JSON.stringify(inputs));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs module-availability.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/module-open.json" "$PONTO_ARTIFACT_DIR/runs/module-open.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/module-open.json")"
          mkdir -p "$PONTO_ARTIFACT_DIR/module-transitions/live-open"
          state="$([[ "$STAGE" == production ]] && echo active || echo canary)"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "module-transition-timekeeping-production-$state-$GITHUB_RUN_ID" \
            --dir "$PONTO_ARTIFACT_DIR/module-transitions/live-open"
      - name: Observe external authenticated production SLO
        if: ${{ contains(fromJSON('["pilot","canary","production","rollback"]'), inputs.stage) }}
        id: slo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - "$RUNNER_TEMP/slo-inputs.json" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json" "$PONTO_ARTIFACT_DIR/surfaces/pages/surface.json" <<'NODE'
          const fs = require("fs");
          const core = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const timekeeping = JSON.parse(fs.readFileSync(process.argv[4], "utf8"));
          const identity = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          const pages = JSON.parse(fs.readFileSync(process.argv[6], "utf8"));
          const rollback = process.env.STAGE === "rollback";
          fs.writeFileSync(process.argv[2], JSON.stringify({
            stage: process.env.STAGE,
            release_sha: process.env.RELEASE_SHA,
            core_version_id: rollback ? core.incumbentVersionId : core.candidateVersionId,
            timekeeping_version_id: rollback ? timekeeping.incumbentVersionId : timekeeping.candidateVersionId,
            identity_version_id: rollback ? identity.incumbentVersionId : identity.candidateVersionId,
            pages_deployment_id: pages.deploymentId,
          }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs ponto-production-slo.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/slo-inputs.json" "$PONTO_ARTIFACT_DIR/runs/slo.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/slo.json")"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "ponto-slo-${STAGE}-${RELEASE_SHA}" --dir "$PONTO_ARTIFACT_DIR/slo"
      - name: Consolidate sanitized schema v2 evidence
        if: success()
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
          PREDECESSOR_STAGE: ${{ steps.source.outputs.predecessor }}
        run: |
          set -euo pipefail
          node - "$PONTO_ARTIFACT_DIR" <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const root = process.argv[2];
          const read = file => JSON.parse(fs.readFileSync(file, "utf8"));
          const surfaces = {
            timekeeping: read(path.join(root, "surfaces/timekeeping/surface.json")),
            coreApi: read(path.join(root, "surfaces/core/surface.json")),
            identityWorkforce: read(path.join(root, "surfaces/identity/surface.json")),
            crmPages: read(path.join(root, "surfaces/pages/surface.json")),
          };
          fs.writeFileSync(path.join(root, "surfaces.json"), JSON.stringify(surfaces));
          const checkpoints = Object.fromEntries([
            ["timekeeping", surfaces.timekeeping.checkpoint],
            ["identityWorkforce", surfaces.identityWorkforce.checkpoint],
          ].filter(([, value]) => value));
          fs.writeFileSync(path.join(root, "checkpoint.json"), JSON.stringify(Object.keys(checkpoints).length ? checkpoints : null));
          const migrations = [
            ...(surfaces.timekeeping.migrations || []).map(migration => ({ unit: "timekeeping", ...migration })),
            ...(surfaces.identityWorkforce.migrations || []).map(migration => ({ unit: "identityWorkforce", ...migration })),
          ];
          fs.writeFileSync(path.join(root, "migrations.json"), JSON.stringify(migrations));
          const stagingDrill = process.env.STAGE === "staging"
            ? read(path.join(root, "staging-rollback-drill/ponto-staging-rollback-drill.json"))
            : null;
          fs.writeFileSync(path.join(root, "rollback.json"), JSON.stringify({
            executed: process.env.STAGE === "rollback" || stagingDrill?.passed === true,
            mode: stagingDrill ? "staging-drill-restored-candidate" : (process.env.STAGE === "rollback" ? "live-rollback" : "not-executed"),
            evidenceRunId: stagingDrill?.runId || "",
            predecessorRunId: stagingDrill?.predecessor?.runId || "",
            restoredCandidate: stagingDrill?.passed === true,
            timekeepingVersionId: surfaces.timekeeping.incumbentVersionId,
            coreVersionId: surfaces.coreApi.incumbentVersionId,
            identityVersionId: surfaces.identityWorkforce.incumbentVersionId,
            pagesDeploymentId: surfaces.crmPages.rollbackDeploymentId,
          }));
          if (process.env.STAGE === "staging") {
            const reportFile = path.join(root, "staging-slo/ponto-staging-report.json");
            const contractFile = path.join(root, "staging-slo/ponto-staging-contract.json");
            const report = read(reportFile);
            const contract = read(contractFile);
            const expectedStatuses = {
              auth: 200,
              me: 200,
              profile: 200,
              presence: 200,
              invalidPin: 401,
              punch: 201,
              idempotentRetry: 200,
              crossUnitDenied: 403,
              correction: 201,
              adminDenied: 403,
            };
            const statusChecks = Object.entries(expectedStatuses).map(([key, expected]) => ({
              key,
              expected,
              actual: Number(report.journey?.[key]?.status || 0),
            }));
            const navigationPassed = report.environment === "staging"
              && report.role === "CONSULTOR"
              && report.navigation?.atendimentoVisible === true
              && report.navigation?.pontoVisible === true
              && report.navigation?.administrativeNavigationHidden === true
              && JSON.stringify(report.navigation?.visibleModuleKeys) === JSON.stringify(["atendimento", "ponto"])
              && report.credentialsIncluded === false
              && report.piiIncluded === false;
            const statusErrors = statusChecks.filter(check => check.actual !== check.expected).length;
            const identityOnboarding = report.identityOnboarding || {};
            const identityStatusPassed = Number(identityOnboarding.adminAuth?.status) === 200
              && [200, 201].includes(Number(identityOnboarding.create?.status))
              && Number(identityOnboarding.terminate?.status) === 200
              && Number(identityOnboarding.ledger?.status) === 200
              && identityOnboarding.hmacContract === "v2"
              && identityOnboarding.inviteIssued === false
              && identityOnboarding.auditPreserved === true
              && identityOnboarding.actorRole === "GESTOR"
              && JSON.stringify(identityOnboarding.actorModuleKeys) === JSON.stringify(["insumos"])
              && Number(identityOnboarding.actorUnitCount) === 1;
            const digest = crypto.createHash("sha256").update(fs.readFileSync(reportFile)).update(fs.readFileSync(contractFile)).digest("hex");
            fs.writeFileSync(path.join(root, "slo-summary.json"), JSON.stringify({
              passed: contract.passed === true && navigationPassed && identityStatusPassed && statusErrors === 0,
              samples: statusChecks.length + 7,
              errors: statusErrors + (contract.passed === true ? 0 : 1) + (navigationPassed ? 0 : 1) + (identityStatusPassed ? 0 : 1),
              p95Ms: 0,
              windowSeconds: 1,
              navigation: {
                visibleModuleKeys: navigationPassed ? ["atendimento", "ponto"] : [],
                administrativeNavigationHidden: report.navigation?.administrativeNavigationHidden === true,
              },
              identityOnboarding: {
                passed: identityStatusPassed,
                hmacContract: identityStatusPassed ? "v2" : "",
                inviteIssued: identityOnboarding.inviteIssued === false ? false : null,
                auditPreserved: identityOnboarding.auditPreserved === true,
                administrativeRole: identityStatusPassed ? "GESTOR" : "",
                moduleKeys: identityStatusPassed ? ["insumos"] : [],
                unitCount: identityStatusPassed ? 1 : 0,
              },
              digest,
            }));
          } else if (process.env.STAGE === "preview") {
            fs.writeFileSync(path.join(root, "slo-summary.json"), JSON.stringify({ passed: true }));
          } else {
            fs.copyFileSync(path.join(root, "slo/ponto-production-slo.json"), path.join(root, "slo-summary.json"));
          }
          NODE
          predecessor_args=()
          if [[ "$STAGE" != preview ]]; then
            predecessor_args=(
              PONTO_PREDECESSOR_STAGE="$PREDECESSOR_STAGE"
              PONTO_PREDECESSOR_RUN_ID="$PREDECESSOR_RUN_ID"
              PONTO_PREDECESSOR_SHA="$RELEASE_SHA"
              PONTO_PREDECESSOR_ARTIFACT="ponto-release-evidence-${PREDECESSOR_STAGE}-${RELEASE_SHA}"
              PONTO_PREDECESSOR_FILE="$PONTO_ARTIFACT_DIR/predecessor/ponto-release-evidence.json"
            )
          fi
          cohort="$PONTO_ARTIFACT_DIR/cohort-summary.json"
          [[ -f "$cohort" ]] || echo '{"configured":false,"grants":0,"units":0,"contexts":0}' > "$cohort"
          edge_guard='null'
          [[ ! -f "$PONTO_ARTIFACT_DIR/edge-guard/ponto-edge-override-guard.json" ]] || edge_guard="$(cat "$PONTO_ARTIFACT_DIR/edge-guard/ponto-edge-override-guard.json")"
          env \
            PONTO_RELEASE_STAGE="$STAGE" \
            PONTO_RELEASE_SHA="$RELEASE_SHA" \
            PONTO_RELEASE_TREE="$SOURCE_TREE" \
            PONTO_RELEASE_SURFACES_JSON="$(cat "$PONTO_ARTIFACT_DIR/surfaces.json")" \
            PONTO_RELEASE_EDGE_GUARD_JSON="$edge_guard" \
            PONTO_RELEASE_CHECKPOINT_JSON="$(cat "$PONTO_ARTIFACT_DIR/checkpoint.json")" \
            PONTO_RELEASE_MIGRATIONS_JSON="$(cat "$PONTO_ARTIFACT_DIR/migrations.json")" \
            PONTO_RELEASE_COHORT_SUMMARY_JSON="$(cat "$cohort")" \
            PONTO_RELEASE_SLO_JSON="$(cat "$PONTO_ARTIFACT_DIR/slo-summary.json")" \
            PONTO_RELEASE_ROLLBACK_JSON="$(cat "$PONTO_ARTIFACT_DIR/rollback.json")" \
            "${predecessor_args[@]}" \
            node .github/scripts/ponto-release-evidence.mjs write "$PONTO_ARTIFACT_DIR/ponto-release-evidence.json"
      - name: Keep the selected environment fail-closed on any mutation-stage failure
        if: ${{ always() && (failure() || cancelled()) && contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          abort_target=production
          [[ "$STAGE" == staging ]] && abort_target=staging
          node - "$RUNNER_TEMP/module-abort.json" "$abort_target" <<'NODE'
          const fs = require("fs"); fs.writeFileSync(process.argv[2], JSON.stringify({ module: "timekeeping", target: process.argv[3], state: "maintenance", message: "Ponto automatic stop limit or release failure.", orchestrator_run_id: process.env.GITHUB_RUN_ID }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs module-availability.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/module-abort.json" "$PONTO_ARTIFACT_DIR/runs/module-abort.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/module-abort.json")"
          mkdir -p "$PONTO_ARTIFACT_DIR/module-transitions/automatic-abort"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "module-transition-timekeeping-$abort_target-maintenance-$GITHUB_RUN_ID" \
            --dir "$PONTO_ARTIFACT_DIR/module-transitions/automatic-abort"
      - name: Cancel and reconcile every governed non-terminal child before rollback
        if: ${{ always() && (failure() || cancelled()) && contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_RECONCILIATION_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          mkdir -p "$PONTO_ARTIFACT_DIR/automatic-rollback"
          node .github/scripts/ponto-reconcile-children.mjs \
            "$PONTO_ARTIFACT_DIR" \
            "$PONTO_ARTIFACT_DIR/automatic-rollback/ponto-child-reconciliation.json"
      - name: Reassert maintenance after every governed child is terminal
        if: ${{ always() && (failure() || cancelled()) && contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          abort_target=production
          [[ "$STAGE" == staging ]] && abort_target=staging
          node - "$RUNNER_TEMP/module-abort-final.json" "$abort_target" <<'NODE'
          const fs = require("fs"); fs.writeFileSync(process.argv[2], JSON.stringify({ module: "timekeeping", target: process.argv[3], state: "maintenance", message: "Ponto automatic stop limit or release failure; maintenance reasserted after child reconciliation.", orchestrator_run_id: process.env.GITHUB_RUN_ID }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs module-availability.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/module-abort-final.json" "$PONTO_ARTIFACT_DIR/runs/module-abort.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/module-abort.json")"
          rm -rf "$PONTO_ARTIFACT_DIR/module-transitions/automatic-abort"
          mkdir -p "$PONTO_ARTIFACT_DIR/module-transitions/automatic-abort"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "module-transition-timekeeping-$abort_target-maintenance-$GITHUB_RUN_ID" \
            --dir "$PONTO_ARTIFACT_DIR/module-transitions/automatic-abort"
      - name: Roll back every successfully mutated surface to its attested incumbent
        if: ${{ always() && (failure() || cancelled()) && contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ inputs.stage == 'staging' && (vars.CLOUDFLARE_PAGES_PROJECT_STAGING || 'skincos-staging') || (vars.CLOUDFLARE_PAGES_PROJECT || 'skincos') }}
          MODULE_CONTROL_KV_ID: ${{ inputs.stage == 'staging' && vars.MODULE_CONTROL_STAGING_KV_ID || vars.MODULE_CONTROL_PRODUCTION_KV_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          recover_surface() {
            local run_file="$1" artifact="$2" destination="$3" surface_file="$4"
            [[ -f "$surface_file" || ! -f "$run_file" ]] || {
              local conclusion run_id
              conclusion="$(node -e "process.stdout.write(String(require(process.argv[1]).conclusion||''))" "$run_file")"
              run_id="$(node -e "process.stdout.write(String(require(process.argv[1]).runId||''))" "$run_file")"
              if [[ "$conclusion" == success && "$run_id" =~ ^[0-9]+$ ]]; then
                mkdir -p "$destination"
                gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$destination" || true
              fi
            }
          }
          recover_journal() {
            local run_file="$1" artifact="$2" destination="$3"
            [[ -f "$run_file" ]] || return 0
            local run_id
            run_id="$(node -e "process.stdout.write(String(require(process.argv[1]).runId||''))" "$run_file")"
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 0
            mkdir -p "$destination"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$destination" || true
          }
          recover_surface "$PONTO_ARTIFACT_DIR/runs/timekeeping.json" "ponto-surface-timekeeping-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json"
          recover_surface "$PONTO_ARTIFACT_DIR/runs/identity.json" "ponto-surface-identity-workforce-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/surfaces/identity" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json"
          recover_surface "$PONTO_ARTIFACT_DIR/runs/core.json" "ponto-surface-core-api-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/surfaces/core" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json"
          recover_surface "$PONTO_ARTIFACT_DIR/runs/pages.json" "ponto-surface-crm-pages-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/surfaces/pages" "$PONTO_ARTIFACT_DIR/surfaces/pages/surface.json"
          recover_journal "$PONTO_ARTIFACT_DIR/runs/timekeeping.json" "ponto-mutation-timekeeping-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/mutations/timekeeping"
          recover_journal "$PONTO_ARTIFACT_DIR/runs/identity.json" "ponto-mutation-identity-workforce-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/mutations/identity"
          recover_journal "$PONTO_ARTIFACT_DIR/runs/core.json" "ponto-mutation-core-api-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/mutations/core"
          recover_journal "$PONTO_ARTIFACT_DIR/runs/pages.json" "ponto-mutation-crm-pages-$STAGE-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/mutations/pages"
          if [[ "$STAGE" == staging ]]; then
            recover_journal "$PONTO_ARTIFACT_DIR/runs/staging-rollback-drill.json" \
              "ponto-staging-rollback-drill-$RELEASE_SHA" \
              "$PONTO_ARTIFACT_DIR/staging-rollback-drill"
          fi
          secret_target=production
          [[ "$STAGE" == staging ]] && secret_target=staging
          recover_journal "$PONTO_ARTIFACT_DIR/runs/provision-pages.json" "ponto-pages-secret-attestation-$secret_target-$RELEASE_SHA" "$PONTO_ARTIFACT_DIR/provisioning/pages"
          mkdir -p "$PONTO_ARTIFACT_DIR/automatic-rollback"
          status=0
          node .github/scripts/ponto-automatic-rollback.mjs \
            "$PONTO_ARTIFACT_DIR" \
            "$PONTO_ARTIFACT_DIR/automatic-rollback/ponto-automatic-rollback.json" || status=$?
          if [[ ! -f "$PONTO_ARTIFACT_DIR/automatic-rollback/ponto-automatic-rollback.json" ]]; then
            node - "$PONTO_ARTIFACT_DIR/automatic-rollback/ponto-automatic-rollback.json" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            schemaVersion: 1,
            automaticInterruption: true,
            sourceSha: process.env.RELEASE_SHA,
            failedStage: process.env.STAGE,
            orchestratorRunId: process.env.GITHUB_RUN_ID,
            passed: false,
            unresolved: [{ surface: "release", reason: "rollback-runner-failed-before-complete-attestation" }],
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          fi
          exit "$status"
      - name: Upload automatic interruption and rollback evidence
        if: ${{ always() && (failure() || cancelled()) && contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-automatic-rollback-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-release/automatic-rollback/ponto-automatic-rollback.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() && inputs.stage == 'preview' }}
        with:
          name: promotion-evidence-timekeeping
          path: ${{ runner.temp }}/ponto-release/promotion/timekeeping/promotion-evidence.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() && inputs.stage == 'preview' }}
        with:
          name: promotion-evidence-core-inventory
          path: ${{ runner.temp }}/ponto-release/promotion/identity/promotion-evidence.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() && inputs.stage == 'preview' }}
        with:
          name: promotion-evidence-core-api
          path: ${{ runner.temp }}/ponto-release/promotion/core/promotion-evidence.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() && inputs.stage == 'preview' }}
        with:
          name: promotion-evidence-crm-pages
          path: ${{ runner.temp }}/ponto-release/promotion/pages/promotion-evidence.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload combined release evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-release-evidence-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-release/ponto-release-evidence.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload edge guard evidence
        if: ${{ success() && contains(fromJSON('["pilot","canary","production"]'), inputs.stage) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-edge-guard-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-release/edge-guard/ponto-edge-override-guard.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload module transition evidence
        if: ${{ always() && inputs.stage != 'preview' }}
