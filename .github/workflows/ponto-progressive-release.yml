name: Ponto progressive release
run-name: Ponto ${{ inputs.stage }} ${{ inputs.release_sha }} orchestrator=${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Ordered Ponto release stage
        required: true
        default: preview
        type: choice
        options: [preview, staging, pilot, canary, production, rollback]
      release_sha:
        description: Exact immutable coordinator SHA at main for every surface
        required: true
        type: string
      predecessor_run_id:
        description: Required after preview; completed Ponto progressive run for the exact predecessor
        required: false
        type: string
      rollback_from_stage:
        description: Current live stage when stage=rollback
        required: false
        default: production
        type: choice
        options: [pilot, canary, production]

concurrency:
  group: ${{ inputs.stage == 'preview' && 'ponto-preview-release-custody' || 'ponto-release-custody' }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  orchestrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage == 'preview' && 'preview' || inputs.stage == 'staging' && 'staging' || 'production' }}
    timeout-minutes: 360
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGE: ${{ inputs.stage }}
      PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
      ROLLBACK_FROM_STAGE: ${{ inputs.rollback_from_stage }}
      # 20-minute default child custody, with script-enforced 35/65-minute
      # journey/drill budgets, leaves at least 50 minutes for fail-close,
      # reconciliation, rollback, and evidence before the 330-minute job cap.
      PONTO_DISPATCH_TIMEOUT_MS: "1200000"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Initialize private release artifact directory
        run: |
          echo "PONTO_ARTIFACT_DIR=$RUNNER_TEMP/ponto-release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ponto-release"
      - name: Verify immutable source and ordered predecessor provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full SHA'; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || { echo 'release_sha must equal the immutable main coordinator SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'checkout differs from release_sha'; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'release_sha is not reachable from main'; exit 1; }
          tree="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          mkdir -p "$PONTO_ARTIFACT_DIR/predecessor" "$PONTO_ARTIFACT_DIR/runs" "$PONTO_ARTIFACT_DIR/surfaces" "$PONTO_ARTIFACT_DIR/module-transitions"
          case "$STAGE" in
            preview) predecessor='' ;;
            staging) predecessor=preview ;;
            pilot) predecessor=staging ;;
            canary) predecessor=pilot ;;
            production) predecessor=canary ;;
            rollback) predecessor="$ROLLBACK_FROM_STAGE" ;;
            *) exit 1 ;;
          esac
          echo "predecessor=$predecessor" >> "$GITHUB_OUTPUT"
          [[ "$STAGE" == preview ]] && exit 0
          [[ "$PREDECESSOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'numeric predecessor_run_id is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ponto-progressive-release.yml" > "$RUNNER_TEMP/ponto-workflow.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREDECESSOR_RUN_ID" > "$RUNNER_TEMP/predecessor-run.json"
          node - "$RUNNER_TEMP/ponto-workflow.json" "$RUNNER_TEMP/predecessor-run.json" <<'NODE'
          const fs = require("fs");
          const workflow = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const run = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (
            run.workflow_id !== workflow.id
            || !String(run.path || "").startsWith(".github/workflows/ponto-progressive-release.yml@refs/heads/main")
            || run.status !== "completed"
            || run.conclusion !== "success"
            || run.event !== "workflow_dispatch"
            || run.head_branch !== "main"
            || run.name !== "Ponto progressive release"
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
          ) throw new Error("predecessor run provenance is invalid");
          NODE
          artifact="ponto-release-evidence-${predecessor}-${RELEASE_SHA}"
          gh run download "$PREDECESSOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$PONTO_ARTIFACT_DIR/predecessor"
          PONTO_EXPECTED_STAGE="$predecessor" PONTO_EXPECTED_SHA="$RELEASE_SHA" PONTO_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
            node .github/scripts/ponto-release-evidence.mjs verify "$PONTO_ARTIFACT_DIR/predecessor/ponto-release-evidence.json"
          rm -f "$RUNNER_TEMP/ponto-workflow.json" "$RUNNER_TEMP/predecessor-run.json"
      - name: Issue masked single-use capabilities for every governed child mutation
        if: ${{ inputs.stage != 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "PONTO_LEASE_TOKENS_FILE=$RUNNER_TEMP/ponto-orchestrator-lease-tokens.json" >> "$GITHUB_ENV"
          node .github/scripts/ponto-orchestrator-lease.mjs issue \
            "$RUNNER_TEMP/ponto-orchestrator-leases" \
            "$RUNNER_TEMP/ponto-orchestrator-lease-tokens.json" \
            workers-secrets pages-secrets timekeeping core-inventory core-api pages staging-journey staging-rollback module-open rollback-incumbent-open rollback-candidate-open
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-workers-secrets
          path: ${{ runner.temp }}/ponto-orchestrator-leases/workers-secrets.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-pages-secrets
          path: ${{ runner.temp }}/ponto-orchestrator-leases/pages-secrets.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-timekeeping
          path: ${{ runner.temp }}/ponto-orchestrator-leases/timekeeping.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-core-inventory
          path: ${{ runner.temp }}/ponto-orchestrator-leases/core-inventory.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-core-api
          path: ${{ runner.temp }}/ponto-orchestrator-leases/core-api.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-pages
          path: ${{ runner.temp }}/ponto-orchestrator-leases/pages.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-staging-journey
          path: ${{ runner.temp }}/ponto-orchestrator-leases/staging-journey.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-staging-rollback
          path: ${{ runner.temp }}/ponto-orchestrator-leases/staging-rollback.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage != 'preview' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-module-open
          path: ${{ runner.temp }}/ponto-orchestrator-leases/module-open.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage == 'staging' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-rollback-incumbent-open
          path: ${{ runner.temp }}/ponto-orchestrator-leases/rollback-incumbent-open.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.stage == 'staging' }}
        with:
          name: ponto-orchestrator-lease-${{ github.run_id }}-rollback-candidate-open
          path: ${{ runner.temp }}/ponto-orchestrator-leases/rollback-candidate-open.json
          retention-days: 1
          if-no-files-found: error
      - name: Preflight selected environment secret-root custody
        if: ${{ contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required for custody attestation'; exit 1; }
          target=production
          [[ "$STAGE" == staging ]] && target=staging
          gh api "repos/$GITHUB_REPOSITORY/environments/$target/secrets" > "$RUNNER_TEMP/ponto-root-secret-names.json"
          node - "$RUNNER_TEMP/ponto-root-secret-names.json" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const names = new Set((payload.secrets || []).map(item => item.name));
          for (const name of ["PONTO_PROFILE_DATA_KEY", "PONTO_IDEMPOTENCY_KEY"]) {
            if (!names.has(name)) throw new Error(`${name} must be owned by the selected GitHub environment; repository fallback is refused`);
          }
          NODE
          rm -f "$RUNNER_TEMP/ponto-root-secret-names.json"
      - name: Preflight production custody, approved cohort, and online pilot runner
        if: ${{ contains(fromJSON('["pilot","canary","production"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PONTO_PILOT_LOGIN: ${{ secrets.PONTO_PILOT_LOGIN }}
          PONTO_PILOT_PASSWORD: ${{ secrets.PONTO_PILOT_PASSWORD }}
          PONTO_PILOT_COHORT_JSON: ${{ secrets.PONTO_PILOT_COHORT_JSON }}
          REQUIRED_RUNNER_LABELS_JSON: ${{ vars.PONTO_PILOT_RUNNER_LABELS_JSON }}
          CANARY_COHORT_PERCENTAGE: ${{ vars.PONTO_CANARY_COHORT_PERCENTAGE }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments and Actions read is required'; exit 1; }
          [[ -n "${PONTO_PILOT_LOGIN:-}" && -n "${PONTO_PILOT_PASSWORD:-}" && -n "${PONTO_PILOT_COHORT_JSON:-}" ]] || { echo 'Approved pilot identity/cohort values are absent'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/environments/production/secrets" > "$RUNNER_TEMP/production-secret-names.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runners" > "$RUNNER_TEMP/repository-runners.json"
          node - "$RUNNER_TEMP/production-secret-names.json" "$RUNNER_TEMP/repository-runners.json" "$PONTO_ARTIFACT_DIR/cohort-summary.json" <<'NODE'
          const fs = require("fs");
          const secretPayload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const names = new Set((secretPayload.secrets || []).map(item => item.name));
          for (const name of ["PONTO_PILOT_LOGIN", "PONTO_PILOT_PASSWORD", "PONTO_PILOT_COHORT_JSON", "PONTO_PROFILE_DATA_KEY", "PONTO_IDEMPOTENCY_KEY"]) {
            if (!names.has(name)) throw new Error(`${name} must be owned by the production environment`);
          }
          const cohort = JSON.parse(process.env.PONTO_PILOT_COHORT_JSON);
          const keys = ["pilotEmployeeRefs", "pilotIdentityLoginRefs", "pilotIdentityRefs", "pilotNetworkContexts", "pilotUnits"];
          if (JSON.stringify(Object.keys(cohort).sort()) !== JSON.stringify([...keys].sort())) throw new Error("cohort contains unapproved fields");
          const opaque = /^v1:[A-Za-z0-9_-]{43}$/;
          const limits = { pilotEmployeeRefs: 100, pilotIdentityLoginRefs: 100, pilotIdentityRefs: 100, pilotNetworkContexts: 20, pilotUnits: 20 };
          for (const key of keys) {
            if (!Array.isArray(cohort[key]) || !cohort[key].length || cohort[key].length > limits[key] || new Set(cohort[key]).size !== cohort[key].length) throw new Error(`invalid ${key}`);
          }
          for (const key of ["pilotEmployeeRefs", "pilotIdentityLoginRefs", "pilotIdentityRefs", "pilotNetworkContexts"]) {
            if (cohort[key].some(value => !opaque.test(value))) throw new Error(`${key} references are not opaque`);
          }
          if (cohort.pilotUnits.some(value => !/^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$/.test(value))) throw new Error("pilotUnits contains an invalid unit key");
          const requiredLabels = JSON.parse(process.env.REQUIRED_RUNNER_LABELS_JSON || "[]");
          if (!Array.isArray(requiredLabels) || !requiredLabels.length || requiredLabels.some(value => typeof value !== "string" || !value)) throw new Error("PONTO_PILOT_RUNNER_LABELS_JSON is absent or invalid");
          const runners = JSON.parse(fs.readFileSync(process.argv[3], "utf8")).runners || [];
          const ready = runners.some(runner => runner.status === "online" && !runner.busy && requiredLabels.every(label => (runner.labels || []).some(item => item.name === label)));
          if (!ready) throw new Error("no online idle runner has the exact approved pilot labels");
          if (process.env.STAGE === "pilot" && (cohort.pilotEmployeeRefs.length !== 1 || cohort.pilotIdentityRefs.length !== 1 || cohort.pilotIdentityLoginRefs.length !== 1 || cohort.pilotNetworkContexts.length !== 1 || cohort.pilotUnits.length !== 1)) throw new Error("pilot cohort must contain exactly one employee, Identity, Identity login, network context and unit");
          if (process.env.STAGE === "canary") {
            const percentage = Number(process.env.CANARY_COHORT_PERCENTAGE);
            if (!Number.isInteger(percentage) || percentage < 1 || percentage > 100) throw new Error("PONTO_CANARY_COHORT_PERCENTAGE must be 1..100");
          }
          fs.writeFileSync(process.argv[4], `${JSON.stringify({
            configured: true,
            grants: cohort.pilotEmployeeRefs.length,
            identityGrants: cohort.pilotIdentityRefs.length,
            loginGrants: cohort.pilotIdentityLoginRefs.length,
            units: cohort.pilotUnits.length,
            contexts: cohort.pilotNetworkContexts.length,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          rm -f "$RUNNER_TEMP/production-secret-names.json" "$RUNNER_TEMP/repository-runners.json"
      - name: Attest unconditional edge blocks before any candidate mutation
        if: ${{ contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          PONTO_WAF_RULESET_ID: ${{ vars.PONTO_WAF_RULESET_ID }}
          PONTO_WAF_HEADER_RULE_ID: ${{ vars.PONTO_WAF_HEADER_RULE_ID }}
          PONTO_WAF_CONTRACT_RULE_ID: ${{ vars.PONTO_WAF_CONTRACT_RULE_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'Cloudflare API token is required for the WAF precondition'; exit 1; }
          [[ "$CLOUDFLARE_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'CLOUDFLARE_ZONE_ID is absent or invalid'; exit 1; }
          ruleset="$RUNNER_TEMP/ponto-edge-ruleset.json"
          mkdir -p "$PONTO_ARTIFACT_DIR/edge-guard"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
            > "$ruleset"
          node .github/scripts/ponto-edge-override-guard.mjs \
            "$ruleset" \
            "$PONTO_ARTIFACT_DIR/edge-guard/ponto-edge-override-guard.json"
          rm -f "$ruleset"
      - name: Put Ponto in maintenance before staging or live mutation
        if: ${{ contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - "$RUNNER_TEMP/module-maintenance.json" <<'NODE'
          const fs = require("fs"); fs.writeFileSync(process.argv[2], JSON.stringify({
            module: "timekeeping",
            target: process.env.STAGE === "staging" ? "staging" : "production",
            state: "maintenance",
            message: "Ponto release in progress.",
            orchestrator_run_id: process.env.GITHUB_RUN_ID,
          }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs module-availability.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/module-maintenance.json" "$PONTO_ARTIFACT_DIR/runs/module-maintenance.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/module-maintenance.json")"
          target="$STAGE"; [[ "$target" == staging ]] || target=production
          mkdir -p "$PONTO_ARTIFACT_DIR/module-transitions/pre-mutation-maintenance"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "module-transition-timekeeping-$target-maintenance-$GITHUB_RUN_ID" \
            --dir "$PONTO_ARTIFACT_DIR/module-transitions/pre-mutation-maintenance"
      - name: Provision isolated target values before staging or first pilot
        if: ${{ inputs.stage == 'staging' || inputs.stage == 'pilot' }}
        id: provision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$STAGE"
          [[ "$target" == pilot ]] && target=production
          staging_run=''
          [[ "$target" == production ]] && staging_run="$PREDECESSOR_RUN_ID"
          node - "$RUNNER_TEMP/provision-workers.json" "$target" "$staging_run" <<'NODE'
          const fs = require("fs"); fs.writeFileSync(process.argv[2], JSON.stringify({ target: process.argv[3], release_sha: process.env.RELEASE_SHA, staging_run_id: process.argv[4] }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs cloudflare-workers-sync-ponto-secrets.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/provision-workers.json" "$PONTO_ARTIFACT_DIR/runs/provision-workers.json"
          node - "$RUNNER_TEMP/provision-pages.json" "$target" "$staging_run" <<'NODE'
          const fs = require("fs"); fs.writeFileSync(process.argv[2], JSON.stringify({ target: process.argv[3], release_sha: process.env.RELEASE_SHA, staging_run_id: process.argv[4] }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs cloudflare-pages-sync-ponto.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/provision-pages.json" "$PONTO_ARTIFACT_DIR/runs/provision-pages.json"
          pages_provision_run_id="$(node -e "process.stdout.write(String(require(process.argv[1]).runId||''))" "$PONTO_ARTIFACT_DIR/runs/provision-pages.json")"
          mkdir -p "$PONTO_ARTIFACT_DIR/provisioning/pages"
          gh run download "$pages_provision_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "ponto-pages-secret-attestation-$target-$RELEASE_SHA" \
            --dir "$PONTO_ARTIFACT_DIR/provisioning/pages"
      - name: Resolve once and reuse the immutable pre-pilot production baseline
        if: inputs.stage == 'pilot'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ponto-production-baseline.yml" > "$RUNNER_TEMP/baseline-workflow.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ponto-production-baseline.yml/runs?event=workflow_dispatch&branch=main&per_page=100" > "$RUNNER_TEMP/baseline-runs.json"
          baseline_run_id="$(node - "$RUNNER_TEMP/baseline-workflow.json" "$RUNNER_TEMP/baseline-runs.json" <<'NODE'
          const fs = require("fs");
          const workflow = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const runs = JSON.parse(fs.readFileSync(process.argv[3], "utf8")).workflow_runs || [];
          if (workflow.state !== "active" || workflow.path !== ".github/workflows/ponto-production-baseline.yml") throw new Error("canonical baseline workflow is unavailable");
          const prefix = `Ponto baseline ${process.env.RELEASE_SHA} staging=${process.env.PREDECESSOR_RUN_ID} orchestrator=`;
          const reusable = runs
            .filter(run => run.workflow_id === workflow.id
              && run.path === `${workflow.path}@refs/heads/main`
              && run.status === "completed"
              && run.conclusion === "success"
              && run.event === "workflow_dispatch"
              && run.head_branch === "main"
              && run.name === "Ponto production baseline"
              && run.repository?.full_name === process.env.GITHUB_REPOSITORY
              && run.head_repository?.full_name === process.env.GITHUB_REPOSITORY
              && String(run.display_title || "").startsWith(prefix))
            .sort((a, b) => Number(a.id) - Number(b.id))[0];
          process.stdout.write(String(reusable?.id || ""));
          NODE
          )"
          if [[ -z "$baseline_run_id" ]]; then
            node - "$RUNNER_TEMP/baseline-inputs.json" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(process.argv[2], JSON.stringify({
            release_sha: process.env.RELEASE_SHA,
            staging_run_id: process.env.PREDECESSOR_RUN_ID,
          }));
          NODE
            node .github/scripts/ponto-dispatch-workflow.mjs ponto-production-baseline.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/baseline-inputs.json" "$PONTO_ARTIFACT_DIR/runs/production-baseline.json"
            baseline_run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/production-baseline.json")"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$baseline_run_id" > "$RUNNER_TEMP/reused-baseline-run.json"
            node - "$RUNNER_TEMP/reused-baseline-run.json" "$PONTO_ARTIFACT_DIR/runs/production-baseline.json" <<'NODE'
          const fs = require("fs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          fs.writeFileSync(process.argv[3], `${JSON.stringify({
            schemaVersion: 1,
            workflow: "ponto-production-baseline.yml",
            runId: String(run.id),
            status: run.status,
            conclusion: run.conclusion,
            event: run.event,
