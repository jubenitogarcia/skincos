          const timekeeping = JSON.parse(fs.readFileSync(process.argv[4], "utf8"));
          const core = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          const identity = JSON.parse(fs.readFileSync(process.argv[6], "utf8"));
          const pages = JSON.parse(fs.readFileSync(process.argv[7], "utf8"));
          fs.writeFileSync(process.argv[2], JSON.stringify({
            release_sha: process.env.RELEASE_SHA,
            orchestrator_run_id: process.env.GITHUB_RUN_ID,
            staging_journey_run_id: String(journey.runId),
            timekeeping_candidate_version_id: timekeeping.candidateVersionId,
            timekeeping_incumbent_version_id: timekeeping.incumbentVersionId,
            core_candidate_version_id: core.candidateVersionId,
            core_incumbent_version_id: core.incumbentVersionId,
            identity_candidate_version_id: identity.candidateVersionId,
            identity_incumbent_version_id: identity.incumbentVersionId,
            pages_candidate_deployment_id: pages.deploymentId,
            pages_incumbent_deployment_id: pages.rollbackDeploymentId,
          }));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs ponto-staging-rollback-drill.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/staging-rollback-drill-inputs.json" "$PONTO_ARTIFACT_DIR/runs/staging-rollback-drill.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/staging-rollback-drill.json")"
          mkdir -p "$PONTO_ARTIFACT_DIR/staging-rollback-drill"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "ponto-staging-rollback-drill-$RELEASE_SHA" \
            --dir "$PONTO_ARTIFACT_DIR/staging-rollback-drill"
          node - "$PONTO_ARTIFACT_DIR/staging-rollback-drill/ponto-staging-rollback-drill.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json" \
            "$PONTO_ARTIFACT_DIR/surfaces/pages/surface.json" <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            value.releaseSha !== process.env.RELEASE_SHA
            || value.orchestratorRunId !== process.env.GITHUB_RUN_ID
            || value.passed !== true
            || value.credentialsIncluded !== false
            || value.piiIncluded !== false
            || value.recovery?.disposition !== "candidate-restored-under-maintenance"
          ) {
            throw new Error("staging rollback drill evidence is invalid");
          }
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const entries = [
            ["timekeeping", process.argv[3]],
            ["coreApi", process.argv[4]],
            ["identityWorkforce", process.argv[5]],
          ];
          for (const [surface, file] of entries) {
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const proof = value.restoration?.surfaces?.[surface];
            if (
              manifest.surface !== surface
              || proof?.passed !== true
              || !uuid.test(proof.deploymentId)
              || String(proof.versionId || "").toLowerCase() !== String(manifest.candidateVersionId || "").toLowerCase()
            ) throw new Error(`${surface} rollback-drill restoration identity is invalid`);
            fs.writeFileSync(file, `${JSON.stringify({
              ...manifest,
              preRollbackDrillDeploymentId: manifest.deploymentId,
              deploymentId: proof.deploymentId,
              rollbackDrillRunId: value.runId,
            }, null, 2)}\n`, { mode: 0o600 });
          }
          const pagesFile = process.argv[6];
          const pages = JSON.parse(fs.readFileSync(pagesFile, "utf8"));
          const pagesProof = value.restoration?.surfaces?.crmPages;
          if (
            pages.surface !== "crmPages"
            || pagesProof?.passed !== true
            || !uuid.test(pagesProof.activeDeploymentId)
            || pagesProof.sourceDeploymentId !== pages.deploymentId
            || String(pagesProof.commitHash || "").toLowerCase() !== process.env.RELEASE_SHA
          ) throw new Error("CRM Pages rollback-drill restoration identity is invalid");
          fs.writeFileSync(pagesFile, `${JSON.stringify({
            ...pages,
            preRollbackDrillDeploymentId: pages.deploymentId,
            deploymentId: pagesProof.activeDeploymentId,
            rollbackDrillRunId: value.runId,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Open the approved live cohort or activate production
        if: ${{ contains(fromJSON('["pilot","canary","production"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_ORCHESTRATOR_CAPABILITY_PRIVATE_KEY: ${{ secrets.PONTO_ORCHESTRATOR_CAPABILITY_PRIVATE_KEY }}
          PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON: ${{ vars.PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON }}
          CANARY_COHORT_PERCENTAGE: ${{ vars.PONTO_CANARY_COHORT_PERCENTAGE }}
        run: |
          set -euo pipefail
          tk_candidate="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json")"
          tk_incumbent="$(node -e "process.stdout.write(require(process.argv[1]).incumbentVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/timekeeping/surface.json")"
          core_candidate="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json")"
          core_incumbent="$(node -e "process.stdout.write(require(process.argv[1]).incumbentVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json")"
          identity_candidate="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json")"
          identity_incumbent="$(node -e "process.stdout.write(require(process.argv[1]).incumbentVersionId)" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json")"
          expires_at="$(node -e "process.stdout.write(new Date(Date.now()+2*60*60*1000).toISOString())")"
