            node - "$RUNNER_TEMP/reused-baseline-run.json" "$PONTO_ARTIFACT_DIR/runs/production-baseline.json" <<'NODE'
          const fs = require("fs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
