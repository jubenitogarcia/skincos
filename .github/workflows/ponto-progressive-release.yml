            identityWorkforce: { versionId: process.env.IDENTITY_VERSION_ID, deploymentId: process.env.IDENTITY_DEPLOYMENT_ID },
          };
          if (
            process.env.BASELINE_RUN_ID !== process.env.PONTO_BASELINE_RUN_ID
            || !/^[0-9a-f]{64}$/.test(process.env.BASELINE_SHA256 || "")
