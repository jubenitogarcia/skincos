          const fs = require("fs");
          const stage = process.env.STAGE;
          const inputs = {
            module: "timekeeping",
            target: "production",
            state: stage === "production" ? "active" : "canary",
            release_sha: process.env.RELEASE_SHA,
            timekeeping_candidate_version_id: process.argv[3],
            timekeeping_incumbent_version_id: process.argv[4],
            core_candidate_version_id: process.argv[5],
            core_incumbent_version_id: process.argv[6],
            identity_candidate_version_id: process.argv[7],
            identity_incumbent_version_id: process.argv[8],
            message: "",
            orchestrator_run_id: process.env.GITHUB_RUN_ID,
          };
          if (stage !== "production") Object.assign(inputs, {
            rollout_stage: stage,
            worker_percentage: "0",
            cohort_percentage: stage === "pilot" ? "100" : process.env.CANARY_COHORT_PERCENTAGE,
            expires_at: process.argv[9],
          });
          fs.writeFileSync(process.argv[2], JSON.stringify(inputs));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs module-availability.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/module-open.json" "$PONTO_ARTIFACT_DIR/runs/module-open.json"
          run_id="$(node -e "process.stdout.write(require(process.argv[1]).runId)" "$PONTO_ARTIFACT_DIR/runs/module-open.json")"
          mkdir -p "$PONTO_ARTIFACT_DIR/module-transitions/live-open"
          state="$([[ "$STAGE" == production ]] && echo active || echo canary)"
