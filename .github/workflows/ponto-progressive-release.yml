        with:
          name: ponto-module-transitions-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-release/module-transitions
          retention-days: 90
          if-no-files-found: warn
      - name: Upload sanitized orchestration run ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-release-runs-${{ inputs.stage }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-release/runs
          retention-days: 90
          if-no-files-found: warn

  recovery-latch:
    needs: orchestrate
    if: ${{ always() && contains(fromJSON('["failure","cancelled"]'), needs.orchestrate.result) && contains(fromJSON('["staging","pilot","canary","production","rollback"]'), inputs.stage) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ponto-emergency-latch-${{ inputs.stage == 'staging' && 'staging' || 'production' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    environment: ${{ inputs.stage == 'staging' && 'ponto-emergency-staging' || 'ponto-emergency-production' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Monotonically latch Ponto closed outside the surface mutex
        env:
          PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL: ${{ secrets.PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL }}
          PONTO_EMERGENCY_CLOSE_BROKER_URL: ${{ vars.PONTO_EMERGENCY_CLOSE_BROKER_URL }}
          PONTO_EMERGENCY_CLOSE_CUSTODY_REF: ${{ vars.PONTO_EMERGENCY_CLOSE_CUSTODY_REF }}
          PONTO_EMERGENCY_TARGET: ${{ inputs.stage == 'staging' && 'staging' || 'production' }}
          PONTO_EMERGENCY_TRIGGER_RUN_ID: ${{ github.run_id }}
          PONTO_FAILED_COORDINATOR_RUN_ID: ${{ github.run_id }}
          PONTO_EMERGENCY_LATCH_REPORT: ${{ runner.temp }}/ponto-ordinary-recovery/latch.json
        run: node .github/scripts/ponto-emergency-latch-write.mjs
      - name: Attempt external overlay propagation before reconciliation
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PONTO_MODULE_HEALTH_URL: ${{ inputs.stage == 'staging' && 'https://api-staging.skincos.com.br/api/ponto/health' || 'https://api.skincos.com.br/api/ponto/health' }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/ponto-ordinary-recovery"
          node - "$directory/latch.json" "$directory/overlay-expectation.json" <<'NODE'
          const fs = require("fs");
          const latch = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          fs.writeFileSync(process.argv[3], `${JSON.stringify({
            state: "maintenance",
            changedAt: latch.changedAt,
          })}\n`, { mode: 0o600 });
          NODE
          status=0
          PONTO_MODULE_EXPECTED_SOURCE=emergency-latch-active \
          PONTO_MODULE_EXPECTATION_FILE="$directory/overlay-expectation.json" \
          PONTO_MODULE_PROPAGATION_REPORT="$directory/overlay-propagation.json" \
            node .github/scripts/ponto-module-propagation.mjs || status=$?
          PONTO_PROPAGATION_STATUS="$status" node - \
            "$directory/overlay-propagation.json" \
            "$directory/overlay-propagation-attempt.json" <<'NODE'
          const fs = require("fs");
          const propagation = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          fs.writeFileSync(process.argv[3], `${JSON.stringify({
            schemaVersion: 1,
            passed: propagation.passed === true,
            pendingPrimaryClose: propagation.passed !== true,
            disposition: propagation.passed === true
              ? "emergency-overlay-observed"
              : "overlay-unavailable-primary-close-required",
            lastObservedState: String(propagation.lastObserved?.state || ""),
            probeExitStatus: Number(process.env.PONTO_PROPAGATION_STATUS),
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          rm -f "$directory/overlay-expectation.json"
      - name: Upload immutable ordinary-recovery latch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-ordinary-recovery-latch-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery
          retention-days: 90
          if-no-files-found: error

  recovery-reconcile:
    needs: [orchestrate, recovery-latch]
    if: ${{ always() && needs.recovery-latch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download the durable recovery journal
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-recovery-journal-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery/journal
      - name: Cancel and reconcile children without waiting on the surface mutex
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON: ${{ vars.PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON }}
          PONTO_COORDINATOR_RUN_ID: ${{ github.run_id }}
          PONTO_COORDINATOR_SHA: ${{ inputs.release_sha }}
          PONTO_RECONCILIATION_TIMEOUT_SECONDS: "600"
        run: |
          mkdir -p "$RUNNER_TEMP/ponto-ordinary-recovery/reconciliation"
          node .github/scripts/ponto-reconcile-children.mjs \
            "$RUNNER_TEMP/ponto-ordinary-recovery/journal" \
            "$RUNNER_TEMP/ponto-ordinary-recovery/reconciliation/children.json"
      - name: Reconstruct and fetch exact rollback journals outside the surface mutex
        if: ${{ contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON: ${{ vars.PONTO_ORCHESTRATOR_CAPABILITY_PUBLIC_KEYS_JSON }}
          PONTO_COORDINATOR_RUN_ID: ${{ github.run_id }}
          PONTO_COORDINATOR_SHA: ${{ inputs.release_sha }}
          PONTO_COORDINATOR_STAGE: ${{ inputs.stage }}
          PONTO_RECOVERY_ARTIFACT_ROOT: ${{ runner.temp }}/ponto-ordinary-recovery/journal
        run: |
          set -euo pipefail
          node .github/scripts/ponto-watchdog-journal.mjs
          node - "$PONTO_RECOVERY_ARTIFACT_ROOT/watchdog-journal.json" <<'NODE' |
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          for (const item of report.downloads || []) {
            if (
              !/^[1-9][0-9]*$/.test(item.runId)
              || !/^[A-Za-z0-9._-]{1,200}$/.test(item.artifact)
              || !/^[A-Za-z0-9._/-]{1,200}$/.test(item.destination)
            ) throw new Error("unsafe artifact manifest entry");
            process.stdout.write(`${item.runId}\t${item.artifact}\t${item.destination}\n`);
          }
          NODE
          while IFS=$'\t' read -r run_id artifact destination; do
            mkdir -p "$PONTO_RECOVERY_ARTIFACT_ROOT/$destination"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "$PONTO_RECOVERY_ARTIFACT_ROOT/$destination" || true
          done
      - name: Upload immutable ordinary-recovery reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-ordinary-recovery-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery/reconciliation
          retention-days: 90
          if-no-files-found: warn
      - name: Upload reconstructed recovery journal for mutexed rollback
        if: ${{ contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-reconstructed-recovery-journal-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery/journal
          retention-days: 90
          if-no-files-found: error

  recovery-close:
    needs: [orchestrate, recovery-latch, recovery-reconcile]
    if: ${{ always() && needs.recovery-latch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    environment: ${{ inputs.stage == 'staging' && 'ponto-emergency-staging' || 'ponto-emergency-production' }}
    concurrency:
      group: ponto-surface-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write regular maintenance under the exact closed latch
        env:
          PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL: ${{ secrets.PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL }}
          PONTO_EMERGENCY_CLOSE_BROKER_URL: ${{ vars.PONTO_EMERGENCY_CLOSE_BROKER_URL }}
          PONTO_EMERGENCY_CLOSE_CUSTODY_REF: ${{ vars.PONTO_EMERGENCY_CLOSE_CUSTODY_REF }}
          PONTO_EMERGENCY_TARGET: ${{ inputs.stage == 'staging' && 'staging' || 'production' }}
          PONTO_EMERGENCY_TRIGGER_RUN_ID: ${{ github.run_id }}
          PONTO_FAILED_COORDINATOR_RUN_ID: ${{ github.run_id }}
          PONTO_EMERGENCY_MAINTENANCE_REPORT: ${{ runner.temp }}/ponto-ordinary-recovery/maintenance.json
        run: node .github/scripts/ponto-emergency-maintenance-write.mjs
      - name: Prove external fail-close through overlay or exact incumbent control
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PONTO_MODULE_HEALTH_URL: ${{ inputs.stage == 'staging' && 'https://api-staging.skincos.com.br/api/ponto/health' || 'https://api.skincos.com.br/api/ponto/health' }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/ponto-ordinary-recovery"
          node - "$directory/maintenance.json" \
            "$directory/overlay-expectation.json" \
            "$directory/control-fallback-expectation.json" <<'NODE'
          const fs = require("fs");
          const maintenance = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          fs.writeFileSync(process.argv[3], `${JSON.stringify({
            state: "maintenance",
            changedAt: maintenance.latchChangedAt,
          })}\n`, { mode: 0o600 });
          fs.writeFileSync(process.argv[4], `${JSON.stringify({
            state: "maintenance",
            changedAt: maintenance.controlChangedAt,
            source: "control",
          })}\n`, { mode: 0o600 });
          NODE
          PONTO_MODULE_EXPECTED_SOURCE=emergency-latch-active \
          PONTO_MODULE_EXPECTATION_FILE="$directory/overlay-expectation.json" \
          PONTO_MODULE_ALTERNATE_EXPECTATION_FILE="$directory/control-fallback-expectation.json" \
          PONTO_MODULE_PROPAGATION_REPORT="$directory/final-propagation.json" \
            node .github/scripts/ponto-module-propagation.mjs
          rm -f "$directory/overlay-expectation.json" "$directory/control-fallback-expectation.json"
      - name: Upload immutable ordinary-recovery maintenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-ordinary-recovery-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery
          retention-days: 90
          if-no-files-found: error

  recovery-rollback:
    needs: [orchestrate, recovery-reconcile, recovery-close]
    if: ${{ always() && needs.recovery-reconcile.result == 'success' && needs.recovery-close.result == 'success' && contains(fromJSON('["staging","pilot","canary","production"]'), inputs.stage) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: write
      contents: read
    environment: ${{ inputs.stage == 'staging' && 'staging' || 'production' }}
    concurrency:
      group: ponto-surface-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Revalidate protected target environment before rollback mutation
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_ENVIRONMENT_TARGET: ${{ inputs.stage == 'staging' && 'staging' || 'production' }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required for rollback protection attestation'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/environments/$PONTO_ENVIRONMENT_TARGET" \
            > "$RUNNER_TEMP/ponto-rollback-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/$PONTO_ENVIRONMENT_TARGET/deployment-branch-policies?per_page=100" \
            > "$RUNNER_TEMP/ponto-rollback-environment-branch-policies.json"
          mkdir -p "$RUNNER_TEMP/ponto-ordinary-recovery/journal/automatic-rollback"
          node .github/scripts/ponto-environment-protection.mjs \
            "$RUNNER_TEMP/ponto-rollback-environment.json" \
            "$RUNNER_TEMP/ponto-rollback-environment-branch-policies.json" \
            "$RUNNER_TEMP/ponto-ordinary-recovery/journal/automatic-rollback/ponto-environment-protection.json"
          rm -f \
            "$RUNNER_TEMP/ponto-rollback-environment.json" \
            "$RUNNER_TEMP/ponto-rollback-environment-branch-policies.json"
      - name: Download the durable recovery journal
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-reconstructed-recovery-journal-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery/journal
      - name: Download exact ordinary child reconciliation
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-ordinary-recovery-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery/evidence/reconciliation
      - name: Download exact ordinary broker fail-close evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-ordinary-recovery-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery/evidence/fail-close
      - name: Normalize exact ordinary recovery custody for automatic rollback
        env:
          PONTO_RECOVERY_SOURCE_MODE: ordinary
          PONTO_COORDINATOR_RUN_ID: ${{ github.run_id }}
          PONTO_EMERGENCY_RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: ${{ inputs.stage }}
          PONTO_RECOVERY_TARGET: ${{ inputs.stage == 'staging' && 'staging' || 'production' }}
        run: |
          node .github/scripts/ponto-recovery-evidence.mjs \
            "$RUNNER_TEMP/ponto-ordinary-recovery/evidence/reconciliation/children.json" \
            "$RUNNER_TEMP/ponto-ordinary-recovery/evidence/fail-close/maintenance.json" \
            "$RUNNER_TEMP/ponto-ordinary-recovery/evidence/fail-close/final-propagation.json" \
            "$RUNNER_TEMP/ponto-ordinary-recovery/journal"
      - name: Restore every attested incumbent idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY: ${{ secrets.PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: ${{ inputs.stage }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_PAGES_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT_STAGING }}
          PRODUCTION_PAGES_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          STAGING_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PRODUCTION_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            staging)
              CLOUDFLARE_PAGES_PROJECT="$STAGING_PAGES_PROJECT_RAW"
              OPPOSITE_PAGES_PROJECT="$PRODUCTION_PAGES_PROJECT_RAW"
              MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"
              OPPOSITE_MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"
              ;;
            pilot|canary|production)
              CLOUDFLARE_PAGES_PROJECT="$PRODUCTION_PAGES_PROJECT_RAW"
              OPPOSITE_PAGES_PROJECT="$STAGING_PAGES_PROJECT_RAW"
              MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"
              OPPOSITE_MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"
              ;;
            *) echo 'Unsupported recovery rollback stage'; exit 1 ;;
          esac
          for name in CLOUDFLARE_PAGES_PROJECT MODULE_CONTROL_KV_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing selected rollback value: $name"; exit 1; }
          done
          [[ -z "${OPPOSITE_PAGES_PROJECT:-}" || "$CLOUDFLARE_PAGES_PROJECT" != "$OPPOSITE_PAGES_PROJECT" ]] || { echo 'Pages projects are not isolated'; exit 1; }
          [[ -z "${OPPOSITE_MODULE_CONTROL_KV_ID:-}" || "$MODULE_CONTROL_KV_ID" != "$OPPOSITE_MODULE_CONTROL_KV_ID" ]] || { echo 'Module-control namespaces are not isolated'; exit 1; }
          export CLOUDFLARE_PAGES_PROJECT MODULE_CONTROL_KV_ID
          export PONTO_OPPOSITE_MODULE_CONTROL_KV_ID="$OPPOSITE_MODULE_CONTROL_KV_ID"
          root="$RUNNER_TEMP/ponto-ordinary-recovery/journal"
          mkdir -p "$root/automatic-rollback"
          status=0
          node .github/scripts/ponto-automatic-rollback.mjs \
            "$root" "$root/automatic-rollback/ponto-automatic-rollback.json" || status=$?
          exit "$status"
      - name: Upload immutable automatic rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-automatic-rollback-${{ inputs.stage }}-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-ordinary-recovery/journal/automatic-rollback
          retention-days: 90
          if-no-files-found: warn
