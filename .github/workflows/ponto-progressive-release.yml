      - name: Attest exact Ponto Core bootstrap before any candidate mutation
        if: ${{ inputs.stage == 'staging' || inputs.stage == 'pilot' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          target=staging
          [[ "$STAGE" == pilot ]] && target=production
          export PONTO_BOOTSTRAP_TARGET="$target"
          mapfile -t expected < <(node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const catalog = JSON.parse(fs.readFileSync("platform/deploy/operational-units.json", "utf8"));
          const bootstrap = catalog.units.find(unit => unit.id === "ponto-core-baseline")?.promotion?.bootstrapEvidence;
          const artifact = bootstrap?.artifacts?.[process.env.PONTO_BOOTSTRAP_TARGET];
          for (const value of [
            bootstrap?.workflowRunId,
            artifact?.id,
            bootstrap?.sourceSha,
            artifact?.deploymentId,
            artifact?.versionId,
            artifact?.digest,
          ]) {
            if (!value || /[\r\n]/.test(String(value))) throw new Error("staging bootstrap catalog entry is invalid");
            process.stdout.write(`${value}\n`);
          }
