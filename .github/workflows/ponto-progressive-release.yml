          edge_guard='null'
          [[ ! -f "$PONTO_ARTIFACT_DIR/edge-guard/ponto-edge-override-guard.json" ]] || edge_guard="$(cat "$PONTO_ARTIFACT_DIR/edge-guard/ponto-edge-override-guard.json")"
          bootstrap_core='null'
          [[ ! -f "$PONTO_ARTIFACT_DIR/bootstrap-core/precondition.json" ]] || bootstrap_core="$(cat "$PONTO_ARTIFACT_DIR/bootstrap-core/precondition.json")"
