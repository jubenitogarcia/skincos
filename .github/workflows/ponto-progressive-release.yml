        run: |
          set -euo pipefail
          node - "$PONTO_ARTIFACT_DIR/baseline/ponto-production-baseline-selection.json" <<'NODE'
          const fs = require("fs");
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const workers = {
