            }
          }
          fs.writeFileSync(process.argv[2], JSON.stringify(inputs));
          NODE
          node .github/scripts/ponto-dispatch-workflow.mjs deploy-core-workers.yml "$GITHUB_RUN_ID" "$RUNNER_TEMP/core-inputs.json" "$PONTO_ARTIFACT_DIR/runs/core.json"
          run_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).runId)" "$PONTO_ARTIFACT_DIR/runs/core.json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "ponto-surface-core-api-${STAGE}-${RELEASE_SHA}" --dir "$PONTO_ARTIFACT_DIR/surfaces/core"
          node -e "const s=require(process.argv[1]);if(s.surface!=='coreApi'||s.stage!==process.env.STAGE||s.sourceSha!==process.env.RELEASE_SHA)process.exit(1)" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json"
          if [[ "$STAGE" == preview ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name promotion-evidence-core-api --dir "$PONTO_ARTIFACT_DIR/promotion/core"
          fi
      - name: Publish and attest canonical CRM Pages surface
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_id="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId||'')" "$PONTO_ARTIFACT_DIR/surfaces/core/surface.json")"
          identity_id="$(node -e "process.stdout.write(require(process.argv[1]).candidateVersionId||'')" "$PONTO_ARTIFACT_DIR/surfaces/identity/surface.json")"
          node - "$RUNNER_TEMP/pages-inputs.json" "$core_id" "$identity_id" <<'NODE'
          const fs = require("fs");
          const inputs = { target: process.env.STAGE, release_scope: "ponto", release_sha: process.env.RELEASE_SHA, orchestrator_run_id: process.env.GITHUB_RUN_ID };
          if (process.env.STAGE === "staging") {
            inputs.preview_run_id = process.env.PREDECESSOR_RUN_ID;
