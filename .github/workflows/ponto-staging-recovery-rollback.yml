name: Ponto staging recovery rollback
run-name: Ponto staging recovery rollback ${{ inputs.release_sha }} coordinator=${{ inputs.coordinator_run_id }} watchdog=${{ inputs.watchdog_run_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Immutable SHA of the failed staging coordinator"
        required: true
        type: string
      coordinator_run_id:
        description: "Exact failed Ponto progressive-release run"
        required: true
        type: string
      watchdog_run_id:
        description: "Exact failed Ponto release-watchdog run that holds recovery evidence"
        required: true
        type: string
      timekeeping_candidate_version_id:
        description: "Exact candidate version recorded by the failed Timekeeping publisher"
        required: true
        type: string
      timekeeping_incumbent_version_id:
        description: "Exact incumbent version to restore"
        required: true
        type: string
      timekeeping_owner_recovery_run_id:
        description: "Exact successful Ponto recovery that currently owns the candidate-only Worker deployment"
        required: true
        type: string
      timekeeping_owner_coordinator_run_id:
        description: "Coordinator run bound to the successful current-owner recovery"
        required: true
        type: string
      timekeeping_owner_release_sha:
        description: "Release SHA bound to the successful current-owner recovery"
        required: true
        type: string
      authorization_ref:
        description: "Opaque approved incident or change reference for the fresh recovery close"
        required: true
        type: string

concurrency:
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  fresh-close:
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ponto-emergency-staging
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate current source and exact failed-run provenance before fresh close
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          WATCHDOG_RUN_ID: ${{ inputs.watchdog_run_id }}
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA'; exit 1; }
          [[ "$COORDINATOR_RUN_ID" =~ ^[1-9][0-9]*$ && "$WATCHDOG_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid recovery run IDs'; exit 1; }
          [[ "$COORDINATOR_RUN_ID" != "$WATCHDOG_RUN_ID" ]] || { echo 'Coordinator and watchdog runs must differ'; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Recovery must run from main'; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo 'Historical recovery reruns are forbidden; dispatch a fresh recovery'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Recovery checkout differs from current workflow source'; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'Recovery source is not the current canonical main'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'Failed release is not reachable from main'; exit 1; }
          [[ "$AUTHORIZATION_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:/#-]{2,119}$ ]] || { echo 'Authorization reference must be opaque'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COORDINATOR_RUN_ID" > "$RUNNER_TEMP/ponto-coordinator.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WATCHDOG_RUN_ID" > "$RUNNER_TEMP/ponto-watchdog.json"
          node --input-type=module - "$RUNNER_TEMP/ponto-coordinator.json" "$RUNNER_TEMP/ponto-watchdog.json" <<'NODE'
          import fs from "node:fs";
          import { pontoSourceClosureMatches } from "./.github/scripts/ponto-source-closure.mjs";
          const coordinator = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const watchdog = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const repo = process.env.GITHUB_REPOSITORY;
          const releaseSha = process.env.RELEASE_SHA;
          const isCompletedFailure = (run) => run.status === "completed"
            && ["failure", "cancelled"].includes(run.conclusion);
          if (
            coordinator.path !== ".github/workflows/ponto-progressive-release.yml"
            || coordinator.event !== "workflow_dispatch"
            || !isCompletedFailure(coordinator)
            || !pontoSourceClosureMatches(releaseSha, String(coordinator.head_sha || "").toLowerCase())
            || coordinator.head_branch !== "main"
            || coordinator.repository?.full_name !== repo
            || watchdog.path !== ".github/workflows/ponto-release-watchdog.yml"
            || watchdog.event !== "workflow_run"
            || watchdog.status !== "completed"
            || watchdog.conclusion !== "failure"
            || !/^[0-9a-f]{40}$/.test(String(watchdog.head_sha || ""))
            || watchdog.head_branch !== "main"
            || watchdog.repository?.full_name !== repo
            || !String(watchdog.display_title || "").includes(`source=${process.env.COORDINATOR_RUN_ID}`)
          ) throw new Error("failed coordinator/watchdog provenance is not exact");
          NODE
          rm -f "$RUNNER_TEMP/ponto-coordinator.json" "$RUNNER_TEMP/ponto-watchdog.json"

      - name: Download the exact historical watchdog custody
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-watchdog-rollback-${{ inputs.coordinator_run_id }}-${{ inputs.watchdog_run_id }}
          path: ${{ runner.temp }}/ponto-fresh-close/historical
          github-token: ${{ github.token }}
          run-id: ${{ inputs.watchdog_run_id }}

      - name: Validate the exact failed Timekeeping mutation before fresh close
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          WATCHDOG_RUN_ID: ${{ inputs.watchdog_run_id }}
          TIMEKEEPING_CANDIDATE_VERSION_ID: ${{ inputs.timekeeping_candidate_version_id }}
          TIMEKEEPING_INCUMBENT_VERSION_ID: ${{ inputs.timekeeping_incumbent_version_id }}
          RECOVERY_ROOT: ${{ runner.temp }}/ponto-fresh-close/historical
        run: |
          set -euo pipefail
          node - "$RECOVERY_ROOT" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = process.argv[2];
          const read = (relative) => JSON.parse(fs.readFileSync(path.join(root, relative), "utf8"));
          const uuid = (value) => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ""));
          const journal = read("watchdog-journal.json");
          const reconciliation = read("automatic-rollback/ponto-child-reconciliation.json");
          const mutation = read("mutations/timekeeping/mutation.json");
          if (
            journal.schemaVersion !== 1
            || journal.coordinatorRunId !== process.env.COORDINATOR_RUN_ID
            || journal.releaseSha !== process.env.RELEASE_SHA
            || journal.stage !== "staging"
            || journal.passed !== true
            || journal.credentialsIncluded !== false
            || journal.piiIncluded !== false
            || reconciliation.schemaVersion !== 1
            || reconciliation.orchestratorRunId !== process.env.COORDINATOR_RUN_ID
            || reconciliation.orchestratorHeadSha !== process.env.RELEASE_SHA
            || reconciliation.target !== "staging"
            || reconciliation.passed !== true
            || reconciliation.credentialsIncluded !== false
            || reconciliation.piiIncluded !== false
            || mutation.schemaVersion !== 1
            || mutation.surface !== "timekeeping"
            || mutation.stage !== "staging"
            || mutation.sourceSha !== process.env.RELEASE_SHA
            || mutation.orchestratorRunId !== process.env.COORDINATOR_RUN_ID
            || mutation.candidateVersionId !== process.env.TIMEKEEPING_CANDIDATE_VERSION_ID
            || mutation.incumbentVersionId !== process.env.TIMEKEEPING_INCUMBENT_VERSION_ID
            || !uuid(mutation.candidateVersionId)
            || !uuid(mutation.incumbentVersionId)
            || mutation.mutationStarted !== true
            || mutation.rollbackCompleted !== false
            || !(
              (mutation.mutationCompleted === false && mutation.compensationDisposition === "ownership-conflict")
              || (mutation.mutationCompleted === true && mutation.compensationDisposition === "not-required")
            )
            || mutation.credentialsIncluded !== false
            || mutation.piiIncluded !== false
          ) throw new Error("historical watchdog custody does not prove the exact failed Timekeeping mutation");
          NODE

      - name: Write a fresh emergency latch correlated to the failed coordinator
        env:
          PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL: ${{ secrets.PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL }}
          PONTO_EMERGENCY_CLOSE_BROKER_URL: ${{ vars.PONTO_EMERGENCY_CLOSE_BROKER_URL }}
          PONTO_EMERGENCY_CLOSE_CUSTODY_REF: ${{ vars.PONTO_EMERGENCY_CLOSE_CUSTODY_REF }}
          PONTO_EMERGENCY_TARGET: staging
          PONTO_EMERGENCY_TRIGGER_RUN_ID: ${{ github.run_id }}
          PONTO_FAILED_COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          PONTO_EMERGENCY_LATCH_REPORT: ${{ runner.temp }}/ponto-fresh-close/latch.json
        run: node .github/scripts/ponto-emergency-latch-write.mjs

      - name: Write fresh maintenance under the correlated latch
        env:
          PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL: ${{ secrets.PONTO_EMERGENCY_CLOSE_BROKER_CREDENTIAL }}
          PONTO_EMERGENCY_CLOSE_BROKER_URL: ${{ vars.PONTO_EMERGENCY_CLOSE_BROKER_URL }}
          PONTO_EMERGENCY_CLOSE_CUSTODY_REF: ${{ vars.PONTO_EMERGENCY_CLOSE_CUSTODY_REF }}
          PONTO_EMERGENCY_TARGET: staging
          PONTO_EMERGENCY_TRIGGER_RUN_ID: ${{ github.run_id }}
          PONTO_FAILED_COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          PONTO_EMERGENCY_MAINTENANCE_REPORT: ${{ runner.temp }}/ponto-fresh-close/maintenance.json
        run: node .github/scripts/ponto-emergency-maintenance-write.mjs

      - name: Prove and record the fresh external fail-close
        env:
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          PONTO_MODULE_HEALTH_URL: https://api-staging.skincos.com.br/api/ponto/health
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/ponto-fresh-close"
          mkdir -p "$directory"
          node - "$directory/latch.json" "$directory/maintenance.json" "$directory/authorization.json" <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const latch = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const maintenance = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (
            latch?.target !== "staging"
            || latch?.coordinatorRunId !== process.env.COORDINATOR_RUN_ID
            || latch?.emergencyRunId !== process.env.GITHUB_RUN_ID
            || latch?.latched !== true
            || maintenance?.target !== "staging"
            || maintenance?.coordinatorRunId !== process.env.COORDINATOR_RUN_ID
            || maintenance?.emergencyRunId !== process.env.GITHUB_RUN_ID
            || maintenance?.state !== "maintenance"
            || maintenance?.latched !== true
            || maintenance?.passed !== true
          ) throw new Error("fresh broker close evidence is not correlated to the failed coordinator");
          fs.writeFileSync(process.argv[4], `${JSON.stringify({
            schemaVersion: 1,
            target: "staging",
            releaseSha: process.env.RELEASE_SHA,
            coordinatorRunId: process.env.COORDINATOR_RUN_ID,
            emergencyRunId: process.env.GITHUB_RUN_ID,
            authorizationRefDigest: `sha256:${crypto.createHash("sha256").update(process.env.AUTHORIZATION_REF).digest("hex")}`,
            passed: true,
            credentialsIncluded: false,
            piiIncluded: false,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          node - "$directory/maintenance.json" "$directory/overlay-expectation.json" "$directory/control-fallback-expectation.json" <<'NODE'
          (async () => {
          const fs = require("fs");
          const maintenance = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const probe = new URL(process.env.PONTO_MODULE_HEALTH_URL);
          probe.searchParams.set("recovery_close_probe", `${Date.now()}`);
          const response = await fetch(probe, { redirect: "manual", headers: { accept: "application/json", "cache-control": "no-cache" } });
          const body = await response.json().catch(() => null);
          const availability = body?.availability;
          if (
            response.status !== 200
            || availability?.state !== "maintenance"
            || !["control", "emergency-latch-active"].includes(availability?.source)
            || !Number.isFinite(Date.parse(String(availability?.changedAt || "")))
          ) throw new Error("fresh recovery close did not observe maintenance");
          if (availability.source === "emergency-latch-active") {
            fs.writeFileSync(process.argv[3], `${JSON.stringify({ state: "maintenance", changedAt: availability.changedAt })}\n`, { mode: 0o600 });
            fs.rmSync(process.argv[4], { force: true });
          } else {
            fs.writeFileSync(process.argv[3], `${JSON.stringify({ state: "maintenance", changedAt: maintenance.latchChangedAt })}\n`, { mode: 0o600 });
            fs.writeFileSync(process.argv[4], `${JSON.stringify({ state: "maintenance", changedAt: availability.changedAt, source: "control" })}\n`, { mode: 0o600 });
          }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
          if [[ -f "$directory/control-fallback-expectation.json" ]]; then
            PONTO_MODULE_EXPECTED_SOURCE=emergency-latch-active \
            PONTO_MODULE_EXPECTATION_FILE="$directory/overlay-expectation.json" \
            PONTO_MODULE_ALTERNATE_EXPECTATION_FILE="$directory/control-fallback-expectation.json" \
            PONTO_MODULE_PROPAGATION_REPORT="$directory/final-propagation.json" \
              node .github/scripts/ponto-module-propagation.mjs
          else
            PONTO_MODULE_EXPECTED_SOURCE=emergency-latch-active \
            PONTO_MODULE_EXPECTATION_FILE="$directory/overlay-expectation.json" \
            PONTO_MODULE_PROPAGATION_REPORT="$directory/final-propagation.json" \
              node .github/scripts/ponto-module-propagation.mjs
          fi
          rm -f "$directory/overlay-expectation.json" "$directory/control-fallback-expectation.json"

      - name: Upload immutable fresh recovery close evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-fresh-recovery-close-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-fresh-close
          retention-days: 90
          if-no-files-found: error

  rollback:
    needs: fresh-close
    if: ${{ needs.fresh-close.result == 'success' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Acquire global Ponto recovery lease for staging rollback
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          resource: release:ponto
          module: ponto
          # The lease authorizes the trusted recovery workflow, while the
          # failed release remains constrained by its immutable evidence.
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-ponto-staging-rollback.json

      - name: Validate current source and exact failed-run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          WATCHDOG_RUN_ID: ${{ inputs.watchdog_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA'; exit 1; }
          [[ "$COORDINATOR_RUN_ID" =~ ^[1-9][0-9]*$ && "$WATCHDOG_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid recovery run IDs'; exit 1; }
          [[ "$COORDINATOR_RUN_ID" != "$WATCHDOG_RUN_ID" ]] || { echo 'Coordinator and watchdog runs must differ'; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Recovery must run from main'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Recovery checkout differs from current workflow source'; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'Recovery source is not the current canonical main'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'Failed release is not reachable from main'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COORDINATOR_RUN_ID" > "$RUNNER_TEMP/ponto-coordinator.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WATCHDOG_RUN_ID" > "$RUNNER_TEMP/ponto-watchdog.json"
          node --input-type=module - "$RUNNER_TEMP/ponto-coordinator.json" "$RUNNER_TEMP/ponto-watchdog.json" <<'NODE'
          import fs from "node:fs";
          import { pontoSourceClosureMatches } from "./.github/scripts/ponto-source-closure.mjs";
          const coordinator = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const watchdog = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const repo = process.env.GITHUB_REPOSITORY;
          const releaseSha = process.env.RELEASE_SHA;
          const isCompletedFailure = (run) => run.status === "completed"
            && ["failure", "cancelled"].includes(run.conclusion);
          if (
            coordinator.path !== ".github/workflows/ponto-progressive-release.yml"
            || coordinator.event !== "workflow_dispatch"
            || !isCompletedFailure(coordinator)
            || !pontoSourceClosureMatches(releaseSha, String(coordinator.head_sha || "").toLowerCase())
            || coordinator.head_branch !== "main"
            || coordinator.repository?.full_name !== repo
            || watchdog.path !== ".github/workflows/ponto-release-watchdog.yml"
            || watchdog.event !== "workflow_run"
            || watchdog.status !== "completed"
            || watchdog.conclusion !== "failure"
            || !/^[0-9a-f]{40}$/.test(String(watchdog.head_sha || ""))
            || watchdog.head_branch !== "main"
            || watchdog.repository?.full_name !== repo
            || !String(watchdog.display_title || "").includes(`source=${process.env.COORDINATOR_RUN_ID}`)
          ) throw new Error("failed coordinator/watchdog provenance is not exact");
          NODE
          rm -f "$RUNNER_TEMP/ponto-coordinator.json" "$RUNNER_TEMP/ponto-watchdog.json"

      - name: Download the exact immutable watchdog rollback evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-watchdog-rollback-${{ inputs.coordinator_run_id }}-${{ inputs.watchdog_run_id }}
          path: ${{ runner.temp }}/ponto-staging-recovery-rollback
          github-token: ${{ github.token }}
          run-id: ${{ inputs.watchdog_run_id }}

      - name: Download the exact successful recovery that owns the replacement Worker
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-staging-recovery-rollback-${{ inputs.timekeeping_owner_coordinator_run_id }}-${{ inputs.timekeeping_owner_recovery_run_id }}
          path: ${{ runner.temp }}/ponto-staging-recovery-rollback/owner-recovery
          github-token: ${{ github.token }}
          run-id: ${{ inputs.timekeeping_owner_recovery_run_id }}

      - name: Validate the exact current Worker ownership recovery before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          PONTO_PRIOR_RECOVERY_RUN_ID: ${{ inputs.timekeeping_owner_recovery_run_id }}
          PONTO_PRIOR_RECOVERY_COORDINATOR_RUN_ID: ${{ inputs.timekeeping_owner_coordinator_run_id }}
          PONTO_PRIOR_RECOVERY_RELEASE_SHA: ${{ inputs.timekeeping_owner_release_sha }}
          PONTO_TIMEKEEPING_CANDIDATE_VERSION_ID: ${{ inputs.timekeeping_candidate_version_id }}
          PONTO_PRIOR_RECOVERY_RUN_FILE: ${{ runner.temp }}/ponto-staging-recovery-rollback/owner-recovery-run.json
          PONTO_PRIOR_RECOVERY_ARTIFACT_ROOT: ${{ runner.temp }}/ponto-staging-recovery-rollback/owner-recovery
          PONTO_WORKER_OWNERSHIP_REPORT: ${{ runner.temp }}/ponto-staging-recovery-rollback/current-worker-ownership.json
        run: |
          set -euo pipefail
          [[ "$PONTO_PRIOR_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid current-owner recovery run ID'; exit 1; }
          [[ "$PONTO_PRIOR_RECOVERY_COORDINATOR_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid current-owner coordinator run ID'; exit 1; }
          [[ "$PONTO_PRIOR_RECOVERY_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid current-owner release SHA'; exit 1; }
          [[ "$PONTO_PRIOR_RECOVERY_RUN_ID" != "$PONTO_PRIOR_RECOVERY_COORDINATOR_RUN_ID" ]] || { echo 'Current-owner recovery and coordinator runs must differ'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PONTO_PRIOR_RECOVERY_RUN_ID" > "$PONTO_PRIOR_RECOVERY_RUN_FILE"
          owner_head_sha="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).head_sha || "")' "$PONTO_PRIOR_RECOVERY_RUN_FILE")"
          [[ "$owner_head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Current-owner recovery SHA is invalid'; exit 1; }
          git merge-base --is-ancestor "$owner_head_sha" origin/main || { echo 'Current-owner recovery source is not reachable from canonical main'; exit 1; }
          node .github/scripts/ponto-worker-ownership-recovery.mjs \
            "$PONTO_PRIOR_RECOVERY_RUN_FILE" \
            "$PONTO_PRIOR_RECOVERY_ARTIFACT_ROOT" \
            "$PONTO_WORKER_OWNERSHIP_REPORT"
          rm -f "$PONTO_PRIOR_RECOVERY_RUN_FILE"

      - name: Validate exact incumbent custody before mutation
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          WATCHDOG_RUN_ID: ${{ inputs.watchdog_run_id }}
          TIMEKEEPING_CANDIDATE_VERSION_ID: ${{ inputs.timekeeping_candidate_version_id }}
          TIMEKEEPING_INCUMBENT_VERSION_ID: ${{ inputs.timekeeping_incumbent_version_id }}
          RECOVERY_ROOT: ${{ runner.temp }}/ponto-staging-recovery-rollback
        run: |
          set -euo pipefail
          node - "$RECOVERY_ROOT" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = process.argv[2];
          const read = (relative) => JSON.parse(fs.readFileSync(path.join(root, relative), "utf8"));
          const uuid = (value) => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ""));
          const journal = read("watchdog-journal.json");
          const broker = read("automatic-rollback/ponto-broker-fail-close.json");
          const reconciliation = read("automatic-rollback/ponto-child-reconciliation.json");
          const mutation = read("mutations/timekeeping/mutation.json");
          if (
            journal.schemaVersion !== 1
            || journal.coordinatorRunId !== process.env.COORDINATOR_RUN_ID
            || journal.releaseSha !== process.env.RELEASE_SHA
            || journal.stage !== "staging"
            || journal.passed !== true
            || journal.credentialsIncluded !== false
            || journal.piiIncluded !== false
            || broker.schemaVersion !== 1
            || broker.contractId !== "skincos/ponto/emergency-close/v1"
            || broker.coordinatorRunId !== process.env.COORDINATOR_RUN_ID
            || broker.emergencyRunId !== process.env.WATCHDOG_RUN_ID
            || broker.releaseSha !== process.env.RELEASE_SHA
            || broker.stage !== "staging"
            || broker.target !== "staging"
            || broker.state !== "maintenance"
            || broker.latched !== true
            || broker.passed !== true
            || broker.credentialsIncluded !== false
            || broker.piiIncluded !== false
            || reconciliation.schemaVersion !== 1
            || reconciliation.orchestratorRunId !== process.env.COORDINATOR_RUN_ID
            || reconciliation.orchestratorHeadSha !== process.env.RELEASE_SHA
            || reconciliation.target !== "staging"
            || reconciliation.passed !== true
            || reconciliation.credentialsIncluded !== false
            || reconciliation.piiIncluded !== false
            || mutation.schemaVersion !== 1
            || mutation.surface !== "timekeeping"
            || mutation.stage !== "staging"
            || mutation.sourceSha !== process.env.RELEASE_SHA
            || mutation.orchestratorRunId !== process.env.COORDINATOR_RUN_ID
            || mutation.candidateVersionId !== process.env.TIMEKEEPING_CANDIDATE_VERSION_ID
            || mutation.incumbentVersionId !== process.env.TIMEKEEPING_INCUMBENT_VERSION_ID
            || !uuid(mutation.candidateVersionId)
            || !uuid(mutation.incumbentVersionId)
            || mutation.mutationStarted !== true
            || mutation.rollbackCompleted !== false
            || !(
              (mutation.mutationCompleted === false && mutation.compensationDisposition === "ownership-conflict")
              || (mutation.mutationCompleted === true && mutation.compensationDisposition === "not-required")
            )
            || mutation.credentialsIncluded !== false
            || mutation.piiIncluded !== false
          ) throw new Error("watchdog recovery evidence does not prove the exact failed Timekeeping mutation");
          NODE

      - name: Revalidate staging environment protection before rollback
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PONTO_ENVIRONMENT_TARGET: staging
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'GH_TOKEN with Environments:read is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/environments/$PONTO_ENVIRONMENT_TARGET" > "$RUNNER_TEMP/ponto-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/$PONTO_ENVIRONMENT_TARGET/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/ponto-environment-policies.json"
          node .github/scripts/ponto-environment-protection.mjs \
            "$RUNNER_TEMP/ponto-environment.json" \
            "$RUNNER_TEMP/ponto-environment-policies.json" \
            "$RUNNER_TEMP/ponto-environment-protection.json"
          rm -f "$RUNNER_TEMP/ponto-environment.json" "$RUNNER_TEMP/ponto-environment-policies.json"

      - name: Download the fresh recovery close evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ponto-fresh-recovery-close-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-staging-recovery-rollback/fresh-close
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Check global Ponto recovery lease immediately before staging materialization
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-ponto-staging-rollback.json
          resource: release:ponto
          module: ponto
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
      - name: Materialize the exact fresh broker close under the staging surface mutex
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_RESOURCE_TARGET: staging
          PONTO_TIMEKEEPING_D1_ID: ${{ vars.PONTO_TIMEKEEPING_D1_STAGING_ID }}
          PONTO_OPPOSITE_TIMEKEEPING_D1_ID: ${{ vars.PONTO_TIMEKEEPING_D1_PRODUCTION_ID }}
          PONTO_MODULE_CONTROL_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PONTO_OPPOSITE_MODULE_CONTROL_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
          PONTO_MATERIALIZE_TARGET: staging
          PONTO_COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          PONTO_EMERGENCY_RUN_ID: ${{ github.run_id }}
          PONTO_MAINTENANCE_FILE: ${{ runner.temp }}/ponto-staging-recovery-rollback/fresh-close/maintenance.json
          PONTO_MATERIALIZE_REPORT: ${{ runner.temp }}/ponto-staging-recovery-rollback/fresh-close/materialized-readback.json
          PONTO_RESOURCE_IDENTITY_REPORT: ${{ runner.temp }}/ponto-staging-recovery-rollback/resource-identity.json
        run: |
          set -euo pipefail
          node .github/scripts/ponto-cloudflare-resource-identity.mjs
          node .github/scripts/ponto-module-control-materialize.mjs
      - name: Read back the exact staging module control from Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_MODULE_CONTROL_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PONTO_COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          PONTO_EMERGENCY_RUN_ID: ${{ github.run_id }}
          PONTO_MAINTENANCE_FILE: ${{ runner.temp }}/ponto-staging-recovery-rollback/fresh-close/maintenance.json
          PONTO_DIRECT_READBACK_FILE: ${{ runner.temp }}/ponto-staging-recovery-rollback/fresh-close/direct-readback.json
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { readCloudflareKvJson } from "./.github/scripts/ponto-kv-readback.mjs";

          const validDate = (value) => Number.isFinite(Date.parse(String(value || "")));
          const maintenance = JSON.parse(fs.readFileSync(process.env.PONTO_MAINTENANCE_FILE, "utf8"));
          const moduleControl = await readCloudflareKvJson({
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            namespaceId: process.env.PONTO_MODULE_CONTROL_KV_ID,
            key: "module-control:timekeeping",
            apiToken: process.env.CLOUDFLARE_API_TOKEN,
          });
          const emergencyLatch = await readCloudflareKvJson({
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            namespaceId: process.env.PONTO_MODULE_CONTROL_KV_ID,
            key: "module-control:timekeeping:emergency-latch",
            apiToken: process.env.CLOUDFLARE_API_TOKEN,
          });
          const coordinatorRunId = process.env.PONTO_COORDINATOR_RUN_ID;
          const emergencyRunId = process.env.PONTO_EMERGENCY_RUN_ID;
          if (
            maintenance?.schemaVersion !== 1
            || maintenance?.target !== "staging"
            || maintenance?.coordinatorRunId !== coordinatorRunId
            || maintenance?.emergencyRunId !== emergencyRunId
            || maintenance?.state !== "maintenance"
            || maintenance?.latched !== true
            || maintenance?.passed !== true
            || !validDate(maintenance?.latchChangedAt)
            || moduleControl?.schemaVersion !== 2
            || moduleControl?.state !== "maintenance"
            || !validDate(moduleControl?.changedAt)
            || moduleControl?.emergencyLatchRef?.stopRunId !== coordinatorRunId
            || moduleControl?.emergencyLatchRef?.emergencyRunId !== emergencyRunId
            || moduleControl?.emergencyLatchRef?.latchChangedAt !== maintenance.latchChangedAt
            || emergencyLatch?.schemaVersion !== 1
            || emergencyLatch?.module !== "timekeeping"
            || emergencyLatch?.target !== "staging"
            || emergencyLatch?.latched !== true
            || !validDate(emergencyLatch?.changedAt)
            || emergencyLatch?.changedAt !== maintenance.latchChangedAt
            || emergencyLatch?.stopRunId !== coordinatorRunId
            || emergencyLatch?.emergencyRunId !== emergencyRunId
          ) throw new Error("direct staging KV readback is not correlated to the fresh emergency close");
          const sanitized = {
            schemaVersion: 1,
            source: "cloudflare-kv-direct",
            target: "staging",
            moduleControl: {
              schemaVersion: moduleControl.schemaVersion,
              state: moduleControl.state,
              changedAt: moduleControl.changedAt,
              emergencyLatchRef: {
                stopRunId: moduleControl.emergencyLatchRef.stopRunId,
                emergencyRunId: moduleControl.emergencyLatchRef.emergencyRunId,
                latchChangedAt: moduleControl.emergencyLatchRef.latchChangedAt,
              },
            },
            emergencyLatch: {
              schemaVersion: emergencyLatch.schemaVersion,
              module: emergencyLatch.module,
              target: emergencyLatch.target,
              latched: emergencyLatch.latched,
              changedAt: emergencyLatch.changedAt,
              stopRunId: emergencyLatch.stopRunId,
              emergencyRunId: emergencyLatch.emergencyRunId,
            },
            credentialsIncluded: false,
            piiIncluded: false,
          };
          fs.mkdirSync(path.dirname(process.env.PONTO_DIRECT_READBACK_FILE), { recursive: true });
          fs.writeFileSync(
            process.env.PONTO_DIRECT_READBACK_FILE,
            `${JSON.stringify(sanitized, null, 2)}\n`,
            { mode: 0o600 },
          );
          process.stdout.write("Direct staging KV custody readback recorded without values.\n");
          NODE

      - name: Normalize the fresh close with historical child reconciliation
        env:
          PONTO_RECOVERY_SOURCE_MODE: watchdog
          PONTO_COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          PONTO_EMERGENCY_RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: staging
          PONTO_RECOVERY_TARGET: staging
        run: |
          node .github/scripts/ponto-recovery-evidence.mjs \
            "$RUNNER_TEMP/ponto-staging-recovery-rollback/automatic-rollback/ponto-child-reconciliation.json" \
            "$RUNNER_TEMP/ponto-staging-recovery-rollback/fresh-close/maintenance.json" \
            "$RUNNER_TEMP/ponto-staging-recovery-rollback/fresh-close/final-propagation.json" \
            "$RUNNER_TEMP/ponto-staging-recovery-rollback" \
            "$RUNNER_TEMP/ponto-staging-recovery-rollback/fresh-close/direct-readback.json"

      - name: Check global Ponto recovery lease immediately before staging rollback
        uses: ./.github/actions/global-coordination-check
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-ponto-staging-rollback.json
          resource: release:ponto
          module: ponto
          source_sha: ${{ github.sha }}
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
      - name: Restore the exact Timekeeping incumbent under the existing latch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PONTO_ROLLBACK_CHECK_TOKEN: ${{ github.token }}
          PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY: ${{ secrets.PONTO_PAGES_ROLLBACK_INTENT_HMAC_KEY }}
          PONTO_COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: staging
          PONTO_TIMEKEEPING_CANDIDATE_VERSION_ID: ${{ inputs.timekeeping_candidate_version_id }}
          PONTO_WORKER_OWNERSHIP_REPORT: ${{ runner.temp }}/ponto-staging-recovery-rollback/current-worker-ownership.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_MODULE_HEALTH_URL: https://api-staging.skincos.com.br/api/ponto/health
          STAGING_PAGES_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT_STAGING }}
          PRODUCTION_PAGES_PROJECT_RAW: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT }}
          STAGING_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PRODUCTION_MODULE_CONTROL_KV_ID_RAW: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "${STAGING_PAGES_PROJECT_RAW:-}" && -n "${STAGING_MODULE_CONTROL_KV_ID_RAW:-}" ]] || { echo 'Missing staging Ponto resource configuration'; exit 1; }
          [[ "$STAGING_PAGES_PROJECT_RAW" == skincos-staging ]] || { echo 'Unexpected staging Pages project'; exit 1; }
          CLOUDFLARE_PAGES_PROJECT="$STAGING_PAGES_PROJECT_RAW"
          OPPOSITE_PAGES_PROJECT="$PRODUCTION_PAGES_PROJECT_RAW"
          MODULE_CONTROL_KV_ID="$STAGING_MODULE_CONTROL_KV_ID_RAW"
          OPPOSITE_MODULE_CONTROL_KV_ID="$PRODUCTION_MODULE_CONTROL_KV_ID_RAW"
          [[ "$CLOUDFLARE_PAGES_PROJECT" != "$OPPOSITE_PAGES_PROJECT" ]] || { echo 'Pages projects are not isolated'; exit 1; }
          [[ "$MODULE_CONTROL_KV_ID" != "$OPPOSITE_MODULE_CONTROL_KV_ID" ]] || { echo 'Module-control namespaces are not isolated'; exit 1; }
          export CLOUDFLARE_PAGES_PROJECT MODULE_CONTROL_KV_ID
          export PONTO_OPPOSITE_MODULE_CONTROL_KV_ID="$OPPOSITE_MODULE_CONTROL_KV_ID"
          root="$RUNNER_TEMP/ponto-staging-recovery-rollback"
          node .github/scripts/ponto-automatic-rollback.mjs \
            "$root" "$root/automatic-rollback/ponto-automatic-rollback-replay.json"

      - name: Prove staging remains closed on the restored incumbent
        if: ${{ success() }}
        env:
          PONTO_MODULE_HEALTH_URL: https://api-staging.skincos.com.br/api/ponto/health
          TIMEKEEPING_INCUMBENT_VERSION_ID: ${{ inputs.timekeeping_incumbent_version_id }}
          PONTO_MATERIALIZE_REPORT: ${{ runner.temp }}/ponto-staging-recovery-rollback/fresh-close/materialized-readback.json
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const headers = { accept: "application/json" };
          if (process.env.CF_ACCESS_CLIENT_ID && process.env.CF_ACCESS_CLIENT_SECRET) {
            headers["cf-access-client-id"] = process.env.CF_ACCESS_CLIENT_ID;
            headers["cf-access-client-secret"] = process.env.CF_ACCESS_CLIENT_SECRET;
          }
          const materialized = JSON.parse(fs.readFileSync(process.env.PONTO_MATERIALIZE_REPORT, "utf8"));
          const propagationDeadline = Date.now() + 75_000;
          let consecutiveValidSamples = 0;
          let lastValidSampleKey = "";
          let passed = false;
          let attempt = 0;
          while (Date.now() <= propagationDeadline) {
            attempt += 1;
            try {
              const response = await fetch(process.env.PONTO_MODULE_HEALTH_URL, {
                redirect: "manual",
                signal: AbortSignal.timeout(15_000),
                headers,
              });
              const body = await response.json().catch(() => null);
              const availabilitySource = String(body?.availability?.source || "");
              const expectedAvailabilityChangedAt = availabilitySource === "emergency-latch-active"
                ? materialized?.emergencyLatch?.changedAt
                : materialized?.moduleControl?.changedAt;
              const workerVersionId = String(body?.versionMetadata?.workerVersionId || "").toLowerCase();
              const validSample = (
                response.status === 200
                && body?.ok === false
                && body?.ready === false
                && body?.availability?.state === "maintenance"
                && ["control", "emergency-latch-active"].includes(availabilitySource)
                && body?.availability?.changedAt === expectedAvailabilityChangedAt
                && workerVersionId === process.env.TIMEKEEPING_INCUMBENT_VERSION_ID.toLowerCase()
              );
              const sampleKey = `${availabilitySource}:${body?.availability?.changedAt || ""}:${workerVersionId}`;
              if (validSample && sampleKey === lastValidSampleKey) {
                consecutiveValidSamples += 1;
              } else if (validSample) {
                lastValidSampleKey = sampleKey;
                consecutiveValidSamples = 1;
              } else {
                lastValidSampleKey = "";
                consecutiveValidSamples = 0;
              }
              if (consecutiveValidSamples >= 2) {
                passed = true;
                break;
              }
            } catch {
              // A transient health-probe failure consumes this attempt but must not abort the bounded propagation window.
              lastValidSampleKey = "";
              consecutiveValidSamples = 0;
            }
            const remainingMs = propagationDeadline - Date.now();
            if (remainingMs > 0) await new Promise((resolve) => setTimeout(resolve, Math.min(5_000, remainingMs)));
          }
          if (!passed) throw new Error("staging health did not prove two consecutive maintenance samples on the restored Timekeeping incumbent within the propagation window");
          NODE

      - name: Upload immutable staging recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-staging-recovery-rollback-${{ inputs.coordinator_run_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ponto-staging-recovery-rollback
          retention-days: 90
          if-no-files-found: warn
      - name: Release global Ponto recovery lease after staging rollback
        if: always()
        uses: ./.github/actions/global-coordination-release
        with:
          required: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID }}
          proof_file: ${{ runner.temp }}/skincos-global-coordination-ponto-staging-rollback.json
