name: Ponto staging rollback drill
run-name: Ponto staging rollback drill ${{ inputs.release_sha }} orchestrator=${{ inputs.orchestrator_run_id }} nonce=${{ inputs.orchestrator_nonce }}

on:
  workflow_dispatch:
    inputs:
      release_sha: { description: "Immutable SHA restored after the drill", required: true, type: string }
      orchestrator_run_id: { description: "Ponto coordinator correlation ID", required: true, type: string }
      orchestrator_stage: { description: "Exact coordinator stage", required: false, type: string }
      staging_journey_run_id: { description: "Successful authenticated staging journey predecessor", required: true, type: string }
      timekeeping_candidate_version_id: { description: "Exact Timekeeping staging candidate", required: true, type: string }
      timekeeping_incumbent_version_id: { description: "Exact Timekeeping staging incumbent", required: true, type: string }
      core_candidate_version_id: { description: "Exact route-isolated Ponto Core staging candidate", required: true, type: string }
      core_incumbent_version_id: { description: "Exact route-isolated Ponto Core staging incumbent", required: true, type: string }
      identity_candidate_version_id: { description: "Exact Identity staging candidate", required: true, type: string }
      identity_incumbent_version_id: { description: "Exact Identity staging incumbent", required: true, type: string }
      pages_candidate_deployment_id: { description: "Exact CRM Pages staging candidate deployment", required: true, type: string }
      pages_incumbent_deployment_id: { description: "Exact CRM Pages staging incumbent deployment", required: true, type: string }
      orchestrator_issuer_run_id: { description: "Exact direct issuer run", required: false, type: string }
      orchestrator_nonce: { description: "Non-secret per-dispatch correlation nonce", required: false, type: string }

concurrency:
  # Every current Ponto surface mutator takes this direct lock. The drill
  # writes module-control itself, so it does not dispatch lock-recursive
  # module grandchildren.
  group: ponto-surface-mutation
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  coordination:
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
    uses: ./.github/workflows/ponto-orchestrator-gate.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
    with:
      required: true
      global_lease_required: true
      global_resource: ${{ inputs.orchestrator_run_id != '' && 'release:ponto-child' || 'release:ponto' }}
      global_module: ponto
      global_coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_URL }}
      lease_key: staging-rollback
      stage: ${{ inputs.orchestrator_stage }}
      target: staging
      release_sha: ${{ inputs.release_sha }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}

  drill:
    needs: coordination
    if: ${{ github.run_attempt == 1 }}
    permissions:
      actions: read
      checks: write
      contents: read
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Verify immutable source and authenticated journey predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_JOURNEY_RUN_ID: ${{ inputs.staging_journey_run_id }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$STAGING_JOURNEY_RUN_ID" =~ ^[0-9]+$ && "$ORCHESTRATOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid rollback drill provenance'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'Rollback drill checkout differs from release_sha'; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'release_sha is not reachable from main'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/timekeeping-staging-journey.yml" > "$RUNNER_TEMP/journey-workflow.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_JOURNEY_RUN_ID" > "$RUNNER_TEMP/journey-run.json"
          node --input-type=module - "$RUNNER_TEMP/journey-workflow.json" "$RUNNER_TEMP/journey-run.json" <<'NODE'
          import fs from "node:fs";
          import { pontoSourceClosureMatches } from "./.github/scripts/ponto-source-closure.mjs";
          const workflow = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const run = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (
            workflow.state !== "active"
            || workflow.path !== ".github/workflows/timekeeping-staging-journey.yml"
            || workflow.name !== "Timekeeping authenticated staging journey"
            || run.workflow_id !== workflow.id
            || ![workflow.path, `${workflow.path}@refs/heads/main`].includes(run.path)
            || run.status !== "completed"
            || run.conclusion !== "success"
            || run.event !== "workflow_dispatch"
            || run.head_branch !== "main"
            || !pontoSourceClosureMatches(process.env.RELEASE_SHA, String(run.head_sha || "").toLowerCase())
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
            || !String(run.display_title || "").includes(`orchestrator=${process.env.ORCHESTRATOR_RUN_ID}`)
          ) throw new Error("staging journey predecessor provenance is invalid");
          NODE
          mkdir -p "$RUNNER_TEMP/journey"
          gh run download "$STAGING_JOURNEY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "timekeeping-staging-journey-$RELEASE_SHA" \
            --dir "$RUNNER_TEMP/journey"
          node - "$RUNNER_TEMP/journey/ponto-staging-report.json" "$RUNNER_TEMP/journey/ponto-staging-contract.json" <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const contract = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (contract.sourceSha !== process.env.RELEASE_SHA || contract.passed !== true || report.environment !== "staging" || report.credentialsIncluded !== false || report.piiIncluded !== false) {
            throw new Error("staging journey artifact is not the exact sanitized predecessor");
          }
          NODE
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: crm/console/package-lock.json
      - name: Install authenticated browser harness
        run: npm ci
        working-directory: crm/console
      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium
        working-directory: crm/console
      - name: Revalidate the exact active coordinator before rollback drill secrets or mutation
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/ponto-orchestrator-lease.mjs assert-active \
            "$ORCHESTRATOR_STAGE" \
            "$RELEASE_SHA" \
            "$ORCHESTRATOR_RUN_ID"
      - name: Authorize global Ponto rollback-drill mutation
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED }}
          coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
          resource: ${{ inputs.orchestrator_run_id != '' && 'release:ponto-child' || 'release:ponto' }}
          module: ponto
          source_sha: ${{ inputs.release_sha }}
      - name: Attest exact staging D1 and module-control identities before rollback drill mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_RESOURCE_TARGET: staging
          PONTO_TIMEKEEPING_D1_ID: ${{ vars.PONTO_TIMEKEEPING_D1_STAGING_ID }}
          PONTO_OPPOSITE_TIMEKEEPING_D1_ID: ${{ vars.PONTO_TIMEKEEPING_D1_PRODUCTION_ID }}
          PONTO_MODULE_CONTROL_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          PONTO_OPPOSITE_MODULE_CONTROL_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_PRODUCTION_KV_ID }}
          PONTO_RESOURCE_IDENTITY_REPORT: ${{ runner.temp }}/ponto-staging-resource-identity.json
        run: node .github/scripts/ponto-cloudflare-resource-identity.mjs
      - name: Render the exact staging Timekeeping D1 config
        env:
          STAGING_TIMEKEEPING_D1_ID: ${{ vars.PONTO_TIMEKEEPING_D1_STAGING_ID }}
        run: |
          set -euo pipefail
          [[ "$STAGING_TIMEKEEPING_D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'staging Timekeeping D1 ID is missing or malformed'; exit 1; }
          config="$RUNNER_TEMP/ponto-timekeeping-staging-wrangler.toml"
          cp workforce/timekeeping/wrangler.toml "$config"
          sed -i \
            "s/__CONFIGURE_TIMEKEEPING_D1_ID__/00000000-0000-4000-8000-000000000001/;s/__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__/00000000000000000000000000000001/;s/__CONFIGURE_TIMEKEEPING_STAGING_D1_ID__/$STAGING_TIMEKEEPING_D1_ID/" \
            "$config"
          ! grep -q '__CONFIGURE_.*_ID__' "$config" || { echo 'unresolved Timekeeping staging binding placeholder'; exit 1; }
          printf 'TIMEKEEPING_STAGING_WRANGLER_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Exercise exact incumbents and restore every exact staging candidate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          ORCHESTRATOR_STAGE: ${{ inputs.orchestrator_stage }}
          STAGING_JOURNEY_RUN_ID: ${{ inputs.staging_journey_run_id }}
          TIMEKEEPING_CANDIDATE_VERSION_ID: ${{ inputs.timekeeping_candidate_version_id }}
          TIMEKEEPING_INCUMBENT_VERSION_ID: ${{ inputs.timekeeping_incumbent_version_id }}
          CORE_CANDIDATE_VERSION_ID: ${{ inputs.core_candidate_version_id }}
          CORE_INCUMBENT_VERSION_ID: ${{ inputs.core_incumbent_version_id }}
          IDENTITY_CANDIDATE_VERSION_ID: ${{ inputs.identity_candidate_version_id }}
          IDENTITY_INCUMBENT_VERSION_ID: ${{ inputs.identity_incumbent_version_id }}
          PAGES_CANDIDATE_DEPLOYMENT_ID: ${{ inputs.pages_candidate_deployment_id }}
          PAGES_INCUMBENT_DEPLOYMENT_ID: ${{ inputs.pages_incumbent_deployment_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTO_IDEMPOTENCY_KEY: ${{ secrets.PONTO_IDEMPOTENCY_KEY }}
          PONTO_CLOUDFLARE_PAGES_PROJECT_STAGING: ${{ vars.PONTO_CLOUDFLARE_PAGES_PROJECT_STAGING }}
          PONTO_MODULE_CONTROL_STAGING_KV_ID: ${{ vars.PONTO_MODULE_CONTROL_STAGING_KV_ID }}
          STAGING_CORE_D1_DATABASE: skincos-db-staging
          STAGING_TIMEKEEPING_D1_DATABASE: skincos-timekeeping-staging
          TIMEKEEPING_STAGING_WRANGLER_CONFIG: ${{ runner.temp }}/ponto-timekeeping-staging-wrangler.toml
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node .github/scripts/ponto-staging-rollback-drill.mjs "$RUNNER_TEMP/ponto-staging-rollback-drill.json"
      - name: Upload immutable staging rollback drill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-staging-rollback-drill-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/ponto-staging-rollback-drill.json
          retention-days: 90
          if-no-files-found: error
  global-coordination-release:
    needs: [coordination, drill]
    if: ${{ always() && needs.coordination.outputs.global_lease_required == 'true' }}
    uses: ./.github/workflows/global-coordination-release.yml
    secrets:
      SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
    with:
      required: true
      proof_b64: ${{ needs.coordination.outputs.global_proof_b64 }}
      coordinator_url: ${{ needs.coordination.outputs.global_coordinator_url }}
