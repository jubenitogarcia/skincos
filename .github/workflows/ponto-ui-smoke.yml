name: Ponto UI Smoke (prod)

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      expect_sha:
        description: "Optional: assert the Ponto build badge matches this commit SHA (first 7 chars). Leave empty to skip."
        required: false
        default: ""
        type: string

concurrency:
  group: ponto-ui-smoke-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_PONTO_UI_SMOKE == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: crm/console/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: crm/console

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium

      - name: Install Playwright Chromium (with deps)
        run: npx --yes playwright install --with-deps chromium
        working-directory: crm/console

      - name: Resolve expected SHA
        id: sha
        env:
          INPUT_SHA: ${{ github.event.inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          INPUT_SHA="$(echo "${INPUT_SHA:-}" | tr -d '[:space:]')"
          if [[ -n "${INPUT_SHA:-}" ]]; then
            [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "expect_sha must be 7-40 hexadecimal characters"; exit 1; }
            echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required secrets
        env:
          SMOKE_EMAIL: ${{ secrets.PONTO_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_EMAIL:-}" || -z "${SMOKE_PASSWORD:-}" ]]; then
            echo "Missing GitHub Actions secrets: PONTO_SMOKE_EMAIL / PONTO_SMOKE_PASSWORD"
            echo "Configure them in the repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run UI smoke (fast)
        id: smoke
        continue-on-error: true
        env:
          CRM_URL: https://crm.skincos.com.br
          EXPECT_BUILD_SHA: ${{ steps.sha.outputs.sha }}
          AUTO_LOGIN: "1"
          SMOKE_EMAIL: ${{ secrets.PONTO_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_SMOKE_PASSWORD }}
          LOGIN_WAIT_MS: "120000"
          NO_SCREENSHOTS: "1"
          MUTATE_ADMIN: "0"
          MUTATE_EMPLOYEE: "0"
          MUTATE_PUNCH: "0"
          NODE_PATH: crm/console/node_modules
        run: |
          set -euo pipefail
          node crm/console/scripts/ponto-ui-smoke.cjs

      - name: Re-run UI smoke with trace (on failure)
        if: ${{ steps.smoke.outcome != 'success' }}
        env:
          CRM_URL: https://crm.skincos.com.br
          EXPECT_BUILD_SHA: ${{ steps.sha.outputs.sha }}
          AUTO_LOGIN: "1"
          SMOKE_EMAIL: ${{ secrets.PONTO_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_SMOKE_PASSWORD }}
          LOGIN_WAIT_MS: "120000"
          TRACE: "0"
          FULL_PAGE: "1"
          MUTATE_ADMIN: "0"
          MUTATE_EMPLOYEE: "0"
          MUTATE_PUNCH: "0"
          NODE_PATH: crm/console/node_modules
        run: |
          set -euo pipefail
          node crm/console/scripts/ponto-ui-smoke.cjs

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponto-ui-smoke-artifacts
          path: |
            output/playwright/*.png
            output/playwright/*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail if fast smoke failed
        if: ${{ steps.smoke.outcome != 'success' }}
        run: exit 1
