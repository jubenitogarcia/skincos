name: Ponto UI Smoke (authorized manual)

on:
  workflow_dispatch:
    inputs:
      expect_sha:
        description: "Optional: assert the Ponto build badge matches this commit SHA (first 7 chars). Leave empty to skip."
        required: false
        default: ""
        type: string

concurrency:
  group: ponto-ui-smoke-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: crm/console/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: crm/console

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium

      - name: Install Playwright Chromium (with deps)
        run: npx --yes playwright install --with-deps chromium
        working-directory: crm/console

      - name: Resolve expected SHA
        id: sha
        env:
          INPUT_SHA: ${{ github.event.inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          INPUT_SHA="$(echo "${INPUT_SHA:-}" | tr -d '[:space:]')"
          if [[ -n "${INPUT_SHA:-}" ]]; then
            [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "expect_sha must be 7-40 hexadecimal characters"; exit 1; }
            echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required secrets
        env:
          SMOKE_EMAIL: ${{ secrets.PONTO_PILOT_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_PILOT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_EMAIL:-}" || -z "${SMOKE_PASSWORD:-}" ]]; then
            echo "Missing production-environment secrets: PONTO_PILOT_LOGIN / PONTO_PILOT_PASSWORD"
            echo "Use only the separately approved least-privilege CONSULTOR pilot identity."
            exit 1
          fi

      - name: Run UI smoke (fast)
        id: smoke
        continue-on-error: true
        env:
          CRM_URL: https://crm.skincos.com.br
          EXPECT_BUILD_SHA: ${{ steps.sha.outputs.sha }}
          AUTO_LOGIN: "1"
          SMOKE_EMAIL: ${{ secrets.PONTO_PILOT_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_PILOT_PASSWORD }}
          LOGIN_WAIT_MS: "120000"
          NO_SCREENSHOTS: "1"
          MUTATE_ADMIN: "0"
          MUTATE_EMPLOYEE: "0"
          MUTATE_PUNCH: "0"
          NODE_PATH: crm/console/node_modules
        run: |
          set -euo pipefail
          node crm/console/scripts/ponto-ui-smoke.cjs

      - name: Re-run UI smoke with trace (on failure)
        if: ${{ steps.smoke.outcome != 'success' }}
        env:
          CRM_URL: https://crm.skincos.com.br
          EXPECT_BUILD_SHA: ${{ steps.sha.outputs.sha }}
          AUTO_LOGIN: "1"
          SMOKE_EMAIL: ${{ secrets.PONTO_PILOT_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PONTO_PILOT_PASSWORD }}
          LOGIN_WAIT_MS: "120000"
          TRACE: "0"
          NO_SCREENSHOTS: "1"
          MUTATE_ADMIN: "0"
          MUTATE_EMPLOYEE: "0"
          MUTATE_PUNCH: "0"
          NODE_PATH: crm/console/node_modules
        run: |
          set -euo pipefail
          node crm/console/scripts/ponto-ui-smoke.cjs

      - name: Fail if fast smoke failed
        if: ${{ steps.smoke.outcome != 'success' }}
        run: exit 1
