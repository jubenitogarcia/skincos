name: PR Admin Finalize

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
      - name: Merge or close remaining PRs under admin
        env:
          GH_ACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${ADMIN_TOKEN:-${GH_ACT_TOKEN}}"
          branch="main"
          echo "Relaxing branch protection for $REPO@$branch"
          cat > body.json <<'JSON'
          {"required_status_checks": null, "enforce_admins": false, "required_pull_request_reviews": null, "restrictions": null, "allow_force_pushes": true, "allow_deletions": true, "required_conversation_resolution": false}
          JSON
          gh api -X PUT repos/$REPO/branches/$branch/protection -H "Accept: application/vnd.github+json" --input body.json || true

          echo "Listing open PRs for $REPO"
          gh api -H "Accept: application/vnd.github+json" repos/$REPO/pulls --paginate > pulls.json
          if ! jq -e . pulls.json >/dev/null 2>&1; then
            echo "No PRs or failed to list."; exit 0
          fi
          jq -r '.[].number' pulls.json | while read pr; do
            echo "Finalizing PR #$pr"
            gh pr view "$pr" -R "$REPO" --json isDraft,title,headRefOid,mergeable,mergeableState,headRefName,baseRefName > pr.json || { echo "Failed to fetch PR #$pr"; continue; }
            draft=$(jq -r '.isDraft' pr.json)
            headSha=$(jq -r '.headRefOid' pr.json)
            headRef=$(jq -r '.headRefName' pr.json)
            baseRef=$(jq -r '.baseRefName' pr.json)
            if [ "$draft" = "true" ]; then
              echo "Marking draft PR #$pr ready for review"
              gh api -X PUT -H "Accept: application/vnd.github+json" repos/$REPO/pulls/$pr/ready_for_review || true
            fi
            # Update from base
            gh pr update "$pr" -R "$REPO" --merge >/dev/null 2>&1 || true
            # Try to merge with multiple fallbacks ignoring checks (protection is relaxed)
            if gh pr merge "$pr" -R "$REPO" --auto --squash --delete-branch; then
              echo "Auto-merge scheduled for #$pr"; continue;
            elif gh pr merge "$pr" -R "$REPO" --squash --delete-branch; then
              echo "Merged #$pr (squash + delete-branch)"; continue;
            elif gh pr merge "$pr" -R "$REPO" --squash; then
              echo "Merged #$pr (squash, kept branch)"; continue;
            elif gh pr merge "$pr" -R "$REPO" --merge; then
              echo "Merged #$pr (merge commit)"; continue;
            elif gh pr merge "$pr" -R "$REPO"; then
              echo "Merged #$pr (default method)"; continue;
            fi
            # If merge still fails, likely due to conflicts; close with rationale
            echo "Unable to merge #$pr automatically (likely conflicts). Closing."
            gh pr comment "$pr" -R "$REPO" -b "Admin Finalize: PR fechado automaticamente por conflitos não resolvidos após tentativa de atualização. Reabra com um rebase/merge resolvendo conflitos." || true
            gh pr close "$pr" -R "$REPO" || true
          done

          echo "Restoring branch protection for $REPO@$branch"
          cat > body_strict.json <<'JSON'
          {"required_status_checks": {"strict": true, "contexts": []}, "enforce_admins": true, "required_pull_request_reviews": {"required_approving_review_count": 1}, "restrictions": null, "allow_force_pushes": false, "allow_deletions": false, "required_conversation_resolution": true}
          JSON
          gh api -X PUT repos/$REPO/branches/$branch/protection -H "Accept: application/vnd.github+json" --input body_strict.json || true

      - name: Trigger issues audit
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '')
            const resp = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'issues-audit-autoclose.yml',
              ref,
            })
            core.info(`issues-audit-autoclose => ${resp.status}`)
