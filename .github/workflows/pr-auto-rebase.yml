name: PR Auto Rebase

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Rebase conflicting PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" repos/$REPO/pulls --paginate | jq -r '.[] | select(.mergeable_state=="dirty") | .number' | while read pr; do
            echo "Attempting rebase for PR #$pr"
            # Attempt an auto-update (merge base into head) which often resolves conflicts
            if gh pr ready "$pr" -R "$REPO" >/dev/null 2>&1; then echo "Marked ready"; fi
            if gh pr update "$pr" -R "$REPO" --merge >/dev/null 2>&1; then echo "Updated from base"; fi
            # Try a rebase by using the update-branch API if available
            gh api -X PUT -H "Accept: application/vnd.github+json" repos/$REPO/pulls/$pr/update-branch -f expected_head_sha="$(gh pr view $pr -R $REPO --json headRefOid -q .headRefOid)" || true
          done
