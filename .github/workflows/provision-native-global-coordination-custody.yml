name: Provision native global coordination custody

on:
  workflow_dispatch: {}

concurrency:
  group: native-global-coordination-custody
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Reconcile mini-PC coordination custody
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'jubenitogarcia/skincos' }}
    runs-on: [self-hosted, Linux, X64, skincos-native-custody]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify trusted main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$main_sha" == "$GITHUB_SHA" ]] || {
            echo 'Custody provisioning requires the exact current main SHA.' >&2
            exit 78
          }
          bash -n scripts/runtime/provision-global-coordination-custody.sh

      - name: Acquire global custody lease
        id: acquire
        uses: ./.github/actions/global-coordination-acquire
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:native-runtime-coordination-custody
          module: native-runtime
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-custody.json

      - name: Check custody lease immediately before writing
        if: ${{ steps.acquire.outcome == 'success' }}
        uses: ./.github/actions/global-coordination-check
        with:
          required: 'true'
          enabled: ${{ vars.SKINCOS_GLOBAL_COORDINATION_REQUIRED || 'false' }}
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          resource: global:native-runtime-coordination-custody
          module: native-runtime
          source_sha: ${{ github.sha }}
          proof_file: ${{ runner.temp }}/skincos-global-custody.json

      - name: Write the private native custody file
        if: ${{ steps.acquire.outcome == 'success' }}
        env:
          SKINCOS_GLOBAL_COORDINATOR_URL: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY }}
          SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          SKINCOS_GLOBAL_COORDINATION_KEY_ID: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
        run: |
          set -euo pipefail
          [[ -n "$SKINCOS_GLOBAL_COORDINATOR_URL" ]] || {
            echo 'GitHub coordination custody is unavailable.' >&2
            exit 78
          }
          if [[ "$SKINCOS_GLOBAL_COORDINATION_KEY_ID" == 'legacy-v1' ]]; then
            custody_secret="${SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY:-$SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET}"
          else
            [[ -n "$SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY" ]] || {
              echo 'Explicit active coordination key custody is unavailable.' >&2
              exit 78
            }
            custody_secret="$SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY"
          fi
          [[ -n "$custody_secret" ]] || {
            echo 'GitHub coordination secret custody is unavailable.' >&2
            exit 78
          }
          {
            printf '%s\n' "$SKINCOS_GLOBAL_COORDINATOR_URL"
            printf '%s\n' "$custody_secret"
            printf '%s\n' "$SKINCOS_GLOBAL_COORDINATION_KEY_ID"
          } | sudo -n /usr/local/sbin/skincos-provision-global-coordination write
          unset custody_secret
          sudo -n /usr/local/sbin/skincos-provision-global-coordination audit

      - name: Release global custody lease
        if: always() && steps.acquire.outcome == 'success'
        uses: ./.github/actions/global-coordination-release
        with:
          required: 'true'
          coordinator_url: ${{ vars.SKINCOS_GLOBAL_COORDINATOR_PRODUCTION_URL }}
          shared_secret: ${{ secrets.SKINCOS_GLOBAL_COORDINATION_ACTIVE_KEY || secrets.SKINCOS_GLOBAL_COORDINATION_SHARED_SECRET }}
          key_id: ${{ vars.SKINCOS_GLOBAL_COORDINATION_KEY_ID || 'legacy-v1' }}
          proof_file: ${{ runner.temp }}/skincos-global-custody.json
