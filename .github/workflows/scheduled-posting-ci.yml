name: Scheduled Posting CI/CD Pipeline

on:
  schedule:
    - cron: '0 8 * * *'  # Executa todos os dias às 8:00 UTC
  workflow_dispatch:      # Permite execução manual
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'           # Ignora atualizações em arquivos markdown
      - '.vscode/**'      # Ignora arquivos de configuração do VS Code

jobs:
  diagnose:
    runs-on: ubuntu-latest
    name: Run System Diagnostics
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f automations/scheduled_posting/requirements.txt ]; then pip install -r automations/scheduled_posting/requirements.txt; fi

      - name: Run diagnostic tests
        run: |
          python -m apps.automations.scheduled_posting --mode diagnose
        # GITHUB_TOKEN é automaticamente injetado pelo GitHub Actions
        # e será detectado pelo código atualizado

  test:
    runs-on: ubuntu-latest
    name: Run Test Mode
    needs: diagnose
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f automations/scheduled_posting/requirements.txt ]; then pip install -r automations/scheduled_posting/requirements.txt; fi

      - name: Run test mode
        run: |
          python -m apps.automations.scheduled_posting --mode test
        # GITHUB_TOKEN é automaticamente injetado pelo GitHub Actions

