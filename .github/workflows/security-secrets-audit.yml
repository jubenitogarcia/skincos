name: Security & Secrets Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Scan for secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}

  npm-audit:
    name: Dependency Audit (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM audit (root + frontend, best-effort)
        run: |
          set -euxo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --omit=dev
            npm audit --omit=dev --audit-level=high
          fi
          if [ -f frontend/package-lock.json ]; then
            (cd frontend && npm ci --omit=dev && npm audit --omit=dev --audit-level=high)
          fi

      - name: pnpm audit (backend workspace, prod deps)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm -C backend audit --prod --audit-level high

  pip-audit:
    name: Pip Audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Find and audit all requirements.txt
        run: |
          set -euxo pipefail
          mapfile -t REQS < <(git ls-files | grep -E '(^|/)requirements.txt$')
          for r in "${REQS[@]}"; do
            dir=$(dirname "$r")
            echo "Auditing $dir..."
            out="pip-audit-$(echo "$r" | tr '/.' '__').json"
            # pip-audit CLI flags vary across versions; keep this best-effort and upload artifacts.
            python -m pip_audit -r "$r" -f json -o "$out" || true
          done
      - name: Upload pip-audit reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit-*.json

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit
      - name: Run Bandit
        run: |
          set -euxo pipefail
          bandit -r backend/config backend/libs backend/archive/tools/repo_checks -f json -o bandit.json --severity-level high --confidence-level high
      - name: Upload Bandit report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit
          path: bandit.json

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          entryPoint: semgrep
          args: scan --config auto --sarif --output semgrep.sarif
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload Semgrep SARIF
        if: ${{ hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
