name: Security & Secrets Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Scan for secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
        with:
          args: "detect --source . --no-git --redact --report-format sarif --report-path gitleaks.sarif || exit 1"
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  npm-audit:
    name: Dependency Audit (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM audit (root + frontend, best-effort)
        run: |
          set -euxo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high || true
          fi
          if [ -f frontend/package-lock.json ]; then
            (cd frontend && npm ci && npm audit --audit-level=high) || true
          fi

      - name: pnpm audit (backend workspace, best-effort)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm -C backend audit --audit-level high || true

  pip-audit:
    name: Pip Audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Find and audit all requirements.txt
        run: |
          set -euxo pipefail
          mapfile -t REQS < <(git ls-files | grep -E '(^|/)requirements.txt$')
          for r in "${REQS[@]}"; do
            dir=$(dirname "$r")
            echo "Auditing $dir..."
            python -m pip-audit -r "$r" || true
          done
