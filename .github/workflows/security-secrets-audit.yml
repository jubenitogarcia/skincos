name: Security & Secrets Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Scan for secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
        with:
          args: "detect --source . --no-git --redact --report-format sarif --report-path gitleaks.sarif || exit 1"
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  npm-audit:
    name: NPM Audit (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and audit all JS/TS projects
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            echo "Auditing $dir..."
            if [ -f "$dir/package-lock.json" ] || [ -f "$dir/pnpm-lock.yaml" ] || [ -f "$dir/yarn.lock" ]; then
              (cd "$dir" && npm audit --audit-level=high || true)
            fi
          done

  pip-audit:
    name: Pip Audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Find and audit all requirements.txt
        run: |
          set -euxo pipefail
          mapfile -t REQS < <(git ls-files | grep -E '(^|/)requirements.txt$')
          for r in "${REQS[@]}"; do
            dir=$(dirname "$r")
            echo "Auditing $dir..."
            python -m pip-audit -r "$r" || true
          done
