name: Security & Secrets Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional ancestor SHA used to produce the risk report
        required: false
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scope:
    name: Classify security audit scope
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      risk: ${{ steps.scope.outputs.risk }}
      sensitive_path_changed: ${{ steps.scope.outputs.sensitive_path_changed }}
      full_scan: ${{ steps.scope.outputs.full_scan }}
      npm_audit: ${{ steps.scope.outputs.npm_audit }}
      trivy: ${{ steps.scope.outputs.trivy }}
      pip_audit: ${{ steps.scope.outputs.pip_audit }}
      bandit: ${{ steps.scope.outputs.bandit }}
      semgrep: ${{ steps.scope.outputs.semgrep }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha || github.sha }}
        run: node .github/scripts/resolve-codex-autonomy-base.mjs
      - id: risk
        run: node scripts/codex-risk-classifier.mjs --base "${{ steps.base.outputs.sha }}" --head "$GITHUB_SHA" --output risk-report.json
      - id: changed
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACDMRT "$BASE_SHA...$GITHUB_SHA" > changed-files.txt
      - id: scope
        run: |
          set -euo pipefail
          node .github/scripts/security-secrets-audit-scope.mjs \
            --event "$GITHUB_EVENT_NAME" \
            --risk-report risk-report.json \
            --changed-files changed-files.txt \
            --output security-audit-scope.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-scope-${{ github.run_id }}
          path: |
            risk-report.json
            security-audit-scope.json
            changed-files.txt
          retention-days: 30

  gitleaks:
    name: Scan for secrets (Gitleaks)
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The pinned action selects base^..head for pull_request events. A
          # complete checkout supplies that base without making the PR scan
          # historical: schedule/dispatch use the action's full scan path.
          fetch-depth: 0
      - name: Run Gitleaks (PR diff-aware; full elsewhere)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Run full Gitleaks history scan for broad-risk PRs and main
        if: ${{ needs.scope.outputs.full_scan == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        run: gitleaks git --redact --exit-code=2 --config .gitleaks.toml --log-opts="--all" .

  npm-audit:
    name: Dependency Audit (JS/TS)
    needs: scope
    if: ${{ needs.scope.outputs.npm_audit == 'true' || needs.scope.outputs.trivy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        if: ${{ needs.scope.outputs.npm_audit == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"

      - name: NPM audit (root + frontend + website + timekeeping lockfiles)
        if: ${{ needs.scope.outputs.npm_audit == 'true' }}
        run: |
          set -euxo pipefail
          if [ -f package-lock.json ]; then
            node .github/scripts/npm-audit-gate.mjs .
          fi
          if [ -f crm/console/package-lock.json ]; then
              node .github/scripts/npm-audit-gate.mjs crm/console
          fi
          if [ -f website/package-lock.json ]; then
            node .github/scripts/npm-audit-gate.mjs website
          fi
          if [ -f workforce/timekeeping/package-lock.json ]; then
            node .github/scripts/npm-audit-gate.mjs workforce/timekeeping
          fi

      - name: Audit backend production lockfile with Trivy
        if: ${{ needs.scope.outputs.trivy == 'true' && hashFiles('backend/pnpm-lock.yaml') != '' }}
        # pnpm audit calls the retired npm audit endpoint (HTTP 410).  Trivy
        # consumes the committed lockfile and its maintained advisory database
        # instead; high and critical production findings remain merge-blocking.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/pnpm-lock.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

  pip-audit:
    name: Pip Audit (Python)
    needs: scope
    if: ${{ needs.scope.outputs.pip_audit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Semgrep bundles a native semgrep-core executable. Pin a supported
          # Python minor instead of following 3.x to a newly released runtime
          # before the wheel bundle is available for it.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pip-audit
      - name: Enforce pip-audit policy and audit requirements
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          VULN_EXCEPTIONS_FILE=".github/security/pip-audit-vuln-exceptions.csv"
          PATH_EXCEPTIONS_FILE=".github/security/pip-audit-path-exceptions.csv"
          declare -a IGNORE_ARGS=()
          declare -a SKIP_PATHS=()

          validate_not_expired() {
            local kind="$1"
            local key="$2"
            local expires="$3"
            if [[ ! "$expires" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Invalid ${kind} exception expiry for '${key}': '${expires}' (expected YYYY-MM-DD)."
              exit 1
            fi
            if [[ "$expires" < "$TODAY" ]]; then
              echo "::error::Expired ${kind} exception for '${key}' (expired ${expires}, today ${TODAY})."
              exit 1
            fi
          }

          if [[ -f "$VULN_EXCEPTIONS_FILE" ]]; then
            while IFS=, read -r vuln_id expires_on reason; do
              vuln_id="$(echo "${vuln_id:-}" | xargs)"
              expires_on="$(echo "${expires_on:-}" | xargs)"
              reason="$(echo "${reason:-}" | xargs)"
              [[ -z "$vuln_id" || "$vuln_id" =~ ^# ]] && continue
              validate_not_expired "vulnerability" "$vuln_id" "$expires_on"
              echo "Allowing vulnerability exception ${vuln_id} until ${expires_on} (${reason:-no-reason})"
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < "$VULN_EXCEPTIONS_FILE"
          fi

          if [[ -f "$PATH_EXCEPTIONS_FILE" ]]; then
            while IFS=, read -r req_path expires_on reason; do
              req_path="$(echo "${req_path:-}" | xargs)"
              expires_on="$(echo "${expires_on:-}" | xargs)"
              reason="$(echo "${reason:-}" | xargs)"
              [[ -z "$req_path" || "$req_path" =~ ^# ]] && continue
              validate_not_expired "path" "$req_path" "$expires_on"
              echo "Allowing path exception ${req_path} until ${expires_on} (${reason:-no-reason})"
              SKIP_PATHS+=("$req_path")
            done < "$PATH_EXCEPTIONS_FILE"
          fi

          mapfile -t REQS < <(git ls-files | grep -E '(^|/)requirements\.txt$|(^|/)requirements\.unified\.txt$')
          if [[ "${#REQS[@]}" -eq 0 ]]; then
            echo "::error::No requirements files found for pip-audit."
            exit 1
          fi

          fail=0
          for r in "${REQS[@]}"; do
            dir=$(dirname "$r")
            skip=0
            for s in "${SKIP_PATHS[@]}"; do
              if [[ "$r" == "$s" ]]; then
                skip=1
                break
              fi
            done
            if [[ "$skip" -eq 1 ]]; then
              echo "::warning::Skipping pip-audit for ${r} due to active path exception."
              continue
            fi
            echo "Auditing $dir..."
            out="pip-audit-$(echo "$r" | tr '/.' '__').json"
            if ! python -m pip_audit -r "$r" -f json -o "$out" "${IGNORE_ARGS[@]}"; then
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::pip-audit failed. Resolve vulnerabilities or add time-bounded exceptions."
            exit 1
          fi
      - name: Upload pip-audit reports (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit
          path: pip-audit-*.json

  bandit:
    name: Bandit (Python SAST)
    needs: scope
    if: ${{ needs.scope.outputs.bandit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit
      - name: Run Bandit and enforce exceptions policy
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          EXCEPTIONS_FILE=".github/security/bandit-exceptions.csv"

          # Always emit report, then enforce policy from exceptions file. PRs
          # use only changed Python files; full scans are reserved for main,
          # schedule, dispatch, and high/critical or sensitive paths.
          if [[ "${{ needs.scope.outputs.full_scan }}" == "true" ]]; then
            bandit -r backend/config backend/libs backend/apps/automations/sales_chart_messenger backend/tools/scripts backend/apps/agent-zero -x backend/tools/scripts/xiaomi,backend/archive -f json -o bandit.json --severity-level high --confidence-level high || true
          else
            mapfile -t TARGETS < <(git diff --name-only --diff-filter=ACMRT "${{ needs.scope.outputs.base_sha }}...$GITHUB_SHA" -- '*.py')
            [[ "${#TARGETS[@]}" -gt 0 ]] || { echo 'No changed Python sources; Bandit is not applicable.'; exit 0; }
            bandit "${TARGETS[@]}" -f json -o bandit.json --severity-level high --confidence-level high || true
          fi

          python - <<'PY'
          import csv
          import json
          import os
          import sys
          from datetime import date

          today = date.today().isoformat()
          exceptions_file = ".github/security/bandit-exceptions.csv"

          allowed = set()
          if os.path.exists(exceptions_file):
            with open(exceptions_file, newline="", encoding="utf-8") as fh:
              for row in csv.reader(fh):
                if not row:
                  continue
                raw0 = (row[0] if len(row) > 0 else "").strip()
                if not raw0 or raw0.startswith("#"):
                  continue
                if len(row) < 3:
                  print(f"::error::Invalid bandit exception row (expected filename,test_id,expires_on[,reason]): {row}")
                  sys.exit(1)
                filename = raw0
                test_id = row[1].strip()
                expires_on = row[2].strip()
                if len(expires_on) != 10 or expires_on[4] != "-" or expires_on[7] != "-":
                  print(f"::error::Invalid bandit exception expiry for {filename}:{test_id}: {expires_on}")
                  sys.exit(1)
                if expires_on < today:
                  print(f"::error::Expired bandit exception for {filename}:{test_id} (expired {expires_on}, today {today})")
                  sys.exit(1)
                allowed.add((filename, test_id))

          with open("bandit.json", encoding="utf-8") as fh:
            data = json.load(fh)

          unresolved = []
          for issue in data.get("results", []):
            filename = str(issue.get("filename", "")).strip()
            test_id = str(issue.get("test_id", "")).strip()
            key = (filename, test_id)
            if key in allowed:
              continue
            unresolved.append(issue)

          if unresolved:
            print("::error::Bandit found unresolved HIGH/HIGH issues.")
            for issue in unresolved:
              filename = issue.get("filename", "")
              line = issue.get("line_number", "")
              test_id = issue.get("test_id", "")
              text = issue.get("issue_text", "")
              print(f"- {filename}:{line} {test_id} {text}")
            sys.exit(1)

          print("Bandit policy check passed (all findings resolved or explicitly excepted).")
          PY
      - name: Upload Bandit report (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit
          path: bandit.json

  semgrep:
    name: Semgrep (SAST)
    needs: scope
    if: ${{ needs.scope.outputs.semgrep == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Install Semgrep CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'semgrep>=1.72.0'
      - name: Run Semgrep
        run: |
          set -euo pipefail
          if [[ "${{ needs.scope.outputs.full_scan }}" == "true" ]]; then
            semgrep scan --config auto --sarif --output semgrep.sarif
          else
            mapfile -t TARGETS < <(git diff --name-only --diff-filter=ACMRT "${{ needs.scope.outputs.base_sha }}...$GITHUB_SHA" -- \
              '*.c' '*.cc' '*.cpp' '*.cxx' '*.go' '*.java' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.php' '*.py' '*.rb' '*.rs' '*.swift' '*.ts' '*.tsx')
            [[ "${#TARGETS[@]}" -gt 0 ]] || { echo 'No changed Semgrep-supported sources; Semgrep is not applicable.'; exit 0; }
            semgrep scan --config auto --sarif --output semgrep.sarif "${TARGETS[@]}"
          fi
      - name: Upload Semgrep SARIF
        if: ${{ hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: semgrep.sarif
