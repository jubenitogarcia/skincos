name: Submodule Dirty Check

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Detect dirty submodules
        id: dirty
        run: |
          set -e
          DIRTY=$(git submodule foreach --quiet 'git status --porcelain' | sed '/^$/d' || true)
          echo "dirty<<EOF" >> $GITHUB_OUTPUT
          echo "$DIRTY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Open issue if dirty
        if: ${{ steps.dirty.outputs.dirty != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Submodule(s) appear dirty or out-of-sync with remote.\n\nOutput:\n\n${process.env.DIRTY}\n\nNext steps:\n- Review submodule changes\n- Consider bumping refs and opening a PR\n- Run dev smoke locally`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `Submodule dirty check • ${new Date().toISOString()}`, body });
        env:
          DIRTY: ${{ steps.dirty.outputs.dirty }}
