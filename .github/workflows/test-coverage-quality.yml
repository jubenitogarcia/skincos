name: Test Coverage & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-website-quality:
    name: Frontend & Website Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            crm/console/package-lock.json
            website/package-lock.json

      - name: Frontend install
        if: ${{ hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm ci

      - name: Frontend coverage
        if: ${{ hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run test:coverage

      - name: Website install
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm ci

      - name: Website tests
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run test

      - name: Website typecheck
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run typecheck

  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          cd backend
          python -m pytest tests/unit --cov=config --cov-fail-under=80 --cov-report=xml:coverage.xml --cov-report=term
      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: backend/coverage.xml
