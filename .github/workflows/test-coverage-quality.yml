name: Test Coverage & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-website-quality:
    name: Frontend & Website Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            modules/crm/web/package-lock.json
            modules/site-public/website/package-lock.json

      - name: Frontend install
        if: ${{ hashFiles('modules/crm/web/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd modules/crm/web
          npm ci

      - name: Frontend coverage
        if: ${{ hashFiles('modules/crm/web/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd modules/crm/web
          npm run test:coverage

      - name: Website install
        if: ${{ hashFiles('modules/site-public/website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd modules/site-public/website
          npm ci

      - name: Website tests
        if: ${{ hashFiles('modules/site-public/website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd modules/site-public/website
          npm run test

      - name: Website typecheck
        if: ${{ hashFiles('modules/site-public/website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd modules/site-public/website
          npm run typecheck

  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          cd backend
          python -m pytest tests/unit --cov=config --cov-fail-under=80 --cov-report=xml:coverage.xml --cov-report=term
      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml
