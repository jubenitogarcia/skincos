name: Test Coverage & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  js-ts-coverage:
    name: JS/TS Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Install dependencies (all projects)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package-lock.json" ] || [ -f "$dir/pnpm-lock.yaml" ] || [ -f "$dir/yarn.lock" ]; then
              (cd "$dir" && npm install --no-audit --no-fund)
            fi
          done
      - name: Run coverage (all projects)
        run: |
          set -euxo pipefail
          mapfile -t PKGS < <(git ls-files | grep -E '(^|/)package.json$')
          for p in "${PKGS[@]}"; do
            dir=$(dirname "$p")
            if [ -f "$dir/package-lock.json" ] || [ -f "$dir/pnpm-lock.yaml" ] || [ -f "$dir/yarn.lock" ]; then
              if [ -f "$dir/package.json" ] && jq -e '.scripts["test:coverage"]' "$dir/package.json" >/dev/null; then
                (cd "$dir" && npm run test:coverage || true)
              fi
            fi
          done
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: js-ts-coverage
          path: |
            **/coverage*
            **/coverage.*

  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dev dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          python -m pytest --cov=backend --cov-report=xml --cov-report=term
      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml
