name: Test Coverage & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  js-ts-coverage:
    name: JS/TS Coverage (best-effort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Frontend install
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm ci

      - name: Frontend coverage (if configured)
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd frontend
          npm run test:coverage --if-present

      - name: Setup pnpm (for backend workspace)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Backend workspace install (pnpm)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend install --frozen-lockfile

      - name: Backend coverage (if configured)
        if: ${{ hashFiles('backend/pnpm-lock.yaml') != '' }}
        run: |
          set -euxo pipefail
          pnpm -C backend -r run test:coverage --if-present
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: js-ts-coverage
          path: |
            **/coverage*
            **/coverage.*

  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          cd backend
          python -m pytest tests/unit --cov=. --cov-fail-under=5 --cov-report=xml:coverage.xml --cov-report=term
      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml
