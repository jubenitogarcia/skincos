name: Test Coverage & Quality

on:
  push:
    branches: [main]
    paths:
      - "crm/console/**"
      - "website/**"
      - "booking/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-coverage-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "crm/console/**"
      - "website/**"
      - "booking/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-coverage-quality.yml"
  workflow_dispatch:

jobs:
  changes:
    name: Classify coverage surface
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      python: ${{ steps.scope.outputs.python }}
      workflow: ${{ steps.scope.outputs.workflow }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - id: bounded-diff
        name: Prepare bounded immutable diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/codex-bounded-diff.mjs --base "${PR_BASE_SHA:-$BEFORE_SHA}" --head "${PR_HEAD_SHA:-$HEAD_SHA}" --output "$GITHUB_OUTPUT"
      - id: scope
        env:
          BOUNDED_BASE_SHA: ${{ steps.bounded-diff.outputs.base }}
          BOUNDED_HEAD_SHA: ${{ steps.bounded-diff.outputs.head }}
        run: |
          set -euo pipefail
          base="$BOUNDED_BASE_SHA"
          head="$BOUNDED_HEAD_SHA"
          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          changed() {
            if git diff --quiet "$base...$head" -- "$@"; then printf false; else printf true; fi
          }
          echo "frontend=$(changed crm/console website booking package.json package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "python=$(changed backend)" >> "$GITHUB_OUTPUT"
          echo "workflow=$(changed .github/workflows/test-coverage-quality.yml)" >> "$GITHUB_OUTPUT"

  frontend-website-quality:
    name: Frontend & Website Coverage
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            crm/console/package-lock.json
            website/package-lock.json

      - name: Frontend install
        if: ${{ hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm ci

      - name: Frontend coverage
        if: ${{ hashFiles('crm/console/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd crm/console
          npm run test:coverage

      - name: Website install
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm ci

      - name: Website tests
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run test

      - name: Website typecheck
        if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: |
          set -euxo pipefail
          cd website
          npm run typecheck

  python-coverage:
    name: Python Coverage
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          cd backend
          python -m pytest tests/unit --cov=config --cov-fail-under=80 --cov-report=xml:coverage.xml --cov-report=term
      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: backend/coverage.xml
