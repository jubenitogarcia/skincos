name: Timekeeping CI

on:
  pull_request:
    paths:
      - 'workforce/timekeeping/**'
      - 'api/**'
      - 'inventory/src/worker.js'
      - 'inventory/tests/releaseHealth.test.mjs'
      - 'inventory/wrangler.toml'
      - 'shared/identity-runtime/**'
      - 'shared/module-availability/**'
      - 'crm/console/functions/api/ponto/**'
      - 'crm/console/PontoModule.tsx'
      - 'crm/console/crmRoleAccess.ts'
      - 'crm/console/moduleAvailability.ts'
      - 'crm/console/pontoApi.ts'
      - 'crm/console/pontoTypes.ts'
      - 'crm/console/tests/ponto*.test.ts'
      - 'crm/console/tests/crmRoleAccess.test.ts'
      - 'crm/console/tests/moduleRegistry.test.ts'
      - 'crm/console/scripts/ponto-staging-journey.cjs'
      - 'workforce/timekeeping/scripts/ponto-staging-journey-fixtures.mjs'
      - '.github/workflows/timekeeping-staging-journey.yml'
      - '.github/workflows/deploy-timekeeping.yml'
      - '.github/workflows/deploy-core-workers.yml'
      - '.github/workflows/deploy-crm-pages.yml'
      - '.github/workflows/module-availability.yml'
      - '.github/workflows/ponto-*.yml'
      - '.github/scripts/ponto-*.mjs'
      - 'scripts/bootstrap-ponto-jit-runner.ps1'
      - 'scripts/runtime/install-ponto-jit-runner.sh'
      - 'scripts/runtime/ponto-jit-*.mjs'
      - 'scripts/runtime/provision-ponto-jit-custody.sh'
      - 'scripts/tests/ponto-jit-custody-runner.test.mjs'
      - 'ops/runtime/github-actions-runner/ponto-jit-*.sh'
      - 'ops/runtime/github-actions-runner/skincos-native-custody.sudoers'
      - 'ops/runtime/units/skincos-ponto-jit-runner.service'
      - 'ops/runtime/units/skincos-ponto-jit-credential-cleanup.service'
      - 'ops/runtime/units/skincos-ponto-jit-credential-cleanup.timer'
      - 'ops/runtime/units/skincos-native-custody-runner.service'
      - '.github/governance/progressive-release-policy.json'
      - 'platform/deploy/operational-units.json'
      - '.github/workflows/timekeeping-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workforce/timekeeping/**'
      - 'api/**'
      - 'inventory/src/worker.js'
      - 'inventory/tests/releaseHealth.test.mjs'
      - 'inventory/wrangler.toml'
      - 'shared/identity-runtime/**'
      - 'shared/module-availability/**'
      - 'crm/console/functions/api/ponto/**'
      - 'crm/console/PontoModule.tsx'
      - 'crm/console/crmRoleAccess.ts'
      - 'crm/console/moduleAvailability.ts'
      - 'crm/console/pontoApi.ts'
      - 'crm/console/pontoTypes.ts'
      - 'crm/console/tests/ponto*.test.ts'
      - 'crm/console/tests/crmRoleAccess.test.ts'
      - 'crm/console/tests/moduleRegistry.test.ts'
      - 'crm/console/scripts/ponto-staging-journey.cjs'
      - 'workforce/timekeeping/scripts/ponto-staging-journey-fixtures.mjs'
      - '.github/workflows/timekeeping-staging-journey.yml'
      - '.github/workflows/deploy-timekeeping.yml'
      - '.github/workflows/deploy-core-workers.yml'
      - '.github/workflows/deploy-crm-pages.yml'
      - '.github/workflows/module-availability.yml'
      - '.github/workflows/ponto-*.yml'
      - '.github/scripts/ponto-*.mjs'
      - 'scripts/bootstrap-ponto-jit-runner.ps1'
      - 'scripts/runtime/install-ponto-jit-runner.sh'
      - 'scripts/runtime/ponto-jit-*.mjs'
      - 'scripts/runtime/provision-ponto-jit-custody.sh'
      - 'scripts/tests/ponto-jit-custody-runner.test.mjs'
      - 'ops/runtime/github-actions-runner/ponto-jit-*.sh'
      - 'ops/runtime/github-actions-runner/skincos-native-custody.sudoers'
      - 'ops/runtime/units/skincos-ponto-jit-runner.service'
      - 'ops/runtime/units/skincos-ponto-jit-credential-cleanup.service'
      - 'ops/runtime/units/skincos-ponto-jit-credential-cleanup.timer'
      - 'ops/runtime/units/skincos-native-custody-runner.service'
      - '.github/governance/progressive-release-policy.json'
      - 'platform/deploy/operational-units.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          # node:sqlite is required by the migration rollback test.
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            workforce/timekeeping/package-lock.json
            api/package-lock.json
            inventory/pnpm-lock.yaml
            crm/console/package-lock.json
      - name: Install pinned Timekeeping toolchain
        run: npm --prefix workforce/timekeeping ci --ignore-scripts
      - name: Test Timekeeping domain
        run: npm --prefix workforce/timekeeping test
      - name: Apply Timekeeping migrations locally
        working-directory: workforce/timekeeping
        run: ./node_modules/.bin/wrangler d1 migrations apply skincos-timekeeping --local --config wrangler.toml
      - name: Validate legacy JSON importer
        run: |
          node workforce/timekeeping/scripts/import-ponto-json.mjs --source workforce/timekeeping/fixtures/ponto_store.synthetic.json --dry-run
          node workforce/timekeeping/scripts/migration-local.test.mjs
      - name: Validate synthetic staging fixture contract
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/ponto-staging-fixtures.json"
          core_sql="$RUNNER_TEMP/ponto-staging-core.sql"
          timekeeping_sql="$RUNNER_TEMP/ponto-staging-timekeeping.sql"
          teardown_core="$RUNNER_TEMP/ponto-staging-core-teardown.sql"
          teardown_timekeeping="$RUNNER_TEMP/ponto-staging-timekeeping-teardown.sql"
          node workforce/timekeeping/scripts/ponto-staging-journey-fixtures.mjs --action provision --run-id 123456 --fixtures "$fixtures" --core-sql "$core_sql" --timekeeping-sql "$timekeeping_sql"
          node -e "const fs=require('fs');const f=JSON.parse(fs.readFileSync(process.argv[1]));const core=fs.readFileSync(process.argv[2],'utf8');const timekeeping=fs.readFileSync(process.argv[3],'utf8');if(f.environment!=='staging'||f.role!=='CONSULTOR'||f.allowedModules.join(',')!=='atendimento,ponto'||!f.pin||!f.password||!core.includes('STAGING_SYNTHETIC')||core.includes(f.password)||core.includes(f.pin)||timekeeping.includes(f.password)||timekeeping.includes(f.pin))process.exit(1)" "$fixtures" "$core_sql" "$timekeeping_sql"
          node workforce/timekeeping/scripts/ponto-staging-journey-fixtures.mjs --action teardown --run-id 123456 --fixtures "$fixtures" --core-sql "$teardown_core" --timekeeping-sql "$teardown_timekeeping"
          node -e "const fs=require('fs');const core=fs.readFileSync(process.argv[1],'utf8');const timekeeping=fs.readFileSync(process.argv[2],'utf8');if(!core.includes('STAGING_SYNTHETIC')||timekeeping.includes('DELETE FROM timekeeping_audit_events'))process.exit(1)" "$teardown_core" "$teardown_timekeeping"
          rm -f "$fixtures" "$core_sql" "$timekeeping_sql" "$teardown_core" "$teardown_timekeeping"
      - name: Test gateway routing
        run: |
          set -euo pipefail
          npm --prefix api ci --ignore-scripts
          (cd inventory && corepack pnpm install --frozen-lockfile --ignore-scripts)
          npm --prefix api test
          api/node_modules/.bin/wrangler deploy --dry-run --config api/wrangler.toml --env="" --outdir "$RUNNER_TEMP/api-dry-run"
          api/node_modules/.bin/wrangler deploy --dry-run --config api/wrangler.ponto.toml --env="" --outdir "$RUNNER_TEMP/ponto-core-dry-run"
          api/node_modules/.bin/wrangler deploy --dry-run --config api/wrangler.ponto.toml --env staging --outdir "$RUNNER_TEMP/ponto-core-staging-dry-run"
      - name: Test governed Ponto release contracts
        run: |
          set -euo pipefail
          node --test \
            .github/scripts/ponto-*.test.mjs \
            scripts/tests/ponto-jit-custody-runner.test.mjs \
            workforce/timekeeping/scripts/ponto-staging-journey-fixtures.test.mjs \
            shared/identity-runtime/workforce-onboarding.test.mjs \
            inventory/tests/releaseHealth.test.mjs
          for script in .github/scripts/ponto-*.mjs scripts/runtime/ponto-jit-*.mjs; do node --check "$script"; done
          bash -n scripts/runtime/install-ponto-jit-runner.sh
          bash -n scripts/runtime/provision-ponto-jit-custody.sh
          bash -n ops/runtime/github-actions-runner/ponto-jit-before-job.sh
          bash -n ops/runtime/github-actions-runner/ponto-jit-after-job.sh
          node .github/scripts/validate-progressive-release.mjs
      - name: Typecheck and test CRM proxy
        run: |
          set -euo pipefail
          npm --prefix crm/console ci
          npm --prefix crm/console run typecheck
          npm --prefix crm/console run lint
          npm --prefix crm/console test
          npm --prefix crm/console run build
          if PONTO_STAGING_CRM_URL='https://user@candidate.skincos-staging.pages.dev/' node crm/console/scripts/ponto-staging-journey.cjs 2>/dev/null; then
            echo 'Ponto staging journey accepted an origin with userinfo.' >&2
            exit 1
          fi
