name: Ponto UX/UI Infrastructure (informative)

on:
  pull_request:
    paths:
      - 'workforce/ponto-pages/**'
      - '.github/workflows/ux-ui-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux-ui-baseline:
    name: Ponto UX/UI baseline (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workforce/ponto-pages/package-lock.json
      - name: Install local audit dependencies
        run: |
          set -euxo pipefail
          npm --prefix workforce/ponto-pages ci
      - name: Run component, journey, accessibility and visual baselines
        env:
          PLAYWRIGHT_KEEP_ARTIFACTS: '1'
          A11Y_ENFORCE: '0'
        run: |
          set -euxo pipefail
          npm --prefix workforce/ponto-pages run test
      - name: Build Storybook states and accessibility addon
        run: |
          set -euxo pipefail
          npm --prefix workforce/ponto-pages run build
      - name: Upload UX/UI artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-ui-baseline-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
