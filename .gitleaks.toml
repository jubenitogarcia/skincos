title = "skincos gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore legacy/vendor/docs artifacts that trip default rules (e.g., curl examples, rule catalogs)."
paths = [
  '''^agent-zero-module/''',
  '''^attached_assets/''',
  '''^backend/apps/automations/sprinta/legacy/''',
  '''^backend/apps/agent-zero/''',
  '''^backend/archive/tools/semgrep/semgrep_rules\.json$''',
  '''^social/instagram/instagrapi/''',
  '''^inventory/\.dev\.vars\.example$''',
  '''^backend/apps/meta-ads/apps/api/README\.md$''',
  '''^backend/apps/whatsapp/gateway/agent_zero_webhook_server\.py$''',
  '''^comprehensive-crm-so/''',
  '''^frontend/CameraDiscovery\.tsx$''',
  '''^messaging/channels/whatsapp/engine/\.env\.example$''',
  '''^messaging/channels/whatsapp/evolution-api/(GUIA-RAPIDO|MIGRATION|SUCESSO-INSTALACAO)\.md$''',
  '''^messaging/channels/whatsapp/engine/(GUIA-RAPIDO|MIGRATION|SUCESSO-INSTALACAO)\.md$''',
  '''^whatsapp-official-module/''',
  '''^\.config/\.semgrep/''',
]
regexTarget = "secret"
regexes = [
  # Exact non-secret, temporary Pages fence project names captured in the
  # Ponto replay-containment ledgers. The Cloudflare default rule otherwise
  # mistakes these public resource names for API keys.
  '''^skincos-ponto-fenced-(production|staging)-20260730$''',
]
