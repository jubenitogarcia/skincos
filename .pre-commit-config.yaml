# Pre-commit hooks for code quality
repos:
  # Python formatting
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
        args:
          - --max-line-length=88
          - --extend-ignore=E203,W503,D100,D101,D102,D103,D104,D105,D106,D107

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.6.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-python-dateutil]
        args: [--strict, --ignore-missing-imports]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: requirements-txt-fixer

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-r', '.', '-f', 'json', '-o', 'bandit-report.json']
        exclude: ^(tests/|venv/|env/)

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        files: \.(yaml|yml|json|md)$
        exclude: ^(\.github/|package-lock\.json)

  - repo: local
    hooks:
      - id: frontend-lint-changed
        name: Frontend lint (changed files)
        entry: bash -lc 'if printf "%s\n" "$@" | grep -q "^frontend/"; then cd frontend && npm run lint; else echo "frontend lint skipped"; fi' --
        language: system
        pass_filenames: true
        files: ^frontend/.*\.(ts|tsx)$
      - id: website-lint-changed
        name: Website lint (changed files)
        entry: bash -lc 'if printf "%s\n" "$@" | grep -q "^modules/site-public/website/"; then cd modules/site-public/website && npm run lint; else echo "website lint skipped"; fi' --
        language: system
        pass_filenames: true
        files: ^modules/site-public/website/.*\.(ts|tsx|js|jsx)$
      - id: frontend-tests-pre-push
        name: Frontend tests (pre-push)
        entry: bash -lc 'cd frontend && npm run test && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: website-tests-pre-push
        name: Website tests (pre-push)
        entry: bash -lc 'cd modules/site-public/website && npm run test && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: crm-api-tests-pre-push
        name: CRM API tests (pre-push)
        entry: bash -lc 'cd backend/apps/crm-api && npm test'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: python-unit-tests-pre-push
        name: Python unit tests (pre-push)
        entry: bash -lc 'cd backend && python -m pytest tests/unit --cov=config --cov-fail-under=80'
        language: system
        pass_filenames: false
        stages: [pre-push]
