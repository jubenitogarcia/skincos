name = "skincos-ponto-core"
main = "workers/ponto.js"
compatibility_date = "2024-11-20"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
APP_VERSION = "unreleased"
ENVIRONMENT = "production"
PONTO_ROUTE_ONLY = "true"

[[services]]
binding = "TIMEKEEPING"
service = "skincos-timekeeping"

[env.staging]
name = "skincos-ponto-core-staging"
workers_dev = false
preview_urls = false

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.vars]
APP_VERSION = "unreleased"
ENVIRONMENT = "staging"
PONTO_ROUTE_ONLY = "true"

[[env.staging.services]]
binding = "TIMEKEEPING"
service = "skincos-timekeeping-staging"
