name = "skincos-api"
main = "workers/index.js"
compatibility_date = "2024-11-20"
routes = ["api.skincos.com.br/*"]
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
APP_VERSION = "unreleased"
ENVIRONMENT = "production"
# The private production CRM bindings remain inert until the independent
# Worker, exact signed receipt, caller custody and legacy-retirement gates are
# verified externally. These defaults keep a deployed binding fail-closed.
CRM_CORE_PRODUCTION_ENABLED = "false"
CRM_IDENTITY_ISSUER_CALLER_ENABLED = "false"
CRM_IDENTITY_ISSUER_CALLER_ID = "crm-api-production-v1"

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "JOB_QUEUE"
class_name = "JobQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JobQueue"]

[[d1_databases]]
binding = "DB"
database_name = "skincos-db"
database_id = "13e59612-99ba-450e-9014-ddefbee72965"

[[services]]
binding = "INVENTORY"
service = "skincos-insumos"

[[services]]
binding = "INVENTORY_LEGACY_JOBS"
service = "skincos-insumos"
entrypoint = "InventoryLegacyJobsEntrypoint"

[[services]]
binding = "TIMEKEEPING"
service = "skincos-timekeeping"

[[services]]
binding = "FINANCE"
service = "skincos-finance"

# The public gateway is the sole production Core caller. This binding creates
# no public route, and no receipt, key ring or HMAC value is stored in Git.
[[services]]
binding = "CRM_CORE"
service = "skincos-crm-core"

# Do not add a production IDENTITY_CRM_ISSUER binding here yet. Wrangler
# resolves service targets at upload even with CRM flags disabled, so normal
# API releases would fail before the isolated Identity Worker has an immutable
# deployed version. A source-pinned cutover candidate may add this binding only
# after the private production Identity target and rollback version are proved;
# its individual requests must still use the receipt-bound version override.

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "skincos-backups"

[env.staging]
name = "skincos-api-staging"
routes = ["api-staging.skincos.com.br/*"]
workers_dev = false
preview_urls = false

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.vars]
APP_VERSION = "unreleased"
ENVIRONMENT = "staging"
# The persistent Identity caller remains off until a source-pinned staging
# release enables both sides and provisions its separate HMAC through the
# protected bootstrap. Production has a separate default-off caller profile.
CRM_IDENTITY_ISSUER_CALLER_ENABLED = "false"
CRM_IDENTITY_ISSUER_CALLER_ID = "crm-api-staging-v1"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.durable_objects.bindings]]
name = "JOB_QUEUE"
class_name = "JobQueue"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "skincos-db-staging"
database_id = "4bdd7995-ad69-465a-917c-0aab22db5c4e"

[[env.staging.services]]
binding = "INVENTORY"
service = "skincos-insumos-staging"

[[env.staging.services]]
binding = "INVENTORY_LEGACY_JOBS"
service = "skincos-insumos-staging"
entrypoint = "InventoryLegacyJobsEntrypoint"

[[env.staging.services]]
binding = "TIMEKEEPING"
service = "skincos-timekeeping-staging"

[[env.staging.services]]
binding = "FINANCE"
service = "skincos-finance-staging"

# CRM Core is an isolated staging service. The production counterpart is also
# default-off and requires its own exact signed receipt before any request is
# forwarded.
[[env.staging.services]]
binding = "CRM_CORE"
service = "skincos-crm-core-staging"

# Identity signs the one GET /crm/session capability through a private staging
# binding. The browser never supplies an envelope and no production API worker
# gets this binding. Provision CRM_IDENTITY_ISSUER_CALLER_HMAC only through the
# protected staging secret bootstrap; it is intentionally absent from Git.
[[env.staging.services]]
binding = "IDENTITY_CRM_ISSUER"
service = "skincos-identity-crm-delivery-staging"

[[env.staging.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "skincos-backups-staging"

# IMPORTANT:
# - Production vars/secrets should live in Cloudflare Dashboard.
# - Deploy uses `--keep-vars` to avoid overwriting production configuration.
