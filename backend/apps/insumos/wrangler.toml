name = "skincos-insumos"
main = "workers/index.js"
compatibility_date = "2024-11-20"
routes = ["api.skincos.com.br/insumos/*"]

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "JOB_QUEUE"
class_name = "JobQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JobQueue"]

[[d1_databases]]
binding = "DB"
database_name = "skincos-db"
database_id = "13e59612-99ba-450e-9014-ddefbee72965"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "skincos-backups"

[vars]
APP_ORIGIN = "https://crm.skincos.com.br"
INSUMOS_STORAGE = "d1"
SHEET_RANGE = "Insumos!A:AZ"
USER_SHEET_RANGE = "Usuarios!A:AZ"
MOVIMENTACOES_RANGE = "Movimentacoes!A:AZ"

[env.staging]
name = "skincos-insumos-staging"
routes = ["api-staging.skincos.com.br/insumos/*"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "skincos-db-staging"
database_id = "REPLACE_ME"

[[env.staging.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "skincos-backups-staging"

[env.staging.vars]
APP_ORIGIN = "https://crm-staging.skincos.com.br"
INSUMOS_STORAGE = "d1"
SHEET_RANGE = "Insumos!A:AZ"
USER_SHEET_RANGE = "Usuarios!A:AZ"
MOVIMENTACOES_RANGE = "Movimentacoes!A:AZ"

# Optional:
# UNIDADES = "novo-hamburgo,barra-shopping-sul"
# UNIDADES_HEADERS_JSON = "{\"barra-shopping-sul\":\"barrashoppingsul\",\"novo-hamburgo\":\"novo hamburgo\"}"

# IMPORTANT:
# Insumos roda em D1 (INSUMOS_STORAGE=d1).
# Sheets é opcional (apenas para migração/restore legado) e pode ficar desabilitado em produção.
#
# Secrets (set via `wrangler secret put`):
# - SESSION_SECRET (recommended)
# - MIGRATION_TOKEN (optional, one-time)  # permite chamar POST /admin/migrate/sheets-to-d1 sem sessão/CSRF
#
# Optional legacy (Sheets):
# - SPREADSHEET_ID
# - GOOGLE_SERVICE_ACCOUNT_EMAIL
# - GOOGLE_PRIVATE_KEY (secret)
