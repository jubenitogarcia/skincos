name = "skincos-insumos"
main = "workers/index.js"
compatibility_date = "2024-11-20"
routes = ["api.skincos.com.br/insumos/*"]

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "JOB_QUEUE"
class_name = "JobQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JobQueue"]

[[d1_databases]]
binding = "DB"
database_name = "skincos-db"
database_id = "13e59612-99ba-450e-9014-ddefbee72965"

[vars]
APP_ORIGIN = "https://crm.skincos.com.br"
SHEET_RANGE = "Insumos!A:AZ"
USER_SHEET_RANGE = "Usuarios!A:AZ"
MOVIMENTACOES_RANGE = "Movimentacoes!A:AZ"

# Optional:
# UNIDADES = "novo-hamburgo,barra-shopping-sul"
# UNIDADES_HEADERS_JSON = "{\"barra-shopping-sul\":\"barrashoppingsul\",\"novo-hamburgo\":\"novo hamburgo\"}"

# IMPORTANT:
# Production-only vars/secrets should be configured in Cloudflare (Dashboard or `wrangler secret put`)
# and preserved during deploys with `wrangler deploy --keep-vars`:
# - SPREADSHEET_ID
# - SHEET_ID
# - GOOGLE_SERVICE_ACCOUNT_EMAIL
# - GOOGLE_PRIVATE_KEY (secret)
# - SESSION_SECRET (recommended)
#
# Secrets (set via `wrangler secret put`):
# GOOGLE_PRIVATE_KEY = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
