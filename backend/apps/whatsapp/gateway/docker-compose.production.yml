services:
  # API WhatsApp Principal
  whatsapp-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: whatsapp-api-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_PORT=3001
      - DEBUG=1
      - DISPLAY=:99
    volumes:
      - whatsapp_auth_data:/app/.wwebjs_auth
      - whatsapp_temp_videos:/app/temp_videos
      - whatsapp_logs_data:/app/logs
      - whatsapp_public_data:/app/public
    ports:
      - "3001:3001"
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1.5G

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: traefik-proxy
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
      - "--entrypoints.websecure.address=:8443"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8080:8080"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_config_data:/etc/traefik
      - traefik_logs_data:/var/log/traefik
    networks:
      - whatsapp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.whatsapp.rule=Host(`api.localhost`)"
      - "traefik.http.routers.whatsapp.service=whatsapp"
      - "traefik.http.services.whatsapp.loadbalancer.server.port=3001"

  # Watchtower para auto-update
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower-whatsapp
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_DEBUG=true
      - WATCHTOWER_LOG_LEVEL=info
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - whatsapp-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: redis-whatsapp
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx para servir arquivos estáticos
  nginx:
    image: nginx:alpine
    container_name: nginx-whatsapp
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - whatsapp_public_data:/usr/share/nginx/html/public:ro
      - whatsapp_temp_videos:/usr/share/nginx/html/media:ro
    ports:
      - "8090:80"
    networks:
      - whatsapp-network
    depends_on:
      - whatsapp-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(`files.localhost`)"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"

  # Portainer para gerenciamento
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-whatsapp
    restart: unless-stopped
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"
    networks:
      - whatsapp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.localhost`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  # Cloudflare Tunnel (opcional)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN:-dummy}
    networks:
      - whatsapp-network
    depends_on:
      - whatsapp-api
    profiles:
      - tunnel

volumes:
  whatsapp_auth_data:
    driver: local
  whatsapp_temp_videos:
    driver: local
  whatsapp_logs_data:
    driver: local
  whatsapp_public_data:
    driver: local
  traefik_config_data:
    driver: local
  traefik_logs_data:
    driver: local
  redis_data:
    driver: local
  portainer_data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
