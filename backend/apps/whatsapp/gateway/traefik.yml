# Configuração do Traefik para WhatsApp API
# Proxy reverso com SSL automático

api:
  dashboard: true
  insecure: true # Apenas para desenvolvimento, remover em produção

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: whatsapp-network

certificatesResolvers:
  letsencrypt:
    acme:
      tlsChallenge: {}
      email: admin@skincos.com.br # Alterar para seu email
      storage: /letsencrypt/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory

# Logs
log:
  level: INFO
  filePath: "/var/log/traefik.log"

accessLog:
  filePath: "/var/log/access.log"

# Métricas (opcional)
metrics:
  prometheus:
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0
