<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatsApp — QR Code</title>
    <style>
      :root { color-scheme: light; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: linear-gradient(135deg, #25D366, #128C7E);
        min-height: 100vh;
        box-sizing: border-box;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      }
      h1 { margin: 0 0 8px; color: #111; }
      .sub { margin: 0 0 18px; color: #444; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
      .panel { flex: 1 1 320px; border: 1px solid #e7e7e7; border-radius: 14px; padding: 16px; }
      .status { font-weight: 700; margin: 0 0 8px; }
      .muted { color: #555; margin: 0; }
      .qr {
        display: grid;
        place-items: center;
        background: #fafafa;
        border: 2px dashed #25D366;
        border-radius: 14px;
        padding: 16px;
        min-height: 320px;
      }
      .qr img { max-width: 280px; width: 100%; height: auto; border-radius: 12px; background: #fff; padding: 8px; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary { background: #128C7E; color: #fff; }
      button.secondary { background: #f1f3f5; color: #111; }
      code { background: #f1f3f5; padding: 2px 6px; border-radius: 8px; }
      .small { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Conectar WhatsApp</h1>
      <p class="sub">Abra o WhatsApp no celular → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b> e escaneie o QR.</p>

      <div class="row">
        <div class="panel">
          <p class="status" id="statusLine">Carregando status…</p>
          <p class="muted" id="statusDetails">Aguardando resposta do serviço.</p>
          <div class="actions">
            <button class="primary" id="btnRefresh">Recarregar</button>
            <button class="secondary" id="btnStart">Iniciar cliente</button>
          </div>
          <p class="small">
            Endpoints compat: <code>/status</code>, <code>/qr</code>, <code>/qr.html</code>
          </p>
        </div>

        <div class="panel">
          <div class="qr" id="qrBox">
            <div>Carregando QR…</div>
          </div>
          <p class="small" id="qrMeta"></p>
        </div>
      </div>
    </div>

    <script src="/qr.js"></script>
  </body>
</html>
