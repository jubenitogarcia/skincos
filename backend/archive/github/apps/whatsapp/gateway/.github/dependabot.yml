version: 2
updates:
  # Enable version updates for npm dependencies in root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "jubenitogarcia"
    assignees:
      - "jubenitogarcia"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Enable version updates for npm dependencies in WhatsApp API app
  - package-ecosystem: "npm"
    directory: "/apps/whatsapp-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jubenitogarcia"
    assignees:
      - "jubenitogarcia"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # Enable version updates for npm dependencies in shared packages
  - package-ecosystem: "npm"
    directory: "/packages/shared-utils"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jubenitogarcia"
    assignees:
      - "jubenitogarcia"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # Enable version updates for npm dependencies in tools/configs
  - package-ecosystem: "npm"
    directory: "/tools/configs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jubenitogarcia"
    assignees:
      - "jubenitogarcia"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jubenitogarcia"
    assignees:
      - "jubenitogarcia"
    commit-message:
      prefix: "chore(actions):"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"