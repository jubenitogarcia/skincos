name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # Detect changes and set up matrix
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            whatsapp-api:
              - 'apps/whatsapp-api/**'
              - 'packages/**'
              - 'tools/**'
            root:
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  # Install dependencies and cache
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

  # Lint and format check
  lint:
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: ${{ needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node
        
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Run ESLint
        run: pnpm lint
        
      - name: Check formatting
        run: pnpm format --check

  # Type checking
  typecheck:
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: ${{ needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node
        
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Run type checking
        run: pnpm typecheck

  # Run tests
  test:
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: ${{ needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != '' }}
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js and pnpm  
        uses: ./.github/actions/setup-node
        
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Run tests
        run: pnpm test --filter=${{ matrix.package }}
        
      - name: Generate coverage report
        run: pnpm test:coverage --filter=${{ matrix.package }}
        if: matrix.package == 'whatsapp-api'
        
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: matrix.package == 'whatsapp-api'
        with:
          file: ./apps/whatsapp-api/coverage/lcov.info
          fail_ci_if_error: true

  # Build applications
  build:
    runs-on: ubuntu-latest
    needs: [setup, changes, lint, typecheck]
    if: ${{ needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != '' }}
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node
        
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Build
        run: pnpm build --filter=${{ matrix.package }}

  # Docker build and test
  docker:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: contains(needs.changes.outputs.packages, 'whatsapp-api')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/whatsapp-api
          push: false
          tags: whatsapp-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
