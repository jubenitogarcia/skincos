name: Novo Hamburgo Scraper

on:
  schedule:
    # Executa às 19:45 BRT (22:45 UTC) para Novo Hamburgo
    - cron: '45 22 * * *'

  workflow_dispatch:

jobs:
  scraper-novo-hamburgo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f requirements.txt ]; then
            # Corrigir incompatibilidades de versões
            pip install urllib3==1.26.18
            pip install requests==2.31.0
            pip install -r requirements.txt
          fi
      - name: Executar scraper - Novo Hamburgo
        run: python main.py --mode run --unit nh --headless
        env:
          PYTHONUNBUFFERED: 1
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
