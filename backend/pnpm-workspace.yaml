packages:
  # Simple Node apps (no nested workspaces)
  - "apps/api"
  - "apps/insumos"
  - "apps/instagram/module"
  - "apps/whatsapp/official-module"
  - "apps/whatsapp/official"

  # NOTE:
  # - `apps/agent-zero/` is its own Nx monorepo (npm workspaces).
