<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Inteligente 2025 - Solução Completa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="/main.css" rel="stylesheet" />

    <!-- Icons / Link preview -->
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/insumos-icon-192.png" type="image/png" sizes="192x192" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SKINCOS CRM" />
    <meta property="og:description" content="Plataforma unificada de relacionamento e crescimento empresarial." />
    <meta property="og:url" content="https://crm.skincos.com.br/" />
    <meta property="og:image" content="https://crm.skincos.com.br/icons/insumos-icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SKINCOS CRM" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/insumos-icon-192.png" />
    <style>
        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="boot"
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1220 0%,#111827 50%,#1f2937 100%);color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
        <div
            style="width:90%;max-width:420px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.25);padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35)">
            <div
                style="margin:0 auto;width:48px;height:48px;border-radius:9999px;border:2px solid rgba(191,219,254,0.7);border-top-color:transparent;animation:boot-spin 1s linear infinite">
            </div>
            <div style="margin-top:16px;font-weight:700;font-size:18px">Carregando CRM...</div>
            <div style="margin-top:4px;font-size:12px;color:rgba(191,219,254,0.7)">Preparando sua sessão e módulos.</div>
            <div style="margin-top:18px;display:flex;justify-content:center">
                <div
                    style="display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9999px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);font-size:12px;color:#f8fafc">
                    <span style="display:inline-flex;width:10px;height:10px;border-radius:9999px;border:2px solid rgba(191,219,254,0.7);border-top-color:transparent;animation:boot-spin 1s linear infinite"></span>
                    Carregando dados...
                </div>
            </div>
            <div style="margin-top:16px;font-size:11px;color:rgba(148,163,184,0.8)">Se demorar, force o reload (⌘R) ou confira os logs.</div>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
</body>

</html>
