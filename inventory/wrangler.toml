name = "skincos-insumos"
main = "workers/index.js"
compatibility_date = "2024-11-20"
routes = ["api.skincos.com.br/insumos/*"]
workers_dev = false
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

# Run the fetch handler next to the D1 primary (skincos-db lives in ENAM).
# /auth/me and the Insumos routes make several sequential D1 round trips, so
# paying one hop to the eastern US is cheaper than ~150 ms per query from GRU.
# https://developers.cloudflare.com/workers/configuration/placement/
[placement]
region = "aws:us-east-1"

# Persist Workers Logs (invocation logs + console output) for this Worker.
[observability]
enabled = true

[secrets]
required = ["IDENTITY_WORKFORCE_HMAC_KEY", "SESSION_SECRET"]

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "JOB_QUEUE"
class_name = "JobQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JobQueue"]

[[d1_databases]]
binding = "DB"
database_name = "skincos-db"
database_id = "13e59612-99ba-450e-9014-ddefbee72965"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "skincos-backups"

[[services]]
binding = "WORKFORCE"
service = "skincos-timekeeping"

[vars]
APP_ORIGIN = "https://crm.skincos.com.br"
APP_VERSION = "unreleased"
ENVIRONMENT = "production"

[env.staging]
name = "skincos-insumos-staging"
routes = ["api-staging.skincos.com.br/insumos/*"]
workers_dev = false
preview_urls = false

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.secrets]
required = ["IDENTITY_WORKFORCE_HMAC_KEY", "SESSION_SECRET"]

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.durable_objects.bindings]]
name = "JOB_QUEUE"
class_name = "JobQueue"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "skincos-db-staging"
database_id = "4bdd7995-ad69-465a-917c-0aab22db5c4e"

[[env.staging.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "skincos-backups-staging"

[[env.staging.services]]
binding = "WORKFORCE"
service = "skincos-timekeeping-staging"

[env.staging.vars]
# No independent CRM staging console exists. Keep staging browser CORS
# fail-closed until an owner provisions a dedicated Inventory surface.
APP_ORIGIN = "https://no-staging-console.invalid"
APP_VERSION = "unreleased"
ENVIRONMENT = "staging"

# Optional:
# UNIDADES = "novo-hamburgo,barra-shopping-sul"
# UNIDADES_HEADERS_JSON = "{\"barra-shopping-sul\":\"barrashoppingsul\",\"novo-hamburgo\":\"novo hamburgo\"}"

# IMPORTANT:
# Insumos é D1-only e requer binding `DB`.
#
# Secrets (set via `wrangler secret put`):
# - SESSION_SECRET (required)
# - IDENTITY_PII_KEY (required for employee onboarding)
# - IDENTITY_WORKFORCE_HMAC_KEY (shared only with workforce/timekeeping)
