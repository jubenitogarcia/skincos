# Base Docker Compose Configuration for WhatsApp Monorepo
# Use with environment-specific overrides

services:
  # WhatsApp API Main Service
  whatsapp-api:
    build:
      context: ./apps/whatsapp-api
      dockerfile: Dockerfile
      target: production
    container_name: whatsapp-api
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3001}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    env_file:
      - ./apps/whatsapp-api/.env
    volumes:
      - whatsapp_auth_data:/app/.wwebjs_auth
      - whatsapp_cache_data:/app/.wwebjs_cache
      - whatsapp_logs_data:/app/logs
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3001}/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: redis-whatsapp
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  whatsapp_auth_data:
    driver: local
  whatsapp_cache_data:
    driver: local
  whatsapp_logs_data:
    driver: local
  redis_data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16