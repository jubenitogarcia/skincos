name = "skincos-global-coordinator"
main = "index.js"
compatibility_date = "2026-08-09"
workers_dev = false

[vars]
COORDINATION_CONTRACT_ID = "skincos/global-coordination/v1"
COORDINATION_PLANE_NAME = "global"
COORDINATION_PLANE_MODE = "global"
COORDINATION_ACTIVE_KEY_ID = "legacy-v1"
COORDINATION_ALLOW_LEGACY_KEY = "true"
COORDINATION_RECOVERY_KEY_ID = "recovery-v1"

[durable_objects]
bindings = [
  { name = "GLOBAL_COORDINATOR", class_name = "GlobalCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GlobalCoordinator"]

[env.staging]
name = "skincos-global-coordinator-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
COORDINATION_CONTRACT_ID = "skincos/global-coordination/v1"
COORDINATION_PLANE_NAME = "global"
COORDINATION_PLANE_MODE = "global"
COORDINATION_ACTIVE_KEY_ID = "legacy-v1"
COORDINATION_ALLOW_LEGACY_KEY = "true"
COORDINATION_RECOVERY_KEY_ID = "recovery-v1"

[env.staging.durable_objects]
bindings = [
  { name = "GLOBAL_COORDINATOR", class_name = "GlobalCoordinator" }
]

[env.production]
name = "skincos-global-coordinator-production"
workers_dev = true
preview_urls = false

[env.production.vars]
COORDINATION_CONTRACT_ID = "skincos/global-coordination/v1"
COORDINATION_PLANE_NAME = "global"
COORDINATION_PLANE_MODE = "global"
COORDINATION_ACTIVE_KEY_ID = "legacy-v1"
COORDINATION_ALLOW_LEGACY_KEY = "true"
COORDINATION_RECOVERY_KEY_ID = "recovery-v1"

[env.production.durable_objects]
bindings = [
  { name = "GLOBAL_COORDINATOR", class_name = "GlobalCoordinator" }
]
