name = "skincos-token-vault"
main = "src/compat-entry.js"
compatibility_date = "2026-06-18"
workers_dev = true
routes = ["api.skincos.com.br/internal/token-vault/*"]

[vars]
ENVIRONMENT = "production"
REQUIRE_AUTH = "true"
WORKER_AUTH_HEADER_NAME = "Authorization"
WORKER_AUTH_SCHEME = "Bearer"
INFLUENCER_INTELLIGENCE_ANALYTICS_MODE = "off"

[secrets]
required = ["TOKEN_VAULT_API_TOKEN", "TOKEN_VAULT_ANALYTICS_API_TOKEN", "TOKEN_VAULT_ENCRYPTION_KEY"]

[[d1_databases]]
binding = "TOKEN_VAULT_DB"
database_name = "skincos-token-vault"
database_id = "8a31000d-a608-4a01-8739-3ab7e011a0d9"
migrations_dir = "migrations"

[env.staging]
name = "skincos-token-vault-staging"
workers_dev = true
routes = ["api-staging.skincos.com.br/internal/token-vault/*"]

[env.staging.vars]
ENVIRONMENT = "staging"
REQUIRE_AUTH = "true"
WORKER_AUTH_HEADER_NAME = "Authorization"
WORKER_AUTH_SCHEME = "Bearer"
INFLUENCER_INTELLIGENCE_ANALYTICS_MODE = "off"

[env.staging.secrets]
required = ["TOKEN_VAULT_API_TOKEN", "TOKEN_VAULT_ANALYTICS_API_TOKEN", "TOKEN_VAULT_ENCRYPTION_KEY"]

[[env.staging.d1_databases]]
binding = "TOKEN_VAULT_DB"
database_name = "skincos-token-vault-staging"
database_id = "22e1d4e4-b356-488d-86f3-812aa9821d58"
migrations_dir = "migrations"
