name = "skincos-inventory-staging-foundation"
main = "worker.js"
compatibility_date = "2026-07-23"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
DOMAIN = "inventory"
ENVIRONMENT = "staging"
APP_VERSION = "staging-foundation-v1"

[[d1_databases]]
binding = "DB"
database_name = "skincos-inventory-staging"
database_id = "a73ea686-a61a-4e73-9628-bfcd91848dc4"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "skincos-inventory-staging-data"

[[kv_namespaces]]
binding = "FLAGS"
id = "b775ee195eae4219ac0be6508b3ff434"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "skincos-inventory-events-staging"

[[queues.consumers]]
queue = "skincos-inventory-events-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 30
dead_letter_queue = "skincos-inventory-events-dlq-staging"
