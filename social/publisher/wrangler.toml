name = "skincos-social-publisher"
main = "src/index.ts"
compatibility_date = "2026-01-13"

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "skincos-share"

[[durable_objects.bindings]]
name = "LOCK"
class_name = "PublisherLock"

[[migrations]]
tag = "v1"
new_classes = ["PublisherLock"]

[vars]
# Base pública para gerar URLs das mídias (Pages).
PUBLIC_ORIGIN = "https://crm.skincos.com.br"
# Segurança: só roda quando true.
SOCIAL_PUBLISHER_ENABLED = "false"
# Processa jobs enfileirados pelo CRM (/api/social/publish). Default: true.
SOCIAL_JOBS_ENABLED = "true"
SOCIAL_JOBS_MAX_PER_RUN = "50"

# Limpeza (R2 GC) — roda apenas quando habilitado.
SOCIAL_CLEANUP_ENABLED = "false"
# Retenção em dias (ddMMyy) para social/queue + social/results + social/published + social/assets.
SOCIAL_RETENTION_DAYS = "45"
# Guardrails (evita delete gigantesco numa única execução).
SOCIAL_CLEANUP_MAX_DATEKEYS_PER_RUN = "10"
SOCIAL_CLEANUP_MAX_ASSETS_PER_DATEKEY = "2000"

SHARE_CLEANUP_ENABLED = "false"
# Retenção em dias para shares/* baseada em index internal/share/index/YYYY-MM-DD/.
SHARE_RETENTION_DAYS = "30"
SHARE_CLEANUP_MAX_SHARES_PER_RUN = "200"
