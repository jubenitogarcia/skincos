name = "espacofacial-site"
main = ".open-next/worker.js"
compatibility_date = "2026-01-11"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [
	{ pattern = "espacofacial.com/*", zone_name = "espacofacial.com" },
	{ pattern = "www.espacofacial.com/*", zone_name = "espacofacial.com" },
]

[vars]
NEXT_PUBLIC_SITE_URL = "https://espacofacial.com"
# Campaign code is shipped fail-closed. A separate D1 binding and a completed
# synthetic staging validation are required before this can ever be enabled.
BEAUTY_MOVEMENT_ENABLED = "false"
BEAUTY_MOVEMENT_ALLOWED_ORIGINS = "https://espacofacial.com,https://www.espacofacial.com"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "BOOKING_DB"
database_name = "espacofacial-booking"
database_id = "9765b1fb-11a4-462c-9657-8a438c755725" # criado via: wrangler d1 create espacofacial-booking

[[d1_databases]]
binding = "SKINCOS_ESCALA_DB"
database_name = "skincos-escala"
database_id = "594fef1b-5597-476e-86f9-59920f284215"

[[d1_databases]]
binding = "BEAUTY_MOVEMENT_DB"
database_name = "espacofacial-beauty-movement"
database_id = "6f67e1aa-22bf-445e-b541-f568d99fbbe9"
migrations_dir = "migrations/beauty-movement"

[env.staging]
name = "espacofacial-site-staging"
workers_dev = true
# Never attach the staging Worker to a production hostname.
routes = []

[env.staging.vars]
NEXT_PUBLIC_SITE_URL = "https://espacofacial-site-staging.skincos.workers.dev"
# Staging has no production Turnstile secret and must remain usable for
# synthetic booking verification without weakening production enforcement.
BOOKING_REQUIRE_TURNSTILE = "false"
BEAUTY_MOVEMENT_ENABLED = "false"
BEAUTY_MOVEMENT_ALLOWED_ORIGINS = "https://espacofacial-site-staging.skincos.workers.dev"

[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "BOOKING_DB"
database_name = "espacofacial-booking-staging"
database_id = "dea29efb-badd-41f3-962b-d991aa4ac321"

[[env.staging.d1_databases]]
binding = "SKINCOS_ESCALA_DB"
database_name = "skincos-escala-staging"
database_id = "3f59f0a3-2c27-4f15-9f84-a9234f86c2e5"

[[env.staging.d1_databases]]
binding = "BEAUTY_MOVEMENT_DB"
database_name = "espacofacial-beauty-movement-staging"
database_id = "7e319fc9-2cd3-4627-817c-adca264cd360"
migrations_dir = "migrations/beauty-movement"
