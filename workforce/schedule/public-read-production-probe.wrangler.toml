# Ephemeral authenticated verifier; the production adapter itself stays private.
# The protected production manifest and canonical adapter workflow are its only
# publisher. No routes, D1, schedules, or caller-controlled proxying are allowed.
name = "skincos-schedule-public-read-probe-staging"
main = "public-read-production-probe.js"
compatibility_date = "2026-03-02"
workers_dev = true
preview_urls = false

[vars]
PROBE_SOURCE_SHA = "disabled"
PROBE_EXPIRES_AT_MS = "0"

[[services]]
binding = "SCHEDULE_PUBLIC_READ"
service = "skincos-schedule-public-read"
