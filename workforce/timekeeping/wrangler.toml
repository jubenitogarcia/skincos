name = "skincos-timekeeping"
main = "worker.js"
compatibility_date = "2026-07-18"
workers_dev = false
preview_urls = false

[version_metadata]
binding = "VERSION_METADATA"

[secrets]
required = [
  "PONTO_ACTOR_HMAC_KEY",
  "PONTO_IDEMPOTENCY_KEY",
  "PONTO_TEMPLATES_KEY",
  "PONTO_PROFILE_DATA_KEY",
  "PONTO_NETWORK_CONTEXT_KEY",
  "IDENTITY_WORKFORCE_HMAC_KEY",
]

[[d1_databases]]
binding = "DB"
database_name = "skincos-timekeeping"
database_id = "__CONFIGURE_TIMEKEEPING_D1_ID__"
migrations_dir = "migrations"

[[services]]
binding = "SCHEDULE"
service = "skincos-escala-api"

[[kv_namespaces]]
binding = "MODULE_CONTROL"
id = "__CONFIGURE_MODULE_CONTROL_PRODUCTION_KV_ID__"

[vars]
APP_VERSION = "unreleased"
ENVIRONMENT = "production"
APP_ORIGIN = "https://crm.skincos.com.br"
# Face capture/identification remains deliberately disabled until a separately
# governed operational release. PIN is the only self-service credential.
PONTO_FACE_PUNCH_ENABLED = "false"

[env.staging]
name = "skincos-timekeeping-staging"
workers_dev = false
preview_urls = false

[env.staging.version_metadata]
binding = "VERSION_METADATA"

[env.staging.secrets]
required = [
  "PONTO_ACTOR_HMAC_KEY",
  "PONTO_IDEMPOTENCY_KEY",
  "PONTO_TEMPLATES_KEY",
  "PONTO_PROFILE_DATA_KEY",
  "PONTO_NETWORK_CONTEXT_KEY",
  "IDENTITY_WORKFORCE_HMAC_KEY",
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "skincos-timekeeping-staging"
database_id = "__CONFIGURE_TIMEKEEPING_STAGING_D1_ID__"
migrations_dir = "migrations"

[[env.staging.services]]
binding = "SCHEDULE"
service = "skincos-escala-api-staging"

[[env.staging.kv_namespaces]]
binding = "MODULE_CONTROL"
id = "e69fe06b6abc46eca4f4c00198d078f2"

[env.staging.vars]
APP_VERSION = "unreleased"
ENVIRONMENT = "staging"
APP_ORIGIN = "https://crm-staging.skincos.com.br"
PONTO_FACE_PUNCH_ENABLED = "false"
